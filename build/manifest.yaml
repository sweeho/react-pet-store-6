  source: extraction
  generator: vortex-spec-extraction
  sourceRef: vortex/legacy-spec/sx-0001
capabilities:
  - slug: localization
    title: Localization
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-localization
      specCapabilities:
        - localization
    canvas:
      problem: The legacy store serves shoppers in US English, Japanese and Simplified Chinese, but its locale rules (session default, locale switching, page fallback, per-locale catalog content and prices, UTF-8 handling, locale formatting in e-mails and the admin tool) are spread across the web framework, storefront, catalog, cart, order processing and admin client, and the English guide disagrees with the code about which locales ship.
      solution: "Provide locale selection and locale-specific behaviour as one capability: en_US default session locale, a change-locale action that returns to the originating page, page resolution with a two-step fallback to en_US, per-locale catalog content and separately stated prices, UTF-8 request decoding and rendering, order and invoice locale defaults, and locale-aware price formatting in customer e-mails and admin text."
      userStories:
        - As a shopper, I want to switch the store language from the page header, so that I can browse and buy in en_US, ja_JP or zh_CN.
        - As a shopper, I want to stay on the page I was viewing after changing language, so that I do not lose my place.
        - As a shopper who types non-Latin text, I want my input decoded and shown correctly, so that names, addresses and searches in Japanese or Chinese are not garbled.
        - As an administrator, I want the admin tool labels in my language with English as the default, so that I can read the tool.
      acceptanceCriteria:
        - "Supported storefront locales — Each supported locale has a full page set: the page is rendered with that locale's own localized text and layout"
        - "Supported storefront locales — Default locale: it is rendered in US English (en_US)"
        - "Default locale for a new session — First request of a session: the session locale is set to en_US before the request is processed"
        - "Default locale for a new session — Session already carries a locale: the session locale remains ja_JP"
        - "Locale code interpretation — Two-part code: it resolves to language Japanese, country Japan"
        - "Locale code interpretation — The word default: it resolves to the server's default locale"
        - "Locale code interpretation — Code without an underscore: no locale is resolved and the code is treated as invalid"
        - "Change session locale — Valid locale submitted: the session locale becomes zh_CN; the cart lines are thereafter shown with zh_CN catalog content and prices"
        - "Change session locale — Unrecognised locale submitted: the change is rejected with the error \"Unable to change language to fr\"; the session locale remains en_US"
        - "Language switch from the storefront header — Shopper switches to Japanese: the session locale becomes ja_JP and the storefront is shown in Japanese"
        - "Return to the originating page after a language change — Language changed on a product page: the product page for FI-SW-01 is displayed again, now in Chinese"
        - "Change-language screen — The screen is displayed: it shows a locale selector with the options US English, German, Japanese and Simplified Chinese, and a \"Change Locale\" submit control"
        - "Change-language screen — A locale is selected and submitted: the session locale becomes ja_JP; a confirmation screen is displayed stating that the locale is ja_JP"
        - "Change-language screen — A locale without a page set is selected: the session locale becomes de_DE; subsequent pages are rendered from the default (en_US) page set, because no German pages exist"
        - "Page locale resolution and fallback — Request locale overrides session locale: the page is rendered in Japanese"
        - "Page locale resolution and fallback — Locale without a page set: the page is rendered from the en_US page set"
        - "Page locale resolution and fallback — Page missing from the chosen locale: the en_US version of that page is shown"
        - "Page locale resolution and fallback — Page missing everywhere: an error stating \"Definition for screen unknown not found\" is shown"
        - "Locale-specific catalog content — Same item in two locales: the Japanese name, description and attributes are shown"
        - "Locale-specific catalog content — Locale with no catalog rows: no localized details are returned for that locale"
        - "Separately stated price per locale — Item prices per locale: each locale shows its own stated list price, with no conversion between them"
        - "Catalog text and currency formatting follow the page locale — Cart viewed on Japanese pages: the item text is the ja_JP catalog text and the price is formatted in Japanese yen"
        - "Cart follows the shopper's locale — New cart: catalog details are taken from en_US"
        - "Cart follows the shopper's locale — Locale changes after items are added: the EST-1 line shows its ja_JP name and price"
        - "UTF-8 decoding of storefront input — Japanese text submitted in a form: the stored name is identical to what the shopper entered"
        - "UTF-8 decoding of storefront input — Non-ASCII credentials at sign-on: sign-on receives the user name already decoded as UTF-8"
        - "UTF-8 rendering of storefront pages — Chinese page rendered: the response is encoded and declared as UTF-8"
        - "Request encoding is a deployment setting — Configured encoding applied: its character data is decoded as UTF-8"
        - "Order locale is recorded — Order placed in Japanese: the order's locale is ja_JP"
        - "Order locale is recorded — Order with no locale: its locale is en_US"
        - "Invoice locale default — Invoice without a locale: its locale is en_US"
        - "UTF-8 encoding of business documents — Supplier order with Japanese address: the document is encoded in UTF-8 and the address characters are preserved"
        - "Customer e-mail price format per locale — Japanese invoice e-mail: the unit price reads \"￥1,951\""
        - "Customer e-mail price format per locale — English completed-order e-mail: the unit price reads \"$16.50\""
        - "Administration tool text catalogue — German user: its labels and messages are shown in German"
        - "Administration tool text catalogue — Locale without a translation: its labels and messages are shown in English"
        - "Locale-aware number formatting and keyword splitting — Money formatted to two places: the result is \"$1,234.50\""
        - "Locale-aware number formatting and keyword splitting — Search phrase split into words: the keywords are \"gold\" and \"fish\""
      outOfScope:
        - Translating catalog content or authoring new page sets for additional languages
        - Catalog browsing, cart and checkout behaviour beyond their locale dependence (owned by catalog-browsing, shopping-cart and checkout)
        - E-mail delivery mechanics (owned by customer-notifications)
      risksAssumptions:
        - "Whether zh_CN is a supported locale is disputed: the code ships it, the English guide does not list it"
        - The change-language screen offers de_DE although no German storefront page set exists; whether it is in production scope is an open Business Owner decision
      techStack: []
      affectedCode: []
      screens:
        - "Change-language screen: a language selection form offering US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN); after a successful change it shows a confirmation stating the new locale"
