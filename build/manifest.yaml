  - slug: order-approval
    title: Order approval
    order: 7
    dependsOn:
      - checkout
      - sign-on
    priority: 0
    change:
      dir: openspec/changes/sx-order-approval
      specCapabilities:
        - order-approval
    canvas:
      problem: The legacy store holds every order above a locale-dependent threshold until an administrator approves or denies it. The rebuild must reproduce which orders are auto-approved, how an administrator reviews and decides the rest, and how decisions reach order processing.
      solution: Provide automatic approval of small orders by locale (US under 500, Japan under 50000, every other locale never), the administrator's Process Pending Orders and View Non-Pending Orders screens with status colour coding, bulk marking and commit, the uncommitted-refresh warning, busy state and fatal-error handling, the orders-by-status query, server handling of status updates, and asynchronous delivery of decisions to order processing.
      userStories:
        - As a store owner, I want small orders approved automatically by locale threshold, so that administrators only review large orders.
        - As an administrator, I want a list of pending orders where I can mark each approved or denied, so that I can decide them in one pass.
        - As an administrator, I want to see already-decided orders separately, so that I can check what has been approved, denied or fulfilled.
        - As order processing, I want each approval decision delivered asynchronously, so that approved orders move on to fulfilment.
      acceptanceCriteria:
        - "Process Pending Orders screen — Pending orders are displayed: exactly the three PENDING orders are listed, each showing ID, User ID, Date, Amount and Status, together with Approve, Deny and Commit controls"
        - "Process Pending Orders screen — Only the status can be edited: the value cannot be changed"
        - "Process Pending Orders screen — Status choices offered: the choices offered are PENDING, APPROVED and DENIED and no other value can be chosen"
        - "Process Pending Orders screen — Sorting by a column: the rows are reordered by amount"
        - "Pending order status colour coding — Statuses are colour-coded: the PENDING status is shown in yellow, the APPROVED status in green and the DENIED status in red"
        - "View Non-Pending Orders screen — Decided orders are displayed read-only: the APPROVED, DENIED and COMPLETED orders are listed with ID, User ID, Date, Amount and Status, the PENDING order is not listed, and no value can be edited"
        - "View Non-Pending Orders screen — Refresh shows newly decided orders: the order appears on the View Non-Pending Orders screen with status APPROVED"
        - "Bulk marking of selected pending orders — Approve several selected orders: the three selected orders show status APPROVED, the other two still show PENDING, and nothing is sent to the server"
        - "Bulk marking of selected pending orders — Deny several selected orders: both orders show status DENIED and nothing is sent to the server"
        - "Committing approval decisions — Commit approvals and denials: one batch containing A and B with status APPROVED is sent, then one batch containing C with status DENIED, D is not sent, and the order lists are reloaded"
        - "Committing approval decisions — Commit with nothing marked: nothing is sent to the server"
        - "Committing approval decisions — Only approvals marked: exactly one batch is sent, containing A with status APPROVED"
        - "Warning before discarding uncommitted decisions — Refresh cancelled: no reload happens and the order still shows APPROVED"
        - "Warning before discarding uncommitted decisions — Refresh confirmed: the lists are reloaded and the order shows its stored status PENDING"
        - "Warning before discarding uncommitted decisions — Refresh with nothing uncommitted: the lists are reloaded without a warning"
        - "Loading order lists on start and refresh — Tool start: the pending list and the non-pending list are populated without the administrator requesting a refresh"
        - "Busy state during server requests — Commit in progress: Approve, Deny, Commit, Refresh, About and Exit are disabled and \"Updating data on the server...\" is shown, and they are enabled again after the reply"
        - "Busy state during server requests — Load in progress: the actions are disabled and \"Retrieving data from the server...\" is shown"
        - "Server communication failure — Commit fails: a \"Fatal Error!\" dialog is shown and, once it is dismissed, the administration tool closes"
        - "Retrieve orders by status — Pending orders requested: the reply carries status PENDING, a count of 3 and the three PENDING orders, each once"
        - "Retrieve orders by status — Status matched exactly: that order is not returned"
        - "Order as seen by the administrator — Order fields: it carries its order id, user id j2ee, date 2026-10-01, amount 612.50 and status PENDING"
        - "Handling a submitted status update — Incomplete entry skipped: a batch containing 1001 and 1003 is handed to order processing and the reply is SUCCESS"
        - "Handling a submitted status update — Hand-off fails: the reply is an error asking the administrator to try again"
        - "Asynchronous delivery of approval decisions — Administrator decisions delivered: one message carrying both decisions is placed on the order-approval channel and the server replies before order processing has acted on it"
        - "Approval decision batch format — Well-formed batch accepted: both decisions are read"
        - "Approval decision batch format — Entry with empty status rejected: the batch is rejected"
        - "Approval decision batch format — Batch with no entries rejected: the batch is rejected"
        - "Batch format does not restrict status values — Unlisted status carried: the entry is read with status COMPLETED and no format error is raised"
        - "Approval batch schema validation by default — Default validation: it is validated against the declared schema"
        - "Automatic approval of small US orders — US order below threshold: it is approved automatically"
        - "Automatic approval of small US orders — US order at exactly the threshold: it remains PENDING for administrator review"
        - "Automatic approval of small US orders — US order above threshold: it remains PENDING and appears on the Process Pending Orders screen"
        - "Automatic approval for other locales — Japanese order below threshold: it is approved automatically"
        - "Automatic approval for other locales — Japanese order at the threshold: it remains PENDING"
