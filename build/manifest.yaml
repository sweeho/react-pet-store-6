# Build manifest for spec extraction SX-0001 (Java Pet Store 1.3.2). Machine-read release schedule.
schemaVersion: 1
program:
  key: java-pet-store-rebuild
  title: Java Pet Store 1.3.2 rebuild (spec extraction SX-0001)
  source: extraction
  generator: vortex-spec-extraction
  sourceRef: vortex/legacy-spec/sx-0001
capabilities:
  - slug: localization
    title: Localization
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-localization
      specCapabilities:
        - localization
    canvas:
      problem: The legacy store serves shoppers in US English, Japanese and Simplified Chinese, but its locale rules (session default, locale switching, page fallback, per-locale catalog content and prices, UTF-8 handling, locale formatting in e-mails and the admin tool) are spread across the web framework, storefront, catalog, cart, order processing and admin client, and the English guide disagrees with the code about which locales ship.
      solution: "Provide the en_US, ja_JP and zh_CN storefront locales with en_US as the default and a header language switch, a locale change that applies to the session and the cart, locale-code interpretation, page locale resolution with fallback to en_US, locale-aware money and number formatting and keyword splitting, the change-language screen, the catalog and cart lines shown in the shopper's locale, and UTF-8 interpretation of submitted text established before sign-on."
      userStories:
        - As a shopper, I want to switch the store language from the page header, so that I can browse and buy in en_US, ja_JP or zh_CN.
        - As a shopper, I want to stay on the page I was viewing after changing language, so that I do not lose my place.
        - As a shopper who types non-Latin text, I want my input decoded and shown correctly, so that names, addresses and searches in Japanese or Chinese are not garbled.
        - As an administrator, I want the admin tool labels in my language with English as the default, so that I can read the tool.
      acceptanceCriteria:
        - "Supported storefront locales and header language switch — Each supported locale has a full screen set: the screen is rendered with that locale's own localized text and layout"
        - "Supported storefront locales and header language switch — Default locale: it is rendered in US English (en_US)"
        - "Supported storefront locales and header language switch — Shopper switches to Japanese from the header: the session locale becomes ja_JP and the storefront is shown in Japanese"
        - "Locale change applies to session and cart — Locale changed with items in the cart: the session locale becomes zh_CN; the EST-1 cart line is shown with its zh_CN name and price"
        - "Locale code interpretation — Two-part code: it resolves to language Japanese, country Japan"
        - "Locale code interpretation — The word default: it resolves to the server's default locale"
        - "Locale code interpretation — Code without an underscore: no locale is resolved and the code is treated as invalid"
        - "Page locale resolution and fallback — Request locale overrides session locale: the screen is rendered in Japanese"
        - "Page locale resolution and fallback — Locale without screen definitions: the screen is rendered from the en_US definitions"
        - "Page locale resolution and fallback — Screen missing from the chosen locale: the en_US version of that screen is shown"
        - 'Page locale resolution and fallback — Screen missing everywhere: an error stating "Definition for screen unknown not found" is shown'
        - 'Locale-aware money and number formatting — Money formatted to two places: the result is "$1,234.50"'
        - 'Locale-aware money and number formatting — Number formatted to zero places: the result is "1,951"'
        - 'Locale-aware formatting and keyword splitting — Search phrase split into words: the keywords are "gold" and "fish", and no blank keyword is returned'
        - 'Locale-aware formatting and keyword splitting — Money formatted to a fixed precision: the result is "$16.50"'
        - 'Change-language screen — The screen is displayed: it shows a locale selector with the options US English, German, Japanese and Simplified Chinese, and a "Change Locale" submit control'
        - "Change-language screen — A locale is selected and submitted: the session locale becomes ja_JP; a confirmation is displayed stating that the locale is ja_JP"
        - "Catalog shown in the shopper's locale — Same item in two locales: the Japanese name, description and attributes are shown"
        - "Catalog shown in the shopper's locale — Shopper in English: the English name, description and attributes are shown"
        - "UTF-8 interpretation of submitted text — Japanese text submitted in a form: the displayed name is identical to what the shopper entered"
        - "UTF-8 interpretation of submitted text — Chinese text in a query parameter: the keyword is read as the same Chinese characters"
        - "Encoding established before sign-on — Non-ASCII credentials at sign-on: sign-on receives the user name already decoded as UTF-8"
        - "Encoding established before sign-on — Non-ASCII form after sign-on: every handler of that request sees the values already decoded as UTF-8"
        - "Cart lines follow the cart locale — New cart with no locale: the EST-1 name, attribute and price are taken from the en_US catalog details"
        - "Cart lines follow the cart locale — Cart with a locale: the EST-1 name, attribute and price are taken from the ja_JP catalog details"
      outOfScope:
        - Translating catalog content or authoring new page sets for additional languages
        - Catalog browsing, cart and checkout behaviour beyond their locale dependence (owned by catalog-browsing, shopping-cart and checkout)
        - E-mail delivery mechanics (owned by customer-notifications)
      risksAssumptions:
        - "Whether zh_CN is a supported locale is disputed: the code ships it, the English guide does not list it"
        - The change-language screen offers de_DE although no German storefront page set exists; whether it is in production scope is an open Business Owner decision
      techStack: []
      affectedCode: []
      screens:
        - "Change-language screen: a language selection form offering US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN); after a successful change it shows a confirmation stating the new locale"
    evidence:
      irRefs: [ LOC-REQ-0001, LOC-BR-0002, LOC-BR-0003, LOC-BR-0004, LOC-BR-0007, LOC-BR-0010, LOC-SCR-0005, LOCALIZATION-BR-0002, LOCALIZATION-REQ-0001, LOCALIZATION-RULE-0001, SC-BR-0006 ]
      reviewedBy: null
      reviewedAt: null
  - slug: catalog-browsing
    title: Catalog browsing and search
    order: 2
    dependsOn:
      - localization
    priority: 0
    change:
      dir: openspec/changes/sx-catalog-browsing
      specCapabilities:
        - catalog-browsing
    canvas:
      problem: Shoppers find pets by category, product and item, and by keyword search. In the legacy store these rules live in the catalog DDL, two interchangeable data-access classes, a SQL definition file and the storefront pages, and are written down nowhere else.
      solution: "Provide the category, product and item hierarchy with per-locale details, category listing and the paged category product list with Previous and Next, the item detail page, home-to-item navigation, the home screen pet selection and category side panel, keyword search with whitespace tokenization, items hidden where their product is not localized, default paging, a shared five-minute cache of catalog pages, mandatory unique category ids, and catalog reads that report a failure when the catalog cannot be read."
      userStories:
        - As a visitor, I want to browse from a category to a product to its items, so that I can find a pet to buy.
        - As a visitor, I want to search the catalog by keyword, so that I can find an item without navigating categories.
        - As a visitor, I want a clear failure when the catalog cannot be read, so that I am not shown an empty or partial list as if it were the whole catalog.
      acceptanceCriteria:
        - "Catalog keyword search — Any keyword matches: both items are returned"
        - 'Catalog keyword search — Category id matches: the item is returned even if neither its product name nor its description contains "fish"'
        - 'Catalog keyword search — Duplicate keywords: it searches for the two distinct keywords "fish" and "koi"'
        - "Catalog keyword search — Mixed-case keyword: the item is returned"
        - "Catalog keyword search — Blank search text: an empty result is returned and no search is performed"
        - "Catalog read paths and failure reporting — Both read paths agree: both reads return the same products with the same details"
        - "Catalog read paths and failure reporting — Data access selected by configuration: the configured implementation and dialect are used"
        - "Catalog read paths and failure reporting — Catalog store unreachable: a catalog failure is reported to the caller instead of an empty or partial list"
        - 'Item visible only where its product is localized — Product not localized: "EST-1" is not returned'
        - "Item visible only where its product is localized — Item and product both localized: the item is returned with its en_US details"
        - "Default catalog paging — No paging values supplied: the first 2 products are returned"
        - "Default catalog paging — Only a page size supplied: products 1 through 3 are returned"
        - "Shared five-minute cache of catalog pages — Change appears within five minutes: the new product is shown"
        - "Shared five-minute cache of catalog pages — Cached copy reused across shoppers: shopper B MAY see the product list as it was rendered for shopper A"
        - "Shared five-minute cache of catalog pages — Item detail not cached: the new unit price is shown"
        - "Catalog hierarchy — Product without a category is refused: the product is rejected"
        - "Catalog hierarchy — Item localization without prices is refused: the details are rejected"
        - 'Catalog hierarchy — Per-locale details: its name is "エンゼルフィッシュ"'
        - 'List categories — Categories sorted by name: "Birds", "Fish", "Reptiles" are returned in that order'
        - "List categories — Page within the list: the 3rd and 4th categories by name are returned"
        - 'List categories — Category not localized: "REPTILES" is not returned'
        - 'Category product list with Previous and Next — First page of a category: "Bulldog" and "Dalmation" are shown, a Next control is offered and no Previous control is offered'
        - 'Category product list with Previous and Next — Last page of a category: "Poodle" is shown, a Previous control is offered and no Next control is offered'
        - "Item detail page — Item detail displayed: the page shows the item's image, \"List Price\" 16.50, \"Your Price\" 10.00 and an Add to Cart action"
        - "Item detail page — Add to Cart from item detail: \"EST-1\" is added to the shopper's cart"
        - "Home screen pet selection — Home screen displayed: a pet selection picture is shown with selectable regions for Birds, Fish, Dogs, Reptiles and Cats"
        - 'Home screen pet selection — Pet region selected: the category page for "FISH" opens'
        - 'Home screen and category navigation panel — Side panel on every screen: a side panel lists "Birds", "Cats", "Dogs", "Fish", "Reptiles" in that order'
        - 'Home screen and category navigation panel — Side panel entry selected: the category page for "REPTILES" opens'
        - "Locale-scoped catalog descriptions — Shopper sees own locale only: only the ja_JP description is shown"
        - "Category code is mandatory and unique — Duplicate category code: it is rejected"
        - "Category code is mandatory and unique — Missing category code: it is rejected"
        - "Category identifier length — Over-long category id: it is rejected"
        - "Category identifier length — Ten-character category id: it is accepted"
        - "Localized catalog details — Category names in shopper's locale: the category is shown as \"魚\" in name order among the ja_JP category names"
        - "Browse from home to item — Navigate to a product's items: the items of \"Bulldog\" are listed, each row with an add-to-cart action"
        - "Browse from home to item — Add an item from the product's item list: that item is added to the shopper's cart"
        - 'Search keyword tokenization — Tabs and repeated words: it searches for the two keywords "koi" and "angel"'
        - "Search keyword tokenization — Whitespace-only query: an empty result is returned and the catalog is not queried"
      outOfScope:
        - Adding items to the cart and cart totals (owned by shopping-cart)
        - Locale selection and the language switch (owned by localization)
        - Maintaining catalog content through an admin interface; the legacy catalog is only seeded (see data-population)
      risksAssumptions:
        - Keyword search case sensitivity and the active data-access implementation are disputed in the IR; see the change design.md
      techStack: []
      affectedCode: []
      screens:
        - "Home screen: a pet selection picture whose regions link to the Birds, Fish, Dogs, Reptiles and Cats categories"
        - "Home screen and storefront side panel: the pet selection map linking to the Birds, Fish, Dogs, Reptiles and Cats categories, and on every storefront screen a side panel listing the catalog categories in the current locale ordered by name"
    evidence:
      irRefs: [ CAT-BR-0002, CAT-INT-0001, CAT-BR-0001, CAT-BR-0004, CAT-BR-0007, CAT-ENT-0001, CAT-REQ-0001, CAT-REQ-0003, CAT-REQ-0005, CAT-SCR-0001, CAT-SCR-0002, CATALOG-BROWSING-BR-0001, CATALOG-BROWSING-ENT-0001, CATALOG-BROWSING-ENTITY-0001, CATALOG-BROWSING-REQ-0001, CATALOG-BROWSING-WF-0001, CATB-RULE-0008 ]
      reviewedBy: null
      reviewedAt: null
  - slug: sign-on
    title: Sign-on and access control
    order: 3
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-sign-on
      specCapabilities:
        - sign-on
    canvas:
      problem: Sign-on decides who may see account details, check out, administer orders and manage supplier stock. The legacy storefront, administration area and supplier area each sign users in and out differently, and their access control has known weaknesses that the business must see before deciding what to keep.
      solution: Provide the pages that require a signed-on customer, the remembered user name, storefront sign-out, the storefront page header sign-in state, idle session expiry for the storefront, the administration area and the framework sample application, separate administrator and supplier areas with sign-out before switching, the administration sign-in and landing screens, and internal services that rely on their callers for access control.
      userStories:
        - As a customer, I want account and order pages to require me to be signed on, so that nobody else can use my details.
        - As a returning customer, I want my user name optionally remembered, so that signing on is quicker.
        - As a customer, I want to sign out, so that the next person on this browser cannot use my session.
        - As an administrator, I want a separate sign-in to the administration area, so that only administrators can approve orders and view sales.
        - As a supplier administrator, I want the supplier area kept separate from the administration area, so that only authorised staff can change stock.
      acceptanceCriteria:
        - 'Remember the user name — Option ticked: the browser keeps "ann" as the remembered user name for 31 days'
        - "Remember the user name — Option not ticked: the remembered user name is removed"
        - "Storefront idle session expiry — Shopper idle for 16 minutes: the shopper is no longer signed on and the cart is empty"
        - "Framework sample application idle session expiry — Visitor idle for 31 minutes: a new session is started and none of the previous session's server-side state is available"
        - "Separate administrator and supplier areas — User moves from the administrator area to the supplier area: the user signs out of the administrator area first and then signs in to the supplier area"
        - "Administrator signs out before using the supplier area — Administrator still signed in: the user MUST sign out of the administrator application before the supplier application is used"
        - "Message hand-off service relies on its callers for access control — Order process hands off a message: the message is accepted without a role check and is sent under the caller's identity"
        - "Message hand-off service relies on its callers for access control — Caller outside the application: the service is not reachable"
        - "Administration sign-in screen — Screen displayed: the sign-in screen is shown with a User ID field, a Password field and a submit control"
        - 'Administration sign-in screen — Rejected credentials: "Login Error" is shown with the text "You could not be authenticated with the information provided. Please check your Username and Password." and a link back to the sign-in page'
        - "Administration idle session expiry — Administrator idle for 55 minutes: the administration sign-in screen is shown"
        - 'Storefront sign-out — Shopper signs out with items in the cart: the "You are signed out" screen is shown with a link to sign in again, the shopper is no longer signed on, the cart is empty and the store is still in Japanese'
        - "Pages that require a signed-on customer — Visitor tries to place an order: the visitor is asked to sign in before the order is placed"
        - "Pages that require a signed-on customer — Visitor tries to edit the account: the visitor is asked to sign in before the account can be edited"
        - "Pages that require a signed-on customer — Signed-on customer enters shipping information: the information is accepted without a further sign-in prompt"
        - 'Storefront page header — Visitor not signed on: the header shows the main-page link, the search box, Account, Cart and "Sign in", and no "Sign out"'
        - 'Storefront page header — Signed-on customer: the header shows the main-page link, the search box, Account, Cart and "Sign out", and no "Sign in"'
        - "Administration landing page — Administrator opens the administration area: the landing page shows the description of the sales, revenue, order-status and approve/deny facilities, a control to launch the administration tool and a control to log out"
        - "Order line data relies on order processes for access control — Order process reads order lines: the operation proceeds without a role check of its own"
      outOfScope:
        - Account creation details, profile and contact data (owned by customer-account)
        - Order approval and sales reporting behaviour inside the admin area (owned by order-approval and sales-reporting)
        - Inventory behaviour inside the supplier area (owned by supplier-inventory)
      risksAssumptions:
        - Eleven suspected legacy defects (including an admin data endpoint without role protection and pre-filled demo credentials) and seven open questions are listed in the change design.md
      techStack: []
      affectedCode: []
      screens:
        - "Supplier sign-in screen: asks for user id and password; when authentication fails it shows a login error stating the user could not be authenticated, asking them to check username and password, with a link back to sign in"
        - "Storefront sign-on screen: a returning-customer form (user name, password, Remember My User Name) and a new-customer form (user name, password, password repeat); the user name is pre-filled when previously remembered, otherwise user name and password are pre-filled with the demo account j2ee"
        - "Storefront header on every store page: a link to the main page, a keyword search box, Account and Cart links, and a Sign out link when the user is signed on or a Sign in link otherwise"
        - "Admin landing page: explains that the administrator can view sales, revenue and orders by status and approve or deny pending orders, and offers two actions, launch the administration tool and log out"
    evidence:
      irRefs: [ SIGN-BR-0004, SIGN-BR-0006, SIGN-BR-0012, SIGN-ON-BR-0001, SIGN-ON-REQ-0001, SIGN-ON-BUSINESS-RULE-0001, SIGN-REQ-0003, SIGN-REQ-0004, SIGN-REQ-0005, SIGN-REQ-0011, SIGN-SCR-0007, SIGN-SCR-0008, sign-on-BR-0001 ]
      reviewedBy: null
      reviewedAt: null
  - slug: customer-account
    title: Customer account and profile
    order: 4
    dependsOn:
      - sign-on
    priority: 0
    change:
      dir: openspec/changes/sx-customer-account
      specCapabilities:
        - customer-account
    canvas:
      problem: Customers sign up, keep contact, address and payment-card details, and set profile preferences that change what the storefront shows. In the legacy system these rules are spread over the storefront web tier and five data components, are documented almost nowhere, and include several suspected defects.
      solution: "Provide sign-up from the sign-in screen and stand-alone registration with a password entered twice, one customer per user id created all-or-nothing with one account and one profile, profile defaults and contents, the My List panel and pet-tips banner driven by the favourite category, account contents and active/disabled status, the fixed card type and expiry year options, contact information snapshots and transactional address operations."
      userStories:
        - "As a new visitor, I want to register with a user name and password, so that I can sign in and place orders."
        - "As a customer, I want to choose my card type and expiry year from fixed options, so that my payment details are valid."
        - "As a new customer, I want sensible profile defaults, so that the store works before I set any preferences."
        - "As an operator, I want each account to be active or disabled, so that an account can be switched off."
      acceptanceCriteria:
        - "Password entered twice at sign-up — Both password fields filled with the same value: the registration proceeds with that user name and the first password"
        - "Password entered twice at sign-up — A password field left empty: the submission is refused before it reaches the server and the empty field is reported"
        - "Password entered twice at sign-up — The two passwords differ: the registration proceeds using the first password and no mismatch is reported"
        - "Payment card type and expiry year options — Card type choices on the account form: exactly the options Java(TM) Card, Duke Express and Meow Card are offered"
        - "Payment card type and expiry year options — Expiry year choices on the account form: only years from the fixed list are offered and no free-text year can be entered"
        - "Customer profile defaults at creation — New customer created without profile choices: the customer's profile has preferred language \"en_US\", no favourite category, the MyList preference on and the banner preference on"
        - 'Customer profile defaults at creation — Profile values supplied after creation: the profile holds "ja_JP" and "BIRDS" and the MyList and banner preferences remain on unless also changed'
        - 'Account status values — Status of a new account: the account status is "active"'
        - 'Account status values — Account set to disabled: the account status reads "disabled"'
        - 'Stand-alone user registration — Registration accepted: a sign-on account for "newuser" is created and the user is redirected onward'
        - "Stand-alone user registration — Registration refused: no account is created and the user is redirected to the user-creation error page"
        - 'My List panel for the favourite category — MyList preference on: the panel lists products of the "BIRDS" category, each linking to its product page'
        - "My List panel for the favourite category — Favourite category holds more than ten products: only the first 10 products of the category are listed"
        - "My List panel for the favourite category — MyList preference off: no My List panel is shown"
        - "Pet-tips banner for the favourite category — Banner on the home screen: the cats pet-tips banner is shown"
        - "Pet-tips banner for the favourite category — Unrecognised favourite category: the dogs pet-tips banner is shown"
        - "Pet-tips banner for the favourite category — Screen other than home or cart: no pet-tips banner is shown"
        - "Pet-tips banner for the favourite category — Banner preference off: no pet-tips banner is shown"
        - "Sign-up from the sign-in screen — User name available: the user name is registered and the visitor continues to account creation"
        - "Sign-up from the sign-in screen — User name cannot be registered: the User Creation Error screen is shown, saying the user name is in use and asking the visitor to choose another"
        - 'One customer per user id — Duplicate user id: the creation is refused and exactly one customer record for "j2ee" exists'
        - 'Customer creation is all-or-nothing — Profile creation fails: the customer creation fails and no customer, account or profile exists for "newuser"'
        - 'Customer creation is all-or-nothing — Account creation fails: the customer creation fails and no customer or profile exists for "newuser"'
        - "Customer record keyed by user id — Customer looked up by user id: exactly one customer is returned, owning one account and one profile"
        - "Customer profile contents — Profile without a favourite category: the profile is accepted with the favourite category empty"
        - "Customer profile contents — On/off preferences always set: each reads either on or off and neither is empty"
        - "Account contents — Account read after creation: it carries a status, one contact-information record and one payment card record"
        - "Contact information snapshot — Snapshot taken: the snapshot carries the given name, family name, telephone, e-mail and a copy of the postal address"
        - "Contact information snapshot — Snapshot does not change the record: the stored contact-information record keeps its original telephone"
        - "Address operations are transactional — Update inside a failing change: the address keeps its original city"
        - "Address operations are transactional — Update with no caller transaction: the update runs in its own transaction and is saved"
        - "Account creation before purchase — First-time visitor signs up: an account is created for the visitor and they can go on to make a purchase"
      outOfScope:
        - Credential checking, page protection and session handling (owned by sign-on)
        - Order entry and the copy of contact and card details onto an order (owned by checkout)
        - Payment-card validation or authorisation; the legacy system stores card values as supplied
      risksAssumptions:
        - "Suspected defects recorded as observed: unmasked card number on the account screen, unchecked password confirmation, swallowed validation, and every sign-up failure reported as a taken user name"
      techStack: []
      affectedCode: []
      screens:
        - "Account screen: the customer's contact details, card type, full card number and expiry month/year, and profile preferences"
    evidence:
      irRefs: [ ACCT-BR-0003, ACCT-RULE-0009, CUST-BR-0003, CUST-BR-0005, CUST-WF-0001, ACCT-BR-0010, ACCT-BR-0011, ACCT-REQ-0001, CUST-BR-0001, CUST-BR-0009, CUST-ENT-0001, CUST-ENT-0002, CUST-ENT-0003, CUST-REQ-0002, CUST-RULE-0006, CUSTOMER-ACCOUNT-WF-0001 ]
      reviewedBy: null
      reviewedAt: null
  - slug: shopping-cart
    title: Shopping cart
    order: 5
    dependsOn:
      - catalog-browsing
    priority: 0
    change:
      dir: openspec/changes/sx-shopping-cart
      specCapabilities:
        - shopping-cart
    canvas:
      problem: The shopping cart is where a shopper collects catalog items before checkout. The rebuild must reproduce how the legacy storefront adds, updates, removes, counts and totals cart lines and what the cart page shows, and the business needs to see where that behaviour is questionable.
      solution: Provide one session-only cart per browsing session, discarded on sign-out and usable without a security role; add an item with quantity one or with a supplied quantity; remove a line entirely; empty the cart once an order is placed; no guaranteed line order; failure routing to an error page; and the shopping cart screen.
      userStories:
        - As a shopper, I want to add an item to my cart from a product, item or search page, so that I can buy it later in my visit.
        - As a shopper, I want to remove a line from my cart, so that my cart holds exactly what I want.
        - As a shopper, I want to see each line's price and the cart total, so that I know what I will pay before checking out.
        - As an anonymous visitor, I want to use the cart without signing in, so that I can shop before creating an account.
      acceptanceCriteria:
        - "One cart per browsing session — First use of the cart in a session: an empty cart is created for that session"
        - "One cart per browsing session — Two sessions have separate carts: the second shopper's cart does not contain EST-1"
        - "One cart per browsing session — Shopper signs out with items in the cart: the shopper's cart is empty afterwards"
        - "Cart held for the session only — Session ends: the cart contents are not retrievable by any later session"
        - "Cart use without a security role — Anonymous visitor adds an item: the item is added and the visitor is not asked to sign on"
        - "Cart use without a security role — Anonymous visitor removes an item: EST-1 is removed and no role check refuses the operation"
        - "Add item to cart — Add from the product listing: the cart contains EST-1 with quantity 1"
        - "Add item to cart — Add from a search result: the cart contains EST-2 with quantity 1"
        - "Add item with a supplied quantity — Item not yet in the cart: the cart contains EST-1 with quantity 5"
        - "Add item with a supplied quantity — Item already in the cart: the cart contains one line for EST-1 with quantity 2"
        - "Remove control for a cart line — Shopper removes one line: the cart holds only EST-2"
        - "Item removal semantics — Remove a line with several units: the cart holds only EST-2 with quantity 1"
        - "Item removal semantics — Remove an item not in the cart: the cart still holds only EST-2 and no error is raised"
        - "Empty cart after order placement — Order placed: the customer's cart is empty"
        - "Cart line order — Lines listed: all three lines are listed exactly once, in an order the shopper cannot rely on"
        - "Failure routing to an error page — Order attempted with an empty cart: the shopper is shown the empty-cart order error page"
        - "Failure routing to an error page — Failure matched by a more general kind: the shopper is shown the general failure's error page"
        - "Failure routing to an error page — Unmapped failure: the request fails with a general server error"
        - "Shopping cart screen — Cart with items is displayed: it shows a row with \"Large Angelfish\" linked to EST-1's detail page, a Remove control, a quantity field containing 2 and the unit price $16.50, followed by an Update Cart control, the cart total and a Check Out link"
        - 'Shopping cart screen — Empty cart is displayed: it shows "Your Shopping Cart is Empty." and no rows, total, Update Cart control or Check Out link'
        - "Shopping cart screen — Remove activated: the screen is redisplayed showing only EST-2"
        - "Shopping cart screen — Check Out activated: the shopper is taken to order information entry"
      outOfScope:
        - Persisting a cart across sessions; the legacy cart is session-only
        - Order total, payment and order placement (owned by checkout)
        - Catalog item lookup and the add-to-cart links' source pages (owned by catalog-browsing)
      risksAssumptions:
        - Re-adding an item resets its quantity to 1 instead of incrementing; whether that is intended is a Business Owner decision (design.md D1)
        - A cart line whose catalog item is missing for the locale may break the cart page (design.md D2)
      techStack: []
      affectedCode: []
      screens:
        - "Cart screen: when the cart holds no items it states Your Shopping Cart is Empty; otherwise it lists each line with the item attribute and name linked to the item page, a Remove link, an editable quantity and the unit price, followed by the cart total and a Check Out link to order entry"
