  - slug: customer-account
    title: Customer account and profile
    order: 4
    dependsOn:
      - sign-on
    priority: 0
    change:
      dir: openspec/changes/sx-customer-account
      specCapabilities:
        - customer-account
    canvas:
      problem: Customers sign up, keep contact, address and payment-card details, and set profile preferences that change what the storefront shows. In the legacy system these rules are spread over the storefront web tier and five data components, are documented almost nowhere, and include several suspected defects.
      solution: "Provide stand-alone registration with a user name and a password entered twice (both required on the form), the fixed card type and expiry year options on the account form, profile defaults at customer creation (language en_US, no favourite category, MyList and banner on), and the active/disabled account status values."
      userStories:
        - "As a new visitor, I want to register with a user name and password, so that I can sign in and place orders."
        - "As a customer, I want to choose my card type and expiry year from fixed options, so that my payment details are valid."
        - "As a new customer, I want sensible profile defaults, so that the store works before I set any preferences."
        - "As an operator, I want each account to be active or disabled, so that an account can be switched off."
      acceptanceCriteria:
        - "Password entered twice at sign-up — Both password fields filled with the same value: the registration proceeds with that user name and the first password"
        - "Password entered twice at sign-up — A password field left empty: the submission is refused before it reaches the server and the empty field is reported"
        - "Password entered twice at sign-up — The two passwords differ: the registration proceeds using the first password and no mismatch is reported"
        - "Payment card type and expiry year options — Card type choices on the account form: exactly the options Java(TM) Card, Duke Express and Meow Card are offered"
        - "Payment card type and expiry year options — Expiry year choices on the account form: only years from the fixed list are offered and no free-text year can be entered"
        - "Customer profile defaults at creation — New customer created without profile choices: the customer's profile has preferred language \"en_US\", no favourite category, the MyList preference on and the banner preference on"
        - "Customer profile defaults at creation — Profile values supplied after creation: the profile holds \"ja_JP\" and \"BIRDS\" and the MyList and banner preferences remain on unless also changed"
        - "Account status values — Status of a new account: the account status is \"active\""
        - "Account status values — Account set to disabled: the account status reads \"disabled\""
        - "Stand-alone user registration — Registration accepted: a sign-on account for \"newuser\" is created and the user is redirected onward"
        - "Stand-alone user registration — Registration refused: no account is created and the user is redirected to the user-creation error page"
      outOfScope:
        - Credential checking, page protection and session handling (owned by sign-on)
        - Order entry and the copy of contact and card details onto an order (owned by checkout)
        - Payment-card validation or authorisation; the legacy system stores card values as supplied
      risksAssumptions:
        - "Suspected defects recorded as observed: unmasked card number on the account screen, unchecked password confirmation, swallowed validation, and every sign-up failure reported as a taken user name"
      techStack: []
      affectedCode: []
      screens:
        - "Account screen: the customer's contact details, card type, full card number and expiry month/year, and profile preferences"
