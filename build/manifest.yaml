  - slug: data-population
    title: Sample data population
    order: 12
    dependsOn:
      - catalog-browsing
      - customer-account
      - supplier-inventory
    priority: 0
    change:
      dir: openspec/changes/sx-data-population
      specCapabilities:
        - data-population
    canvas:
      problem: "Every other capability depends on the sample data the legacy loader seeds: the catalog, the demo sign-on accounts and customers, and the supplier's stock. The loader's behaviour is spread over two servlets, five populator classes, two seed files, a start page and the install script, and none of it is written down."
      solution: Provide a single editable UTF-8 seed data set that creates missing datastore structures, the storefront seed content (4 users and customers, 5 categories, 16 products, 28 items in 3 languages), the supplier seed content (29 stock lines at 10000), replacement of sample accounts by id while keeping other accounts, contact information linked to an existing address, listing all customers, three separate datastores, and the installation sequence.
      userStories:
        - As a developer or demo operator, I want the store seeded with sample catalog, customers and stock, so that it is usable immediately.
        - As a demo operator, I want loading the sample data to restore the sample accounts without touching other accounts, so that a demo starts from a known state.
        - As a tester, I want the seed content fixed and known, so that tests can rely on specific categories, items and accounts.
      acceptanceCriteria:
        - "List all customers — Customers exist: both customers are returned"
        - "List all customers — No customers: an empty list is returned"
        - "Single editable seed data set — First load into an empty datastore: the structures are created and the catalog, customer and inventory data from the seed data set are present"
        - "Single editable seed data set — Operator edits the seed data: the added product is present in the catalog"
        - "Contact information linked to an existing address — Seeding a sample customer's contact details: the record holds the four values exactly as supplied and refers to the same stored address"
        - "Supplier seed inventory content — Seeded supplier stock: 29 inventory records EST-1 to EST-29 exist, each with quantity 10000"
        - "Supplier seed inventory content — Seed entry without a quantity: that item is seeded with quantity 0"
        - "Storefront seed data content — Seeded storefront contents: exactly 4 sample users with 4 matching customers, 5 categories, 16 products and 28 items exist; each item has details and a price in English, Japanese and Chinese"
        - 'Sample account replacement by id — Sample account reset: "j2ee" and its customer are restored from the sample data; "alice" and its customer are unchanged'
        - "Separate datastores per application area — Fresh installation: the storefront, supplier and order-processing datastores each exist and hold no business data"
        - "Separate datastores per application area — Installation over an existing datastore: the existing storefront datastore is kept and only the missing datastores are created"
        - 'Installation sequence — Installation completes: the storefront, order-processing, supplier and administration areas are all available; the storefront answers at "/petstore"'
      outOfScope:
        - Catalog, customer, sign-on and supplier behaviour beyond what seeding them requires
        - Any target design for the loader
        - Importing production or customer data
      risksAssumptions:
        - Population triggers, forced repopulation and the supplier load chain were not approved and are Not specified; how the rebuild seeds data is a build decision
      techStack: []
      affectedCode: []
