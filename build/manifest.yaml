  - slug: order-fulfillment
    title: Order fulfilment and invoicing
    order: 9
    dependsOn:
      - order-approval
      - supplier-inventory
    priority: 0
    change:
      dir: openspec/changes/sx-order-fulfillment
      specCapabilities:
        - order-fulfillment
    canvas:
      problem: The legacy store fulfils orders across three cooperating applications (storefront, order processing centre, supplier) that talk over asynchronous messaging. The rules for when a line ships, when an order is complete, what an invoice carries and what an exchanged document must contain are spread across six modules and written down almost nowhere outside the code.
      solution: "Provide the staged order flow from submission to completion: hand-off to order processing, the order workflow status store and lifecycle, order lines with quantity shipped, supplier orders, the supplier-order and invoice documents, whole-line fulfilment from supplier stock, re-fulfilment on restock, invoicing, and application of invoices to complete customer orders."
      userStories:
        - As order processing, I want approved orders sent to the supplier as supplier orders, so that stock is shipped.
        - As a supplier, I want each order line shipped whole when stock allows and held otherwise, so that partial shipments are tracked per line.
        - As order processing, I want each invoice applied to the customer order, so that the order is marked complete when every line has shipped.
        - As a store operator, I want each order's workflow status recorded, so that I can see where it is in the lifecycle.
      acceptanceCriteria:
        - "Asynchronous hand-off from storefront to order processing — Placing an order does not wait for processing: the order is passed to order processing in the background and the customer does not wait for approval or fulfilment"
        - "Asynchronous hand-off from storefront to order processing — An approved order is fulfilled and invoiced: the supplier sends an invoice for the shipment to order processing"
        - "Staged order processing — An order fulfilled in two shipments: the supplier invoices order processing once per shipment and the order is complete only after the second shipment"
        - "Staged order processing — An order not yet approved is not fulfilled: the order is not sent to the supplier for fulfilment"
        - "Fulfilment message channels — Channels exist after installation: a new-order channel, a supplier purchase-order channel and an invoice channel exist and accept messages"
        - "Fulfilment message channels — An invoice reaches every subscriber: both subscribers receive that invoice"
        - "Fulfilment message channels — A queued order survives a restart: the order message is still delivered to order processing"
        - "One workflow record per order — A workflow record holds the current status: exactly one record is found and it carries status APPROVED"
        - "Starting an order workflow — Workflow started for a new order: a workflow record for order 10011 with status PENDING is stored"
        - "Starting an order workflow — Duplicate workflow start rejected: creation fails and the existing record is unchanged"
        - "Reading an order status — Status of a known order: SHIPPED_PART is returned"
        - "Reading an order status — Status of an unknown order: the request fails with a not-found error"
        - "Order lifecycle — New order starts pending: its status is PENDING"
        - "Order lifecycle — Approved order progresses to completion: the status becomes SHIPPED_PART and then COMPLETED"
        - "Order lifecycle — Denied order stops: its status is DENIED and it moves to no further status"
        - "Order status tracking — Approval decision applied to a pending order: the order status becomes APPROVED"
        - "Order status tracking — Approval decision ignored for an order no longer pending: the order status remains APPROVED"
        - "Order status tracking — Shipment recorded: the order status becomes SHIPPED_PART"
        - "Configurable stage hand-off — Batch hand-off: the configured transition receives all three messages in one hand-off"
        - "Configurable stage hand-off — Transition cannot be loaded: a transition error is raised that carries the reason the transition could not be loaded"
        - "Order message processed as one unit — Failure after a status change: order 10011 remains PENDING, no supplier purchase order is sent, and the approval batch is retried"
        - "Order line record — New order lines start unshipped: each line records its category, product, item, line number, ordered quantity and unit price, and a quantity shipped of 0"
