        - "Pending-orders status colouring: each order's status is coloured APPROVED in green, DENIED in red and PENDING in yellow"
        - "Pending and non-pending order views: one view of pending orders and one of non-pending orders listing orders that have been approved, denied or completed (fulfilled), each loaded on request"
