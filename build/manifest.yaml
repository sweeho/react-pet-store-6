  - slug: customer-notifications
    title: Customer notifications
    order: 10
    dependsOn:
      - order-approval
      - order-fulfillment
    priority: 0
    change:
      dir: openspec/changes/sx-customer-notifications
      specCapabilities:
        - customer-notifications
    canvas:
      problem: The legacy store e-mails customers about order progress through a queue-driven mail service in its order processing centre. Which e-mails exist, how each is switched on, what happens when a mail cannot be sent and what an e-mail request must contain were never written down outside a configuration guide and the code.
      solution: "Provide three customer e-mail notifications (order approval, order confirmation as parts are fulfilled, order completion), each switched on independently at deployment and off unless enabled, delivered to every address in the recipient list as direct recipients, through a configurable mail server and sender address."
      userStories:
        - "As a customer, I want an e-mail when my order is approved, fulfilled in part, or completed, so that I can track it."
        - "As a store operator, I want each order e-mail switched off unless I enable it, so that I control what customers receive."
        - "As a store operator, I want to set the mail server and sender address, so that e-mail goes out through my infrastructure."
      acceptanceCriteria:
        - "Independently switchable order notifications — Only the approval notification is enabled: the customer receives the approval e-mail only"
        - "Independently switchable order notifications — A disabled notification's event occurs: no completion e-mail is sent"
        - "Order notifications disabled unless enabled at deployment — No notification is enabled at deployment: the customer receives no approval, confirmation or completion e-mail"
        - "Order notifications disabled unless enabled at deployment — One notification is enabled at deployment: the customer receives a confirmation e-mail, and the approval and completion notifications remain disabled"
        - "Recipient address list — Two recipients in one request: both addresses receive the e-mail as direct (\"To\") recipients"
        - "Recipient address list — Single recipient: a@example.com receives the e-mail as a direct (\"To\") recipient"
        - "Configurable mail server and sender — Shipped sender address: its From address is customerservice@javapetstoredemo.com"
        - "Configurable mail server and sender — Operator changes the mail server and sender: it is delivered through smtp.example.com with From address orders@example.com"
      outOfScope:
        - Deciding approval or fulfilment state (owned by order-approval and order-fulfillment)
        - Per-locale price formatting rules inside e-mails (owned by localization)
        - Any user interface; no screen records were extracted for this capability
      risksAssumptions:
