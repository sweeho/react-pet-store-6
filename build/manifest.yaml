    canvas:
      problem: Checkout is how a signed-on customer turns a cart into an order. The rebuild must reproduce what the legacy storefront shows, accepts and hands to order processing, and the business needs a record of where that behaviour is questionable.
      solution: "Provide the billing and shipping information form pre-filled from the signed-on customer's account, order ids issued from the shared \"1001\" counter (with a prefix required for every identifier request), atomic creation of a purchase order with its contact, card and line-item records, and a Server Error page for unexpected failures."
      userStories:
        - "As a signed-on customer, I want billing and shipping details pre-filled from my account, so that checking out is quick."
        - "As a customer, I want each order to receive a unique order id, so that I can refer to it later."
        - "As order processing, I want an order stored completely or not at all, so that no partial order is ever processed."
        - "As a customer, I want an error page when something unexpected fails, so that I know to contact the administrator."
      acceptanceCriteria:
        - "Billing and shipping information screen pre-filled at checkout — Signed-on customer reaches the checkout form: the billing and shipping information form is displayed with those known details already filled in"
