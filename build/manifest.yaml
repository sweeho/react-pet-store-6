  - slug: order-fulfillment
    title: Order fulfilment and invoicing
    order: 9
    dependsOn:
      - order-approval
      - supplier-inventory
    priority: 0
    change:
      dir: openspec/changes/sx-order-fulfillment
      specCapabilities:
        - order-fulfillment
    canvas:
      problem: The legacy store fulfils orders across three cooperating applications (storefront, order processing centre, supplier) that talk over asynchronous messaging. The rules for when a line ships, when an order is complete, what an invoice carries and what an exchanged document must contain are spread across six modules and written down almost nowhere outside the code.
      solution: "Provide the staged order flow from submission to completion: hand-off to order processing, the order workflow status store and lifecycle, order lines with quantity shipped, supplier orders, the supplier-order and invoice documents, whole-line fulfilment from supplier stock, re-fulfilment on restock, invoicing, and application of invoices to complete customer orders."
      userStories:
        - As order processing, I want approved orders sent to the supplier as supplier orders, so that stock is shipped.
        - As a supplier, I want each order line shipped whole when stock allows and held otherwise, so that partial shipments are tracked per line.
        - As order processing, I want each invoice applied to the customer order, so that the order is marked complete when every line has shipped.
        - As a store operator, I want each order's workflow status recorded, so that I can see where it is in the lifecycle.
      acceptanceCriteria:
        - "Staged asynchronous order processing — Placing an order does not wait for processing: the order is handed to order processing as a queued message and the customer does not wait for approval or fulfilment"
        - "Staged asynchronous order processing — An approved order is fulfilled in two shipments: the supplier sends two invoices, one per shipment, and the order is complete only after the second shipment"
        - "Fulfilment message channels — Channels exist after installation: a new-order queue, a supplier purchase-order queue and an invoice topic exist and accept messages"
        - "Fulfilment message channels — An invoice reaches every subscriber: both subscribers receive that invoice"
        - "One workflow status record per order — Status is looked up by order identifier: exactly one record is found and it carries status APPROVED"
        - "Order status vocabulary — A partly shipped order: the status is SHIPPED_PART"
        - "Order lifecycle — A new order enters the workflow: its status is PENDING"
        - "Order lifecycle — A denied order goes no further: the order never moves to APPROVED, SHIPPED_PART or COMPLETED"
        - "Starting an order workflow — New order starts a workflow: a workflow record for 1001 with status PENDING exists"
        - "Starting an order workflow — Duplicate start is refused: the start fails and no second record is created"
        - "Updating an order status — Status replaced: reading order 1001 returns SHIPPED_PART and APPROVED is no longer recorded"
        - "Updating an order status — Unknown order: the update fails with a not-found error and nothing is stored"
        - "Reading an order status — Unknown order status requested: the request fails with a not-found error"
        - "Atomic workflow status operations — Status change rolls back with its cause: the status of order 1001 is unchanged"
        - "Internal-only order status operations — No external access: no interface exists through which it can do so"
        - "Configurable stage hand-off — Missing handler: a hand-off failure is raised and the original cause is retrievable from it"
        - "Order line record — New order starts with nothing shipped: the stored line carries item EST-4, quantity 3, unit price 18.50 and quantity shipped 0"
        - "Order line immutability — Only shipped quantity changes: its quantity shipped becomes 3 and its item, quantity and unit price are unchanged"
        - "Order line snapshot — Snapshot of a partly shipped line: the snapshot carries quantity 5 and no shipped quantity"
        - "Supplier order record — Supplier order stored with its parts: the stored supplier order carries identifier 1001, the order date, a status, the one shipping contact and both lines"
        - "Supplier order identity — Duplicate supplier order refused: its creation is rejected"
        - "Supplier order identity — Retrieval by identifier: that order is returned"
        - "Initial supplier order state — Newly recorded supplier order: its status is PENDING and every line has quantity shipped 0"
        - "Supplier order status vocabulary — Fulfilled supplier order: its status becomes COMPLETED"
        - "Listing supplier orders by status — Pending orders listed: exactly the two PENDING orders are returned, each once"
        - "Atomic supplier order creation — A line cannot be stored: creation fails and neither the order, its contact nor its first line remains stored"
        - "Dependent records removed with their order — Supplier order removed: its shipping contact, the contact's address and both lines no longer exist"
        - "Dependent records removed with their order — Purchase order removed: its contact information, addresses, payment card record and lines no longer exist"
        - "Supplier order read-only view — Viewing a stored supplier order: the view carries identifier 1001, the order date and both lines, no status, and an empty shipping contact"
        - "Internal supplier order document — Document with no lines rejected: the document is rejected"
        - "Supplier order date handling — Readable date: its order date is 24 October 2026 with no time of day"
        - "Supplier order date handling — Unreadable date: the order is accepted and its order date is the current date"
        - "Contact details in order documents — Empty e-mail accepted: the contact is accepted"
        - "Contact details in order documents — Empty phone rejected: the document is rejected"
        - "Contact details in order documents — Missing value written as empty: an empty e-mail element appears between the address and the phone"
        - "Order line exchange element — Misordered line rejected: the line is rejected"
        - "Supplier purchase order document — Approved order sent to supplier: the supplier receives one document with the order identifier, order date, a nine-field shipping address and at least one line, in that order"
        - "Supplier invoice document — Invoice structure: the document carries order identifier 1001, a user identifier, the order date, the shipping date and that one line, in that order"
        - "Trading-partner line attributes — Complete line written: all six values appear on the line"
        - "Schema-mode line value ranges — Zero quantity in schema mode: the line fails validation"
        - "Schema-mode line value ranges — Zero price in schema mode: the line passes validation"
        - "Schema-mode unique items per document — Duplicate item in schema mode: the document fails validation"
        - "Trading-partner document dates — Date written: the order date reads 2026-10-24"
        - "Trading-partner document completeness — Missing order identifier: production fails"
        - "Trading-partner document completeness — Missing address field: the document is produced with an empty state field"
        - "Document format identification and resolution — Offline validation: its format definition is resolved from the bundled copy and validation proceeds"
        - "Document format identification and resolution — Deployment catalog override: the deployment's definition is used"
