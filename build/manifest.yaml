        - "Supplier order identity — Duplicate supplier order rejected: the creation is rejected and the stored order is unchanged"
        - "New supplier order is pending — Supplier order created: its status is PENDING"
        - "Supplier order status vocabulary — Supplier order status values: the status is one of PENDING, APPROVED, DENIED or COMPLETED"
        - "Supplier order lines start unshipped — Supplier order lines copied: the stored line carries the same category, product, item EST-1, line number 1, quantity 3 and unit price 16.50, with shipped quantity 0"
        - "Supplier order contact and lines belong to the order — Supplier order deleted: the shipping contact, the address and both line items no longer exist"
        - "Listing supplier orders by status — Pending supplier orders listed: exactly the three pending orders are returned, each once"
        - "Atomic supplier order creation — Line item cannot be stored: the creation fails and no part of the order, its contact or its lines is stored"
        - "Supplier order document content — Supplier order document built: the document carries, in order, the order identifier 10011, the order date, the shipping address fields first name, last name, street, city, state, country, zip code, e-mail and phone, and the two line items"
        - "Supplier order document content — Supplier order without lines: the document is rejected as not conforming"
        - "Supplier document mandatory fields — Missing order identifier: production fails and no document is produced"
        - "Supplier document mandatory fields — Missing shipping phone: the document is produced with an empty phone field"
        - "Supplier document dates — Order date written as a date: the order date is written as 2003-04-15 with no time of day"
        - "Supplier document format identification and resolution — Default format identification: the document is UTF-8 encoded and identifies its format by the document-type public identifier"
