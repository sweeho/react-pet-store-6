    canvas:
      problem: The legacy store e-mails customers about order progress through a queue-driven mail service in its order processing centre. Which e-mails exist, how each is switched on, what happens when a mail cannot be sent and what an e-mail request must contain were never written down outside a configuration guide and the code.
      solution: "Provide independently switchable order notifications that are off unless enabled at deployment, with a switched-off notification consuming its trigger; e-mail requests in a fixed format delivered asynchronously from a queue, content sent as supplied, to every address in the recipient list; the completed-order e-mail content and the customer e-mail sequence for an order; a configurable mail server, account and sender; and separate durable notification channels."
