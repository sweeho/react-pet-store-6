        - "Completed-order e-mail content — Order completes with completed-order mail enabled: the order's e-mail address receives an English e-mail with subject \"Java Pet Store Order COMPLETED: 1001\" stating the entire order has shipped and listing both lines with category, product, quantity and unit price"
