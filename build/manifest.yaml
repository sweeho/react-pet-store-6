  - slug: sign-on
    title: Sign-on and access control
    order: 3
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-sign-on
      specCapabilities:
        - sign-on
    canvas:
      problem: Sign-on decides who may see account details, check out, administer orders and manage supplier stock. The legacy storefront, administration area and supplier area each sign users in and out differently, and their access control has known weaknesses that the business must see before deciding what to keep.
      solution: Provide the storefront credential store and case-sensitive credential check, protection of the account, order-entry and welcome pages with return to the requested page, the remembered user name, session set-up and sign-out with idle expiry, the storefront sign-in and error screens and header state, and role-restricted administrator and supplier areas with their own sign-in, landing and logout screens.
      userStories:
        - As a returning customer, I want to sign in with my user name and password and optionally have my user name remembered, so that I can reach my account and check out.
        - As a customer, I want to be returned to the page I asked for after signing in, so that I do not have to navigate back.
        - As a customer, I want to sign out, so that the next person on this browser cannot use my session.
        - As an administrator, I want a separate sign-in to the administration area, so that only administrators can approve orders and view sales.
        - As a supplier administrator, I want a separate sign-in to the supplier area, so that only authorised staff can change stock.
      acceptanceCriteria:
        - "Sign-on credential record — Second credential with an existing user ID: the creation is refused and the existing credential is unchanged"
        - "Credential check — Correct user ID and password: the attempt is authenticated"
        - "Credential check — Password differs only in letter case: the attempt fails"
        - "Credential check — Unknown user ID: the attempt fails"
        - "User ID maximum length — 26-character user ID: the creation is refused and no credential is stored"
        - "User ID maximum length — 25-character user ID: the credential is stored"
        - "User ID forbidden characters — User ID containing an asterisk: the creation is refused and no credential is stored"
        - "Password maximum length — Password over the maximum: the creation is refused and no credential is stored"
        - "Storefront protected pages — Visitor opens the account page: the sign-in screen is shown and the account view is remembered as the page to return to"
        - "Storefront protected pages — Visitor opens the cart: the cart is shown without asking the visitor to sign in"
        - "Storefront protected pages — Signed-on customer opens the account page: the account view is shown"
        - "Storefront protection does not check roles — Role configured on a protected page: the page is shown"
        - "Protected page configuration — Duplicate protected page name: \"customer.screen\" is protected, \"cart.do\" is not, and a warning is logged"
        - "Storefront sign-on submission — Successful sign-on after requesting checkout: the visitor is signed on and taken to the order information entry screen"
        - "Storefront sign-on submission — Failed sign-on: the visitor remains not signed on and the sign-in error screen is shown"
        - "Remember the user name — Option ticked: the browser keeps \"ann\" as the remembered user ID for 31 days"
        - "Remember the user name — Option not ticked: the remembered user ID is removed"
        - "Storefront sign-in screen — No remembered user ID: the returning-customer form shows User Name \"j2ee\", a filled Password, and an unticked \"Remember My User Name\" checkbox, and the new-customer form shows three empty fields and a \"Create New Account\" control"
        - "Storefront sign-in screen — Remembered user ID: the returning-customer User Name shows \"ann\", the Password is empty and \"Remember My User Name\" is ticked"
        - "Storefront sign-in screen — Rejected credentials: the \"Sign-in Error\" screen is shown with the \"not found in our records\" message and an invitation to try again"
        - "Storefront header sign-in state — Visitor not signed on: the header shows search, Account, Cart and \"Sign in\", and no \"Sign out\""
        - "Storefront header sign-in state — Signed-on customer: the header shows search, Account, Cart and \"Sign out\", and no \"Sign in\""
        - "Session set-up after sign-on — Customer who prefers Japanese: the store and the cart switch to Japanese"
        - "Session set-up after sign-on — User without a customer record: sign-on succeeds and no customer record is loaded"
        - "Storefront sign-out — Customer signs out with items in the cart: the signed-out screen is shown, the customer is no longer signed on, the cart is empty and the store is still in Japanese"
        - "Storefront idle session expiry — Customer idle for 16 minutes: the customer is not signed on, the sign-in screen is shown and the cart is empty"
        - "Error screen selection — Mapped error: the configured error screen is shown"
        - "Error screen selection — Unmapped error: a generic server error is returned"
        - "Server error page — Unexpected error: it displays the error message and a request to notify the administrator"
        - "Administration area access — Unauthenticated request: the administration sign-in screen is shown"
        - "Administration area access — Authenticated user without the role: access is refused"
        - "Built-in administrator account — Fresh installation: the administration landing page is shown"
        - "Administration sign-in screen — Screen displayed: it shows a User ID field, a Password field and a submit control"
        - "Administration sign-in screen — Rejected credentials: the \"Login Error\" page is shown with the authentication message and a \"Return to Sign in Page\" link"
        - "Administration landing page — Administrator opens the area: the landing page shows the description of the sales, revenue, order and approve/deny facilities, a \"Launch Rich Client\" control and a \"logout\" control"
        - "Administration application launch — Launch from the landing page: the administration application starts and its data requests run within the administrator's session without asking for credentials"
        - "Administration data requests need a live session — Expired session: the reply is \"Session Timed Out; Please exit and login as admin from the login page\" and no orders are returned"
        - "Administration data requests need a live session — Session without the administrator role: the request is refused"
        - "Administration logout — Administrator logs out: the session ends and the welcome page with the \"Click here to enter Admin\" link is shown, and requesting the administration area again shows the sign-in screen"
        - "Administration idle session expiry — Administrator idle for 55 minutes: the administration sign-in screen is shown"
        - "Supplier area access — Unauthenticated request: the supplier sign-in screen is shown"
        - "Built-in supplier account — Fresh installation: the supplier home page is shown"
        - "Supplier sign-in screen — Screen displayed: it shows a User ID field, a Password field and a submit control"
        - "Supplier sign-in screen — Rejected credentials: the \"Login Error\" page is shown with the authentication message and a \"Return to Sign in Page\" link"
        - "Supplier logout — Supplier logs out: the session ends and the page with the \"Click here to enter Supplier\" link is shown"
        - "Supplier idle session expiry — Supplier idle for 55 minutes: the supplier sign-in screen is shown"
        - "Anonymous catalog access — Visitor searches the catalog: the matching products are shown without a sign-in prompt"
        - "Access control at the entry points — Stored card read through the account view: the only route is through a protected storefront page, so the sign-in screen is shown and no card data is returned"
        - "Access control at the entry points — Order processing administration called directly: the call is not reachable and no order data is returned"
      outOfScope:
        - Account creation details, profile and contact data (owned by customer-account)
        - Order approval and sales reporting behaviour inside the admin area (owned by order-approval and sales-reporting)
        - Inventory behaviour inside the supplier area (owned by supplier-inventory)
      risksAssumptions:
        - Eleven suspected legacy defects (including an admin data endpoint without role protection and pre-filled demo credentials) and seven open questions are listed in the change design.md
      techStack: []
      affectedCode: []
      screens:
        - "Supplier sign-in screen: asks for user id and password; when authentication fails it shows a login error stating the user could not be authenticated, asking them to check username and password, with a link back to sign in"
        - "Storefront sign-on screen: a returning-customer form (user name, password, Remember My User Name) and a new-customer form (user name, password, password repeat); the user name is pre-filled when previously remembered, otherwise user name and password are pre-filled with the demo account j2ee"
        - "Storefront header on every store page: a link to the main page, a keyword search box, Account and Cart links, and a Sign out link when the user is signed on or a Sign in link otherwise"
        - "Admin landing page: explains that the administrator can view sales, revenue and orders by status and approve or deny pending orders, and offers two actions, launch the administration tool and log out"
