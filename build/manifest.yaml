        - "Supplier receives purchase orders by message — Purchase order received: exactly one supplier consumer receives it and an internal supplier order for 10011 is produced carrying that shipping address and both lines"
        - "Purchase order receipt as one unit of work — Invoice publication fails: the supplier order is not recorded, no stock is consumed, and the purchase order message is redelivered"
