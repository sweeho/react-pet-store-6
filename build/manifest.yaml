    canvas:
      problem: The legacy store holds every order above a locale-dependent threshold until an administrator approves or denies it. The rebuild must reproduce which orders are auto-approved, how an administrator reviews and decides the rest, and how decisions reach order processing.
      solution: Provide orders that start pending, automatic approval by locale threshold (US under 500, Japan under 50000), the administrator's pending and non-pending order views with status colour coding, batch approval and denial committed together, the warning before discarding uncommitted decisions, loading on start and refresh with a busy state during server requests, and asynchronous delivery of decisions over a durable channel in a batch whose status is free text.
      userStories:
        - As a store owner, I want small orders approved automatically by locale threshold, so that administrators only review large orders.
        - As an administrator, I want a list of pending orders where I can mark each approved or denied, so that I can decide them in one pass.
        - As an administrator, I want to see already-decided orders separately, so that I can check what has been approved, denied or fulfilled.
        - As order processing, I want each approval decision delivered asynchronously, so that approved orders move on to fulfilment.
      acceptanceCriteria:
        - "Pending and non-pending order views — Orders are split between the two views: the PENDING order appears only in the pending view, and the APPROVED, DENIED and COMPLETED orders appear only in the non-pending view"
        - "Pending and non-pending order views — Non-pending view reloaded on request: the order appears in the non-pending view with status APPROVED"
        - "Pending order status colour coding — Statuses are colour-coded: the PENDING status is shown in yellow, the APPROVED status in green and the DENIED status in red"
        - "Batch approval and denial committed together — Decisions held until commit: none of the three orders' stored status has changed"
        - "Batch approval and denial committed together — Decisions applied on commit: all three status changes are submitted together"
        - "Warning before discarding uncommitted decisions — Refresh cancelled: no refresh happens and the order still shows APPROVED"
        - "Warning before discarding uncommitted decisions — Refresh confirmed: the data is reloaded and the order shows its stored status PENDING"
        - "Warning before discarding uncommitted decisions — Refresh with nothing uncommitted: the data is reloaded without a warning"
        - "Loading order data on start and refresh — Tool start: the orders in all four statuses and the revenue and order-count chart data are loaded without the administrator requesting a refresh"
        - "Loading order data on start and refresh — Refresh: the orders in all four statuses and the chart data for the current date ranges are loaded again"
        - 'Busy state during server requests — Update in progress: the approve, deny, commit, chart-submit, refresh, about and exit actions are disabled and "Updating data on the server..." is shown'
        - 'Busy state during server requests — Retrieval in progress: the actions are disabled and "Retrieving data from the server..." is shown'
        - "Busy state during server requests — Reply applied: the actions are enabled again"
        - "New orders start pending — Order recorded before the approval decision: the order is stored and its workflow status is PENDING before the system decides whether it is approved"
        - "Automatic approval thresholds by locale — Japanese order below threshold: it is approved automatically"
        - "Automatic approval thresholds by locale — Japanese order at the threshold: it remains PENDING until an administrator decides it"
        - "Automatic approval thresholds by locale — Chinese order of a small total: it remains PENDING until an administrator decides it"
        - "Automatic approval of small US orders — US order below threshold: it is approved automatically"
        - "Automatic approval of small US orders — US order at exactly the threshold: it is not approved automatically and remains pending"
        - "Automatic approval of small US orders — US order above threshold: it remains pending for administrator review"
        - "Asynchronous delivery of administrator decisions — Decisions delivered as one message: one message carrying both decisions is placed on the order approval queue and the administrator does not wait for order processing to act on it"
        - "Durable order approval channel — Decision survives until consumed: the decision remains on the channel until order processing receives it"
        - "Approval batch status is free text — Unlisted status carried: the entry is read with status COMPLETED and no format error is raised"
      outOfScope:
