  - slug: data-population
    title: Sample data population
    order: 12
    dependsOn:
      - catalog-browsing
      - customer-account
      - supplier-inventory
    priority: 0
    change:
      dir: openspec/changes/sx-data-population
      specCapabilities:
        - data-population
    canvas:
      problem: "Every other capability depends on the sample data the legacy loader seeds: the catalog, the demo sign-on accounts and customers, and the supplier's stock. The loader's behaviour is spread over two servlets, five populator classes, two seed files, a start page and the install script, and none of it is written down."
      solution: Provide the populated-state check, a full sample load (rebuild the catalog, replace sample accounts by id, keep other accounts), forced repopulation with session termination, the chained supplier load and its redirect and failure contract, the seed data content (4 users and customers, 5 categories, 16 products, 28 items in 3 languages, 29 supplier stock lines at 10000), datastore separation and the installation sequence.
      userStories:
        - As a developer or demo operator, I want the store seeded with sample catalog, customers and stock on first start, so that it is usable immediately.
        - As a demo operator, I want to force a reset of the sample data, so that a demo starts from a known state.
        - As a tester, I want the seed content fixed and known, so that tests can rely on specific categories, items and accounts.
      acceptanceCriteria:
        - "Automatic sample-data population on store entry — First entry into an empty store: the sample catalog, users and customers are loaded before the visitor reaches the storefront"
        - "Automatic sample-data population on store entry — Entry into an already populated store: no data is dropped or reloaded"
        - "Populated-state check — Catalog present but no users: the store is treated as not populated and the full sample load runs"
        - "Populated-state check — Check fails with an error: the store is treated as not populated and the full sample load runs"
        - "Forced repopulation — Forced repopulation of a populated store: the full sample load runs even though the populated-state check would pass"
        - "Catalog rebuild on every sample load — Catalog edits are lost on reload: the item carries its seeded price again and no non-seed catalog rows remain"
        - "Catalog rebuild on every sample load — First load with no catalog structures: the catalog data is created and loaded without error"
        - "Sample account replacement by id — Sample account reset: \"j2ee\" and its customer are restored from the seed data; \"alice\" and its customer are unchanged"
        - "Storefront seed data content — Seeded storefront contents: exactly 4 sample users with 4 matching customers, 5 categories, 16 products and 28 items exist; each category, product and item has details in English, Japanese and Chinese"
        - "Single editable seed data set — Operator edits the seed data: the added product is present in the catalog"
        - "Session ended on population — Signed-in visitor triggers population: the visitor is signed out and the session state is discarded"
        - "Chained supplier population — Non-forced entry chain: supplier population runs in non-forced mode; the visitor lands on the storefront main page"
        - "Chained supplier population — Forced chain: supplier population runs in forced mode"
        - "Supplier inventory seeding gate — Inventory already present, not forced: no inventory record is changed"
        - "Supplier inventory seeding gate — Forced reset of inventory: EST-1 has quantity 10000"
        - "Supplier seed inventory content — Seeded supplier stock: 29 inventory records EST-1 to EST-29 exist, each with quantity 10000"
        - "Supplier seed inventory content — Seed entry with a bad quantity: that item is seeded with quantity 0"
        - "Post-population redirect and failure handling — Success with a destination: the caller is sent to that destination"
        - "Post-population redirect and failure handling — Success without a destination: the caller is sent back to the referring page"
        - "Post-population redirect and failure handling — Failure without an error destination: the caller receives a server error response"
        - "Population progress notice — Visitor enters the store: a please-wait notice is shown and population starts automatically in non-forced mode"
        - "Population access without sign-on — Anonymous forced repopulation: the storefront catalog is rebuilt, the sample accounts are reset and supplier inventory is reset to its seed quantities"
        - "List all customers — Customers exist: both customers are returned"
        - "List all customers — No customers: an empty list is returned"
        - "Contact information linked to an existing address — Seeding a sample customer's contact details: the record holds the four values exactly as supplied and refers to the same stored address"
        - "Separate datastores per application area — Fresh installation: the storefront, supplier and order-processing datastores each exist and are empty of business data"
        - "Installation sequence — Installation completes: the storefront, order-processing, supplier and administration areas are all available; the storefront answers at \"/petstore\""
      outOfScope:
        - Catalog, customer, sign-on and supplier behaviour beyond what seeding them requires
        - Any target design for the loader
        - Importing production or customer data
      risksAssumptions:
        - Anonymous callers can trigger a destructive reset (Business Owner decision before build)
        - If the populated-state check fails with an error the catalog is wiped (suspected defect)
      techStack: []
      affectedCode: []
