  - slug: sales-reporting
    title: Admin order and sales reporting
    order: 11
    dependsOn:
      - checkout
      - order-approval
    priority: 0
    change:
      dir: openspec/changes/sx-sales-reporting
      specCapabilities:
        - sales-reporting
    canvas:
      problem: Store administrators list orders by status and chart revenue and sales per product category over a date range in a rich-client admin tool. Which statuses count as non-pending, what the figures are summed from, how report dates are entered and defaulted, and how bad data is handled were never written down beyond a short user guide.
      solution: Provide date-range order retrieval, orders by status, the order-list data contract, revenue-by-category and sales-count-by-category reports with chart date validation, the default range, per-item drill-down, chart totals and discarded entries, load-on-start and refresh, and the non-pending orders and order-list screens.
      userStories:
        - As an administrator, I want to see every order that is no longer pending, so that I can review decided and fulfilled orders.
        - As an administrator, I want to sort order lists by any column, so that I can find orders by date, customer or amount.
        - As an administrator, I want revenue and sales charted per category over a date range, so that I can see which categories sell.
      acceptanceCriteria:
        - "Orders within a date range — Orders on and inside the bounds are returned: all three orders are returned"
        - "Orders within a date range — Orders outside the bounds are excluded: neither order is returned"
        - "Orders by current status — Orders at the requested status are listed once each: exactly the three PENDING orders are returned, each once"
        - "Orders by current status — Status match is exact: no orders are returned"
        - "Order list data — Order data is loaded for all four statuses: one request is made per status and the combined result contains every order with its id, user id, order date, amount and status"
        - "Order list data — Count accompanies each status result: the response carries those four orders and a total count of 4"
        - "Revenue by category report — Revenue split across categories: the response lists DOGS 300.00 and CATS 100.00 with a total of 400.00, and the pie chart shows DOGS as 75% and CATS as 25%"
        - "Revenue by category report — Hover shows category and rounded percentage: the text \"FISH (33.33%)\" is shown"
        - "Sales count by category report — Counts per category are charted: the response lists DOGS 6 and BIRDS 3 with a total of 9, and the DOGS bar is twice the height of the BIRDS bar"
        - "Sales count by category report — Hover shows the count: the text \"6 orders\" is shown"
        - "Chart date entry validation — Malformed date is rejected: the message \"Dates must be in the format of MM/dd/yyyy\" is shown and no chart data is requested"
        - "Chart date entry validation — Valid dates reload the chart: chart data for 1 January 2002 through 30 June 2002 is requested and the chart is redrawn"
        - "Chart date entry validation — Reversed range is not rejected: no error is shown and chart data for that range is requested"
        - "Default chart date range — Charts open on the default range: the start date shows 01/01/2001 and the end date shows 12/31/2002"
        - "Per-item breakdown within a category — Category named in the request: the response lists revenue for EST-1 and EST-2 only, keyed by item"
        - "Per-item breakdown within a category — No category named: the response lists revenue per category"
        - "Chart totals and invalid entries — Unreadable entry is dropped: only DOGS is charted and DOGS is shown as 100% of revenue"
        - "Chart totals and invalid entries — Negative entry is dropped: only the DOGS bar is drawn"
        - "Report data load on start and refresh — Initial load: the order lists, the revenue chart and the sales-count chart are populated without any further action"
        - "Report data load on start and refresh — Refresh reloads everything: the order lists and both charts are reloaded and the newly approved order appears among the non-pending orders"
        - "Non-pending orders screen — Non-pending orders are displayed: every APPROVED, COMPLETED and DENIED order is listed with its ID, user ID, date, amount and status, and no PENDING order is listed"
        - "Non-pending orders screen — Sorting by a column: the rows are re-ordered by amount"
        - "Non-pending orders screen — Rows cannot be edited: the value does not change and no status update is sent"
        - "Non-pending orders screen — Non-numeric order ID: its ID column shows -1"
        - "Sales charts screen — Switching to the Sales view: the Sales view is shown with the tabs \"Pie Chart\" and \"Bar Chart\""
        - "Sales charts screen — Chart tab controls: the tab shows \"Showing total # of sales per category\", a Start Date field, an End Date field and a \"Get Data\" button"
        - "Sales charts screen — Get Data redraws the chart: the revenue chart is requested for that range and redrawn"
      outOfScope:
        - Approving or denying pending orders (owned by order-approval)
        - Admin area sign-in and role restriction (owned by sign-on)
        - Export or scheduled delivery of reports; the legacy tool has none
      risksAssumptions:
        - The Orders chart counts units, not orders, while the screen labels it orders
        - Revenue includes every order in the range regardless of status, denied orders included
        - The end date is effectively exclusive (suspected defect)
        - Per-item drill-down is unreachable from the shipped client (unresolved reachability)
      techStack: []
      affectedCode: []
      screens:
        - "Non-pending orders view: lists orders whose status is approved, denied or committed (fulfilled), loaded on demand by a refresh action"
        - "Order lists: show for each order its ID, user ID, order date, amount and status, sortable by clicking a column header; a non-numeric order ID is shown as -1"
