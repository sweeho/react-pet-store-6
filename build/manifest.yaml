  - slug: shopping-cart
    title: Shopping cart
    order: 5
    dependsOn:
      - catalog-browsing
    priority: 0
    change:
      dir: openspec/changes/sx-shopping-cart
      specCapabilities:
        - shopping-cart
    canvas:
      problem: The shopping cart is where a shopper collects catalog items before checkout. The rebuild must reproduce how the legacy storefront adds, updates, removes, counts and totals cart lines and what the cart page shows, and the business needs to see where that behaviour is questionable.
      solution: Provide one in-memory cart per browsing session with at most one line per item, discarded on sign-out; add (quantity set to 1), update all quantities in one submission, remove a line, empty after an order is placed; the distinct-line count and the list-price subtotal; locale-dependent line details; anonymous use; and the cart screen.
      userStories:
        - As a shopper, I want to add an item to my cart from a product, item or search page, so that I can buy it later in my visit.
        - As a shopper, I want to change quantities and remove lines in one place, so that my cart holds exactly what I want.
        - As a shopper, I want to see each line's price and the cart total, so that I know what I will pay before checking out.
        - As an anonymous visitor, I want to use the cart without signing in, so that I can shop before creating an account.
      acceptanceCriteria:
        - "One cart per shopping session — First use of the cart in a session: an empty cart is created for that session and its item count is 0"
        - "One cart per shopping session — Two sessions have separate carts: the second shopper's cart does not contain EST-1"
        - "Cart session lifetime — Shopper signs out with items in the cart: the shopper's cart is empty afterwards"
        - "Cart session lifetime — Session ends: the cart contents are not retrievable by any later session"
