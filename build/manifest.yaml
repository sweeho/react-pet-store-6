  - slug: supplier-inventory
    title: Supplier inventory
    order: 8
    dependsOn:
      - sign-on
    priority: 0
    change:
      dir: openspec/changes/sx-supplier-inventory
      specCapabilities:
        - supplier-inventory
    canvas:
      problem: The legacy supplier application lets an administrator view the supplier's stock and overwrite stock counts, which releases supplier orders waiting for stock. The same stock record is what order fulfilment draws down when a line ships.
      solution: Provide one stock record per item with a mandatory whole-number quantity; inventory update that overwrites the quantity of marked rows and ignores blank, negative and unmarked entries; stock reduction by the full line quantity when a line ships and none when stock is short; re-attempting every pending supplier order in the same unit of work as the update; and the supplier home and inventory screens.
      userStories:
        - As a supplier administrator, I want to see the stock count for every item, so that I know what can be shipped.
        - As a supplier administrator, I want to enter new counts for the items I tick and submit them together, so that restocking is one step.
        - As a supplier, I want back-ordered supplier orders re-attempted after a restock, so that waiting orders ship without manual follow-up.
      acceptanceCriteria:
        - "Supplier stock record per item — One stock record per item: the creation is refused and the existing record is unchanged"
        - "Supplier stock record per item — Quantity is mandatory: the save is refused"
        - "Inventory update replaces the stock quantity — Marked item with a valid quantity is overwritten: the stock quantity of EST-1 is 25, not 65"
        - "Inventory update replaces the stock quantity — Zero is accepted: the stock quantity of EST-1 is 0"
        - "Inventory update ignores unmarked, blank and negative entries — Edited but unmarked row is not applied: the stock quantity of EST-1 remains 40"
        - "Inventory update ignores unmarked, blank and negative entries — Marked row with an empty quantity is not applied: the stock quantity of EST-1 remains 40"
        - "Inventory update ignores unmarked, blank and negative entries — Negative quantity is not applied: the stock quantity of EST-1 remains 40 and no error message is shown"
        - "Stock is reduced when an order line ships — Sufficient stock: the line is shipped and the stock of EST-1 becomes 6"
        - "Stock is reduced when an order line ships — Exactly enough stock: the line is shipped and the stock of EST-1 becomes 0"
        - "Stock is reduced when an order line ships — Insufficient stock: the stock of EST-1 remains 3 and the line is not shipped"
        - "Inventory update re-fulfils pending orders in one unit of work — Restock releases a waiting order: the line ships, the stock of EST-1 becomes 3, and one invoice is sent for that order"
        - "Inventory update re-fulfils pending orders in one unit of work — Restock that releases nothing: the stock of EST-1 is 2, the order stays pending, and no invoice is sent for it"
        - "Inventory update confirmation — Successful update: the confirmation \"Inventory was updated successfully\" is shown with a Display Inventory action and a Logout action"
        - "Inventory update confirmation — Display inventory from the confirmation: the supplier inventory screen is shown with the updated quantities"
        - "Supplier home screen — Supplier opens the supplier area: the home screen is shown with the explanation, a Display Inventory action and a Logout action"
        - "Supplier home screen — Display Inventory from home: the supplier inventory screen is shown"
        - "Supplier home screen — Logout from home: the supplier is signed out"
        - "Supplier inventory screen display — Administrator views the inventory: three rows are listed, each with its item identifier, existing quantity, an empty new-quantity field and an unmarked update marker, and a single Submit control is offered"
        - "Supplier inventory screen display — User without the administrator role: a not-authorised message is shown and no inventory list or Submit control is shown"
        - "Supplier inventory screen display — Inventory cannot be read: the message \"There are no items in inventory at all\" is shown instead of the list"
        - "Supplier inventory screen batch submission — Several rows changed in one submission: both changes are saved together, EST-1 is 50, EST-2 is 20 and EST-3 is 12"
        - "Supplier inventory screen update marking — Mixed marked and unmarked rows: EST-1 is 30 and EST-2 remains 0"
      outOfScope:
