  # src/apps/petstore/a.yaml
  - record_key: CART-REQ-0001
    source: src/apps/petstore/a.yaml
    recommendation: edit
    confidence: high
    reason: >
      The add path is correct, but "adding a quantity of 1 per action" and "each click adds one
      unit" read as an increment. The cart component resets the quantity to 1 (SC-BR-0001,
