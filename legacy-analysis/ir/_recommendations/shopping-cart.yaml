      narrower failure case.
    edited_requirement: >
      The system SHALL read cart line details (product name, attribute, category and unit
      price) from the catalog in the shopper's current locale, and SHALL use US English when
      no locale has been set.
  - record_key: SC-REQ-0002
    source: src/components/cart/b.yaml
