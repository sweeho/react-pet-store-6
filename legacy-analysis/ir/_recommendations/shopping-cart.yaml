# SX-0001 synthesize shopping-cart: recommendations, not decisions.
# Record keys repeat across pass files with different content, so each entry
# names the pass file it refers to in `source` (relative to
# legacy-analysis/ir/_passes/legacy-source/petstore1.3.2/).
recommendations:
  # src/components/cart/a.yaml
  - record_key: SC-ENT-0001
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The item-id-keyed map in ShoppingCartLocalEJB and the Stateful descriptor agree. Pass B's
      SC-RULE-0006 and petstore CART-RULE-0005 say the same.
  - record_key: SC-ENT-0002
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The CartItem fields and getTotalCost match getItems(). It duplicates pass B's SC-ENT-0001.
  - record_key: SC-BR-0001
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The code says put(itemId, 1), and CartEJBAction is the only caller and calls it without
      a lookup. That raises the pass's medium confidence. Whether a reset-on-re-add is right is
      a Business Owner decision in the defect register (design.md D1).
  - record_key: SC-BR-0002
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The remove-then-conditional-put code and its comment agree. Add-if-absent is read
      correctly from the code.
  - record_key: SC-REQ-0001
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: deleteItem is reached from the Remove link through CartEJBAction DELETE_ITEM.
  - record_key: SC-REQ-0002
    source: src/components/cart/a.yaml
    recommendation: edit
    confidence: high
    reason: >
      The caller is visible: OrderEJBAction line 167 empties the cart after the order is sent.
      Pass B's SC-REQ-0002 states the trigger. This record should too.
    edited_requirement: >
      The system SHALL remove every line from the shopper's cart once an order has been placed
      from it.
  - record_key: SC-BR-0003
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: getCount and ShoppingCartModel.getSize both count lines. The empty-cart screen check uses the same count.
  - record_key: SC-BR-0004
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The same formula is implemented twice and matches pass B's SC-RULE-0003. Checkout's
      order total states the same rule for the order.
  - record_key: SC-BR-0005
    source: src/components/cart/a.yaml
    recommendation: edit
    confidence: medium
    reason: >
      The catch block exists, but the trigger is wrong. On the EJB path the cart uses,
      GenericCatalogDAO.getItem returns null for a missing item, which causes a
      NullPointerException. A SQL failure is wrapped in an EJBException. Only a failure to
      create the catalog EJB raises CatalogException. Confirm on a running instance. Whether
      a missing item crashing the cart is acceptable is a Business Owner decision (design.md D2).
    edited_requirement: >
      GIVEN a cart line for which the catalog cannot be consulted WHEN the cart contents or
      subtotal are read THEN the system SHALL leave that line out of the listed contents and
      the subtotal, SHALL keep it in the cart, and SHALL still count it in the item count.
  - record_key: SC-BR-0007
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The web tier agrees with the descriptor: cart.do is not in signon-config.xml's protected
      list, as petstore CART-REQ-0001 also notes. The "may be stricter" caveat is resolved.
  - record_key: SC-BR-0008
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      The cart has no persistence anywhere. The petstore pass also shows sign-out replacing the
      cart (CART-RULE-0005), which confirms session-only lifetime.
  - record_key: SC-BR-0009
    source: src/components/cart/a.yaml
    recommendation: reject
    confidence: medium
    reason: >
      addItem(String, int) is not on the local interface and has no descriptor entry. Pass B
      found no caller across legacy-source. It is dead code. The reachability question goes to
      Intent (design.md Q1), and the record is left out of the spec.
  - record_key: SC-BR-0010
    source: src/components/cart/a.yaml
    recommendation: accept
    confidence: medium
    reason: >
      cart.jsp iterates cart.items without sorting, so HashMap order reaches the screen. It is
      written as a MAY, so the rebuild is free to sort.
