# These are recommendations, not decisions.
recommendations:
  # ---------------------------------------------------------------- docs / setup
  - record_key: ORDER-FULFILLMENT-WF-0001
    pass_file: docs/a.yaml
    recommendation: edit
    confidence: medium
    reason: >
      The docs say the supplier notifies OPC of inventory changes, but the supplier code
      re-runs its own PENDING orders and publishes invoices; no inventory message to OPC
      exists. Trust the code (OFUL-WF-0002, supplier/b). The wording conflict goes to Intent.
    edited_requirement: >
      WHEN the supplier saves an inventory update, the system SHALL re-attempt fulfilment of
      every PENDING supplier order, publish an invoice for each order that ships a line, and
      mark COMPLETED each order that is now fully shipped.
  - record_key: ORDER-FULFILLMENT-WF-0001
    pass_file: docs/b.yaml
    recommendation: edit
    confidence: medium
    reason: >
      Same document statement as docs/a; code shows the retry happens inside the supplier and
      reaches OPC only as invoices. Accept the code behaviour; doc conflict to Intent.
    edited_requirement: >
      WHEN the supplier saves an inventory update, the system SHALL re-attempt fulfilment of
      every PENDING supplier order and publish an invoice for each order that ships a line.
