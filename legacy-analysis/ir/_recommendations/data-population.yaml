  - record_key: DATA-REQ-0001
    recommendation: edit
    confidence: medium
    reason: >
      This key names three different records (contactinfo/b, supplier/b,
      setup.xml/b), and an SME decision on it is ambiguous until it is re-keyed.
      contactinfo/b: accept, since ContactInfoEJB 93-107 and the
      ContactInfoPopulator caller confirm it. supplier/b: duplicate of
      DPOP-REQ-0001 plus the access issue, so merge it. setup.xml/b: duplicate of
