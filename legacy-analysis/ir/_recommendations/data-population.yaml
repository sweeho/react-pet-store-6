  - record_key: DATA-POPULATION-REQ-0001
    recommendation: edit
    confidence: medium
    reason: >
      Docs passes A, B and C all cite configuring.html only. The code has two
      seed files, one per application, not "a single file", and the per-database
      statement selection is an implementation detail for a single-datastore
      rebuild. The document's claim conflicts with the code, so the question goes
      to Intent. Trust the code.
    edited_requirement: >
      The system SHALL take its initial catalog, customer and inventory data from
      a bundled UTF-8 seed data set that operators may edit, and SHALL create the
      datastore structures it needs when they are absent.
  - record_key: data-population-REQ-0001
