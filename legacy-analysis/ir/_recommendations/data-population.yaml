    edited_requirement: >
      WHEN a contact-information record is created from a given name, family
      name, telephone, e-mail and an already stored postal address, the system
      SHALL store the four values as supplied and SHALL link the existing address
      rather than copying it.
  - record_key: CUST-REQ-0001
