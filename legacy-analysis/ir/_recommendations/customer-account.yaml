# SME recommendations for capability customer-account (SX-0001 synthesize).
# Record keys are reused across modules, so each entry also names the pass file(s)
# it refers to. These are recommendations, not decisions.
recommendations:
  - record_key: CUSTOMER-ACCOUNT-WF-0001
    pass_file: docs/a.yaml, docs/b.yaml, docs/c.yaml
    recommendation: accept
    confidence: high
    reason: >
      All three document passes agree, and the code flow (ACCT-WF-0001) confirms sign-up starts
      on the sign-in page. Merged into "Two-step account sign-up".

  - record_key: ACCT-WF-0001
    pass_file: src/apps/petstore/a.yaml
    recommendation: accept
    confidence: high
    reason: >
      Traced through mappings.xml, both actions and CreateUserFlowHandler. Pass b (ACCT-WF-0006)
      independently reads the same flow. The abandoned-sign-up defect (SD6) goes to the defect register.

  - record_key: ACCT-WF-0006
    pass_file: src/apps/petstore/b.yaml
    recommendation: edit
    confidence: medium
    reason: >
      Matches ACCT-WF-0001. However, its claim that the save "switches the shopping language"
      conflicts with ACCT-RULE-0011 from the same pass, which traces a different session key.
      Drop the language clause and let ACCT-RULE-0011 carry it.
    edited_requirement: >
      The system SHALL complete account creation as: create the login and remember the user id;
      show the account information form; on submit create a customer keyed by that user id, store
      its contact, address, card and profile details, mark the visitor as signed on, and return them
      to the page they were trying to reach, or to the main page if that page was the account page.

