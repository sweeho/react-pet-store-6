  - record_key: "CAT-BR-0006"
    kind: "business-rule"
    capability_key: "catalog-browsing"
    requirement: "The system SHALL be able to serve a previously rendered page fragment, shared by all users, for a configured duration; the cached copy is identified by the page address, the fragment name and the full query string, and GIVEN its age exceeds the duration WHEN it is next requested THEN it is discarded and re-rendered."
    plain_text: "Catalog pages (category, product, side menu) are cached and may be up to five minutes out of date for every shopper."
    technical_note: "CacheTag (waf:cache) stores rendered body content in the chosen scope (context = application-wide) keyed by requestURL#name?queryString with a timestamp; Entry.isExpired compares elapsed ms with duration. Pet Store's category.jsp, product.jsp and sidebar.jsp use scope=context, duration=300000 (5 minutes), with locale-specific names for product and sidebar."
    confidence: "medium"
    confidence_basis: "One implementation in the tag plus its configured use with a 300000 ms literal in Pet Store pages; the 5-minute value is a bare literal with no stated rationale."
    risk_class: "operational"
    basis: "The tag returns cached content unless the entry is older than the duration; Pet Store catalog pages declare a 300000 ms context-scope cache."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java"
        line_start: 65
        line_end: 80
        excerpt: "    public int doStartTag() throws JspTagException {\n        entry = getEntry();\n        if ((entry != null) && entry.isExpired()) {\n            entry = null;\n            removeEntry();\n        }\n        return (entry == null) ? EVAL_BODY_BUFFERED : SKIP_BODY;\n    }\n\n    private String getKey() {\n            HttpServletRequest req =\n            ((HttpServletRequest) pageContext.getRequest());\n            return  (req.getRequestURL().toString()\n                            + '#' + name\n                            + '?' + req.getQueryString());\n    }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java"
        line_start: 169
        line_end: 172
        excerpt: "        public boolean isExpired() {\n            long currentTime = System.currentTimeMillis();\n            return ((currentTime - timestamp) > duration);\n        }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/category.jsp"
        line_start: 47
        line_end: 47
        excerpt: "<waf:cache name=\"page\" scope=\"context\" duration=\"300000\">\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/product.jsp"
        line_start: 48
