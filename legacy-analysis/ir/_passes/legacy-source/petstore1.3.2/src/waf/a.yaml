      reason: "unresolved-reachability"
      detail: "This screen lives in the WAF framework's own sample web application. Pet Store uses its own language links. Settle by confirming whether the WAF sample WAR is deployed in production; if not, this record should be rejected. Also note de_DE is offered but has no page definitions, so it would display in English."
    risk_class: "presentational"
