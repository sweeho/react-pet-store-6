records:
  - record_key: "LOC-BR-0001"
    kind: "business-rule"
    capability_key: "localization"
    requirement: "The system SHALL assign the configured default locale (en_US) to a user session that has no locale set, before handling any request in that session."
    plain_text: "A visitor who has not chosen a language is served in US English."
    technical_note: "MainServlet.doProcess sets session attribute WebKeys.LOCALE to the servlet init-param default_locale (en_US in web.xml) when it is null. Pet Store's own web.xml sets the same value for its MainServlet."
    confidence: "high"
    confidence_basis: "Two places agree: the declared init-param value en_US and the controller code that applies it on every request when the session has no locale."
    risk_class: "presentational"
    basis: "The front controller reads default_locale at start-up and writes it into the session whenever the session locale is null."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java"
        line_start: 79
        line_end: 81
        excerpt: "    public void init(ServletConfig config) throws ServletException {\n        String defaultLocaleString = config.getInitParameter(\"default_locale\");\n        defaultLocale = I18nUtil.getLocaleFromString(defaultLocaleString);\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java"
        line_start: 110
        line_end: 113
        excerpt: "        // set the locale of the user to default if not set\n        if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {\n            request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);\n        }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml"
        line_start: 57
        line_end: 60
        excerpt: "    <init-param>\n      <param-name>default_locale</param-name>\n      <param-value>en_US</param-value>\n    </init-param>\n"
    stack_metadata:
      framework: "j2ee-waf"
      session.scope: "com.sun.j2ee.blueprints.waf.LOCALE"
  - record_key: "LOC-REQ-0002"
    kind: "requirement"
    capability_key: "localization"
    requirement: "The system SHALL let a user change the language of their session by submitting a locale code; GIVEN the code is recognised as a locale WHEN it is submitted THEN the session locale is replaced by it and the business tier is notified of the change; GIVEN the code cannot be turned into a locale THEN the change is refused with an error \"Unable to change language to <code>\"."
    plain_text: "Users can switch the site language. An unrecognised language code is rejected with an error instead of being applied."
    technical_note: "ChangeLocaleHTMLAction reads request parameter 'locale', parses it with I18nUtil.getLocaleFromString, stores it under session key com.sun.j2ee.blueprints.waf.LOCALE and returns a ChangeLocaleEvent (routed to an EJB action that copies the locale into the stateful controller). A null parse result throws HTMLActionException. Pet Store maps changelocale.do to this same WAF action."
    confidence: "medium"
    confidence_basis: "One clear implementation; the Pet Store mapping confirms the action is reachable in the shipped application, but there is no test or second enforcement point."
    risk_class: "presentational"
    basis: "The action stores the parsed locale in the session and emits a change-locale event, or throws when parsing yields nothing."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java"
        line_start: 70
        line_end: 84
        excerpt: "    public Event perform(HttpServletRequest request)\n        throws HTMLActionException {\n        // Extract attributes we will need\n        String localeString = request.getParameter(\"locale\");\n        Locale locale = I18nUtil.getLocaleFromString(localeString);\n        //MessageResources messages = getResources();\n        HttpSession session = request.getSession();\n\n        if (locale != null) {\n            session.setAttribute(LOCALE,locale);\n            return new ChangeLocaleEvent(locale);\n        } else {\n            throw new HTMLActionException(\"ChangeLocaleAction: Unable to change language to \" + localeString);\n        }\n    }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/action/actions/ChangeLocaleEJBAction.java"
        line_start: 52
        line_end: 56
        excerpt: "  public EventResponse perform(Event e) throws EventException {\n      ChangeLocaleEvent ce = (ChangeLocaleEvent)e;\n      machine.setAttribute(\"locale\", ce.getLocale());\n      return null;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml"
        line_start: 101
        line_end: 104
        excerpt: "    <url-mapping url=\"changelocale.do\" useFlowHandler=\"true\" >\n        <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>\n        <flow-handler class=\"com.sun.j2ee.blueprints.waf.controller.web.flow.handlers.ClientStateFlowHandler\"/>\n   </url-mapping>\n"
    stack_metadata:
      framework: "j2ee-waf"
      struts.action: "changelocale.do -> ChangeLocaleHTMLAction"
      session.scope: "com.sun.j2ee.blueprints.waf.LOCALE"
  - record_key: "LOC-BR-0003"
    kind: "business-rule"
    capability_key: "localization"
    requirement: "The system SHALL interpret a locale code as <language>_<COUNTRY>; GIVEN the code is the word \"default\" (any case) THEN the server's default locale is used; GIVEN the code contains no underscore THEN it is not recognised as a locale."
    plain_text: "Language codes must look like en_US or ja_JP. A bare language such as 'en' is not accepted; the word 'default' means the server's own language."
    technical_note: "I18nUtil.getLocaleFromString: null -> null; 'default' -> Locale.getDefault(); no '_' -> null; otherwise language = text before first '_', country = remainder. Variant handling is broken (see suspected defects). Used by both MainServlet (default_locale init-param) and ChangeLocaleHTMLAction."
    confidence: "medium"
    confidence_basis: "Read directly from one parsing routine; behaviour for three-part codes is not what the comment says, so only the two-part and 'default' cases are stated here."
    risk_class: "presentational"
    basis: "The parser returns null without an underscore and builds language/country from the two parts around it."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java"
        line_start: 159
        line_end: 196
        excerpt: "    /**\n     * Convert a string based locale into a Locale Object\n     * <br>\n     * <br>Strings are formatted:\n     * <br>\n     * <br>language_contry_variant\n     *\n     **/\n\n    public static Locale getLocaleFromString(String localeString) {\n        if (localeString == null) return null;\n        if (localeString.toLowerCase().equals(\"default\")) return Locale.getDefault();\n        int languageIndex = localeString.indexOf('_');\n        if (languageIndex  == -1) return null;\n        int countryIndex = localeString.indexOf('_', languageIndex +1);\n        String country = null;\n        if (countryIndex  == -1) {\n            if (localeString.length() > languageIndex) {\n                country = localeString.substring(languageIndex +1, localeString.length());\n            } else {\n                return null;\n            }\n        }\n        int variantIndex = -1;\n        if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);\n        String language = localeString.substring(0, languageIndex);\n        String variant = null;\n        if (variantIndex  != -1) {\n\n            variant = localeString.substring(variantIndex +1, localeString.length());\n        }\n        if (variant != null) {\n            return new Locale(language, country, variant);\n        } else {\n            return new Locale(language, country);\n        }\n\n    }\n"
    stack_metadata:
      framework: "j2ee-waf"
  - record_key: "LOC-BR-0004"
    kind: "business-rule"
    capability_key: "localization"
    requirement: "The system SHALL choose the language of each displayed page as follows: a locale given on the request overrides the session locale; GIVEN the chosen locale has no page definitions THEN the default locale (en_US) is used; GIVEN a page is not defined for the chosen locale THEN the default-locale definition of that page is shown."
    plain_text: "Each page is shown in the user's language. A language passed on the link wins over the saved choice, and anything not available in that language falls back to US English."
    technical_note: "TemplateServlet.process: request param 'locale' > session LOCALE; if allScreens has no entry for it, use init-param default_locale. Screen definitions are loaded per entry of init-param 'locales' from /WEB-INF/screendefinitions_<locale>.xml (WAF sample: en_US only; Pet Store: en_US,ja_JP,zh_CN). Missing screen in the locale set falls back to the default-locale set."
    confidence: "high"
    confidence_basis: "Code fallback logic plus declared configuration (locales and default_locale init-params) agree."
    risk_class: "presentational"
    basis: "The template servlet resolves the locale from parameter then session, and falls back to the default locale's screen set at two points."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java"
        line_start: 157
        line_end: 166
        excerpt: "        String languageParam = request.getParameter(\"locale\");\n        // The language when specified as a parameter overrides the language set in the session\n        if (languageParam != null) {\n            localeString = languageParam;\n        } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {\n            localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();\n        }\n        if (allScreens.get(localeString) == null) {\n           localeString = defaultLocale;\n        }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java"
        line_start: 231
        line_end: 241
        excerpt: "        // get the screen information for the coresponding language\n        Screen screen = null;\n        if (screenName != null){\n            Screens localeScreens = (Screens)allScreens.get(localeString);\n            if (localeScreens != null) screen = (Screen)localeScreens.getScreen(screenName);\n            // default to the default locale screen if it was not defined in the locale specific definitions\n            if (screen == null) {\n                System.err.println(\"Screen not Found loading default from \" + defaultLocale);\n                localeScreens = (Screens)allScreens.get(defaultLocale);\n                screen = (Screen)localeScreens.getScreen(screenName);\n            }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml"
        line_start: 68
        line_end: 75
        excerpt: "    <init-param>\n      <param-name>locales</param-name>\n      <param-value>en_US</param-value>\n    </init-param>\n    <init-param>\n      <param-name>default_locale</param-name>\n      <param-value>en_US</param-value>\n    </init-param>\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml"
        line_start: 108
        line_end: 115
        excerpt: "    <init-param>\n      <param-name>locales</param-name>\n      <param-value>en_US,ja_JP,zh_CN</param-value>\n    </init-param>\n    <init-param>\n      <param-name>default_locale</param-name>\n      <param-value>en_US</param-value>\n    </init-param>\n"
    stack_metadata:
      framework: "j2ee-waf"
      jsp.page: "*.screen via TemplateServlet"
  - record_key: "LOC-SCR-0005"
    kind: "screen"
    capability_key: "localization"
    requirement: "The system SHALL provide a change-language screen offering US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN), and after a change SHALL display a confirmation showing the new locale."
    plain_text: "A language page lets the user pick US English, German, Japanese or Simplified Chinese and then confirms the language now in use."
    technical_note: "changelocale.jsp (screen locale_action) posts to changelocale.do; on success the flow goes to locale_change_success.screen rendering changelocalesuccess.jsp, which prints the session LOCALE attribute. These pages belong to the WAF sample application, not to Pet Store."
    confidence: "low"
    confidence_basis: "Read from a demonstration page of the framework sample application; it is not established that this screen is deployed to end users, and German is not one of the locales with page definitions."
