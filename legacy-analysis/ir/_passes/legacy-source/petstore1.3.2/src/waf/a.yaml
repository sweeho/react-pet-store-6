  - record_key: "CUST-BR-0007"
    kind: "business-rule"
    capability_key: "customer-account"
    requirement: "The system SHALL, on forms that mark fields as validated, prevent submission in the browser WHEN any marked field is empty and SHALL tell the user \"<field name> is empty.\" for each empty field; no other check (format, length, range) is made by this mechanism."
    plain_text: "Sign-in, account and order forms will not submit while a required box is blank; the user is told which box is empty."
    technical_note: "waf:input with a 'validation' attribute registers its field with the enclosing waf:form (FormTag.putValidatedField). FormTag emits a JavaScript validate_<form>() run onSubmit that alerts '<fieldName> is empty.' for each empty registered field. Client-side only; there is no server-side counterpart in this module. Used by Pet Store signon.jsp, edit_customer.jsp and enter_order_information.jsp (all locales). Filed under customer-account as the closest capability; it also applies to sign-on and checkout forms."
    confidence: "medium"
    confidence_basis: "Clear in the two cooperating tags, and their use with validation attributes is visible in Pet Store pages; no server-side enforcement found in this shard."
    risk_class: "operational"
    basis: "The form tag generates an empty-value check for every field registered by an input tag that carries a validation attribute."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/FormTag.java"
        line_start: 84
        line_end: 111
        excerpt: "            javaScript.append(\"<script language=\\\"JavaScript\\\">\\n\");\n            javaScript.append(\"function validate_\" + name +\"() {\\n\");\n            javaScript.append(\"    var ret = true;\\n\");\n            for (Iterator it = validatedFields.keySet().iterator();\n                 it.hasNext(); ) {\n                String fieldName = (String) it.next();\n                String fieldType = (String) validatedFields.get(fieldName);\n                javaScript.append(\"    if (window.document.\");\n                javaScript.append(name + \".\");\n                javaScript.append(fieldName + \".\");\n                javaScript.append(\"value\");\n                javaScript.append(\" ==\");\n                javaScript.append(\" \\\"\\\"\");\n                javaScript.append(\") {\\n\");\n                javaScript.append(\"        alert(\\\"\" + fieldName\n                                  + \" is empty.\\\");\\n\");\n                javaScript.append(\"        ret = false;\\n\");\n                javaScript.append(\"    }\\n\");\n            }\n            javaScript.append(\"    return ret;\\n\");\n            javaScript.append(\"}\\n\");\n            javaScript.append(\"</script>\\n\");\n\n            html.append(\"<form\");\n            html.append(\" name=\\\"\" + name +\"\\\"\");\n            html.append(\" action=\\\"\" + action + \"\\\"\");\n            html.append(\" method=\\\"\" + method + \"\\\"\");\n            html.append(\" onSubmit=\\\"return validate_\" + name + \"();\\\"\");\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/InputTag.java"
        line_start: 80
        line_end: 84
        excerpt: "            FormTag tag\n                = (FormTag) findAncestorWithClass(this, FormTag.class);\n            if (tag != null && validation != null) {\n                tag.putValidatedField(name, type);\n            }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/signon.jsp"
        line_start: 53
        line_end: 53
        excerpt: "   <waf:form  name=\"existingcustomer\" action=\"j_signon_check\" method=\"POST\">\n"
    stack_metadata:
      framework: "j2ee-waf"
      declarative_validator: "waf:form / waf:input validation attribute (client-side JavaScript)"
  - record_key: "CART-WF-0008"
    kind: "workflow"
    capability_key: "shopping-cart"
    requirement: "The system SHALL route a failure raised while handling a request to the error page configured for that kind of failure (or for a more general kind it belongs to), and GIVEN no error page is configured for it THEN the request SHALL fail with a general server error."
    plain_text: "When something goes wrong (for example ordering with an empty cart, or a duplicate account), the user is sent to the matching error page; anything unexpected produces a generic server error."
    technical_note: "MainServlet.doProcess catches Throwable, asks ScreenFlowManager.getExceptionScreen, which walks <exception-mapping> entries from mappings.xml and matches by Class.isAssignableFrom. The exception is placed in request attribute javax.servlet.jsp.jspException. Unmapped -> ServletException. Filed under shopping-cart as the closest capability because Pet Store's empty-cart order rule (ShoppingCartEmptyOrderException -> cart_empty_order_error.screen) depends on it; the mechanism is cross-cutting."
    confidence: "high"
    confidence_basis: "Code path plus declarative mappings in both the WAF sample and Pet Store mappings.xml."
    risk_class: "operational"
    basis: "The controller forwards to the mapped error screen for the first mapping whose class the failure is an instance of, otherwise throws."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java"
        line_start: 117
        line_end: 128
        excerpt: "        } catch (Throwable ex) {\n            String className = ex.getClass().getName();\n            String nextScreen = getScreenFlowManager().getExceptionScreen(ex);\n            // put the exception in the request\n            request.setAttribute(\"javax.servlet.jsp.jspException\", ex);\n            if (nextScreen == null) {\n                // send to general error screen\n                ex.printStackTrace();\n                throw new ServletException(\"MainServlet: unknown exception: \" + className);\n            }\n            context.getRequestDispatcher(nextScreen).forward(request, response);\n      }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java"
        line_start: 164
        line_end: 183
        excerpt: "    public String getExceptionScreen(Throwable e) {\n        Iterator it = exceptionMappings.keySet().iterator();\n        while (it.hasNext()) {\n            String exceptionName = (String)it.next();\n            Class targetExceptionClass = null;\n            try {\n                targetExceptionClass = this.getClass().getClassLoader().loadClass(exceptionName);\n            } catch (ClassNotFoundException cnfe) {\n                System.err.println(\"ScreenFlowManager: Could not load exception \" + exceptionName);\n            }\n            System.err.println(\"Checking exception: \" + exceptionName + \" against \" + e.getClass().getName());\n            // check if the exception is a sub class of matches the exception\n            if ((targetExceptionClass != null) &&\n                targetExceptionClass.isAssignableFrom(e.getClass())) {\n                System.err.println(\"ScreenFlowManager: found exception for \" + exceptionName + \" matches\");;\n                return \"/\" + (String)exceptionMappings.get(exceptionName);\n            }\n        }\n        return null;\n    }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml"
        line_start: 110
        line_end: 112
        excerpt: "    <exception-mapping exception-class=\"com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException\" screen=\"cart_empty_order_error.screen\"/>\n    <exception-mapping exception-class=\"com.sun.j2ee.blueprints.petstore.controller.exceptions.DuplicateAccountException\" screen=\"duplicate_account.screen\"/>\n    <exception-mapping exception-class=\"com.sun.j2ee.blueprints.petstore.controller.exceptions.GeneralFailureException\" screen=\"error.screen\"/>\n"
    stack_metadata:
      framework: "j2ee-waf"
  - record_key: "CAT-WF-0009"
    kind: "workflow"
    capability_key: "catalog-browsing"
    requirement: "The system SHALL remember the last page each user viewed and SHALL re-display it when the user asks for the \"previous\" page; GIVEN the change-language request is made from a page that carried its state THEN the user SHALL be returned to the page they came from with that state restored."
    plain_text: "After switching language the shopper stays on the page they were looking at, rather than being sent back to the home page."
    technical_note: "TemplateServlet stores <screen>.screen in session PREVIOUS_SCREEN and serves PREVIOUS.screen from it (request parameter/attribute replay is off: cache_previous_screen_* = false). ClientStateTag writes the current request parameters and serialised request attributes into hidden fields plus referring_screen; ClientStateFlowHandler (used by Pet Store changelocale.do) restores them and forwards to referring_screen. Filed under catalog-browsing as the closest capability (navigation); it overlaps localization."
