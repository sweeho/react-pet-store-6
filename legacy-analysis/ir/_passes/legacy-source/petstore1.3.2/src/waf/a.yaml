    kind: "business-rule"
    capability_key: "localization"
    requirement: "The system SHALL provide locale-aware formatting of money and numbers to a fixed number of decimal places, and SHALL split a search phrase into words using the word-boundary rules of a given locale, discarding blank words."
    plain_text: "Prices and numbers are shown in the user's local format with a fixed number of decimals, and searches split the typed text into words according to the language."
