      detail: "No caller of formatCurrency/formatNumber/parseKeywords was found outside src/waf. Settle by confirming whether any page or component (e.g. the catalog search) uses these, or uses its own implementation instead."
    risk_class: "presentational"
    basis: "The utility methods fix minimum and maximum fraction digits and tokenise with a locale word iterator."
    traces:
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java"
        line_start: 100
        line_end: 112
        excerpt: "    public static String formatCurrency(double amount, int precision, Locale locale){\n        NumberFormat nf = NumberFormat.getCurrencyInstance(locale);\n        nf.setMinimumFractionDigits(precision);\n        nf.setMaximumFractionDigits(precision);\n        return nf.format(amount);\n    }\n\n    public static String formatNumber(double amount, int precision, Locale locale){\n        NumberFormat nf = NumberFormat.getNumberInstance(locale);\n        nf.setMinimumFractionDigits(precision);\n        nf.setMaximumFractionDigits(precision);\n        return nf.format(amount);\n    }\n"
      - path: "legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java"
        line_start: 136
        line_end: 157
        excerpt: "    public static Vector parseKeywords(String keywordString, Locale locale){\n        if (keywordString != null){\n            Vector keywords = new Vector();\n            BreakIterator breakIt = BreakIterator.getWordInstance(locale);\n            int index=0;\n            int previousIndex =0;\n            breakIt.setText(keywordString);\n            try{\n                while(index < keywordString.length()){\n                    previousIndex = index;\n                    index = breakIt.next();\n                    String word = keywordString.substring(previousIndex, index);\n                    if (!word.trim().equals(\"\")) keywords.addElement(word);\n                }\n                return keywords;\n            } catch (Throwable e){\n                Debug.print(e, \"Error while parsing search string\" );\n            }\n\n        }\n        return null;\n    }\n"
