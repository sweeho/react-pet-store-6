  - record_key: LOC-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL assign the configured default locale (en_US) to every user
      session that has no locale set, before the request is processed.
    plain_text: >
      A visitor who has not chosen a language is shown the site in US English.
    technical_note: >
      MainServlet.doProcess() puts the default locale into the session under the
      LOCALE key when absent. The value comes from the MainServlet init-param
      default_locale=en_US in the WAF sample web.xml.
    confidence: high
    confidence_basis: >
      Enforced in code and stated in deployment configuration (two places). Only the
      WAF sample web.xml was read here; the petstore application's own web.xml may set
      a different value and is outside this shard.
    risk_class: presentational
    basis: >
      MainServlet reads default_locale at init and sets it on any session lacking a
      locale; web.xml configures en_US.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 110
        line_end: 113
        excerpt: |2
                  // set the locale of the user to default if not set
                  if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
                      request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
                  }
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 57
        line_end: 60
        excerpt: |2
              <init-param>
                <param-name>default_locale</param-name>
                <param-value>en_US</param-value>
              </init-param>
