  - record_key: LOC-BR-0007
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL format money and numbers in the user's locale with a fixed,
      caller-supplied number of decimal places.
    plain_text: >
      Prices and numbers are shown in the local style with a set number of decimals.
    technical_note: >
      I18nUtil.formatCurrency/formatNumber set min=max fraction digits to precision,
      optionally applying a pattern. No caller of these methods was found anywhere in
      legacy-source.
    confidence: low
    confidence_basis: >
      Bare utility with no caller found by grep across the whole tree; behaviour is read
      but whether it ever runs is not established.
    dispute:
      reason: unresolved-reachability
      detail: >
        grep for formatCurrency/formatNumber finds only the definition. Settle by
        checking compiled JSPs or tag libraries outside legacy-source that might call
        it; if none, this rule is dead and price formatting lives elsewhere.
    risk_class: financial
    basis: >
      Utility methods fix fraction digits to the given precision per locale.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 100
        line_end: 105
        excerpt: |2
              public static String formatCurrency(double amount, int precision, Locale locale){
                  NumberFormat nf = NumberFormat.getCurrencyInstance(locale);
                  nf.setMinimumFractionDigits(precision);
                  nf.setMaximumFractionDigits(precision);
                  return nf.format(amount);
              }
    stack_metadata:
      framework: WAF util

