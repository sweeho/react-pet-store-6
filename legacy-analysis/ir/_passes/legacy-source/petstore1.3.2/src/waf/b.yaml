      /WEB-INF/screendefinitions_<locale>.xml. Its screen titles ("Order Shipped",
      "Duplicate Account Error", ...) produced no record. A human should confirm it is
      obsolete and can be ignored.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/StateMachine.java
    description: >
      The framework event pipeline (web action -> event -> per-session server action,
      run in a container transaction "Required" per ejb-jar.xml) is infrastructure, not
      a business rule, so no record was emitted. Rebuild architects should know that
      every business event was transactional.

