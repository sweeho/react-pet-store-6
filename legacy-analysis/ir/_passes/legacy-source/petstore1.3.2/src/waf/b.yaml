      framework: WAF (J2EE BluePrints)
      session.scope: com.sun.j2ee.blueprints.waf.LOCALE

  - record_key: LOC-REQ-0002
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL let a user change their session locale by submitting a
      "locale" value; WHEN the value cannot be turned into a locale THEN the system
      SHALL reject the change with the error "Unable to change language to <value>"
      and leave the session locale unchanged.
    plain_text: >
      A shopper can switch the site language; an unrecognised language choice is
      refused with an error and the current language is kept.
    technical_note: >
      ChangeLocaleHTMLAction.perform() parses request parameter "locale" with
      I18nUtil.getLocaleFromString(); on success stores it in the session and emits a
      ChangeLocaleEvent, on null throws HTMLActionException. Mapped to changelocale.do
      in both the WAF sample and the petstore application mappings.xml.
    confidence: high
    confidence_basis: >
      The action is mapped in two independent configurations (WAF sample and the
      petstore application) and the behaviour is in one clear code path.
    risk_class: presentational
    basis: >
      Code sets session locale on success and throws with a fixed message otherwise;
      the URL mapping makes it reachable.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 70
        line_end: 84
        excerpt: |2
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // Extract attributes we will need
                  String localeString = request.getParameter("locale");
                  Locale locale = I18nUtil.getLocaleFromString(localeString);
                  //MessageResources messages = getResources();
                  HttpSession session = request.getSession();

                  if (locale != null) {
                      session.setAttribute(LOCALE,locale);
                      return new ChangeLocaleEvent(locale);
                  } else {
                      throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
                  }
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 101
        line_end: 104
        excerpt: |2
              <url-mapping url="changelocale.do" useFlowHandler="true" >
                  <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
                  <flow-handler class="com.sun.j2ee.blueprints.waf.controller.web.flow.handlers.ClientStateFlowHandler"/>
             </url-mapping>
    stack_metadata:
      framework: WAF
      struts.action: changelocale.do
      session.scope: com.sun.j2ee.blueprints.waf.LOCALE

  - record_key: LOC-BR-0003
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL accept a locale code only in the form language_COUNTRY
      (e.g. en_US, ja_JP); GIVEN the code "default" (any case) THEN the server's own
      default locale SHALL be used; GIVEN a code with no underscore (e.g. "en") THEN
      the code SHALL be treated as invalid.
    plain_text: >
      A language choice must name both a language and a country, such as US English
      or Japanese (Japan); a bare language like "English" is not accepted.
    technical_note: >
      I18nUtil.getLocaleFromString(): returns null for null or no '_'; "default"
      returns Locale.getDefault(); otherwise builds Locale(language, country). A third
      variant segment is never parsed (see suspected defect).
    confidence: medium
    confidence_basis: >
      One clear implementation; no test or validator duplicates it. Used by both
      MainServlet and ChangeLocaleHTMLAction, but that is the same rule in one place.
    risk_class: presentational
    basis: >
      The parsing method's early returns define which codes are valid.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 180
        excerpt: |2
              public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
    stack_metadata:
      framework: WAF

  - record_key: LOC-BR-0004
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL choose the language of each rendered screen as follows: a
      "locale" request parameter overrides the session locale; GIVEN no screen
      definitions exist for that locale THEN the default locale's definitions SHALL be
      used; GIVEN the screen is not defined for the chosen locale THEN the default
      locale's definition of that screen SHALL be used; GIVEN it is undefined in both
      THEN an error page "Definition for screen <name> not found" SHALL be shown.
    plain_text: >
      Pages appear in the shopper's chosen language where a translation exists, and
      fall back to US English for anything not translated.
    technical_note: >
      TemplateServlet.process(): locale from request param then session; falls back to
      default_locale when allScreens has no entry; per-screen fallback to the default
      locale Screens. Screen definition files are loaded per locale listed in the
      "locales" init-param from /WEB-INF/screendefinitions_<locale>.xml. The WAF sample
      lists only en_US.
    confidence: high
    confidence_basis: >
      Code plus the TemplateServlet init-params in web.xml that drive it. The petstore
      application's own list of locales is outside this shard.
    risk_class: presentational
    basis: >
      Explicit fallback branches in TemplateServlet, and the locales/default_locale
      configuration.
