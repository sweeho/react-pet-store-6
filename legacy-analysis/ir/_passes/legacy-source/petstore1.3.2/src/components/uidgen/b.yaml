# Pass B — legacy-source/petstore1.3.2/src/components/uidgen
# No legacy-analysis/sources/**/extracted.md documents exist in this tree, so no
# document traces are cited. The only consumer found is the storefront order
# placement action (apps/petstore), cited for the prefix value only.
records:
  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout
    requirement: >
      The system SHALL generate a unique identifier for a requested prefix by
      concatenating the prefix with the next value of that prefix's sequence,
      written as an unpadded decimal number with no separator.
    plain_text: >
      A new identifier is the requested prefix immediately followed by the next
      number in that prefix's own running count, e.g. prefix "1001" gives
      "10011", "10012", ... "100110".
    technical_note: >
      UniqueIdGeneratorEJB.getUniqueId(prefix) looks up the Counter entity whose
      primary key is the prefix and calls getNextValue(), which returns
      getName() + String.valueOf(count). No zero-padding, no delimiter.
    confidence: high
    confidence_basis: >
      The format is read directly in the counter code and the delegation in the
      generator session bean, and the only caller passes a prefix and stores the
      returned string as the order id; two cooperating places agree. No test or
      document confirms the intended format.
    risk_class: operational
    basis: >
      getNextValue builds the id from the counter name plus the incremented
      integer; getUniqueId returns it unchanged.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
              public String getNextValue() {
                  int count = getCounter() + 1;
                  setCounter(count);
                  return getName() + String.valueOf(count);
              }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
              public String getUniqueId(String idPrefix) {
                  return getCounter(idPrefix).getNextValue();
              }
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: UniqueIdGeneratorEJB (stateless session), CounterEJB (CMP 2.x entity)
      ejb.transaction: Required

  - record_key: CHK-BR-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      GIVEN no sequence exists yet for a requested prefix
      WHEN an identifier is requested for that prefix
      THEN the system SHALL create the sequence starting at 0 and issue the
      prefix followed by 1 as the first identifier.
    plain_text: >
      The first time a prefix is used, its count starts from zero, so the first
      identifier ends in 1. No set-up of prefixes is needed in advance.
    technical_note: >
      UniqueIdGeneratorEJB.getCounter catches FinderException from
      findByPrimaryKey and calls CounterLocalHome.create(name); CounterEJB.ejbCreate
      sets counter to 0; getNextValue then increments to 1.
    confidence: medium
    confidence_basis: >
      Find-or-create and the initial value are each read in one clear place; no
      seed data, test or document corroborates the starting value.
    risk_class: operational
    basis: >
      Lazy creation on FinderException and setCounter(0) on create.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 82
        excerpt: |
              private CounterLocal getCounter(String name) {
                  try {
                      CounterLocal counter = null;
                      try {
                          counter = clh.findByPrimaryKey(name);
                      } catch (FinderException fe) {
                          counter = clh.create(name);
                      }
                      return counter;
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
              public String ejbCreate(String name) throws CreateException {
                  setName(name);
                  setCounter(0);
                  return null;
              }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB, CounterEJB

  - record_key: CHK-BR-0003
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL advance a prefix's sequence by exactly 1 for every
      identifier issued, persist the new value, and perform the read, increment
      and persist inside the requesting transaction so that the same value is
      not issued twice.
    plain_text: >
      Every identifier issued moves that prefix's count up by one and the new
      count is saved; numbers are never skipped deliberately and never handed
      out twice.
    technical_note: >
      getNextValue does getCounter()+1 then setCounter; the CMP container
      persists via UPDATE "CounterEJBTable" SET "counter" = ? WHERE "name" = ?.
      ejb-jar.xml declares trans-attribute Required on CounterEJB.getNextValue,
      CounterEJB create(String) and UniqueIdGeneratorEJB.getUniqueId, so the
      increment joins the caller's transaction (and rolls back with it).
      CounterEJB is declared non-reentrant.
    confidence: high
    confidence_basis: >
      The increment is in code and the transactional boundary is declared in the
      deployment descriptor, with the persisted UPDATE in the server mapping:
      code plus declarative config. Actual isolation/locking behaviour depends on
      the container and database and is not visible in source.
    risk_class: operational
    basis: >
      Increment-by-one in getNextValue; Required transactions on getNextValue and
      getUniqueId; CMP storeRow statement.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 68
        line_end: 69
        excerpt: |
                  int count = getCounter() + 1;
                  setCounter(count);
