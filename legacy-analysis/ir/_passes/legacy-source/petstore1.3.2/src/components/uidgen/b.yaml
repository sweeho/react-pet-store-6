  - record_key: CHK-REQ-0007
    kind: requirement
    capability_key: checkout
    requirement: >
      GIVEN a sequence cannot be created for a new prefix, or the sequence store
      cannot be located
      WHEN an identifier is requested
      THEN the system SHALL fail the request with an error and issue no
      identifier.
    plain_text: >
      If the running count for a prefix cannot be set up or reached, no
      identifier is issued and the request fails.
    technical_note: >
      CreateException in getCounter is rethrown as EJBException("Could not
      create counter ..."); a NamingException looking up java:comp/env/ejb/Counter
      in ejbCreate is rethrown as EJBException. EJBException is a system
      exception, so the container rolls back the Required transaction.
    confidence: medium
    confidence_basis: >
      Both error paths are read directly in one class; rollback is implied by
      EJB semantics, not shown in source.
    risk_class: operational
    basis: >
      Explicit rethrow of CreateException and NamingException as EJBException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 56
        line_end: 63
        excerpt: |
              public void ejbCreate() {
                try {
                  ic = new InitialContext();
                  clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
                } catch (NamingException ne) {
                   throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
                }
              }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 83
        line_end: 85
        excerpt: |
                  } catch (CreateException ce) {
                      throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
                  }

  - record_key: CHK-BR-0008
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL allow any internal caller to request identifiers and
      create or advance sequences without a role check.
    plain_text: >
      Issuing identifiers is an internal service with no permission check of its
      own; whatever part of the system calls it is trusted.
    technical_note: >
      ejb-jar.xml method-permission is <unchecked/> for all CounterEJB and
      UniqueIdGeneratorEJB methods; both beans use caller identity; only local
      interfaces are exposed. Filed under checkout as the closest capability
      (it is not a user-facing sign-on rule).
    confidence: medium
    confidence_basis: >
      Declared once in the deployment descriptor; read directly.
    risk_class: operational
    basis: >
      unchecked method-permission blocks covering getUniqueId, getNextValue,
      create and findByPrimaryKey.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 152
        line_end: 195
        excerpt: |
              <method-permission>
                <unchecked />
                <method>
                  <ejb-name>UniqueIdGeneratorEJB</ejb-name>
                  ...
                  <method-name>getUniqueId</method-name>
    stack_metadata:
      ejb.method_permission: unchecked
      ejb.interfaces: local only

suspected_defects:
  - capability_key: checkout
    record_keys: [CHK-ENT-0004, CHK-REQ-0001]
    severity: medium
    category: data-corruption
    title: Sequence table is dropped on undeploy, so numbering restarts and ids can repeat
    description: >
      The deployment mapping drops the sequence table when the application is
      undeployed and recreates it empty on deploy. After a redeploy every prefix
      restarts at 1, so new order ids repeat ids already held by existing orders
      if order data survives the redeploy.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
        line_start: 631
        line_end: 632
  - capability_key: checkout
    record_keys: [CHK-BR-0002]
    severity: low
    category: other
    title: Concurrent first use of a new prefix can fail one request
    description: >
      Find-or-create is not guarded: two requests that both miss the lookup for
      a new prefix both try to create it; the second violates the primary key,
      the create error is rethrown as a system error and that request fails
      instead of receiving an identifier.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 77
        line_end: 85
  - capability_key: checkout
    record_keys: [CHK-BR-0003, CHK-REQ-0001]
    severity: low
    category: other
    title: Sequence is a 32-bit integer with no overflow handling
    description: >
      The count is a Java int incremented without a bound check; after
      2,147,483,647 identifiers it wraps negative and produces ids such as
      "1001-2147483648".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 50
        line_end: 51
  - capability_key: checkout
    record_keys: [CHK-BR-0006]
    severity: low
    category: other
    title: Documented non-null prefix rule is not enforced
    description: >
      The interface comment says the prefix must not be null, but nothing checks
      it; a null prefix goes straight to the sequence lookup/create, whose
      behaviour then depends on the container and database.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 80

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
    description: >
      Ids are prefix + unpadded number with no separator, so different prefixes
      can collide: prefix "1" at count 11 and prefix "11" at count 1 both yield
      "111". Only one prefix ("1001") is used today, so no collision occurs in
      the live system. A human should decide whether the rebuild must guarantee
      uniqueness across prefixes.
