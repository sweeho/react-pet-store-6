  - record_key: CHK-BR-0005
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL generate storefront order identifiers from the prefix
      "1001", so that order ids take the form "1001" followed by the order
      sequence number.
    plain_text: >
      Customer order numbers all begin with 1001 followed by a running number:
      the first order is 10011, the tenth is 100110.
    technical_note: >
      OrderEJBAction (apps/petstore controller) calls uidgen.getUniqueId("1001")
      and sets the result as the purchase order id. The prefix is a bare
      literal; the generator itself accepts any prefix.
    confidence: low
    confidence_basis: >
      The prefix is a bare literal in a single caller outside this module, with
      no constant, configuration, comment or document explaining it.
    risk_class: operational
    basis: >
      Literal "1001" passed to getUniqueId; result assigned to setOrderId.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 110
        line_end: 115
        excerpt: |
              orderIdString = uidgen.getUniqueId("1001");
              // get ther userId
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              String userId = scf.getUserId();
              purchaseOrder.setOrderId(orderIdString);
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      jndi: java:comp/env/ejb/UniqueIdGenerator

  - record_key: CHK-BR-0006
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL require a non-null prefix when an identifier is requested.
    plain_text: >
      A prefix must always be supplied when asking for a new identifier.
    technical_note: >
      Stated only as a Javadoc comment on UniqueIdGeneratorLocal.getUniqueId;
