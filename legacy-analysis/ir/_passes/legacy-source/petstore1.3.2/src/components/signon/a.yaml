  - record_key: CUST-WF-0001
    kind: workflow
    capability_key: customer-account
    requirement: >
      The system SHALL, on a new-user submission carrying a user name and password, create
      the sign-on account and redirect the user onward; GIVEN account creation is refused
      WHEN the submission is processed THEN the system SHALL redirect to a user-creation
      error page.
    plain_text: >
      A stand-alone registration step creates a login and moves on, or shows an error page if
      the login could not be created.
    technical_note: >
      CreateUserServlet.doPost reads j_username and the password parameter, calls
      SignOnLocal.createUser, redirects to a targetURL on success and to
      user_creation_error.jsp on CreateException. Lines 66-69 of the ingested file are
      redacted, so the try block, the createUser call and where targetURL comes from are not
      visible. The petstore build excludes this class ("we use an Action" —
      CreateUserEJBAction calls SignOnEJB.createUser instead), and web.xml maps no servlet to
      it.
