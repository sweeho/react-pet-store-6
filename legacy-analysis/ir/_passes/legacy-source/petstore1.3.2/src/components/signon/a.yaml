  - record_key: CUST-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL refuse to create a sign-on account whose user name already exists.
    plain_text: >
      Two people cannot register with the same user name; the second attempt is refused.
    technical_note: >
      userName is the primary key of the UserEJB CMP entity, so a second create with the same
      key fails in the container (DuplicateKeyException, a CreateException subtype).
      SignOnEJB.createUser passes the CreateException straight to the caller. The message the
      user sees is decided by the caller outside this module (petstore CreateUserEJBAction).
    confidence: medium
    confidence_basis: >
      Follows from the primary-key declaration in ejb-jar.xml and the propagated
      CreateException in SignOnEJB; there is no explicit duplicate check in code, so the rule
      is enforced only by the container's key handling, which is inferred rather than read.
    risk_class: operational
    basis: >
      primkey-field userName (ejb-jar.xml); SignOnEJB.createUser declares throws
      CreateException and calls ulh.create(userName, password) with no prior lookup.
    traces:
