  - record_key: SIGN-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL authenticate a sign-on attempt only when an account with exactly the
      given user name exists and the given password is exactly equal (case-sensitive) to the
      stored password. GIVEN no account with that user name WHEN sign-on is attempted THEN
      authentication SHALL fail.
    plain_text: >
      You are signed on only if your user name exists and your password matches exactly,
      including upper and lower case. An unknown user name is simply a failed sign-on.
    technical_note: >
      SignOnEJB.authenticate does findByPrimaryKey(userName); a FinderException returns false.
      Otherwise UserEJB.matchPassword returns password.equals(getPassword()) — plain string
      equality against the stored value. No lockout, attempt counting or delay exists in
      this module.
    confidence: medium
    confidence_basis: >
      One clear call chain (session bean to entity) read directly; no test or second
      enforcement point. Absence of lockout is an observation of this module only.
    risk_class: regulated
    basis: >
      SignOnEJB.authenticate and UserEJB.matchPassword.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 68
        line_end: 78
        excerpt: |
              /**
               * business method used to check if a user is allowed to sign on
               */
              public boolean authenticate(String userName, String password) {
                  try {
                      UserLocal user = ulh.findByPrimaryKey(userName);
                      return user.matchPassword(password);
                  } catch (FinderException fe) {
                      return false; // User not found, so authentication failed.
                  }
              }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
              public boolean matchPassword(String password) {
                  return password.equals(getPassword());
              }
    stack_metadata:
      ejb.bean: SignOnEJB (Stateless), UserEJB
      ejb.transaction: Required

  - record_key: SIGN-BR-0002
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL, when a user who is not signed on requests a page whose path (after the
      application root) exactly equals a configured protected-resource path, remember that
      path and show the sign-on page instead; all other pages SHALL be served without
      sign-on. GIVEN the user is signed on WHEN any page is requested THEN it SHALL be served.
    plain_text: >
      Certain pages need you to be signed on. If you are not, you are shown the sign-on page
      first, and the system remembers where you were going. Every other page is open to
      everyone, and once signed on you can reach every page.
    technical_note: >
      SignOnFilter.doFilter (mapped to /* in the petstore web.xml) strips the context root,
      checks the session attribute j_signon (Boolean), and if false iterates the protected
      resources and compares each url-pattern with String.equals (no wildcard matching). On a
      match it stores the path in session attribute j_signon_original_url and forwards to the
      configured sign-on page. The query string is not part of the compared or remembered
      path (getRequestURI). Which pages are protected is configured per application in
      WEB-INF/signon-config.xml (outside this module).
    confidence: high
    confidence_basis: >
      Filter logic read directly and its deployment is declared in the petstore web.xml
      (filter mapped to /*), i.e. code plus declarative configuration.
    risk_class: regulated
    basis: >
      SignOnFilter.doFilter signed-on check and protected-resource loop; web.xml filter mapping.
