  - record_key: SIGN-BR-0004
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL, when the user ticks "remember my user name" on sign-on, store the user
      name on the user's browser for 31 days (2 678 400 seconds); GIVEN the option is not
      ticked WHEN the user signs on THEN any previously remembered user name SHALL be removed.
    plain_text: >
      If you ask the site to remember your user name it does so for about a month; signing on
      without ticking the box makes it forget.
    technical_note: >
      SignOnFilter.validateSignOn sets cookie bp_signon=<userName> with maxAge 2678400 when the
      j_remember_username parameter is present; otherwise it re-sends any bp_signon cookie with
      maxAge 0. This happens before authentication, so a failed attempt also sets/clears it.
