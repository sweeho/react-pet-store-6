records:
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL authenticate a user by user ID and password, and SHALL treat
      sign-on as failed when no account exists for the given user ID or the supplied
      password does not exactly match the stored password.
    plain_text: >
      A customer signs on with their user ID and password. If the user ID is unknown
      or the password is wrong, sign-on fails.
    technical_note: >
      SignOnEJB.authenticate looks the user up by primary key (userName) and calls
      UserEJB.matchPassword, a case-sensitive String.equals against the stored CMP
      field. A FinderException (unknown user) returns false.
    confidence: high
    confidence_basis: >
      Read in two places that agree: the session bean's authenticate method and the
      entity bean's matchPassword, plus the deployment descriptor declaring userName
      as the primary key. Behaviour is fully visible in source.
    risk_class: regulated
    basis: >
      authenticate() returns matchPassword(password) for a found user and false on
      FinderException; matchPassword is an exact equals.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 77
        excerpt: |2
              public boolean authenticate(String userName, String password) {
                  try {
                      UserLocal user = ulh.findByPrimaryKey(userName);
                      return user.matchPassword(password);
                  } catch (FinderException fe) {
                      return false; // User not found, so authentication failed.
                  }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |2
              public boolean matchPassword(String password) {
                  return password.equals(getPassword());
              }
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: SignOnEJB (Stateless), UserEJB (CMP 2.x)
      session.scope: stateless

