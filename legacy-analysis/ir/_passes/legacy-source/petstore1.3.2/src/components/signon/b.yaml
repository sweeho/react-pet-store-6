findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserLocal.java
    description: >
      Line 47 (MAX_PASSWD_LENGTH) and CreateUserServlet.java lines 65-69 contain
      secret-scanner redaction markers in place of source text, so the committed
      legacy source does not compile as-is and the maximum password length and the
      servlet's exact createUser/redirect-target lines cannot be read. A human needs
      to supply the original values (records SIGN-RULE-0004, SIGN-REQ-0010 depend on
      them).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
    description: >
      No sign-off (session invalidation) logic exists in this component; the
      sign-on state lives only in the session flag j_signon. How sign-off clears it
      must be read from the application shards (e.g. petstore SignOffHTMLAction) —
      not resolvable from this module.

