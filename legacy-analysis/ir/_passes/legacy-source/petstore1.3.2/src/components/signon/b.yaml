  - record_key: SIGN-RULE-0008
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL, when the user ticks "remember my user name" on sign-on, store
      the entered user ID in a browser cookie that lasts 31 days; WHEN the box is not
      ticked THEN the system SHALL delete any previously stored user-name cookie.
    plain_text: >
      A customer can ask the store to remember their user ID on this browser for about
      a month. Signing on without that option clears any remembered user ID.
    technical_note: >
      validateSignOn: if parameter j_remember_username is present, add cookie
      bp_signon=userName with maxAge 2678400 seconds (31 days); otherwise re-send any
      existing bp_signon cookie with maxAge 0. This runs before the credentials are
      checked.
    confidence: medium
    confidence_basis: >
      One clear implementation with a commented constant; the petstore sign-on page
      renders the matching checkbox. The 2678400-second figure is a bare literal with
      only a "one month" comment.
    risk_class: presentational
    basis: >
      Cookie handling block in validateSignOn; j_remember_username checkbox in
      signon.jsp.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |2
                  // check if the user wants userName set in cookie
                  String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
                  if (rememberUserName != null) {
                    // set a cookie with the username in it
                    Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
                    // set cookie to last for one month
                    userNameCookie.setMaxAge(2678400);
                    hres.addCookie(userNameCookie);
                  } else {
                      // see if the cookie exists and remove accordingly
                      Cookie[] cookies = hreq.getCookies();
                      if (cookies != null) {
                          for (int loop=0; loop < cookies.length; loop++) {
                              if (cookies[loop].getName().equals(COOKIE_NAME)) {
                                  cookies[loop].setMaxAge(0);
                                  hres.addCookie(cookies[loop]);

                              }
                          }
                      }
                  }
