  - record_key: SIGN-REQ-0006
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL require a signed-on user for every page or action listed as a
      protected resource; GIVEN a visitor who is not signed on WHEN they request a
      protected resource THEN the system SHALL remember the requested resource and
      show the sign-on page instead. Requests for unprotected resources SHALL be
      served without sign-on.
    plain_text: >
      Certain pages (in the shipped store: the customer account pages, the
      enter-order-information page and the sign-on welcome page) need the customer to
      be signed on. Anyone not signed on who asks for one is shown the sign-on page
      first; everything else is open to anyone.
    technical_note: >
      SignOnFilter (mapped to /* in the petstore web.xml) reads
      /WEB-INF/signon-config.xml via SignOnDAO at init. On each request it strips the
      context root, checks the session flag j_signon, and if false compares the
      remaining path for exact string equality with each url-pattern; on a match it
      stores the path in session attribute j_signon_original_url and forwards to the
      configured signon-form-login-page. The petstore config protects
      customer.screen, customer.do, enter_order_information.screen and
      signon_welcome.screen.
    confidence: high
    confidence_basis: >
      Enforcement code in the filter and the declarative list in signon-config.xml
      agree, and web.xml maps the filter to every URL.
    risk_class: regulated
    basis: >
      doFilter signed-on check and protected-resource match loop; signon-config.xml
      security-constraint entries.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 154
        excerpt: |2
                  // check if the user is signed on
                  boolean signedOn = false;
                  if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                      signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
                  } else {
                      hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
                  }
                  // jump to the resource if signed on
                  if (signedOn) {
                          chain.doFilter(request,response);
                          return;
                  }
                  // find out if the patterns match the target URL
                  Iterator it = null;
                  if (protectedResources != null) it = protectedResources.keySet().iterator();
                  while ((it != null) && it.hasNext()) {
                      String protectedName = (String)it.next();
                      ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
                      String urlPattern = resource.getURLPattern();

                      // now check agains the targetURL
                      if (urlPattern.equals(targetURL)) {
                          // put the orginal url in the session so others can access
                          hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                          config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                          // Jump out of the filter and go to the next page
                          return;
                      }
                  }
                  // No matches if we made it to here
                  chain.doFilter(request,response);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
