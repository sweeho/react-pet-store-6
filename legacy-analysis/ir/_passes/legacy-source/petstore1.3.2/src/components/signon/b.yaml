  - record_key: SIGN-WF-0007
    kind: workflow
    capability_key: sign-on
    requirement: >
      The system SHALL process a sign-on form submission as follows: GIVEN valid
      credentials THEN the system SHALL record the user ID and a signed-on state in
      the user's session and redirect to the resource originally requested; GIVEN
      invalid credentials THEN the system SHALL redirect to the sign-on error page and
      leave the user not signed on.
    plain_text: >
      After a successful sign-on the customer is taken back to the page they were
      trying to reach and stays signed on for the rest of the visit. A failed sign-on
      shows the sign-on error page.
    technical_note: >
      Posting to j_signon_check is intercepted by SignOnFilter.validateSignOn. On
      success it sets session attributes j_signon_username and j_signon=true and
      sendRedirect to j_signon_original_url; on failure sendRedirect to the
      signon-form-error-page (signon_error.screen in the petstore config).
    confidence: high
    confidence_basis: >
      The filter code is explicit and the petstore sign-on page posts to the same
      j_signon_check URL with the same field names.
    risk_class: regulated
    basis: >
      validateSignOn success/failure branches; signon.jsp form action.
