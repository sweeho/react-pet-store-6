  - record_key: ORDFUL-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL let each order-process step hand off to the next step through a
      pluggable transition, selected by configuration, that receives either a single XML
      message, a batch of XML messages, or both. GIVEN the configured transition cannot be
      loaded or instantiated WHEN it is requested THEN the system SHALL raise a transition
      error that carries the underlying cause.
    plain_text: >
      Moving an order from one step to the next (for example from approval to the supplier)
      is done by a swappable hand-off component chosen by configuration; it passes along one
      message or a batch of messages. If the hand-off component cannot be found, the step
      fails with an error that keeps the original reason.
    technical_note: >
      TransitionDelegate interface (setup, doTransition(TransitionInfo)); TransitionInfo holds
      an XML string and/or a Collection of XML strings; TransitionDelegateFactory loads the
      implementation by class name via Class.forName(...).newInstance() and wraps any
      exception in TransitionException (getRootCause unwraps nested ones). Concrete delegates
      and the class-name configuration live in apps/opc and apps/supplier, outside this shard.
    confidence: medium
    confidence_basis: >
      The contract and the factory are read directly, but what the delegates actually send
      (queues, message shapes) is not visible in this module, so the integration targets are
      not graded.
    risk_class: operational
    basis: >
      Interface comment "the interface that all transition delegates must implement";
      TransitionInfo "Encapsulates the parameters passed to the transition delegates";
      factory "Used to get the required type of TransitionDelegate".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
        line_start: 41
        line_end: 50
        excerpt: |
          /**
            * This is the interface that all transition delegates must implement
            */
          public interface TransitionDelegate {

             public void setup() throws TransitionException;

             public void doTransition(TransitionInfo info) throws TransitionException;

          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 48
        line_end: 56
        excerpt: |
            public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
              TransitionDelegate td = null;
              try {
                td = (TransitionDelegate)Class.forName(className).newInstance();
              } catch(Exception e) {
                throw new TransitionException(e);
              }
              return td;
            }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionInfo.java
