  - record_key: ORDFUL-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL record a new status for an existing order, replacing its previous
      status. GIVEN no workflow record exists for the order id WHEN a status update is
      requested THEN the update SHALL fail with a not-found error and nothing SHALL be stored.
    plain_text: >
      An order's stage can be moved on; the new stage replaces the old one (no history of
      earlier stages is kept here). Updating an unknown order is refused.
    technical_note: >
      ProcessManagerEJB.updateStatus finds the entity by primary key (FinderException if
      absent) and calls setStatus. No validation of the new value and no check against the
      current value; no status history or timestamp is kept in this module. Container
      transaction Required on updateStatus and on ManagerEJB.setStatus.
    confidence: high
    confidence_basis: >
      The update path is read directly in code and backed by the local interface javadoc and
      the declared transaction attributes in ejb-jar.xml.
    risk_class: operational
    basis: >
      updateStatus does findByPrimaryKey then setStatus; interface javadoc "update the status
      of the order corresponding to orderId".
