suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDFUL-WF-0001, ORDFUL-REQ-0002, ORDFUL-BR-0001]
    severity: medium
    category: data-corruption
    title: Status updates are not checked against the lifecycle or the allowed status list
    description: >
      The documented lifecycle allows only PENDING->APPROVED->SHIPPED_PART->COMPLETED or
      PENDING->DENIED, but the status-update operation stores any string for any existing
      order, regardless of its current status. A denied or completed order can be moved to
      another status, and a value outside the five known statuses can be stored, after which
      it no longer appears in any of the admin's by-status lists. Whether every caller guards
      against this is outside this module.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 73
        line_end: 76
