  - record_key: ORDFUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL recognise exactly five order statuses: PENDING (placed, not yet
      approved), APPROVED, DENIED, SHIPPED_PART (part of the order shipped) and COMPLETED
      (whole order shipped).
    plain_text: >
      An order is always in one of five stages: waiting for approval, approved, denied,
      partly shipped, or completed (everything shipped).
    technical_note: >
      String constants in OrderStatusNames.java, described there as "the central location
      to store the names of the status that an order can be in". The values are stored
      verbatim in the status field. Nothing in this module rejects a status outside this
      set (see suspected defect).
    confidence: high
    confidence_basis: >
      Code (constants) plus an explanatory comment in the same file, and the discovery
      report independently identifies this as the order status machine. Not graded higher
      on enforcement because no check in this module restricts stored values to the set.
    risk_class: operational
    basis: >
      OrderStatusNames declares PENDING, APPROVED, DENIED, SHIPPED_PART, COMPLETED with
      javadoc describing each.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 65
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      framework: plain Java constants

  - record_key: ORDFUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The order lifecycle SHALL be PENDING -> APPROVED -> SHIPPED_PART -> COMPLETED, or
      PENDING -> DENIED. GIVEN a newly placed order WHEN it enters the workflow THEN it starts
      in PENDING; DENIED and COMPLETED are end states.
    plain_text: >
      A new order waits for approval. It is then either denied (and stops there) or approved,
      after which it may be partly shipped and is finally completed once everything has shipped.
    technical_note: >
      The lifecycle is stated only in the javadoc of OrderStatusNames. The process manager
      itself does not enforce it: updateStatus overwrites the status with whatever value the
      caller passes. Guards live in callers outside this shard (e.g. the approval message
      handler in apps/opc checks the current status is PENDING before applying a decision);
      whether every caller guards is for the apps/opc pass to establish. "End states" is
      inferred from the comment's arrows, not from code.
    confidence: medium
    confidence_basis: >
      One clear place (the class comment) states the sequence; there is no code in this module
      that enforces it, and the terminal nature of DENIED/COMPLETED is inferred from the
      diagram rather than read from a check.
    risk_class: operational
    basis: >
      Javadoc "pending->approved->shippedPart(shipped part of order)->completed(whole order
      shipped) or pending->denied".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 46
        excerpt: |
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
    stack_metadata:
      framework: plain Java constants (comment-only state machine)

  - record_key: ORDFUL-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL start a workflow record for each newly received purchase order, storing
      the order id and a caller-supplied initial status. GIVEN a workflow record already exists
      for an order id WHEN another is started for the same id THEN creation SHALL fail.
    plain_text: >
      When a new order arrives, a tracking entry is opened for it with its starting stage.
      The same order number cannot be opened twice.
    technical_note: >
      ProcessManagerEJB.createManager(orderId, status) calls ManagerLocalHome.create, which
      sets both CMP fields in ManagerEJB.ejbCreate. Duplicate rejection comes from orderId
      being the primary key (container raises a CreateException/DuplicateKeyException).
      The initial status is not fixed here; the observed caller (apps/opc PurchaseOrderMDB)
      passes PENDING. Container transaction Required.
    confidence: high
    confidence_basis: >
      Creation path read in the session bean, entity bean and home interface, and the javadoc
      on both the bean and its local interface state the purpose. Duplicate rejection is
      inferred from primary-key semantics rather than an explicit check, but that is a
      container guarantee for the declared primkey-field.
    risk_class: operational
    basis: >
      createManager javadoc "used for when new purchase orders are recieved and want to start
      the workflow process"; local interface "start a new workflow for each new order";
      ejbCreate sets orderId and status.
