  - record_key: SIGNON-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The order-workflow operations (start, update status, read status, list by status) SHALL
      be callable by any in-process caller without a role check at this layer; access control
      for them SHALL be applied by the calling application.
    plain_text: >
      The order-tracking service itself does not check who is calling; protection of who may
      change or view order stages is the job of the screens and services in front of it.
    technical_note: >
      Every method of ManagerEJB and ProcessManagerEJB is listed under <method-permission>
      <unchecked/> in ejb-jar.xml, with use-caller-identity. Only local interfaces are exposed,
      so the beans are not remotely reachable. Filed under sign-on as the closest capability
      for an authorisation rule.
    confidence: high
    confidence_basis: >
      Declared explicitly for every method in the deployment descriptor, and corroborated by
      the beans exposing only local (in-JVM) interfaces.
    risk_class: operational
    basis: >
      Two method-permission blocks marked <unchecked/> cover all methods of both beans.
