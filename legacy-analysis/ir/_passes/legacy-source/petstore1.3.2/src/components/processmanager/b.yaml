findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
    description: >
      The lifecycle comment does not say whether an order can go APPROVED -> COMPLETED
      directly (a single shipment that covers the whole order), whether SHIPPED_PART can
      repeat, or whether DENIED/COMPLETED are final. This module accepts any change, so
      the answer depends on the callers in apps/opc (InvoiceMDB, OrderApprovalMDB). A
      human should confirm the intended terminal states and the direct-completion path
      against those callers.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerLocalHome.java
    description: >
      Javadoc on ManagerLocalHome and ProcessManagerLocalHome says "ProcessManager
      Entity EJB" and ManagerLocal says "sign on information for a particular manager";
      these are copy-paste comments that do not describe the code. No requirement was
      drawn from them.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [FUL-BR-0003, FUL-WF-0001]
    severity: medium
    category: other
    title: Status store accepts any status and any transition
    description: >
      The documented lifecycle allows only PENDING -> APPROVED -> SHIPPED_PART ->
      COMPLETED or PENDING -> DENIED, but the status update writes whatever string it is
      given, with no check of the current status or of the value. A COMPLETED or DENIED
      order can be moved back to PENDING or to an unrecognised status such as a
      misspelling, which would then match no status query. Today only the callers'
      own checks prevent this.
    traces:
