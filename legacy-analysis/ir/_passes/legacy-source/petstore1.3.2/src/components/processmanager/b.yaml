  - capability_key: order-fulfillment
    record_keys: [FUL-INT-0001]
    severity: low
    category: other
    title: Transition handler errors can lose their message
    description: >
      When a handler cannot be loaded, the original error is wrapped with no message of
      its own. The wrapper's text is then only the inner error's text, and a wrapper
      created with neither a message nor a cause reports itself as the root cause. A
      misconfigured handler name surfaces as a generic class-not-found error with no
      mention of which workflow step failed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 50
        line_end: 54
