  - record_key: FUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL recognise exactly five order statuses: PENDING (placed, not yet
      approved), APPROVED, DENIED, SHIPPED_PART (part of the order shipped) and
      COMPLETED (whole order shipped).
    plain_text: >
      An order is always in one of five states: pending, approved, denied, partly
      shipped, or completed.
    technical_note: >
      String constants in OrderStatusNames ("PENDING", "APPROVED", "DENIED",
      "SHIPPED_PART", "COMPLETED"). They are plain strings, not an enum, and the stored
      status column accepts any string.
    confidence: medium
    confidence_basis: >
      One clear place defines the values (a constants class with a descriptive
      comment). Nothing in this module restricts the stored value to these five, so the
      closed set is a convention, not something this module enforces.
    risk_class: operational
    basis: >
      OrderStatusNames declares the five constants, each with a one-line meaning.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 65
        excerpt: |
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
