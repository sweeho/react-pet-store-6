  - record_key: FUL-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL perform the side effects of a workflow step (such as sending a
      message to the next stage) through a pluggable step handler chosen by name at
      run time, which receives either a single XML message or a batch of XML messages.
      GIVEN the named handler cannot be found or created WHEN a step is run THEN the
      system SHALL raise a transition failure carrying the underlying cause.
    plain_text: >
      Each step that moves an order forward hands one document, or a batch of
      documents, to a configurable handler. If the configured handler is missing, the
      step fails with the reason.
    technical_note: >
      TransitionDelegate interface (setup(), doTransition(TransitionInfo)).
      TransitionDelegateFactory.getTransitionDelegate(className) does
      Class.forName(className).newInstance() and wraps any Exception in
      TransitionException. TransitionInfo carries xmlMessage and/or xmlMessageBatch.
      Implementations and the class-name configuration live in apps/opc and
      apps/supplier (e.g. PurchaseOrderTD, InvoiceTD, SupplierOrderTD), outside this
      shard.
    confidence: medium
    confidence_basis: >
      The contract and the failure wrapping are clear in one place each. Which handlers
      are configured, and what they send, is outside this shard and was not read.
    risk_class: operational
    basis: >
      The delegate interface, factory and parameter holder define the extension point
      and its error behaviour.
