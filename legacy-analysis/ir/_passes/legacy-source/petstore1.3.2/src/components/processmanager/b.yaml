  - record_key: FUL-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL update the status of an existing order to the status supplied,
      without checking the order's current status or whether the new status is one of
      the recognised statuses. GIVEN no workflow record exists for the order identifier
      WHEN a status update is requested THEN the update SHALL fail with a not-found
      error and nothing SHALL be written.
    plain_text: >
      An order's status can be changed to any value; the status store itself does not
      check that the change makes sense. Changing the status of an unknown order fails.
    technical_note: >
      ProcessManagerEJB.updateStatus finds the Manager by primary key (FinderException /
      ObjectNotFoundException when absent) and calls setStatus with the raw string.
      No transition guard, no value check. Transaction attribute Required.
    confidence: high
    confidence_basis: >
      The absence of a guard is read directly from the full method body, and the
      setStatus write is also exposed unguarded on the entity's local interface in the
      descriptor. Two places agree that nothing in this module validates the change.
    risk_class: operational
    basis: >
      updateStatus is two lines: find by order id, then set status.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
              /**
               * Business method used to keep track of an order in the workflow process
               */
              public void updateStatus(String orderId, String status) throws FinderException {
                ManagerLocal manager = mlh.findByPrimaryKey(orderId);
                manager.setStatus(status);
              }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerLocal.java
