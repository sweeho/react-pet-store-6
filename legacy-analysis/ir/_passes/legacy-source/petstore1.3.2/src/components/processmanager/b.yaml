  - record_key: FUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL move an order through the lifecycle
      PENDING -> APPROVED -> SHIPPED_PART -> COMPLETED, or PENDING -> DENIED, where
      SHIPPED_PART means part of the order has shipped and COMPLETED means the whole
      order has shipped.
    plain_text: >
      A new order waits for approval. It is then approved or denied. An approved order
      becomes partly shipped as shipments go out, and completed once everything has
      shipped. A denied order goes no further.
    technical_note: >
      The lifecycle is written only in the class comment of OrderStatusNames. This
      module does not enforce it: updateStatus writes whatever status string it gets
      (see FUL-BR-0003). Enforcement, where it exists, is in the callers in apps/opc
      (e.g. OrderApprovalMDB checks the current status is PENDING before it applies an
      approval decision); this pass does not extract that.
    confidence: low
    confidence_basis: >
      The only source in this shard is a code comment. No code in the module checks a
      transition, so I could not confirm from here that the live system follows this
      graph. The callers are outside this shard.
    risk_class: operational
    basis: >
      The OrderStatusNames comment lists the two allowed paths.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 47
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
    stack_metadata:
      framework: ejb-2.0

