  - record_key: FUL-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL NOT restrict, by caller identity or role, who may start, change,
      read or list order workflow statuses; access is limited only to code inside the
      application.
    plain_text: >
      The order status store has no permission check of its own; any part of the
      application that can reach it may change an order's status.
    technical_note: >
      Both method-permission blocks in ejb-jar.xml are <unchecked/>, and both beans use
      caller identity. Only local interfaces exist, so callers must be co-located in the
      same application. Any role-based control must sit in the callers (admin web tier).
    confidence: high
    confidence_basis: >
      Declared explicitly for every method of both beans in two method-permission
      blocks; there is no programmatic check anywhere in the module either.
    risk_class: operational
    basis: >
      method-permission <unchecked/> for all ManagerEJB and ProcessManagerEJB methods.
