records:
  - record_key: checkout-ENTITY-0001
    kind: entity
    capability_key: checkout
    requirement: >
      The system SHALL store each order line as a line item that records the
      category id, product id, item id, line number, ordered quantity, unit price
      and quantity shipped.
    plain_text: >
      Every line on an order records which catalog item was ordered (with its
      category and product), the line's number, how many were ordered, the price
      per unit, and how many have been shipped so far.
    technical_note: >
      LineItemEJB is a CMP 2.x local entity bean (abstract schema "LineItem") with
      seven cmp-fields declared in ejb-jar.xml and matching abstract accessors in
      LineItemEJB.java. categoryId/productId/itemId/lineNumber are String, quantity
      and quantityShipped are int, unitPrice is float. The bean has no remote
      interface. Purchase orders (PurchaseOrderEJB) and supplier orders
      (SupplierOrderEJB) both hold collections of these line items.
    confidence: high
    confidence_basis: >
      The field set is declared in two places that agree: the cmp-field list in
      the deployment descriptor and the abstract accessors in the bean class. The
      local interface exposes the same getters.
    risk_class: financial
    basis: >
      The cmp-field declarations and the abstract getter/setter pairs define the
      persisted state of a line item.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 57
        line_end: 78
        excerpt: |
          <abstract-schema-name>LineItem</abstract-schema-name>
          <cmp-field>
            <field-name>categoryId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>productId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>itemId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>lineNumber</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantity</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>unitPrice</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 106
        line_end: 136
        excerpt: |
          public abstract int getQuantity();
          ...
          public abstract float getUnitPrice();
          ...
          public abstract int getQuantityShipped();
          ...
          public abstract void setQuantityShipped(int qty);
    stack_metadata:
      framework: J2EE 1.3
      ejb.bean: LineItemEJB
      ejb.persistence: Container (CMP 2.x)
      ejb.interfaces: local only
      db.object: LineItem (abstract schema)

  - record_key: order-fulfillment-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN an order's line items are first saved (customer purchase order or
      supplier order), the system SHALL copy category, product, item, line number,
      quantity and unit price from the submitted line and SHALL set the quantity
      shipped to zero.
    plain_text: >
      When an order is saved, each of its lines starts with nothing shipped.
    technical_note: >
      LineItemEJB.ejbCreate(LineItem, int qty) copies every field from the LineItem
      value object and sets quantityShipped to the second argument. Both callers
      outside this module, PurchaseOrderEJB.ejbPostCreate and
      SupplierOrderEJB.ejbPostCreate, pass 0. The seven-argument create takes an
      explicit qtyShipped. This pass found no caller for it (only the two callers
      above were checked).
    confidence: high
    confidence_basis: >
      The copy-and-set behaviour is plain in the bean. The zero initial value comes
      from two independent callers (purchase order and supplier order) that both
      pass the literal 0. Graded high on those two places, though the zero itself
      is supplied by the callers rather than enforced by the entity.
    risk_class: operational
    basis: >
      ejbCreate(LineItem, qty) assigns quantityShipped from the argument, and every
      observed create(li, 0) call passes zero.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 158
        line_end: 167
        excerpt: |
          public Object ejbCreate(LineItem lineItem, int qty) throws CreateException {
            setCategoryId(lineItem.getCategoryId());
            setProductId(lineItem.getProductId());
            setItemId(lineItem.getItemId());
            setLineNumber(lineItem.getLineNumber());
            setQuantity(lineItem.getQuantity());
            setUnitPrice(lineItem.getUnitPrice());
            setQuantityShipped(qty);
            return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 229
        line_end: 233
        excerpt: |
              LineItem li = (LineItem) it.next();
              LineItemLocal lineItemloc = (LineItemLocal)
                  lineItemref.create(li, 0);
              addLineItem(lineItemloc);
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 177
        line_end: 179
        excerpt: |
