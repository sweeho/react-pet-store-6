suspected_defects:
  - capability_key: shopping-cart
    record_keys: [SC-RULE-0001]
    severity: medium
    category: other
    title: Adding an item already in the cart resets its quantity to 1
    description: >
      If a shopper has set a quantity of 5 for an item and then clicks "add" for the same item
      again, the quantity becomes 1 rather than 6. The shopper silently loses the quantity they
      chose.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
  - capability_key: shopping-cart
    record_keys: [SC-RULE-0005, SC-RULE-0004, SC-RULE-0003]
    severity: medium
    category: error-swallowed
    title: Catalog lookup failure silently drops a cart line from display and subtotal but not from the count
    description: >
      When a cart item cannot be fetched from the catalog, the exception is printed to the console
      and the line is skipped. The item stays in the cart's internal store, so the item count still
      includes it while the listing and subtotal omit it, and it could resurface later. The shopper
      gets no message.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
