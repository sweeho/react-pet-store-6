  - record_key: SC-RULE-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL present cart contents (product name, attribute, category and unit price)
      in the shopper's current locale, and SHALL default to US English when no locale has been set.
      GIVEN an item in the cart cannot be found in the catalog for that locale WHEN the cart is
      listed or totalled THEN the item SHALL be omitted from the listing and from the subtotal
      without any message to the shopper.
    plain_text: >
      Cart lines are shown with the product details and prices for the shopper's chosen language,
      English (US) by default. If a product in the cart is not available in the catalog for that
      language, it quietly disappears from the cart display and the subtotal.
    technical_note: >
      The bean holds a Locale defaulting to Locale.US, changeable via setLocale. getItems() calls
      CatalogHelper.getItem(key, locale) for each entry; a CatalogException is caught, printed to
      stdout and the item skipped. The entry remains in the underlying HashMap.
    confidence: medium
    confidence_basis: >
      One clear place in the bean. Whether CatalogHelper.getItem actually throws for a missing
      item (versus returning null, which would raise a NullPointerException instead) lives in the
      catalog component, which this pass did not read.
    risk_class: financial
    basis: >
      `private Locale locale = Locale.US;` and the try/catch around catalog.getItem.
