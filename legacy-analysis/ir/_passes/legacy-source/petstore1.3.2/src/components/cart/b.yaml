  - record_key: SC-RULE-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum, over every item in the cart, of the
      item's current catalog list price multiplied by its quantity, with no rounding applied, no
      discounts, taxes or shipping included.
    plain_text: >
      The cart subtotal is each product's current list price times the quantity, added up. Prices
      are looked up from the catalog at the moment the cart is viewed, not when the product was
      added. No tax, shipping or discount is included, and the figure is not rounded.
    technical_note: >
      ShoppingCartLocalEJB.getSubTotal iterates getItems() and sums unitCost * quantity into a
      Java double. getItems() rebuilds each CartItem from CatalogHelper.getItem(itemId, locale) on
      every call, taking item.getListCost() as unit cost. ShoppingCartModel.getTotalCost computes
      the same sum from CartItem.getTotalCost() (quantity * unitCost).
    confidence: high
    confidence_basis: >
      The same sum-of-line-totals is implemented twice (bean getSubTotal and the model's
      getTotalCost via CartItem.getTotalCost), and both agree. Absence of rounding/tax is read
      directly from the code. Which of the two totals the order amount actually uses is outside
      this module.
    risk_class: financial
    basis: >
      `ret += (i.getUnitCost() * i.getQuantity())`; unitCost populated from `item.getListCost()`.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
             public Double getSubTotal() {
                  Collection items = getItems();
                  if (items == null) return null;
                  // put the subtotal in the request
                  double ret = 0.0d;
                  // total up the quantities
                  for (Iterator it =items.iterator(); it.hasNext(); ) {
                      CartItem i = (CartItem) it.next();
                      ret += (i.getUnitCost() * i.getQuantity()) ;
                  }
                  return new Double(ret);
             }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 94
        line_end: 102
