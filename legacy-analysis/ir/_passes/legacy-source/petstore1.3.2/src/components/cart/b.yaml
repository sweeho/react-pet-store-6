  - record_key: SC-RULE-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a shopper to change the quantity of an item in the cart. GIVEN a new
      quantity of 0 or less WHEN the quantity is updated THEN the item SHALL be removed from the
      cart. GIVEN a new quantity greater than 0 THEN the item's quantity SHALL be replaced with the
      new value, with no upper limit applied.
    plain_text: >
      A shopper can change how many of each product is in the cart. Setting a quantity to zero (or
      a negative number) removes the product from the cart. There is no maximum quantity.
    technical_note: >
      ShoppingCartLocalEJB.updateItemQuantity removes the key, then re-puts it only if newQty > 0.
      The inline comment states the removal rule. CartEJBAction UPDATE_ITEMS applies this per item
      in the submitted map. No upper bound or stock check is made in this component.
    confidence: high
    confidence_basis: >
      The guard is in code and restated by the adjacent comment; the caller confirms it is reached
      for every submitted item. "No upper limit" is an absence observed only in this module and the
      calling action; the web form may restrict input elsewhere, which this pass did not read.
    risk_class: financial
    basis: >
      `if (newQty > 0) cart.put(...)` after an unconditional remove; comment "remove item if it is
      less than or equal to 0".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
              public void updateItemQuantity (String itemID, int newQty) {
                  cart.remove(itemID);
                  // remove item if it is less than or equal to 0
                  if (newQty > 0) cart.put(itemID, new Integer(newQty));
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
