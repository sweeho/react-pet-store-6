records:
  - record_key: SC-RULE-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL, when a shopper adds an item to the cart, set that item's quantity in the
      cart to 1. GIVEN the item is already in the cart with quantity N WHEN the shopper adds it
      again THEN its quantity SHALL become 1 (not N+1).
    plain_text: >
      Adding a product to the cart puts one of it in the cart. Adding a product that is already in
      the cart does not increase the count; it resets that line back to one.
    technical_note: >
      ShoppingCartLocalEJB.addItem(String) does cart.put(itemID, new Integer(1)) on a HashMap keyed
      by item id, overwriting any existing quantity. The only caller in the web tier is
      CartEJBAction ADD_ITEM, which calls addItem(itemId) with no prior lookup.
    confidence: high
    confidence_basis: >
      The overwrite is explicit in the bean and the caller in apps/petstore confirms the single-arg
      variant is the one used for "add", with no pre-check of existing quantity. Two places agree.
      Whether the reset-to-1 is intended is not stated anywhere; see suspected defect.
    risk_class: financial
    basis: >
      HashMap.put with a constant Integer(1) replaces the previous value for the same key.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
        excerpt: |
              public void addItem (String itemID) {
                  cart.put(itemID, new Integer(1));
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 67
        line_end: 70
        excerpt: |
                        case  CartEvent.ADD_ITEM  : {
                            cart.addItem(ce.getItemId());
                        }
                        break;
    stack_metadata:
      framework: J2EE 1.3
