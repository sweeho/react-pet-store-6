  - record_key: SC-BR-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the cart subtotal as the sum over all cart lines of the
      item's current catalog list price multiplied by the line quantity, with no rounding
      step, no tax, no shipping and no discount applied.
    plain_text: >
      The cart total is the sum of price times quantity for every line. The price used is
      the item's list price in the catalog at the moment the total is shown, not the price
      when it was added. No tax, shipping or discount is part of it.
    technical_note: >
      ShoppingCartLocalEJB.getSubTotal() re-reads the catalog through getItems() on every call
      (CatalogHelper.getItem(key, locale)) and sums unitCost * quantity as a double.
      ShoppingCartModel.getTotalCost() sums CartItem.getTotalCost() over the same lines.
      Neither rounds.
    confidence: high
    confidence_basis: >
      The same formula is implemented in two places (bean getSubTotal and model
      getTotalCost). That tax, shipping and discounts are absent is read from these methods
      only; they may be added elsewhere (checkout or order modules) outside this shard.
    risk_class: financial
    basis: >
      getSubTotal loops over the cart items and accumulates getUnitCost() * getQuantity().
      Unit cost is item.getListCost() fetched live from the catalog in getItems().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
             public Double getSubTotal() {
                  Collection items = getItems();
                  if (items == null) return null;
                  // put the subtotal in the request
                  double ret = 0.0d;
                  // total up the quantities
                  for (Iterator it =items.iterator(); it.hasNext(); ) {
                      CartItem i = (CartItem) it.next();
                      ret += (i.getUnitCost() * i.getQuantity()) ;
                  }
                  return new Double(ret);
             }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 93
        line_end: 102
        excerpt: |
                     try {
