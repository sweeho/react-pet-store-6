      ejb.transaction: Required

  - record_key: SC-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL set a cart line's quantity to the new value when the shopper updates
      it. GIVEN a new quantity of zero or less WHEN the shopper updates the line THEN the
      item SHALL be removed from the cart. GIVEN an item that is not in the cart WHEN the
      shopper updates its quantity to a value greater than zero THEN the item SHALL be added
      with that quantity.
    plain_text: >
      Changing a quantity replaces the old one. Setting it to zero (or less) takes the item
      out of the cart. Setting a quantity for an item not yet in the cart adds it.
    technical_note: >
      ShoppingCartLocalEJB.updateItemQuantity removes the key first, then re-puts it only
      when newQty > 0. There is no upper bound and no check that the item was already in the
      cart.
    confidence: high
    confidence_basis: >
      The code and its inline comment ("remove item if it is less than or equal to 0") agree.
      The add-if-absent case is read from the code; no comment covers it.
    risk_class: financial
    basis: >
      Remove-then-conditional-put: quantities > 0 are stored, <= 0 leave the item removed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
              public void updateItemQuantity (String itemID, int newQty) {
                  cart.remove(itemID);
                  // remove item if it is less than or equal to 0
                  if (newQty > 0) cart.put(itemID, new Integer(newQty));
              }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 101
        line_end: 112
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>ShoppingCartEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>updateItemQuantity</method-name>
                  <method-params>
                    <method-param>java.lang.String</method-param>
                    <method-param>int</method-param>
                  </method-params>
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
    stack_metadata:
      framework: ejb-2.0
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required

  - record_key: SC-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL remove an item and its quantity from the cart when the shopper deletes
      it. Deleting an item that is not in the cart SHALL leave the cart unchanged.
    plain_text: >
      The shopper can take an item out of the cart. Removing something that isn't there does
      nothing.
    technical_note: >
      ShoppingCartLocalEJB.deleteItem calls cart.remove(itemID). HashMap.remove of a missing
      key is a no-op.
    confidence: high
    confidence_basis: >
      The bean method, the local interface and a declared container transaction all cover
      it. The no-op case follows from map semantics.
    risk_class: operational
    basis: >
      deleteItem removes the map entry for the item id.
    traces:
