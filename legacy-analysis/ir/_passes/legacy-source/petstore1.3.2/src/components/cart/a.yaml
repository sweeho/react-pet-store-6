  - record_key: SC-BR-0010
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL NOT guarantee any particular order of cart lines when listing the
      cart contents.
    plain_text: >
      Cart lines are not sorted; they can appear in any order.
    technical_note: >
