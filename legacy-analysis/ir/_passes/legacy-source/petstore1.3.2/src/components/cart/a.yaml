  - record_key: SC-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL set an item's cart quantity to 1 when the shopper adds that item.
      GIVEN the item is already in the cart with any quantity WHEN the shopper adds the same
      item again THEN its quantity SHALL be 1 (it is reset, not incremented).
    plain_text: >
      Adding an item to the cart puts one of it in the cart. If it was already there, the
      quantity goes back to one; it does not go up by one.
    technical_note: >
      ShoppingCartLocalEJB.addItem(String) calls cart.put(itemID, new Integer(1)), which
      replaces any existing value for that key. This is the only add method on the local
      interface.
    confidence: medium
    confidence_basis: >
      One clear place in the bean, exposed on the local interface. No test or comment states
      that the overwrite is intended, so the re-add behaviour is read from map semantics.
    risk_class: financial
    basis: >
      addItem(String) puts quantity 1 for the item id, so any earlier quantity is overwritten.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
        excerpt: |
              public void addItem (String itemID) {
                  cart.put(itemID, new Integer(1));
              }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 61
        line_end: 61
