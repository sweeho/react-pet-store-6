      detail: >
        The bean implements addItem(String, int) but the local interface and the
        deployment descriptor expose only addItem(String). Unless something calls the bean
        class directly (not possible through the container), this rule never runs. Settle by
        confirming that no client uses a different interface or reflection; if none, drop
        the record.
