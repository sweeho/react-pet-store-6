records:
  - record_key: SC-ENT-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL keep, for each shopping session, one shopping cart that holds at most
      one line per catalog item, each line recording the item identifier and a quantity.
    plain_text: >
      Each shopper has one cart for their visit. A product item appears in the cart at most
      once, with a quantity next to it.
    technical_note: >
      ShoppingCartLocalEJB is a Stateful session bean whose whole state is a HashMap keyed by
      itemId with an Integer quantity value. The map key makes item lines unique. One bean
      instance per client session, declared Stateful in ejb-jar.xml.
    confidence: high
    confidence_basis: >
      Two places agree: the bean's in-memory map keyed by item id, and the Stateful
      session-type in the deployment descriptor. Uniqueness comes from the map structure, not
      from an explicit check.
    risk_class: operational
    basis: >
      The cart state is a single map from item id to quantity, created empty on ejbCreate. The
      descriptor makes the bean stateful, so there is one cart per client.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 62
        line_end: 70
        excerpt: |
          public class ShoppingCartLocalEJB implements SessionBean {

              private HashMap cart;
              // default to the US English
              private Locale locale = Locale.US;

              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
