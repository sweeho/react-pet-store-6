  - record_key: SC-BR-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a cart line whose item cannot be found in the catalog for the session locale
      WHEN the cart contents or subtotal are read THEN the system SHALL leave that line out
      of the listed contents and the subtotal, SHALL keep it in the cart, and SHALL still
      count it in the item count.
    plain_text: >
      If an item in the cart can no longer be found in the catalog (in the shopper's
      language), it silently disappears from the cart display and total but is still in the
      cart and still counted.
    technical_note: >
      getItems() catches CatalogException per line, prints it to stdout and continues, so the
      line is skipped. The map entry is not removed, so getCount() (cart.size()) still
      includes it.
    confidence: medium
    confidence_basis: >
      One clear catch block. Whether the catalog throws CatalogException for a missing or
      untranslated item is decided in the catalog component, outside this shard.
    risk_class: financial
    basis: >
      The catch on CatalogException logs and moves on without adding the CartItem or touching
      the map.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 88
        line_end: 108
