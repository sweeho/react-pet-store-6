  - record_key: SC-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL report the cart's item count as the number of distinct item lines in
      the cart, not the sum of their quantities.
    plain_text: >
      The cart's "number of items" counts different products, not units. Three of one item
      counts as 1.
    technical_note: >
      ShoppingCartLocalEJB.getCount() returns cart.size(). ShoppingCartModel.getSize() returns
      items.size() (0 when the collection is null). Both count map entries/lines.
    confidence: high
    confidence_basis: >
      Two independent places, the bean's getCount and the model's getSize, both count lines.
    risk_class: presentational
    basis: >
      Both counting methods return the size of the line collection.
