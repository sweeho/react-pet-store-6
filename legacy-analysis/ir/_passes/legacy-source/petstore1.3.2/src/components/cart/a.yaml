      replacing any existing quantity for that item, with no validation of the quantity.
    plain_text: >
      There is a way to add an item with a chosen quantity in one step. It replaces whatever
      quantity was there and does not check the number.
    technical_note: >
      ShoppingCartLocalEJB.addItem(String, int) puts qty directly. It is NOT declared on the
      ShoppingCartLocal interface and has no container-transaction entry, so local clients
      cannot call it through the EJB.
