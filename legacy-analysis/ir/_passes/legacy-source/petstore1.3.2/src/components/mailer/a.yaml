records:
  - record_key: CN-INT-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL accept outbound e-mail requests asynchronously from a message queue
      and, for each request, send one e-mail to the address named in the request using the
      subject and content carried in the request.
    plain_text: >
      Other parts of the store do not send e-mail themselves. They drop a "please send this
      e-mail" request on a queue, and a separate mail service picks each request up and
      sends it.
    technical_note: >
      MailerMDB is a container-managed message-driven bean listening on a javax.jms.Queue
      (ejb-jar.xml). onMessage casts the message to TextMessage, parses the text as a Mail
      XML document (Mail.fromXML) and calls MailHelper.createAndSendMail, which looks up the
      container mail session at java:comp/env/mail/MailSession and calls Transport.send.
      The physical queue (jms/opc/MailQueue) and the SMTP host/from address are bound in the
      opc application's deployment descriptor, outside this shard.
    confidence: high
    confidence_basis: >
      The queue-driven shape is declared in the deployment descriptor and implemented in
      the bean's onMessage and the helper; two independent places agree. Which producers
      put requests on the queue is outside this shard and not graded here.
    risk_class: operational
    basis: >
      The descriptor declares a message-driven bean on a queue destination with a mail
      session resource; onMessage reads the request and passes address, subject and content
      to the send helper.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 64
        excerpt: |
              <message-driven>
                <description>opc node to process PurchaseOrders from the Java Pet Store</description>
                <display-name>MailerMDB</display-name>
                <ejb-name>MailerMDB</ejb-name>
                <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
                <transaction-type>Container</transaction-type>
                <message-driven-destination>
                  <destination-type>javax.jms.Queue</destination-type>
                </message-driven-destination>

                <resource-ref>
                   <res-ref-name>mail/MailSession</res-ref-name>
                   <res-type>javax.mail.Session</res-type>
                   <res-auth>Container</res-auth>
                   <res-sharing-scope>Shareable</res-sharing-scope>
                 </resource-ref>
              </message-driven>
