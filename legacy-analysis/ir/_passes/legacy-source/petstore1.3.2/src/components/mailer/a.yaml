  - record_key: CN-REQ-0002
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL send the e-mail content exactly as supplied in the request, without
      applying any template, formatting or localisation in the mail service; any
      presentation and language choice SHALL already be applied by the producer of the
      request.
    plain_text: >
      The mail service only delivers. Wording, layout and language of each customer e-mail
      are decided before the request reaches it; it does not translate or reformat anything.
    technical_note: >
      The onMessage Javadoc states the message "is already formatted for any presentation
      since this mailer service simly just sends the mails". onMessage passes
      Locale.getDefault() (the server's locale, not the customer's) to sendMail, and
      MailHelper.createAndSendMail accepts the locale parameter but never reads it. Locale-
      specific templates live upstream in the opc application (outside this shard).
    confidence: high
    confidence_basis: >
      The code comment states the rule and the code confirms it: the locale argument is
      unused and the content is copied straight into the message body.
    risk_class: presentational
    basis: >
      Comment on onMessage plus the unused locale parameter and direct use of mailContent
      as the body.
