  - record_key: CN-BR-0002
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN an e-mail request is received
      WHEN the request is not a text message, cannot be read, or does not conform to the
      e-mail request format (CN-ENT-0001)
      THEN the system SHALL fail the processing of that request with an error and roll back
      its receipt, leaving redelivery to the messaging infrastructure.
    plain_text: >
      A malformed e-mail request is treated as an error, not quietly dropped: the request is
      put back on the queue rather than being consumed.
    technical_note: >
      onMessage rethrows XMLDocumentException (validation/parse failure) and JMSException
      (getText failure) as EJBException; a non-TextMessage causes an uncaught
      ClassCastException. Any system exception from onMessage under container-managed
      transaction Required rolls the transaction back, so the message returns to the queue.
      Redelivery limits and dead-letter handling are container configuration not present in
      this shard.
    confidence: medium
    confidence_basis: >
      The rethrows and the Required transaction attribute are both visible, but the actual
      redelivery count and dead-letter behaviour depend on the application server, which is
      not in this shard.
    risk_class: operational
    basis: >
      Explicit EJBException rethrow for parse and JMS errors; transaction attribute Required
      on onMessage.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
