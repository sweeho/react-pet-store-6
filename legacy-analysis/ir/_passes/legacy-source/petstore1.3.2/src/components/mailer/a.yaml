  - record_key: CN-BR-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN a well-formed e-mail request is received
      WHEN sending the e-mail fails for any reason (mail server unreachable, mail session
      missing, invalid recipient address)
      THEN the system SHALL discard the request without retrying it and without notifying
      anyone other than writing a diagnostic line to the server error output.
    plain_text: >
      If an e-mail cannot be sent, it is dropped. It is not retried later and nobody is told
      that the customer did not receive it.
    technical_note: >
      MailHelper.createAndSendMail catches every Exception, prints it to System.err and
      throws MailerAppException("Failure while sending mail"). MailerMDB.onMessage catches
      MailerAppException and does nothing (the EJBException rethrow is commented out with
      "ignore since user probably forgot to set up mail server"), so onMessage returns
      normally, the Required container transaction commits and the JMS message is consumed.
    confidence: high
    confidence_basis: >
      Both halves are visible and agree: the helper converts all failures to one exception
      and the bean swallows exactly that exception, with a comment stating the intent.
    risk_class: operational
    basis: >
      Catch-all in the helper plus an empty catch with an explanatory comment in the bean.
