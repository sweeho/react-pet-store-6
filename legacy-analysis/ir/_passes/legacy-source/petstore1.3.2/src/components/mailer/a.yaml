  - record_key: CN-ENT-0001
    kind: entity
    capability_key: customer-notifications
    requirement: >
      The system SHALL define an e-mail request as exactly three text values, in this order:
      recipient address, subject, and content; all three SHALL be present for the request to
      be accepted.
    plain_text: >
      Every e-mail request has a recipient, a subject line and a body. A request missing any
      of the three is rejected.
    technical_note: >
      Mail.dtd declares <!ELEMENT Mail (Address, Subject, Content)> with #PCDATA children.
      Mail.fromXML parses with VALIDATING = true against that DTD, and fromDOM reads Address,
      then Subject, then Content as sibling elements under a root element that must be named
      "Mail". Mail.java is the value object with the three String fields.
    confidence: high
    confidence_basis: >
      The shape is stated in the DTD and enforced again by the validating parse and the
      ordered child lookup in fromDOM. The DTD says nothing about empty values, so whether an
      empty address or subject is accepted is not visible here.
    risk_class: operational
    basis: >
      The DTD requires all three elements in sequence; parsing is validating by default; the
      deserialiser reads the three children in the same order and fails if the root is not
      Mail.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 52
        line_end: 58
        excerpt: |
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN";
            public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd";
            public static final boolean VALIDATING = true;
            public static final String XML_MAIL = "Mail";
            public static final String XML_SUBJECT = "Subject";
            public static final String XML_ADDRESS = "Address";
            public static final String XML_CONTENT = "Content";
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 154
        line_end: 165
        excerpt: |
            private static Mail fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_MAIL)) {
                Element child;
                Mail mail = new Mail();
                mail.address = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ADDRESS, false), false);
                mail.subject = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_SUBJECT, false), false);
                mail.content = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_CONTENT, false), false);
                return mail;
              }
              throw new XMLDocumentException(XML_MAIL + " element expected.");
            }
    stack_metadata:
      framework: ejb-2.0
      xml.dtd: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN"

  - record_key: CN-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL send each e-mail as an HTML message body encoded in UTF-8, with the
      sender set to the mail service's configured default from-address and the sent date set
      to the time of sending.
    plain_text: >
      Customer e-mails are sent as formatted (HTML) e-mails from the store's standard sender
      address, stamped with the time they were sent. The body supports international
      characters.
    technical_note: >
      MailHelper.createAndSendMail sets content type "text/html", wraps the content in
      ByteArrayDataSource which encodes it with getBytes("UTF-8"), calls msg.setFrom() with
      no argument (so the from-address comes from the mail session's mail.from property,
      configured outside this shard), sets an "X-Mailer: JavaMailer" header and
      setSentDate(new Date()). Note the content type header carries no charset parameter
      while the bytes are UTF-8.
    confidence: medium
    confidence_basis: >
      One clear place (the helper plus its data source) sets each property. The actual
      from-address value is deployment configuration not in this shard, so it is not stated
      here.
    risk_class: presentational
    basis: >
      The helper hard-codes the text/html content type, the default sender, the sent date
      and the X-Mailer header; the data source encodes the body as UTF-8.
