findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
    description: >
      The bean description reads "opc node to process PurchaseOrders from the Java Pet
      Store", which does not describe what the bean does (it sends e-mail). It looks like a
      copy-paste from another descriptor; no record was built from it. A human should
      confirm it carries no meaning.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
    description: >
      No document sources exist under legacy-analysis/sources for this module, so no
      document traces were possible. Mail.java also has a main() test harness (lines
      167-184) that is not part of the runtime path; no requirement was taken from it.

suspected_defects:
  - capability_key: customer-notifications
    record_keys: [CN-BR-0001]
    severity: medium
    category: error-swallowed
    title: Failed customer e-mails are silently dropped
    description: >
      When an e-mail cannot be sent, the failure is caught and ignored and the request is
      consumed. The customer never receives the notice (for example order approval, denial
      or shipment), there is no retry, and the only trace is an unstructured line on the
      server error output that does not include the recipient or subject. The code comment
      shows this was done for demo convenience ("user probably forgot to set up mail
      server").
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 85
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 89
  - capability_key: customer-notifications
    record_keys: [CN-BR-0002]
    severity: low
    category: other
    title: A malformed request can be redelivered repeatedly
    description: >
      A request that fails format validation is rolled back to the queue rather than set
      aside. Because the same bytes fail the same way every time, the request is redelivered
      for as long as the messaging infrastructure allows, which may be indefinitely if no
      redelivery limit or dead-letter queue is configured. Whether a limit exists is not
      visible in this module.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 86
        line_end: 87
  - capability_key: customer-notifications
    record_keys: [CN-REQ-0001]
    severity: low
    category: error-swallowed
    title: Body encoding failure is swallowed and resurfaces as a vague send error
    description: >
      If converting the e-mail body to UTF-8 fails, the error is caught and ignored, the
      body is left empty, and the failure surfaces later only as a generic "no data" error
      during sending, which is then itself swallowed (see CN-BR-0001). In practice UTF-8 is
      always available, so this path is unlikely to run.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
        line_start: 64
        line_end: 76
  - capability_key: customer-notifications
    record_keys: [CN-REQ-0001]
    severity: low
    category: other
    title: HTML body sent as UTF-8 without declaring a character set
    description: >
      The body bytes are UTF-8 but the content type is declared as plain "text/html" with no
      charset, so mail clients may display non-ASCII text (for example Japanese or Chinese
      locale e-mails) incorrectly unless the HTML itself declares the encoding.
