  - record_key: CN-REQ-0003
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL interpret the request's recipient address as a list of one or more
      e-mail addresses, parsed leniently, and send the e-mail to every address in it as a
      direct ("To") recipient.
    plain_text: >
      The recipient field may hold more than one address separated by commas; everyone
      listed receives the e-mail directly. Addresses are not strictly checked for format.
    technical_note: >
      MailHelper calls InternetAddress.parse(emailAddress, false): the second argument
      disables strict RFC 822 parsing and the method returns an array, so a comma-separated
      list yields multiple TO recipients. No CC/BCC is ever set.
    confidence: low
    confidence_basis: >
      Inferred from the semantics of the library call in one place; no comment, test or
      upstream contract in this shard says multiple recipients are intended, and producers
      likely send a single customer address.
    risk_class: operational
    basis: >
      The recipient list is produced by a non-strict address parse and set as the TO list.
