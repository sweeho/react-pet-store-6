records:
  - record_key: NOTIF-INT-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL deliver customer e-mail asynchronously: a request to send an
      e-mail SHALL be accepted as a queued message and SHALL be sent by a separate
      mail-delivery service that consumes that queue, one e-mail per message.
    plain_text: >
      Customer e-mails are not sent while the customer waits. They are put on a
      queue and a background mail service sends each one afterwards.
    technical_note: >
      MailerMDB is a message-driven bean bound to a javax.jms.Queue (ejb-jar.xml).
      onMessage reads the TextMessage body, parses it into a Mail object and calls
      MailHelper.createAndSendMail once per message. The producer side (order
      processing in the OPC app) is outside this shard.
    confidence: high
    confidence_basis: >
      Stated declaratively (ejb-jar.xml message-driven destination is a Queue) and
      implemented in MailerMDB.onMessage; two independent places agree. Which
      business events enqueue mail is not visible in this shard.
    risk_class: operational
    basis: >
      Deployment descriptor declares a queue-driven bean; onMessage performs a single
      send per received message.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 57
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 82
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage textMessage = null;
            String xmlMailMessage = null;
            Mail recMail = null;
            try {
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
    stack_metadata:
      framework: J2EE 1.3 / EJB 2.0
      ejb.bean: MailerMDB
