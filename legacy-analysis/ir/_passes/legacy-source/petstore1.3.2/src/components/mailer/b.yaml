  - record_key: NOTIF-RULE-0004
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL encode e-mail body text as UTF-8 and SHALL NOT vary the e-mail
      by the recipient's locale in the mail-delivery service; any locale-specific
      wording SHALL already be present in the content supplied with the request.
    plain_text: >
      The mail service sends the body as given, encoded as UTF-8. It does not
      translate or choose a language; whoever asks for the e-mail must supply text in
      the customer's language.
    technical_note: >
      ByteArrayDataSource converts the content with getBytes("UTF-8"). MailerMDB passes
      Locale.getDefault() (the server's locale) to MailHelper, and MailHelper never uses
      its locale parameter. Locale-specific templates (per the capability summary) must
      therefore be applied by the producer, outside this shard.
    confidence: medium
    confidence_basis: >
      The UTF-8 conversion and the unused locale parameter are each directly readable,
      but only in one place each; the producer-side templating is inferred, not read.
    risk_class: presentational
    basis: >
      Hard-coded UTF-8 encoding; locale argument is server default and unused.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
