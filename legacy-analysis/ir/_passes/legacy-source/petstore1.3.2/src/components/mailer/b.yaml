findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
    description: >
      The bean description says "opc node to process PurchaseOrders from the Java Pet
      Store" although the bean only sends e-mail; it looks copy-pasted. Which business
      events (approval, denial, shipment, completion) feed this queue is not visible in
      this shard and must be read from the order-processing (OPC) producers.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
    description: >
      Mail.main is a command-line test harness (reads Mail.xml, round-trips it, prints
      content). It produced no record; a human should confirm it is developer tooling
      and not an operational entry point.

suspected_defects:
  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0002]
    severity: medium
    category: error-swallowed
    title: Failed e-mail sends are silently dropped
    description: >
      Any send failure (mail server down, bad address, misconfigured session) is printed
      to the server's error stream and then ignored; the queued request is consumed, no
      retry happens and no one is notified. Customers can miss order approval, denial or
      shipment e-mails with no trace beyond a console line.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 85
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 89
  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0004, NOTIF-RULE-0001]
    severity: medium
    category: other
    title: UTF-8 body sent without a declared charset
    description: >
      The body is encoded as UTF-8 bytes but the content type is the bare "text/html"
      with no charset parameter. Mail clients may then decode it with a default
      charset, which would garble Japanese and Chinese e-mails (supported locales
      ja_JP, zh_CN). The subject is set with the platform default encoding.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 78
        line_end: 82
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
        line_start: 64
        line_end: 69
  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0004]
    severity: low
    category: other
    title: Recipient locale is never used by the mailer
    description: >
      A locale is threaded through to the send routine, but it is always the server's
      default locale and the send routine ignores it. The parameter suggests per-locale
      behaviour that does not exist.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 82
        line_end: 82
