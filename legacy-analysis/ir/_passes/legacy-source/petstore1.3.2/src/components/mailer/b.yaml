  - record_key: NOTIF-ENT-0001
    kind: entity
    capability_key: customer-notifications
    requirement: >
      The system SHALL represent an outgoing e-mail as exactly three fields, in this
      order: recipient address, subject, and content; all three SHALL be present for
      the e-mail to be accepted.
    plain_text: >
      Every e-mail request carries a recipient address, a subject line and a body.
      A request missing any of these is not accepted.
    technical_note: >
      Mail.dtd declares <!ELEMENT Mail (Address, Subject, Content)> with PCDATA
      children; Mail.fromXML parses with VALIDATING=true against that DTD, and
      Mail.fromDOM reads Address, then Subject, then Content as required (optional=false)
      siblings, throwing XMLDocumentException if the root is not <Mail>.
    confidence: high
    confidence_basis: >
      Enforced in two places: the DTD content model and the validating parse plus
      the required-child lookups in fromDOM.
    risk_class: operational
    basis: >
      DTD content model and the deserializer both require all three elements in order.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 52
        line_end: 58
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd";
          public static final boolean VALIDATING = true;
          public static final String XML_MAIL = "Mail";
          public static final String XML_SUBJECT = "Subject";
          public static final String XML_ADDRESS = "Address";
          public static final String XML_CONTENT = "Content";
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 154
        line_end: 165
        excerpt: |
          private static Mail fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_MAIL)) {
              Element child;
              Mail mail = new Mail();
              mail.address = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ADDRESS, false), false);
              mail.subject = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_SUBJECT, false), false);
              mail.content = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_CONTENT, false), false);
              return mail;
            }
            throw new XMLDocumentException(XML_MAIL + " element expected.");
          }
    stack_metadata:
      db.object: "none (XML message, DTD 'OPC Mail 1.0')"

  - record_key: NOTIF-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send each e-mail as an HTML message to the recipient address(es)
      in the request, with the request's subject, the request's content as the body
      unchanged, the current date/time as the sent date, and the sender address taken
      from the mail server configuration rather than from the request.
    plain_text: >
      E-mails go out as HTML, to the address given, with the given subject and body
      exactly as supplied. The "from" address is set centrally for the whole system,
      not per e-mail.
    technical_note: >
      MailHelper.createAndSendMail builds a MimeMessage from the container mail session
      (java:comp/env/mail/MailSession), calls setFrom() with no argument (uses the
      session's mail.from property), parses the To list with InternetAddress.parse(addr,
      false) (non-strict, comma-separated list allowed), sets content type text/html,
      header X-Mailer: JavaMailer and sentDate=now, then Transport.send. The mailer
      performs no formatting or templating; MailerMDB's comment says content is assumed
      already formatted.
    confidence: medium
    confidence_basis: >
      One clear implementation in MailHelper, corroborated for the "no formatting"
      part by the MailerMDB comment. The actual from-address value lives in server
      configuration not present in this shard.
    risk_class: operational
    basis: >
      Explicit message construction in MailHelper; resource-ref for the mail session in
      ejb-jar.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 70
        line_end: 85
        excerpt: |
          public void createAndSendMail(String emailAddress, String subject, String mailContent, Locale locale) throws MailerAppException {
              try {
                  InitialContext ic = new InitialContext();
                  Session session = (Session) ic.lookup(JNDINames.MAIL_SESSION);
              Message msg = new MimeMessage(session);
                  msg.setFrom();
                  msg.setRecipients(Message.RecipientType.TO,
                           InternetAddress.parse(emailAddress, false));
                  msg.setSubject(subject);
                  String contentType = "text/html";
                      StringBuffer sb = new StringBuffer(mailContent);
                    msg.setDataHandler(new DataHandler(
                                        new ByteArrayDataSource(sb.toString(), contentType)));
                  msg.setHeader("X-Mailer", "JavaMailer");
                  msg.setSentDate(new Date());
                  Transport.send(msg);
