  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0003]
    severity: low
    category: other
    title: Malformed or non-text requests may be redelivered repeatedly
    description: >
      A request that fails parsing raises an error that rolls back its receipt, and a
      non-text message raises an uncaught cast error with the same effect. Unless the
      queue provider limits redelivery, the same bad request is retried indefinitely.
      The provider's redelivery settings are not in this shard.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 79
        line_end: 90
  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0004]
    severity: low
    category: error-swallowed
    title: Encoding failure leaves an empty e-mail body path
    description: >
      If UTF-8 conversion fails, the error is swallowed and the data stays null; the
      send later fails with "no data", which is itself swallowed (see the first
      defect). Practically unreachable since UTF-8 is always available.
