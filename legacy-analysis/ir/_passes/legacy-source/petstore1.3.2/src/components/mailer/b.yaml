  - record_key: NOTIF-RULE-0003
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN an e-mail request that is not a well-formed, valid mail document WHEN it is
      received THEN the system SHALL reject processing of that request with an error
      and SHALL NOT send any e-mail for it.
    plain_text: >
      A malformed e-mail request is refused with an error and no e-mail goes out.
    technical_note: >
      Mail.fromXML logs the root cause to System.err and rethrows XMLDocumentException;
      MailerMDB converts it (and JMSException) to EJBException, which under the
      Required container transaction rolls back receipt of the JMS message. What the
      JMS provider then does (redelivery count, dead-letter) is provider configuration
      not present in the shard.
    confidence: medium
    confidence_basis: >
      One clear code path; the downstream consequence (redelivery vs discard) cannot
      be seen from this shard.
    risk_class: operational
    basis: >
      Explicit rethrow of parse failures as EJBException in onMessage.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 86
        line_end: 90
