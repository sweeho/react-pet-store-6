  - record_key: NOTIF-RULE-0002
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN a well-formed e-mail request WHEN the mail server cannot be reached or
      rejects the message THEN the system SHALL discard the e-mail without retrying,
      SHALL write the error only to the server's error output, and SHALL treat the
      request as processed.
    plain_text: >
      If an e-mail cannot be sent (for example the mail server is down or not set up),
      it is silently dropped. Nobody is told and it is never retried.
    technical_note: >
      MailHelper catches every Exception, prints to System.err and throws
      MailerAppException; MailerMDB.onMessage catches MailerAppException and does
      nothing (the rethrow is commented out, "ignore since user probably forgot to set
      up mail server"), so the container transaction commits and the JMS message is
      consumed.
    confidence: medium
    confidence_basis: >
      Behaviour is clear in two cooperating spots (catch-all in MailHelper, empty
      catch in MailerMDB) but it is one code path; whether a business owner intended
      it beyond the demo setup is only stated in a code comment.
    risk_class: operational
    basis: >
      Empty catch block with explanatory comment; commented-out EJBException rethrow.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
