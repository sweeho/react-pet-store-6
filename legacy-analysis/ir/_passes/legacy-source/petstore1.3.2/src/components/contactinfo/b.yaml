  - record_key: CUST-REQ-0002
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL provide a read-only snapshot of a contact-information record
      containing its given name, family name, telephone, e-mail and a snapshot of its
      postal address.
    plain_text: >
      Anyone who needs to show or pass on a person's contact details gets a copy of
      the name, phone, e-mail and address, not the stored record itself.
    technical_note: >
      ContactInfoEJB.getData() builds a ContactInfo value object, mapping telephone ->
      phone and calling getAddress().getData() for the address. Used by
      CustomerEJBAction (profile) and PurchaseOrderEJB.getData().
    confidence: medium
    confidence_basis: >
      One clear place in code; callers exist but were only seen by grep, not read in
