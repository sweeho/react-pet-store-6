  - record_key: CUST-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a contact-information record is deleted, THEN the system SHALL delete the
      postal address that belongs to it in the same transaction.
    plain_text: >
      Removing someone's contact details also removes their postal address; the
      address is not kept on its own.
    technical_note: >
      The AddressEJB role of the ContactInfo-Address relation carries <cascade-delete/>
      in ejb-jar.xml, and remove() on ContactInfoEJB runs with trans-attribute
      Required. ejbRemove() in the bean body is empty, so the container is the only
      enforcer.
    confidence: medium
    confidence_basis: >
      One declarative statement (cascade-delete in the descriptor). No code path in
      this module removes a contact-information record, so whether deletion ever
      happens at runtime was not established here.
    risk_class: operational
    basis: >
      The cascade-delete element is declared on the Address side of the one-to-one
      relation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 139
        line_end: 146
        excerpt: |
          <ejb-relationship-role>
            <ejb-relationship-role-name>AddressEJB</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <cascade-delete />
            <relationship-role-source>
              <ejb-name>AddressEJB</ejb-name>
            </relationship-role-source>
          </ejb-relationship-role>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 393
        line_end: 401
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ContactInfoEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>remove</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.transaction: Required
      ejb.cascade_delete: AddressEJB

  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      GIVEN a contact-information record is created without any details,
      WHEN it is created,
      THEN the system SHALL create a new empty postal address and attach it to the
      record, leaving names, telephone and e-mail unset; and IF the address cannot be
      created THEN the creation of the contact-information record SHALL fail.
    plain_text: >
      When a new customer account is opened, it starts with an empty set of contact
      details that already has an empty postal address attached, ready to be filled in
      later. If the empty address cannot be set up, the contact details are not
      created either.
    technical_note: >
      ContactInfoLocalHome.create() -> ContactInfoEJB.ejbCreate() returns null and sets
      no fields; ejbPostCreate() looks up AddressLocalHome via ServiceLocator
      (java:comp/env/ejb/Address), calls adh.create() and setAddress(). A
      ServiceLocatorException becomes a CreateException. The caller is
      AccountEJB.ejbPostCreate(String status) in the customer component, which calls
      cih.create() for every new account.
    confidence: high
    confidence_basis: >
      The behaviour is in the bean code and is confirmed by a real caller (the account
      bean) that uses exactly this create path. Whether the address bean's no-argument
      create sets any default values was not read (address is another shard).
    risk_class: operational
    basis: >
      No-arg ejbCreate/ejbPostCreate pair in ContactInfoEJB; account creation invokes it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 77
        line_end: 91
        excerpt: |
          public Object ejbCreate () throws CreateException {
            return null;
          }

          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 84
        line_end: 86
        excerpt: |
          ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
          ContactInfoLocal contactInfo = cih.create();
          setContactInfo(contactInfo);
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.transaction: Required
      jndi: java:comp/env/ejb/Address

  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout
    requirement: >
      WHEN a contact-information record is created from a supplied set of contact
      details, THEN the system SHALL copy the given name, family name, telephone and
      e-mail as supplied, without validation or transformation, and SHALL create a new
      postal address from the supplied address details and attach it; IF the address
      cannot be created THEN the creation SHALL fail.
    plain_text: >
      When an order is placed, the shipping contact details given with the order are
      saved exactly as entered, including a new copy of the address. Nothing is
      checked or reformatted at this point.
    technical_note: >
      ContactInfoLocalHome.create(ContactInfo) -> ejbCreate(ContactInfo) copies the
      four strings (phone -> telephone); ejbPostCreate(ContactInfo) calls
      AddressLocalHome.create(contactInfo.getAddress()). Callers:
      PurchaseOrderEJB.ejbPostCreate (shipping info of a purchase order) and
      SupplierOrderEJB.ejbPostCreate (shipping info of a supplier order). Filed under
      checkout because its business use is order shipping details; it is equally used
      by order-fulfillment for supplier orders.
    confidence: high
    confidence_basis: >
      Bean code plus two independent callers that use this create path. The absence of
      validation is read directly: the setters are plain assignments and the
      descriptor declares no validator.
    risk_class: operational
    basis: >
      ejbCreate(ContactInfo)/ejbPostCreate(ContactInfo) in ContactInfoEJB; used by the
      purchase-order and supplier-order beans for shipping info.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 127
        excerpt: |
          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 215
        line_end: 219
        excerpt: |
          ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
              serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
          ContactInfoLocal cinfoloc = (ContactInfoLocal)
              cinforef.create(purchaseOrder.getShippingInfo());
          setContactInfo(cinfoloc);
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 166
        line_end: 170
        excerpt: |
          ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
              serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
          ContactInfoLocal cinfoloc = (ContactInfoLocal)
                          cinforef.create(supplierOrder.getShippingInfo());
          setContactInfo(cinfoloc);
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.transaction: Required

