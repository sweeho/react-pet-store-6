  - record_key: FUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN contact details are received in an order document, THEN the system SHALL
      require the elements in the fixed order family name, given name, address,
      e-mail, phone; SHALL reject the document if any of these elements is missing or
      out of order, or if the family name, given name or phone is empty; and SHALL
      accept an empty e-mail.
    plain_text: >
      Contact details exchanged between the store, the order-processing centre and
      suppliers must list last name, first name, address, e-mail and phone in that
      order. Last name, first name and phone must have a value; e-mail may be blank.
    technical_note: >
      ContactInfo.fromDOM() walks children with XMLDocumentUtils.getFirstChild /
      getNextSibling with optional=false, so a missing or misplaced element throws
      XMLDocumentException. getContentAsString(child, false) throws on empty content
      for FamilyName, GivenName and Phone; Email uses getContentAsString(child, true
      /*false*/), i.e. empty allowed. The DTD (ContactInfo 1.1) states the same
      element sequence. Used for shippingInfo/billingInfo in PurchaseOrder XML and
      shippingInfo in SupplierOrder XML.
    confidence: high
    confidence_basis: >
      Element order is stated in both the DTD and the parser. The required-content
      rule for names and phone, and the optional e-mail, are read from one place (the
      parser) but the helper semantics were verified in XMLDocumentUtils.getContent.
    risk_class: operational
    basis: >
      fromDOM parser plus DTD element declaration; XMLDocumentUtils.getContent throws
      "content expected" when optional is false and content is empty.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 143
        line_end: 161
        excerpt: |
          public static ContactInfo fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CONTACTINFO)) {
              Element child;
              ContactInfo contactInfo = new ContactInfo();
              child = XMLDocumentUtils.getFirstChild(element, XML_FAMILY_NAME, false);
              contactInfo.familyName = XMLDocumentUtils.getContentAsString(child, false);
              child = child = XMLDocumentUtils.getNextSibling(child, XML_GIVEN_NAME, false);
              contactInfo.givenName = XMLDocumentUtils.getContentAsString(child, false);
              child =  XMLDocumentUtils.getNextSibling(child, Address.XML_ADDRESS, false);
              contactInfo.address = Address.fromDOM(child);
              child = XMLDocumentUtils.getNextSibling(child, XML_EMAIL, false);
              contactInfo.email = XMLDocumentUtils.getContentAsString(child, true /*false*/);
              child = XMLDocumentUtils.getNextSibling(child, XML_PHONE, false);
              contactInfo.phone = XMLDocumentUtils.getContentAsString(child, false);
              return contactInfo;
            }
            throw new XMLDocumentException(XML_CONTACTINFO + " element expected.");
          }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT ContactInfo (FamilyName, GivenName, Address, Email, Phone)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 162
        line_end: 164
        excerpt: |
          if (!optional && buffer.length() == 0) {
            throw new XMLDocumentException(element.getTagName() + " element: content expected.");
          }
    stack_metadata:
      xml.dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD ContactInfo 1.1//EN"
      xml.root: ContactInfo

  - record_key: FUL-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN contact details are written into an order document, THEN the system SHALL
      emit family name, given name, address, e-mail and phone in that order, and SHALL
      write any missing name, e-mail or phone value as an empty element rather than
      omitting it.
    plain_text: >
      When the store sends contact details on to order processing or a supplier, all
      five parts are always present in the same order; a missing value is sent as
      blank.
    technical_note: >
      ContactInfo.toDOM() appends FamilyName, GivenName, address.toDOM(), Email, Phone.
      XMLDocumentUtils.appendChild substitutes "" for a null value.
    confidence: medium
    confidence_basis: >
      One place for the order (toDOM) and one helper for the null-to-empty
      substitution. Note that a blank family name, given name or phone written this
      way would be rejected by the reader (FUL-BR-0001); no test confirms the round
      trip.
    risk_class: operational
    basis: >
      toDOM in ContactInfo and appendChild in XMLDocumentUtils.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 133
        line_end: 141
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CONTACTINFO);
            XMLDocumentUtils.appendChild(document, root, XML_FAMILY_NAME, familyName);
            XMLDocumentUtils.appendChild(document, root, XML_GIVEN_NAME, givenName);
            root.appendChild(address.toDOM(document));
            XMLDocumentUtils.appendChild(document, root, XML_EMAIL, email);
            XMLDocumentUtils.appendChild(document, root, XML_PHONE, phone);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 297
        line_end: 302
        excerpt: |
          public static void appendChild(Document document, Node root, String name, String value) {
                Node node = document.createElement(name);
                node.appendChild(document.createTextNode(value != null ? value : ""));
                root.appendChild(node);
                return;
          }
    stack_metadata:
      xml.root: ContactInfo

  - record_key: SIGN-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT restrict reading, creating, changing or deleting
      contact-information records by user role at the storage level; any access
      control over contact details SHALL be applied by the calling feature.
    plain_text: >
      Contact details themselves carry no "who may see or change this" rule; it is up
      to the screen or process that uses them (for example, only the signed-in
      customer's own profile) to decide.
    technical_note: >
      ejb-jar.xml lists every ContactInfoEJB local and local-home method under
      <method-permission><unchecked/>, and the security-identity is
      use-caller-identity. The bean is local-only (no remote interface). Filed under
      sign-on as the closest capability for an access-control rule.
    confidence: medium
    confidence_basis: >
      Declared in one place (the descriptor). The calling features' own checks are in
      other shards and were not read here.
    risk_class: regulated
    basis: >
      Unchecked method-permission covering all ContactInfoEJB methods; contact details
      are personal data, hence risk class regulated.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 149
        line_end: 159
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>ContactInfoEJB</ejb-name>
                <method-intf>Local</method-intf>
                <method-name>setFamilyName</method-name>
                <method-params>
                  <method-param>java.lang.String</method-param>
                </method-params>
              </method>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 80
        line_end: 83
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.method_permission: unchecked
      ejb.interfaces: local only

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      AddressEJB is declared in this descriptor (lines 85-124) with container
      transactions but no method-permission entry, unlike ContactInfoEJB. Whether the
      container then treats Address methods as unchecked or denied depends on the
      application server defaults; the address component's own descriptor (another
      shard) may also declare it. A human should confirm which deployment of AddressEJB
      is live.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
    description: >
      No field-level validation (required names, e-mail format, phone format, lengths)
      exists in this module for stored contact details. Any such rules, if they exist,
      live in the web tier forms of the petstore application (another shard). The
      rebuild should not assume validation from this module.
  - kind: ambiguity
    path: legacy-analysis/sources
    description: >
      No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no
      document traces could be cited for this module.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [FUL-BR-0001, FUL-BR-0002]
    severity: low
    category: other
    title: E-mail is optional on read while names and phone are required, by a commented-out edit
    description: >
      The reader accepts an empty e-mail but rejects an empty family name, given name
      or phone. The e-mail flag was changed in place (`true /*false*/`) with no
      explanation, and the writer substitutes blanks for any missing value, so a
      record with a missing name or phone can be written but not read back.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
