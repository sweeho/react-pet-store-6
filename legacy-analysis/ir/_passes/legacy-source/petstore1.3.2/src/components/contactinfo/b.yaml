records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL hold a contact-information record consisting of a given name,
      a family name, a telephone number, an e-mail address, and exactly one postal
      address, where each address belongs to exactly one contact-information record.
    plain_text: >
      A set of contact details is a person's first name, last name, phone number,
      e-mail address and one postal address. An address is never shared between two
      sets of contact details.
    technical_note: >
      ContactInfoEJB is a CMP 2.x entity bean with cmp-fields telephone, familyName,
      email, givenName and a one-to-one CMR "address" to AddressEJB (ejb-jar.xml).
      The abstract accessors in ContactInfoEJB.java mirror the descriptor. The same
      shape appears in the interchange DTD (ContactInfo.dtd). No length, format or
      not-null constraints are declared anywhere in this module.
    confidence: high
    confidence_basis: >
      The field set and the one-to-one relationship are stated in three independent
      places: the deployment descriptor, the bean's abstract accessors, and the DTD.
      Nothing in this module states field lengths or formats, so the record makes no
      claim about them.
    risk_class: operational
    basis: >
      ejb-jar.xml declares four cmp-fields and a One-to-One ejb-relation to AddressEJB;
      ContactInfoEJB.java declares the matching abstract getters/setters; the DTD
      declares ContactInfo as (FamilyName, GivenName, Address, Email, Phone).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 57
        line_end: 72
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>telephone</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>familyName</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>email</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>givenName</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 127
        line_end: 147
        excerpt: |
          <ejb-relation>
            <ejb-relation-name></ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>ContactInfoEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              ...
              <cmr-field>
                <cmr-field-name>address</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>AddressEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 59
        line_end: 73
        excerpt: |
          public abstract String getFamilyName();
          public abstract void setFamilyName(String familyName);
          public abstract String getGivenName();
          public abstract void setGivenName(String givenName);
          public abstract String getTelephone();
          public abstract void setTelephone(String telephone);
          public abstract String getEmail();
          public abstract void setEmail(String email);
          // CMR fields
          public abstract AddressLocal getAddress();
          public abstract void setAddress(AddressLocal address);
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 38
