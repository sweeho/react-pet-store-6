records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL record a contact as a family name, a given name, a telephone number
      and an e-mail address, each held as free text, together with exactly one postal
      address belonging to that contact.
    plain_text: >
      A contact is a person's surname, first name, phone number and e-mail address, plus
      one postal address. None of the text values has a stated format or length.
    technical_note: >
      ContactInfoEJB is a CMP 2.x entity bean with four String cmp-fields (telephone,
      familyName, email, givenName) declared in the component ejb-jar.xml and mirrored by
      abstract accessors in ContactInfoEJB.java. The address is a container-managed
      one-to-one relationship (cmr-field "address") to AddressEJB. ContactInfo.java is the
      matching value object (it names the phone field "phone" while the bean names it
      "telephone"). The entity is shared by the customer account, the purchase order and the
      supplier order; it is filed under customer-account, which lists contact/address
      details explicitly.
    confidence: high
    confidence_basis: >
      The fields and the one-to-one address link are stated in two independent places: the
      deployment descriptor (cmp-field list and ejb-relation with multiplicity One/One) and
      the bean's abstract accessors. No DDL is present in this shard, so column lengths and
      nullability cannot be seen.
    risk_class: regulated
    basis: >
      The descriptor declares exactly four persistent String fields and a One-to-One
      relationship to AddressEJB through the cmr-field "address"; the bean exposes a getter
      and setter for each. The data is personal contact data (name, phone, e-mail, address),
      hence regulated.
