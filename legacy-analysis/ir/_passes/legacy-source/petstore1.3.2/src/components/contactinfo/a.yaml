  - record_key: CUST-REQ-0004
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL read and change contact details only inside a transaction, joining
      the caller's transaction when one exists, and SHALL place no role restriction of its own
      on who may read or change them.
    plain_text: >
      Changes to a person's contact details are saved together with whatever else the same
      action changes, or not at all. The contact record itself does not check who is asking;
      any access control has to happen before it is reached.
    technical_note: >
      ejb-jar.xml assembly-descriptor: a single <method-permission> with <unchecked/> covers
      every ContactInfoEJB and AddressEJB method, and every <container-transaction> (29 of
      them) uses trans-attribute Required. The bean exposes only a local interface, so it is
      reachable only from components in the same application.
    confidence: medium
    confidence_basis: >
      One clear declarative source (the deployment descriptor), consistent across all listed
      methods. Whether the application-level descriptor overrides these at assembly time is
      not visible in this shard.
    risk_class: regulated
    basis: >
      unchecked method-permission and uniform Required transaction attributes in the
      component deployment descriptor; local-only interfaces.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 149
        line_end: 156
        excerpt: |
            <assembly-descriptor>
              <method-permission>
                <unchecked />
                <method>
                  <ejb-name>ContactInfoEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>setFamilyName</method-name>
                  <method-params>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 302
