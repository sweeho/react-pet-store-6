  - record_key: CUST-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL delete a contact's postal address when the contact itself is deleted.
    plain_text: >
      Removing a person's contact details also removes their postal address; an address
      never outlives the contact it belongs to.
    technical_note: >
      The ContactInfoEJB/AddressEJB ejb-relation declares <cascade-delete/> on the AddressEJB
      role, so the container removes the AddressEJB when its ContactInfoEJB is removed.
      ejbRemove() in the bean is empty; the rule is purely declarative.
    confidence: medium
    confidence_basis: >
      One clear declarative source (the cascade-delete element). The bean code adds nothing,
      and no caller of remove() was examined in this shard, so whether contacts are ever
      deleted in practice is not visible here.
    risk_class: operational
    basis: >
      cascade-delete on the Address side of a One-to-One relationship whose other side is
      ContactInfoEJB.
    traces:
