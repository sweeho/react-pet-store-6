      ejb.local_ref: ejb/Address -> AddressEJB

  - record_key: CHK-BR-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL require, when contact details are received as an XML document, the
      elements family name, given name, address, e-mail and phone in that order, and SHALL
      reject the document if the family name, given name or phone is empty; the e-mail value
      MAY be empty.
      GIVEN an incoming contact record with an empty e-mail WHEN it is read THEN it SHALL be
      accepted with an empty e-mail.
      GIVEN an incoming contact record with an empty phone WHEN it is read THEN it SHALL be
      rejected with "Phone element: content expected."
    plain_text: >
      When contact details arrive in an order document, surname, first name and phone number
      must be filled in, otherwise the document is rejected. The e-mail address may be left
      blank. The fields must appear in a fixed order.
    technical_note: >
      ContactInfo.fromDOM reads children with XMLDocumentUtils.getFirstChild/getNextSibling
      (non-optional) and getContentAsString(child, optional). optional=false for FamilyName,
      GivenName and Phone, which throws XMLDocumentException "<tag> element: content
      expected." on empty content; Email is read with `true /*false*/`, i.e. it was
      deliberately changed from mandatory to optional. ContactInfo.dtd fixes the element
      order (FamilyName, GivenName, Address, Email, Phone) but, being #PCDATA, does not itself
      require non-empty content. The XML form is how contact details travel inside purchase
      order / supplier order documents, so this is filed under checkout (order submission);
      customer-account is the other consumer of ContactInfo but does not go through XML.
    confidence: medium
    confidence_basis: >
      The element order is stated twice (DTD and fromDOM sequence), but the non-empty rule
      and the optional e-mail are in one place only (fromDOM's optional flags, confirmed by
      reading XMLDocumentUtils.getContent). Which order flows actually parse this XML was
      not traced from this shard.
    risk_class: operational
    basis: >
      fromDOM's optional flags plus XMLDocumentUtils.getContent throwing on empty
      non-optional content, and the DTD content model.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 143
        line_end: 161
        excerpt: |
            public static ContactInfo fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CONTACTINFO)) {
                Element child;
                ContactInfo contactInfo = new ContactInfo();
                child = XMLDocumentUtils.getFirstChild(element, XML_FAMILY_NAME, false);
                contactInfo.familyName = XMLDocumentUtils.getContentAsString(child, false);
                child = child = XMLDocumentUtils.getNextSibling(child, XML_GIVEN_NAME, false);
                contactInfo.givenName = XMLDocumentUtils.getContentAsString(child, false);
                child =  XMLDocumentUtils.getNextSibling(child, Address.XML_ADDRESS, false);
                contactInfo.address = Address.fromDOM(child);
                child = XMLDocumentUtils.getNextSibling(child, XML_EMAIL, false);
                contactInfo.email = XMLDocumentUtils.getContentAsString(child, true /*false*/);
                child = XMLDocumentUtils.getNextSibling(child, XML_PHONE, false);
                contactInfo.phone = XMLDocumentUtils.getContentAsString(child, false);
                return contactInfo;
              }
              throw new XMLDocumentException(XML_CONTACTINFO + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 38
        line_end: 42
        excerpt: |
          <!ELEMENT ContactInfo (FamilyName, GivenName, Address, Email, Phone)>
          <!ELEMENT FamilyName (#PCDATA)>
          <!ELEMENT GivenName (#PCDATA)>
          <!ELEMENT Email (#PCDATA)>
          <!ELEMENT Phone (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 162
        line_end: 170
        excerpt: |2
                  if (!optional && buffer.length() == 0) {
                throw new XMLDocumentException(element.getTagName() + " element: content expected.");
                  }
                  return buffer.toString();
            }
  
            public static String getContentAsString(Element element, boolean optional) throws XMLDocumentException {
                  return getContent(element, optional);
            }
