findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
    description: >
      No format, length or presence validation exists for e-mail or telephone anywhere in
      this component (the entity accepts any String, including null). Whether the web tier
      or the customer component validates them was not visible from this shard. A human
      needs to decide whether the rebuild should introduce e-mail/phone format rules or keep
      them as free text.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      The primary key is container-generated (prim-key-class java.lang.Object, ejbCreate
      returns null) and there is no finder other than findByPrimaryKey, so a contact cannot
      be looked up by name, e-mail or phone and nothing prevents two identical contacts. No
      uniqueness rule on e-mail exists in this component; whether one is wanted is a
      business decision.

suspected_defects:
  - capability_key: customer-account
    record_keys: [CUST-BR-0003]
    severity: low
    category: other
    title: A contact can be created with no address, and then fails when it is read back
    description: >
      The variant that builds a contact from separate fields stores whatever address object
      it is given, including none. Reading that contact back (getData) and converting a
      contact to XML or text all dereference the address unconditionally, so a contact
      created without an address fails on every later read instead of at creation time.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 103
        line_end: 107
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 137
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 133
        line_end: 169
  - capability_key: checkout
    record_keys: [CHK-BR-0001]
    severity: low
    category: other
    title: E-mail was made optional on incoming documents by an in-line edit with no stated reason
    description: >
      Every other contact field read from an incoming document is mandatory; e-mail is read
      as optional, and the original mandatory flag is left commented out beside it. The
      outgoing side always writes an e-mail element. Customers whose orders arrive with a
      blank e-mail cannot receive the order notification e-mails, and nothing records whether
      that was intended.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 155
        line_end: 155
