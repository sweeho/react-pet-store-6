  - record_key: CUST-BR-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL create a new postal address for a contact whenever a contact is
      created empty or from a complete set of contact details, and SHALL refuse to create the
      contact if the address cannot be created.
      GIVEN a contact is created with no details WHEN it is stored THEN it SHALL receive a new
      blank address.
      GIVEN a contact is created from a complete contact record WHEN it is stored THEN it
      SHALL receive a new address copied from that record's address.
      GIVEN a contact is created from separate name, phone, e-mail and an existing address
      WHEN it is stored THEN it SHALL be linked to that existing address rather than a copy.
    plain_text: >
      Every new contact gets its own address. A blank contact gets a blank address; a contact
      copied from submitted details gets a fresh copy of the submitted address; a contact
      built from individual fields is linked to the address handed in. If the address cannot
      be set up, the contact is not created.
    technical_note: >
      ContactInfoLocalHome declares three create() variants. ejbPostCreate() and
      ejbPostCreate(ContactInfo) look up AddressLocalHome via ServiceLocator
      (java:comp/env/ejb/Address) and call create()/create(Address); a
      ServiceLocatorException becomes a CreateException. The five-argument variant just calls
      setAddress(address) with the caller's AddressLocal, which may be null (see suspected
      defects).
    confidence: medium
    confidence_basis: >
      Read directly from one class (the bean's create/post-create methods) plus the home
      interface that exposes them. No test or second enforcement point exists in this shard,
      and which create variant each caller uses was not traced here.
    risk_class: operational
    basis: >
      The three ejbPostCreate methods: two create an Address through the Address home, one
      assigns the supplied address; lookup failure throws CreateException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 81
        line_end: 127
        excerpt: |
            public void ejbPostCreate () throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                AddressLocalHome adh = (AddressLocalHome)
                    serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
                AddressLocal address = adh.create();
                setAddress(address);
              } catch (ServiceLocatorException ne) {
                throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
              }
            }

            public Object ejbCreate(String givenName, String familyName,
                                    String telephone, String email, AddressLocal address)
                                    throws CreateException {
              setGivenName(givenName);
              setFamilyName(familyName);
              setTelephone(telephone);
              setEmail(email);
              return null;
            }

            public void ejbPostCreate(String givenName, String familyName,
                                      String telephone, String email,
                                      AddressLocal address) throws CreateException {
              setAddress(address);
            }

            public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
              setGivenName(contactInfo.getGivenName());
              setFamilyName(contactInfo.getFamilyName());
              setTelephone(contactInfo.getPhone());
              setEmail(contactInfo.getEmail());
              return null;
            }

            public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                AddressLocalHome adh = (AddressLocalHome)
                    serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
                AddressLocal address = adh.create(contactInfo.getAddress());
                setAddress(address);
              } catch (ServiceLocatorException ne) {
                throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 47
        line_end: 52
        excerpt: |
