  - record_key: CHK-INT-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL exchange card details in order documents as a CreditCard
      element containing, in this order, CardNumber, CardType and ExpiryDate, each as
      plain text; and SHALL reject a document node that is not a CreditCard element.
    plain_text: >
      When an order is passed between parts of the system, the card travels as a small
      structured record with number, type and expiry date in a fixed order.
    technical_note: >
      CreditCard.toDOM writes the three children in number/type/expiry order; fromDOM
      reads them in the same order and throws XMLDocumentException("CreditCard element
      expected.") otherwise. CreditCard.dtd (public id "-//Sun Microsystems, Inc. -
      J2EE Blueprints Group//DTD CreditCard 1.1//EN") declares the same sequence. Used
      inside the purchase-order document (outside this shard).
    confidence: high
    confidence_basis: >
      The DTD, the serializer and the deserializer agree on element names and order.
    risk_class: regulated
    basis: >
      DTD element declaration plus toDOM/fromDOM.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 130
        excerpt: |2
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_CREDITCARD);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
              XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
              return root;
            }

            public static CreditCard fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
                Element child;
                CreditCard creditCard = new CreditCard();
                child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
                creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_CARD_TYPE, false);
                creditCard.cardType = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_EXPIRYDATE, false);
                creditCard.expiryDate = XMLDocumentUtils.getContentAsString(child, false);
                return creditCard;
              }
              throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
            }
    stack_metadata:
      framework: J2EE 1.3 XML (DOM)
      xml.dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN"

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
    description: >
      fromDOM passes required=false to XMLDocumentUtils for every child, which
      suggests a CreditCard element missing CardNumber/CardType/ExpiryDate is accepted
      with empty values despite the DTD requiring all three. The actual behaviour of
      XMLDocumentUtils (and whether documents are DTD-validated before parsing) lives
      in the xmldocuments component, outside this shard; a human should confirm
      whether incomplete card data in an order document is accepted.

suspected_defects:
  - capability_key: customer-account
    record_keys: [CUST-BR-0002]
    severity: medium
    category: other
    title: Missing or malformed expiry date is reported as January 2010
    description: >
      When the stored expiry date is empty or has no slash, the month and year
      accessors silently return "01" and "2010" rather than signalling that the expiry
      is unknown, while the whole-date accessor still returns the raw value. A card
      with no valid expiry can therefore appear to have a real expiry date.
    traces:
