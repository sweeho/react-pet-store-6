  - record_key: CUST-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL store a card's expiry date as a single "month/year" text value
      and SHALL derive the expiry month as the text before the first "/" and the expiry
      year as the text after the first "/".
    plain_text: >
      A card's expiry date is kept as "month/year" (for example 05/2004); the month and
      year shown separately are read from either side of the slash.
    technical_note: >
      CreditCardEJB.getExpiryMonth / getExpiryYear split the expiryDate CMP field on
      indexOf("/"). No check is made that either part is numeric, that the month is
      1-12, or of the year's length. The concrete "MM/YYYY" shape is implied by the
      split and by the month/year select boxes on the customer pages (outside shard).
    confidence: medium
    confidence_basis: >
      One clear implementation in the bean; the expected format is never stated or
      validated anywhere in this module, so the "MM/YYYY" shape is inferred.
    risk_class: financial
    basis: >
      Substring before/after the first slash in getExpiryMonth and getExpiryYear.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |2
            public String getExpiryMonth() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text before it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(0,slashStart);
              }
              return "01";
            }

            public String getExpiryYear() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text after it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());

              }
              return "2010";
            }
    stack_metadata:
      ejb.bean: CreditCardEJB

  - record_key: CUST-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a stored card whose expiry date is empty or contains no "/"
      WHEN its expiry month and year are requested
      THEN the system SHALL report month "01" and year "2010".
    plain_text: >
      If a card's expiry date is missing or not in month/year form, the system shows
      January 2010 as its expiry instead of flagging it.
    technical_note: >
      Hard-coded fallback literals "01" and "2010" in CreditCardEJB.getExpiryMonth and
      getExpiryYear. getExpiryDate itself still returns the raw (null/malformed) value,
      so callers using the whole date and callers using the parts see different data.
    confidence: low
    confidence_basis: >
      Bare literals with no comment, configuration or test explaining them; whether
      any screen actually displays the fallback depends on callers outside this shard.
    risk_class: financial
    basis: >
      The final return statements of getExpiryMonth ("01") and getExpiryYear ("2010").
    traces:
