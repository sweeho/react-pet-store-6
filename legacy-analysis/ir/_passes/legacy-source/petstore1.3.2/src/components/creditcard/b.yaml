    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL hold, for a customer's payment card, exactly three attributes:
      card number, card type and expiry date, each stored as free text; a card record
      MAY be created with all three attributes empty and populated later.
    plain_text: >
      A customer's saved payment card consists of a card number, a card type (brand)
      and an expiry date. Nothing else about the card is kept.
    technical_note: >
      CreditCardEJB is a CMP 2.x entity with cmp-fields cardNumber, cardType,
      expiryDate (all java.lang.String). The primary key class is java.lang.Object
      (container-generated), so a card has no business key of its own; it is reached
      through its owner (customer account, outside this shard). Three creators exist:
      no-arg (all null), (number, type, expiry) and from a CreditCard value object.
    confidence: high
    confidence_basis: >
      The same three fields are declared in the deployment descriptor, in the bean's
      abstract accessors and in the XML DTD; all agree. Not graded on owner linkage,
      which lives outside this shard.
    risk_class: regulated
    basis: >
      ejb-jar.xml cmp-field list; CreditCardEJB abstract getters/setters and the three
      ejbCreate variants; CreditCardLocalHome create signatures.
