  - record_key: CUST-BR-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL store card number, card type and expiry date exactly as
      supplied, without validating card number format or check digit, card type
      against a list of accepted brands, or whether the expiry date is in the past.
    plain_text: >
      Card details are saved as typed. The system does not check that the number is a
      real card number, that the brand is one it accepts, or that the card has not
      expired.
    technical_note: >
      ejbCreate variants and the setters assign values straight to CMP fields; there
      is no validation code anywhere in the component and ejbCreate never throws
      CreateException. Any validation would have to live in the web tier (outside this
      shard); none is visible here. Discovery report notes "no validation rule found".
    confidence: medium
    confidence_basis: >
      Absence of validation is fully visible within this module (every write path
      read); whether a caller validates before calling is not visible in this shard.
    risk_class: regulated
    basis: >
      ejbCreate(String,String,String) and ejbCreate(CreditCard) are plain assignments.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 78
