records:
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout
    requirement: >
      The system SHALL record a payment card as three text values: a card number, a card
      type, and an expiry date, each of which may be set and read independently.
    plain_text: >
      A payment card is kept as its number, its type (for example the card brand) and its
      expiry date. All three are free text.
    technical_note: >
      CreditCardEJB is a CMP 2.x entity bean with three String cmp-fields (cardNumber,
      cardType, expiryDate) declared in the component ejb-jar.xml and mirrored by abstract
      accessors in CreditCardEJB.java. CreditCard.java is the matching plain value object.
      The same entity is used by both the purchase order (checkout) and the customer account
      (stored card details), so it is filed under checkout as the capability that captures
      the card; customer-account is the other consumer.
    confidence: high
    confidence_basis: >
      Two independent places agree on the three fields and their String type: the
      deployment descriptor's cmp-field list and the bean's abstract accessors (plus the
      value object). No database DDL is in this shard, so column lengths and nullability
      are not visible.
    risk_class: regulated
    basis: >
      The descriptor declares exactly three persistent fields, expiryDate, cardType and
      cardNumber, and the bean exposes a String getter and setter for each.
