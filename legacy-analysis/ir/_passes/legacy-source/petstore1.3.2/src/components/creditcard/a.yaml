  - record_key: CHK-BR-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL treat a card expiry date as text of the form "<month>/<year>",
      where the expiry month is the text before the first "/" and the expiry year is all
      text after that first "/".
    plain_text: >
      A card's expiry is written as month, a slash, then year (for example 10/2001). The
      month and year shown to the shopper are read by splitting at the first slash.
    technical_note: >
      CreditCardEJB.getExpiryMonth() returns expiryDate.substring(0, indexOf("/")) and
      getExpiryYear() returns the substring after the first "/". The format is not
      validated anywhere in this component; it is only assumed by these two accessors.
      Both are exposed on CreditCardLocal and declared Required in ejb-jar.xml.
    confidence: medium
    confidence_basis: >
      One clear place implements the split (the two accessor methods). No validator or
      schema in this shard states the format, and no padding rule (01 vs 1) or year length
      (2 vs 4 digits) is enforced, so only the slash split itself is certain.
    risk_class: operational
    basis: >
      The accessors locate the first slash and return the text before it as the month and
      the text after it as the year.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
            public String getExpiryMonth() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text before it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(0,slashStart);
              }
              return "01";
            }

            public String getExpiryYear() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text after it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());

              }
              return "2010";
            }
    stack_metadata:
      framework: ejb-2.0
      ejb.bean: CreditCardEJB
      ejb.transaction: Required

  - record_key: CHK-BR-0002
