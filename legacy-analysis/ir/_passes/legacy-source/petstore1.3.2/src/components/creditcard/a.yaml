  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout
    requirement: >
      The system SHALL accept and store a card number, card type and expiry date exactly as
      supplied, applying no format, card-number check-digit, card-type list or
      expiry-in-the-future check when the card is recorded or changed.
    plain_text: >
      When a card is saved, the system keeps whatever number, type and expiry it is given.
      It does not check that the number is valid, that the type is a known brand, or that
      the card has not expired.
    technical_note: >
      Every create path (ejbCreate(String,String,String), ejbCreate(CreditCard),
      ejbCreate()) and every setter assigns the value straight to the CMP field; none
      throws CreateException or checks content. The value object CreditCard.java likewise
      assigns without checks. Any validation would have to live in callers outside this
      shard.
    confidence: medium
    confidence_basis: >
      The absence of checks is clear in the one component that owns the data (bean and
      value object). Callers in other shards may validate before calling, which this pass
      cannot see, so the statement is about this component's own behaviour.
    risk_class: regulated
    basis: >
      The create methods copy the three arguments into the persistent fields and return
      without inspecting them.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
            public Object ejbCreate(String cardNumber, String cardType,
                                    String expiryDate) throws CreateException {
                                      setCardNumber(cardNumber);
                                      setCardType(cardType);
                                      setExpiryDate(expiryDate);
                                      return null;
            }
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 68
        line_end: 73
        excerpt: |
            public CreditCard(String cardNumber, String expiryDate, String cardType) {
              this.cardNumber = cardNumber;
              this.expiryDate = expiryDate;
              this.cardType = cardType;
              return;
            }
    stack_metadata:
      framework: ejb-2.0
      ejb.bean: CreditCardEJB

