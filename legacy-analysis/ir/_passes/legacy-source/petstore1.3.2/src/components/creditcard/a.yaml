  - record_key: CHK-INT-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL exchange a payment card as an XML element named "CreditCard"
      containing, in this order, a "CardNumber", a "CardType" and an "ExpiryDate" element,
      each holding text; and WHEN an element other than "CreditCard" is supplied as a card
      THEN the system SHALL reject it with the message "CreditCard element expected."
    plain_text: >
      When a card travels inside an order document, it is written as card number, then card
      type, then expiry date. Anything that is not a card element is refused.
    technical_note: >
      CreditCard.dtd (public id "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD
      CreditCard 1.1//EN") declares the content model. CreditCard.toDOM() writes the three
      children in DTD order; CreditCard.fromDOM() reads them with getFirstChild/getNextSibling
      in the same order and throws XMLDocumentException otherwise. Used when the purchase
      order is serialised to XML for the order-processing side.
    confidence: high
    confidence_basis: >
      Stated in two independent places that agree: the DTD content model and the
      serialise/deserialise code, which both fix the same element names and order.
    risk_class: financial
    basis: >
      The DTD makes all three child elements mandatory and ordered; the writer and reader
      follow that order, and the reader raises an error for a non-card element.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 130
        excerpt: |
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_CREDITCARD);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
              XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
              return root;
            }

            public static CreditCard fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
                Element child;
                CreditCard creditCard = new CreditCard();
                child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
                creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_CARD_TYPE, false);
                creditCard.cardType = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_EXPIRYDATE, false);
                creditCard.expiryDate = XMLDocumentUtils.getContentAsString(child, false);
                return creditCard;
              }
              throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
            }
    stack_metadata:
      framework: j2ee-1.3
      xml.dtd: CreditCard.dtd
      xml.dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN"

  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL apply no role-based restriction on reading, creating, changing or
      removing a stored payment card at the card-record level; any component that can reach
      the card store may perform every card operation under the caller's own identity.
    plain_text: >
      The card store itself does not check who is asking. Protection of card details depends
      entirely on the screens and services that use it.
    technical_note: >
      ejb-jar.xml grants <unchecked/> method-permission on method-name "*" for CreditCardEJB
      and sets <use-caller-identity/>. The bean exposes only a local interface, so access is
      limited to in-container callers, but no role is required. Filed under sign-on as the
      closest listed capability for access control; no capability covers data-level
      authorisation.
    confidence: medium
    confidence_basis: >
      One declarative place states it plainly (the deployment descriptor). Whether an
      application-assembly descriptor elsewhere overrides it is not visible in this shard.
    risk_class: regulated
    basis: >
      The assembly descriptor marks every method of the card bean as unchecked and runs it
      with the caller's identity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 69
        line_end: 82
        excerpt: |2
                <security-identity>
                  <description></description>
                  <use-caller-identity></use-caller-identity>
                </security-identity>
              </entity>
            </enterprise-beans>
            <assembly-descriptor>
              <method-permission>
                <unchecked />
                <method>
                  <ejb-name>CreditCardEJB</ejb-name>
                  <method-name>*</method-name>
                </method>
              </method-permission>
    stack_metadata:
      framework: ejb-2.0
      ejb.bean: CreditCardEJB
      ejb.method_permission: unchecked
      ejb.security_identity: use-caller-identity
      ejb.interfaces: local only

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
    description: >
      The card record has no business key: prim-key-class is java.lang.Object and every
      create method returns null, so identity is container-generated. Nothing in this shard
      prevents the same card number being stored many times (once per order and once per
      account is the visible pattern). A human should decide whether the rebuild needs a
      card identity or de-duplication rule; the physical table and key generation are not
      in this shard.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard
    description: >
      No extracted documents exist under legacy-analysis/sources/, so no document trace
      could be cited for this module. Card-related intent (accepted card types, expiry
      format, storage protection) has only code as evidence.

suspected_defects:
  - capability_key: checkout
    record_keys: [CHK-ENT-0001, CHK-BR-0001, CHK-BR-0002]
    severity: high
    category: data-corruption
    title: Card type and expiry date are swapped by callers of the card value object
    description: >
      The card value object's constructor takes (number, expiry date, type), while the
      persistent card's create takes (number, type, expiry date). The customer-details
      action passes (number, type, "month/year") and the order action passes
      ("1234-2334", "Duke Express", "10/2001") to the value-object constructor, so the type
      lands in the expiry field and the expiry lands in the type field. When such a card is
      later read, the type text (e.g. "Duke Express") contains no slash, so the expiry month
      and year silently come back as the 01/2010 fallback, and the card type shown is a
      date.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 68
        line_end: 73
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 63
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 175
        line_end: 178
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 82
        line_end: 82
  - capability_key: checkout
    record_keys: [CHK-BR-0002]
    severity: medium
    category: error-swallowed
    title: Missing or malformed expiry silently reported as January 2010
    description: >
      A card with no expiry date, or one without a slash, is reported as expiring in month
      01 of year 2010 rather than flagged. The year is a fixed past date, so any such card
      appears already expired, and the original malformed value is hidden from the reader.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
