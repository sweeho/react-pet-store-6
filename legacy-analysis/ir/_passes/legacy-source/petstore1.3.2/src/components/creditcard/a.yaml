      card, giving the order its own CreditCard entity row.
    confidence: medium
    confidence_basis: >
      The copy constructor is clear in this shard and one caller in the purchase order
      component is visible; the order-to-card relationship itself is declared in another
      shard, which this pass did not read in full.
