    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain catalog categories, each identified by a category id of at
      most 10 characters, with a name (required, at most 80 characters) and an optional
      description (at most 255 characters) held separately for each locale, at most one
      localized name/description per category per locale.
    plain_text: >
      The catalog is divided into categories (for example Fish, Dogs). Each category has a
      short code and, for every supported language, a name and an optional description.
    technical_note: >
      Tables category(catid) and category_details(catid, locale, name, image, descn) with
      PK (catid, locale) and FK to category. The Category model exposes only id, name and
      description; the image column in category_details is never read by this component.
    confidence: high
    confidence_basis: >
      The shape is enforced by DDL constraints (PK, NOT NULL, FK) and independently
      reflected in the Category model and the GET_CATEGORY/GET_CATEGORIES queries.
    risk_class: presentational
    basis: >
      DDL for category and category_details; Category model with id/name/description;
      queries join category to category_details on catid filtered by locale.
    traces:
