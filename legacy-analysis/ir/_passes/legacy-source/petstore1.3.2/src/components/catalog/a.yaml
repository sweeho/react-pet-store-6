  - record_key: CAT-ENT-0003
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain sellable items, each identified by an item id of at most 10
      characters and belonging to exactly one product, and SHALL hold per locale for each
      item a list price and a unit cost (each required, up to 10 digits with 2 decimals),
      an image location (required), a description (required, at most 255 characters) and up
      to five optional descriptive attributes (each at most 80 characters).
    plain_text: >
      An item is the thing a customer actually buys (for example "Large Angelfish"). It
      belongs to one product and, for each language, has a selling price, a cost price, a
      picture, a description and up to five extra descriptive attributes. Prices are kept
      per language/market, so the same item can be priced differently per locale.
    technical_note: >
      Tables item(itemid, productid FK) and item_details(itemid, locale, listprice
      decimal(10,2), unitcost decimal(10,2), image, descn, attr1..attr5) PK (itemid,
      locale). The Item model also carries the category id and product name joined from
      product/product_details. Item.getAttribute(n) returns attribute1 for any index
      outside 1..5. Item description defaults to "none" only if never assigned (the
      constructor always assigns it).
    confidence: high
    confidence_basis: >
      DDL NOT NULL/PK/FK constraints and the Item model plus item queries agree on the
      field set; per-locale pricing follows directly from the composite PK including
      locale.
    risk_class: financial
    basis: >
      item_details DDL; Item model fields listPrice/unitCost/attribute1..5/imageLocation;
      GET_ITEM selects listprice, unitcost from item_details filtered by locale.
    traces:
