  - record_key: CAT-BR-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL page every catalog list (categories, products, items, search
      results) by a zero-based start position and a page size, and SHALL report whether a
      next page exists (at least one more result after the page) and whether a previous
      page exists (start greater than zero). The next page SHALL start at start + number of
      results on the current page; the previous page SHALL start at max(start - number of
      results on the current page, 0). GIVEN a negative start or a start beyond the last
      result WHEN a page is requested THEN the system SHALL return an empty page.
    plain_text: >
      Long lists are shown a few entries at a time with Next and Previous links. Next is
      offered only when there are more entries; Previous only when not on the first page.
      Asking for a page past the end shows an empty list.
    technical_note: >
      All DAO list methods use rs.absolute(start+1) and a do/while that reads up to count
      rows, setting hasNext from rs.next(). Page.isPreviousPageAvailable = start > 0;
      getStartOfPreviousPage = max(start - objects.size(), 0). Page.EMPTY_PAGE for
      start < 0 or no row at start. A count <= 0 still returns one row because the
      do/while body runs before the count check.
    confidence: high
    confidence_basis: >
      The identical paging loop is repeated in every list method of both DAO
      implementations, and the navigation arithmetic is in the shared Page model.
    risk_class: presentational
    basis: >
      Paging loop in DAOs; Page model navigation methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 194
        line_end: 204
        excerpt: |2
                if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List categories = new ArrayList();
                  do {
                    categories.add(new Category(resultSet.getString(1).trim(),
                                                resultSet.getString(2),
                                                resultSet.getString(3)));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(categories, start, hasNext);
                }
                return Page.EMPTY_PAGE;
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 75
        line_end: 91
        excerpt: |2
              public boolean isNextPageAvailable() {
                // XXX
                /*
                  return (start + objects.size()) < containingListSize;
                */
                  return hasNext;
              }

              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }

              public int getStartOfNextPage() { return start + objects.size(); }

              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }

  - record_key: CAT-BR-0004
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL use a default catalog page size of 2 entries and a default start
