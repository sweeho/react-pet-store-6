  - record_key: CAT-BR-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show an item in a locale only when both the item and its product
      have localized details in that same locale. GIVEN an item has details in a locale but
      its product does not WHEN items are listed, looked up or searched in that locale THEN
      the item SHALL NOT be returned.
    plain_text: >
      An item only appears in a language if both the item and its parent product have been
      translated into that language.
    technical_note: >
      Every item query joins item_details b to product_details c with the condition
      b.locale = c.locale and filters b.locale = ?. Applies to GET_ITEM, GET_ITEMS and
      SEARCH_ITEMS in both SQL sources.
    confidence: high
    confidence_basis: >
      The same join condition is present in all three item queries across the hard-coded
      SQL and both databases in the externalized SQL.
    risk_class: presentational
    basis: >
      `join product d on d.productid = c.productid and b.locale = c.locale` with `where
      b.locale = ?`.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 82
        line_end: 88
        excerpt: |2
            public static String GET_ITEM_STATEMENT
            = "select catid, a.productid, name, b.image, b.descn, attr1, "
            + "  attr2, attr3, attr4, attr5, listprice, unitcost "
            + " from (((item a join item_details b on a.itemid=b.itemid)"
            + "   join product_details c on a.productid=c.productid)"
            + "   join product d on d.productid = c.productid and b.locale = c.locale) "
            + " where b.locale = ? and a.itemid = ?";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 158
        line_end: 167
        excerpt: |2
                  <SQLStatement method="GET_ITEM">
                      <SQLFragment parameterNb="2">
                          select catid, a.productid, name, b.image, b.descn, attr1, attr2, attr3,
                                  attr4, attr5, listprice, unitcost
                              from item a, item_details b, product_details c, product d
                              where a.itemid = b.itemid and a.productid = c.productid
                                  and d.productid = c.productid and b.locale = c.locale
