  - record_key: LOC-BR-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a requested locale string as language_COUNTRY. GIVEN the
      string "default" (any case) WHEN catalog content is requested THEN the server's
      default locale SHALL be used. GIVEN a string with no underscore WHEN catalog content is
      requested THEN no locale is resolved (see suspected defect).
    plain_text: >
      The shopper's language setting is read as language plus country (for example
      ja_JP). The word "default" means the server's own language.
    technical_note: >
      CatalogHelper.getLocaleFromString: null -> null; "default" -> Locale.getDefault();
      no '_' -> null; otherwise new Locale(language, country). The variant branch is dead
      (variantIndex is always -1), and for strings with two underscores country stays null.
    confidence: medium
    confidence_basis: >
      Single implementation in one helper method; behaviour read directly but not
      corroborated by configuration or tests.
    risk_class: presentational
    basis: >
      getLocaleFromString in CatalogHelper.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 386
        excerpt: |2
              private Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {

                      variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                      return new Locale(language, country, variant);
                  } else {
                      return new Locale(language, country);
                  }
              }

