  - record_key: CAT-BR-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL search items in the requested locale by splitting the search text on
      whitespace into distinct keywords and returning every item for which ANY keyword
      occurs as a substring of the product name, the category id, or the item description.
      GIVEN the search text contains no keywords WHEN a search is run THEN the system SHALL
      return an empty result without querying. Matching is intended to be
      case-insensitive (see dispute).
    plain_text: >
      Shoppers can type one or more words; an item is found if any word appears anywhere in
      its product name, its category code or its description. A blank search finds
      nothing. Whether upper-case search words match depends on which of two legacy
      implementations is running.
    technical_note: >
      Keywords: StringTokenizer on default whitespace into a HashSet (duplicates dropped,
      order lost). SQL: lower(name) / lower(catid) / lower(b.descn) LIKE '%kw%', OR-ed
      across keywords. CloudscapeCatalogDAO lowercases each keyword before binding;
      GenericCatalogDAO binds the keyword as typed. Note the field searched is the category
      ID (e.g. "FISH"), not the localized category name. Results unordered (no ORDER BY).
    confidence: medium
    confidence_basis: >
      Tokenisation, OR semantics and the three searched columns are consistent across both
      DAOs and the SQL config, but case-insensitivity differs between the two
      implementations and the deployed implementation class is redacted in configuration,
      so the live behaviour for mixed-case input cannot be established.
    dispute:
      reason: conflicting-sources
      detail: >
        CloudscapeCatalogDAO lowercases keywords (case-insensitive match).
        GenericCatalogDAO does not, while its SQL lowercases the columns, so any keyword
        containing an upper-case letter matches nothing. The param/CatalogDAOClass
        env-entry value that selects the implementation is redacted in both web.xml and the
        catalog ejb-jar.xml. Settled by the deployed value of param/CatalogDAOClass (docs
        on CatalogDAOSQL.xml suggest the generic DAO is the intended default).
    risk_class: presentational
    basis: >
      searchItems in both DAOs; SEARCH_ITEMS fragments in CatalogDAOSQL.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 347
        line_end: 354
        excerpt: |2
                Collection keywords = new HashSet();
                StringTokenizer st = new StringTokenizer(searchQuery);
                while (st.hasMoreTokens()) {
                  keywords.add(st.nextToken());
                }
                if (keywords.isEmpty()) {
                  return Page.EMPTY_PAGE;
                }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 391
        line_end: 394
