  - record_key: CAT-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the catalog categories available in the requested locale,
      sorted by localized category name, returning one page of at most the requested number
      of categories starting at the requested zero-based position.
    plain_text: >
      Shoppers can see the list of categories in their language, alphabetically by name,
      a page at a time.
    technical_note: >
      CatalogDAO.getCategories(start, count, locale) via GET_CATEGORIES "... where locale =
      ? order by name" (CloudscapeCatalogDAO constant and CatalogDAOSQL.xml entries for both
      cloudscape and oracle). Exposed through CatalogEJB.getCategories and
      CatalogHelper.getCategories (direct DAO or EJB).
    confidence: high
    confidence_basis: >
      Same ordering and filter appear in the hard-coded Cloudscape DAO SQL and in both
      database entries of the externalized SQL configuration.
    risk_class: presentational
    basis: >
      ORDER BY name in GET_CATEGORIES; paging loop builds a Page from start/count.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 70
        line_end: 73
        excerpt: |2
            public static String GET_CATEGORIES_STATEMENT
            = "select a.catid, name, descn "
            + " from (category a join category_details b on a.catid=b.catid) "
            + " where locale = ? order by name";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |2
                  <SQLStatement method="GET_CATEGORIES">
