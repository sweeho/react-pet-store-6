    category: error-swallowed
    title: Database connections leak when a catalog query fails, and close errors are swallowed
    description: >
      The Cloudscape implementation closes its connection only on the success path, so
      every failed query leaves a connection open. The generic implementation closes in a
      finally block but silently discards any error raised while closing. A missing SQL
      statement in the configuration yields no statement and fails with an unexplained
      error rather than a catalog error.
