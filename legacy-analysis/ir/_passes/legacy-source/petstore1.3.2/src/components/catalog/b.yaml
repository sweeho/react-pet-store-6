        excerpt: |2
              private Item getItemFromDAO(String itemId, Locale locale) throws CatalogException {
                  try {
                      if (dao == null)
                          dao = CatalogDAOFactory.getDAO();
                      return dao.getItem(itemId, locale);
                  } catch (CatalogDAOSysException se) {
