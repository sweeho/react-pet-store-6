  - record_key: CATB-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the items (purchasable variants) of a given product in the
      shopper's locale, one page at a time, each carrying its category, product name,
      item identifier, image, localized description, up to five descriptive attributes,
      list price and unit cost. No sort order is applied to this list.
    plain_text: >
      When a shopper opens a product, they see each variant that can be bought (for
      example "adult male"), with its picture, description, attributes and price. The
      list has no defined order.
    technical_note: >
      GET_ITEMS_STATEMENT (CloudscapeCatalogDAO) and GET_ITEMS (CatalogDAOSQL.xml) join
      item, item_details, product_details and product, filter by locale and productid,
      and carry no ORDER BY, so row order is whatever the database returns.
    confidence: high
    confidence_basis: >
      Same columns and absence of ORDER BY in both query definitions. The "no defined
      order" part is read from the absence of a clause, which is certain for the
      query but says nothing about whether the order was intended.
    risk_class: presentational
    basis: >
      Query and mapping into Item objects in getItems of both DAOs.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 89
        line_end: 95
        excerpt: |2
          public static String GET_ITEMS_STATEMENT
          = "select catid, name, a.itemid, b.image, b.descn, attr1, "
          + "  attr2, attr3, attr4, attr5, listprice, unitcost "
          + " from (((item a join item_details b on a.itemid=b.itemid)"
          + "  join product_details c on a.productid=c.productid)"
          + "  join product d on d.productid=c.productid and b.locale = c.locale)"
          + " where b.locale = ? and a.productid = ?";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 102
        line_end: 110
        excerpt: |2
          <SQLStatement method="GET_ITEMS">
              <SQLFragment parameterNb="2">
                  select catid, name, a.itemid, b.image, b.descn, attr1, attr2, attr3,
                          attr4, attr5, listprice, unitcost
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and a.productid = ?
              </SQLFragment>
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: item, item_details, product, product_details

