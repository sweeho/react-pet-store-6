records:
  - record_key: CATB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the catalog categories available in the shopper's locale,
      each with its identifier, localized name and localized description, ordered
      alphabetically by localized name, one page at a time.
    plain_text: >
      Shoppers can see the list of pet categories in their own language, sorted A to Z
      by name, a page at a time.
    technical_note: >
      CatalogEJB.getCategories / CatalogHelper.getCategories delegate to the DAO.
      Both DAO implementations run "select a.catid, name, descn from category join
      category_details where locale = ? order by name" (hard-coded in
      CloudscapeCatalogDAO; loaded from CatalogDAOSQL.xml by GenericCatalogDAO).
    confidence: high
    confidence_basis: >
      The same query, including the ORDER BY, is present in CloudscapeCatalogDAO and in
      the GenericCatalogDAO SQL configuration (two independent places), and the EJB and
      helper both expose the operation.
    risk_class: presentational
    basis: >
      GET_CATEGORIES_STATEMENT filters by locale and orders by name; the result rows are
      mapped to Category(id, name, description) and wrapped in a Page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 70
        line_end: 73
        excerpt: |2
          public static String GET_CATEGORIES_STATEMENT
          = "select a.catid, name, descn "
          + " from (category a join category_details b on a.catid=b.catid) "
          + " where locale = ? order by name";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 75
        excerpt: |2
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ?  order by name
    stack_metadata:
      framework: j2ee-1.3
      ejb.bean: CatalogEJB
      ejb.transaction: Required
      db.object: category, category_details

  - record_key: CATB-REQ-0002
