  - record_key: CATB-RULE-0014
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL determine the catalog content locale from a locale code of the
      form language_COUNTRY (for example en_US, ja_JP, zh_CN); GIVEN the code is the word
      "default" (any case) THEN the server's default locale SHALL be used; GIVEN the code
      contains no underscore THEN no locale SHALL be resolved.
    plain_text: >
      The catalog language is chosen from a code such as en_US or ja_JP. The word
      "default" means the server's own language. A code without a country part is not
      recognised.
    technical_note: >
      CatalogHelper.getLocaleFromString. All catalog queries bind locale.toString()
      (e.g. "en_US") to the locale column, so the code must exactly match the stored
      locale value. An unresolved (null) locale makes the subsequent DAO call fail.
    confidence: medium
    confidence_basis: >
      One clear implementation; behaviour for codes with a variant segment is broken (see
      suspected defects), so only the two-part form is certain.
    risk_class: presentational
    basis: >
      Parsing logic in getLocaleFromString.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 386
        excerpt: |2
              private Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {

                      variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                      return new Locale(language, country, variant);
                  } else {
                      return new Locale(language, country);
                  }
              }

  - record_key: CATB-RULE-0015
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      GIVEN the catalog data store cannot be reached or a catalog query fails WHEN a
      catalog operation is requested THEN the system SHALL raise an error to the caller
      rather than return an empty or partial result.
    plain_text: >
      If the catalog database is unavailable, the shopper gets an error instead of an
      empty catalog that looks like "no products".
    technical_note: >
      DAOs convert SQLException/NamingException to CatalogDAOSysException; CatalogEJB
      rethrows it as EJBException (container rolls back, Required transaction);
      CatalogHelper fast-lane rethrows as CatalogException.
    confidence: high
    confidence_basis: >
      The translation is coded in every method of both DAOs, the EJB and the helper.
    risk_class: operational
    basis: >
      catch/rethrow blocks in CatalogEJB and DAO methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 85
        line_end: 92
