  - record_key: CATB-RULE-0006
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL page catalog lists (categories, products, items, search results)
      by a zero-based start position and a requested count, returning at most count
      entries from the start position together with an indicator of whether more
      entries follow. GIVEN the start position is negative or past the last entry WHEN
      a page is requested THEN the system SHALL return an empty page with no next page.
      A previous page SHALL be offered whenever the start position is greater than zero;
      the next page SHALL start at start + number of entries returned, and the previous
      page SHALL start at the greater of zero and start − number of entries returned.
    plain_text: >
      Long lists are shown in pages with Next and Previous links. Next appears only if
      there is more to see; Previous appears on any page except the first. Asking for a
      page beyond the end shows an empty page.
    technical_note: >
      Each list method does `if (start >= 0 && rs.absolute(start+1)) { do {...} while
      ((hasNext = rs.next()) && (--count > 0)); }` else Page.EMPTY_PAGE. Page computes
      isPreviousPageAvailable (start > 0), getStartOfNextPage and getStartOfPreviousPage.
    confidence: high
    confidence_basis: >
      The loop is repeated in every list method of both DAOs and the navigation
      arithmetic is in the shared Page model, which the JSPs use for their links.
    risk_class: presentational
    basis: >
      Paging loop in DAO list methods and the Page model methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 194
        line_end: 204
        excerpt: |2
                if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List categories = new ArrayList();
                  do {
                    categories.add(new Category(resultSet.getString(1).trim(),
                                                resultSet.getString(2),
                                                resultSet.getString(3)));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(categories, start, hasNext);
                }
                return Page.EMPTY_PAGE;
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 83
        line_end: 91
        excerpt: |2
              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }

              public int getStartOfNextPage() { return start + objects.size(); }

              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }

