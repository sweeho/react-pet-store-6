  - record_key: CATB-RULE-0008
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL split a catalog search query into keywords on whitespace and
      discard duplicate keywords. GIVEN the query contains no keywords (empty or only
      whitespace) WHEN a search is run THEN the system SHALL return an empty result
      without querying the catalog.
    plain_text: >
      A search phrase is broken into separate words; repeating a word changes nothing,
      and an empty search returns no results.
    technical_note: >
      Both DAO searchItems implementations tokenize with java.util.StringTokenizer
      (default delimiters: space, tab, newline, carriage return, form feed) into a
      HashSet, and return Page.EMPTY_PAGE if the set is empty.
    confidence: high
    confidence_basis: >
      Identical tokenization and empty-check in both DAO implementations.
    risk_class: presentational
    basis: >
      StringTokenizer into HashSet, `if (keywords.isEmpty()) return Page.EMPTY_PAGE`.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 347
        line_end: 354
        excerpt: |2
                Collection keywords = new HashSet();
                StringTokenizer st = new StringTokenizer(searchQuery);
                while (st.hasMoreTokens()) {
                  keywords.add(st.nextToken());
                }
                if (keywords.isEmpty()) {
                  return Page.EMPTY_PAGE;
                }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 345
        line_end: 352
        excerpt: |2
                Collection keywordSet = new HashSet();
                StringTokenizer tokenizer = new StringTokenizer(searchQuery);
                while (tokenizer.hasMoreTokens()) {
                  keywordSet.add(tokenizer.nextToken());
                }
                if (keywordSet.isEmpty()) {
                  return Page.EMPTY_PAGE;
                }

  - record_key: CATB-RULE-0009
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL return, for a keyword search in the shopper's locale, every item
      for which at least one keyword occurs anywhere (substring match) in the product's
      localized name, the category identifier, or the item's localized description. The
      search results SHALL have no defined order and SHALL be paged.
    plain_text: >
      Search finds an item if any of the typed words appears inside the product name, the
      category code (e.g. "DOGS") or the item description. Any one word is enough. Results
      are not sorted.
    technical_note: >
      Search SQL is built from fragments: one `(lower(name) like ? or lower(catid) like ?
      or lower(b.descn) like ?)` group per keyword, OR-ed together, each parameter wrapped
      as %keyword%. CloudscapeCatalogDAO groups the predicates by column; the
      CatalogDAOSQL.xml variant groups them by keyword — logically equivalent. No ORDER BY.
    confidence: high
    confidence_basis: >
      Same matching columns, OR semantics and %…% wrapping in both implementations.
    risk_class: presentational
    basis: >
      SEARCH_ITEMS_STATEMENT_FRAGMENTS and the VARIABLE-occurrence fragment in the SQL
      configuration; parameter wrapping in both searchItems methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 96
        line_end: 110
        excerpt: |2
            public static String[] SEARCH_ITEMS_STATEMENT_FRAGMENTS
            = { "select catid, a.productid, name, a.itemid, b.image, b.descn, attr1,"
                + "  attr2, attr3, attr4, attr5, listprice, unitcost"
                + " from (((item a join item_details b on a.itemid=b.itemid)"
                + "  join product_details c on a.productid=c.productid)"
                + "  join product d on d.productid=c.productid and b.locale = c.locale)"
                + " where b.locale = ? ",
                "    and ((lower(name) like ? ",
                "          or lower(name) like ? ",
                "    ) or (lower(catid) like ? ",
                "          or lower(catid) like ? ",
                "    ) or (lower(b.descn) like ? ",
                "          or lower(b.descn) like ? ",
                ") )"
            };
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 119
        line_end: 123
        excerpt: |2
                      where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              </SQLFragment>
              <SQLFragment parameterNb="3" occurrence="VARIABLE">
                  or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              </SQLFragment>
    stack_metadata:
      db.object: item, item_details, product_details

  - record_key: CATB-RULE-0010
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL match search keywords case-insensitively against product name,
      category identifier and item description.
    plain_text: >
      Searching for "Dog", "dog" or "DOG" gives the same results.
    technical_note: >
      Both query variants lower-case the searched columns. CloudscapeCatalogDAO also
      lower-cases each keyword before binding; GenericCatalogDAO binds the keyword as
      typed. Which DAO class is deployed is configured in ejb-jar.xml / web.xml
      (param/CatalogDAOClass), and that value is redacted in this tree.
    confidence: low
    confidence_basis: >
      Case-insensitivity is certain on the Cloudscape path and absent on the generic path
      for any keyword containing an upper-case letter. The deployed DAO class cannot be
      read (redacted), so the live behaviour cannot be determined from source.
    dispute:
      reason: conflicting-sources
      detail: >
        CloudscapeCatalogDAO calls toLowerCase() on every keyword; GenericCatalogDAO does
        not, while its SQL still compares lower(column) LIKE '%Keyword%', so a keyword
        with any upper-case letter matches nothing. The deployed value of
        param/CatalogDAOClass (ejb-jar.xml line 61, web.xml line 194) is redacted;
        reading the un-redacted deployment descriptors, or observing a mixed-case search
        on the running system, would settle it.
    risk_class: presentational
    basis: >
      Keyword lower-casing in CloudscapeCatalogDAO versus raw keyword in GenericCatalogDAO.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 391
        line_end: 394
        excerpt: |2
                  for (it = keywords.iterator(); it.hasNext(); i++) {
                    String keyword = ((String) it.next()).toLowerCase();
                    ps.setString(i, "%" + keyword + "%");
                  }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 359
        line_end: 365
        excerpt: |2
                  String[] parameterValues = new String[1 + (keywords.length * 3)];
                  parameterValues[0] = locale.toString();
                  for (int i = 0; i < keywords.length; i++) {
                    parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
