findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/util/DatabaseNames.java
    description: >
      DatabaseNames.getTableName maps a locale to per-locale table names (suffix _ja for
      Japan, _zh for China, base name otherwise). No caller exists anywhere in the
      legacy tree, and every live query uses a locale column instead. No requirement was
      emitted; a human should confirm this is an abandoned design (per-locale tables) and
      not used by an external batch or loader.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
    description: >
      Catalog reads run on two paths: a direct read path (CatalogHelper default
      constructor, used by the storefront pages) and the CatalogEJB path (used by the
      shopping cart via new CatalogHelper(false)). Both reach the DAO selected by
      param/CatalogDAOClass, which is redacted in ejb-jar.xml and web.xml, so it cannot be
      confirmed that both paths use the same DAO class (and therefore the same search
      case behaviour, see CATB-RULE-0010). JNDINames also declares an unused
      USE_CATALOG_EJB switch with no reader.
    record_key: CATB-RULE-0010

suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0010]
    severity: medium
    category: other
    title: Generic search path never matches keywords containing capital letters
    description: >
      The search SQL compares the lower-cased column against the keyword pattern. The
      Cloudscape-specific implementation lower-cases the keyword first; the generic,
      configuration-driven implementation binds the keyword exactly as typed, so a search
      for "Dog" returns nothing on that path while "dog" works.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 359
        line_end: 365
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 391
        line_end: 394
  - capability_key: localization
    record_keys: [CATB-RULE-0014]
    severity: medium
    category: other
    title: Locale codes with a variant, or with no country, break catalog lookups
    description: >
      For a three-part code such as en_US_WIN the country is never assigned (it is only
      set when there is no second underscore) and the variant index is never computed, so
      a Locale is constructed with a null country, which throws. A code with no
      underscore (e.g. "en") returns no locale, and the subsequent catalog query then
      fails when it reads the locale. Either way the shopper gets an error, not a
      fallback language.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 363
        line_end: 385
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0006]
    severity: low
    category: other
    title: Requested page size of zero or less still returns one entry
    description: >
      The paging loop adds the row at the start position before it checks the remaining
      count, so a count of 0 or a negative count returns one entry instead of none.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 197
        line_end: 201
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0006]
    severity: low
    category: other
    title: Previous-page position is computed from the current page's size
    description: >
      The previous page starts at start minus the number of entries on the current page,
      not minus the page size. On a short last page (e.g. start 4, one entry, page size
      2) the previous link goes to position 3 instead of 2, so page boundaries drift.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 89
        line_end: 91
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0015]
    severity: medium
    category: other
    title: Database connections are not released when a catalog query fails
    description: >
      The Cloudscape-specific implementation closes its result set, statement and
      connection only on the success path; there is no finally block, so every failed
      query leaks a pooled connection. Repeated failures can exhaust the pool and take the
      catalog down. The generic implementation closes in a finally block.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 133
        line_end: 151
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0009]
    severity: low
    category: error-swallowed
    title: Malformed search-query configuration is logged and ignored
    description: >
      When the generic implementation loads its query definitions, validation errors in
      the configuration file are printed and ignored, an unparseable parameter count is
      silently treated as zero, and a mismatch between supplied values and query
      placeholders is only printed. A broken configuration therefore surfaces later as a
      wrong or failing query rather than at start-up.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 425
        line_end: 428
