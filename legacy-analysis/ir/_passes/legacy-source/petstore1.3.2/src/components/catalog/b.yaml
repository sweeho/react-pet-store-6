      sorted A to Z by name, a page at a time.
    technical_note: >
      GET_PRODUCTS_STATEMENT in CloudscapeCatalogDAO and the GET_PRODUCTS entry of
      CatalogDAOSQL.xml (GenericCatalogDAO) both filter on locale and catid and order by
      name. Exposed through CatalogEJB.getProducts and CatalogHelper.getProducts.
    confidence: high
    confidence_basis: >
      Identical filter and ordering in two independent query definitions.
    risk_class: presentational
    basis: >
      Query selects productid, name, descn for the category id and locale, ordered by
      name, mapped to Product objects inside a Page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
