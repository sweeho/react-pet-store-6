  - record_key: CATB-RULE-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show an item in a locale only when both the item's details and its
      product's details exist in that same locale; an item lacking either localized
      record SHALL be omitted from item lists, item lookups and search results for that
      locale.
    plain_text: >
      An item only appears in a language if both the item and its product have been
      described in that language. Untranslated items are silently hidden.
    technical_note: >
      Every item query joins item_details b to product_details c with
      `b.locale = c.locale` and filters `b.locale = ?`, so an inner join drops items
      missing either translation. Applies to GET_ITEM, GET_ITEMS and SEARCH_ITEMS.
    confidence: high
    confidence_basis: >
      The join condition appears in every item query in both DAO implementations.
      Whether hiding untranslated items is intended is not stated anywhere.
    risk_class: presentational
    basis: >
      Inner-join condition `b.locale = c.locale` combined with the locale filter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 82
        line_end: 88
        excerpt: |2
          public static String GET_ITEM_STATEMENT
          = "select catid, a.productid, name, b.image, b.descn, attr1, "
          + "  attr2, attr3, attr4, attr5, listprice, unitcost "
          + " from (((item a join item_details b on a.itemid=b.itemid)"
          + "   join product_details c on a.productid=c.productid)"
          + "   join product d on d.productid = c.productid and b.locale = c.locale) "
          + " where b.locale = ? and a.itemid = ?";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 116
        line_end: 119
        excerpt: |2
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
    stack_metadata:
