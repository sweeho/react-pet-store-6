  - record_key: CATB-ENT-0012
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL model an Item as an identifier belonging to one product and
      carrying, per locale, an image location, a description and up to five free-text
      attributes, plus a list price and a unit cost. GIVEN an attribute position outside
