  - record_key: ORDF-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL create a supplier order together with its shipping contact
      and all of its line items within a single transaction, and SHALL fail the
      creation if the shipping contact or line item records cannot be created.
    plain_text: >
      An incoming supplier order is saved as a whole: the order, its shipping
      contact and its item lines are stored together, and the save fails if any
      part cannot be stored.
    technical_note: >
      LocalHome create(SupplierOrder) has trans-attribute Required. ejbCreate sets
      the scalar fields; ejbPostCreate creates the ContactInfo and each LineItem
      through ServiceLocator lookups and wraps a ServiceLocatorException in a
      CreateException. CreateException is an application exception, so whether
      the partial rows roll back depends on the caller/container marking the
      transaction for rollback.
    confidence: medium
    confidence_basis: >
      Transaction attribute is declared and the failure path is visible in code,
      but CreateException does not by itself force rollback in EJB 2.x and the
      caller in the supplier app was not traced in this pass, so full atomicity
      is not proven.
    risk_class: operational
    basis: >
      container-transaction Required on create; ejbPostCreate creating dependent
      records and throwing CreateException on lookup failure.
