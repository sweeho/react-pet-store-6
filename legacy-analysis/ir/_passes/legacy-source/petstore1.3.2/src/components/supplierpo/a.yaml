  - record_key: ORDF-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accept and produce supplier orders as an XML document
      containing, in order, an order identifier, an order date, a shipping
      contact, and one or more line items, and SHALL reject an inbound document
      that does not conform to that structure.
    plain_text: >
      Orders are handed to suppliers as a structured document with the order
      number, the order date, where to ship, and at least one item; a document
      missing any of these is refused.
    technical_note: >
      SupplierOrder.dtd (public id "-//Sun Microsystems, Inc. - J2EE Blueprints
      Group//DTD SupplierOrder 1.1//EN") declares
      SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+), with
      ShippingInfo wrapping ContactInfo. SupplierOrder.fromXML parses with
      VALIDATING = true against that DTD; fromDOM also throws
      "SupplierOrder element expected." on a wrong root. toXML serialises the
      same structure with the DTD declaration.
    confidence: high
    confidence_basis: >
      Structure is declared in the DTD and enforced by validating parsing in code
      (VALIDATING constant used by the default fromXML overloads); two places.
    risk_class: operational
    basis: >
      DTD element declaration; VALIDATING=true; fromXML default overloads;
      root-element check in fromDOM.
