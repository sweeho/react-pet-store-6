  - record_key: ORDF-BR-0006
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL exchange the supplier order date as a calendar date in the
      form yyyy-MM-dd; GIVEN an inbound supplier order whose date cannot be read
      in that form WHEN it is parsed THEN the order date SHALL be set to the
      current date and processing SHALL continue.
    plain_text: >
      The order date travels as a year-month-day date. If the date on an
      incoming order cannot be read, today's date is used instead and the order
      is still accepted.
    technical_note: >
      SupplierOrder uses SimpleDateFormat("yyyy-MM-dd") for toDOM/fromDOM. In
      fromDOM any exception parsing OrderDate is caught, the date is replaced
      with new Date() (marked "FIX ME!") and a message is printed to stderr.
      The entity stores poDate as epoch millis, so the time-of-day is lost on
      the XML round trip (dates arrive as local midnight).
    confidence: medium
    confidence_basis: >
      Both the format and the fallback are in one clear place in the code; the
      in-code "FIX ME!" comment signals the fallback was not intended as a
      business rule, which is why it is also listed as a suspected defect.
    risk_class: operational
    basis: >
      dateFormat field; try/catch around OrderDate parsing in fromDOM.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 66
        line_end: 66
        excerpt: |
          private final SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 217
        line_end: 223
        excerpt: |
          try {
            child = XMLDocumentUtils.getNextSibling(child, XML_ORDERDATE, false);
            supplierOrder.setOrderDate(supplierOrder.dateFormat.parse(XMLDocumentUtils.getContentAsString(child, false)));
          } catch (Exception exception) {
            supplierOrder.setOrderDate(new Date()); // FIX ME!
            System.err.println(XML_ORDERDATE + ": " + exception.getMessage() + " reset to current date.");
          }
    stack_metadata:
      framework: jaxp-dom

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
    description: >
      All SupplierOrderEJB, ContactInfoEJB, AddressEJB and LineItemEJB methods
      carry an <unchecked/> method permission (lines 318-345) and the beans
      expose only local interfaces. No access restriction exists at this layer;
      whether supplier-order access is protected depends on the calling web tier
      (supplier app), which is outside this shard. A human should confirm that
      sign-on for the supplier area is covered by the supplier app's extraction.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
    description: >
      This module defines its own OrderStatusNames (PENDING, APPROVED, DENIED,
      COMPLETED); the OPC application uses another OrderStatusNames that also
      has SHIPPED_PART. Supplier orders appear to use only PENDING and COMPLETED.
      A human should decide whether APPROVED/DENIED are meaningful supplier-order
      states or leftovers from the customer-order vocabulary.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDF-ENT-0001]
    severity: medium
    category: data-corruption
    title: Reading a stored supplier order back drops its shipping contact
    description: >
      When a stored supplier order is converted back into an order document, the
      shipping contact is set from the new, empty document instead of from the
      stored contact, so it is always empty. Any later attempt to turn that
      order into its XML form fails because the shipping contact is missing.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 216
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 194
        line_end: 195
  - capability_key: order-fulfillment
    record_keys: [ORDF-BR-0006]
    severity: medium
    category: error-swallowed
    title: Unreadable order date silently replaced with today's date
    description: >
      If the date on an incoming supplier order cannot be parsed, the error is
      caught, the date is replaced with the current date and the order is
      accepted; the only trace is a console message. The code itself carries a
