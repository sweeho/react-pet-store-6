    severity: medium
    category: data-corruption
    title: Order view always drops the shipping contact
    description: >
      When a stored supplier order is turned back into an order object, the shipping
      contact is copied from the new, still-empty object onto itself, so the ship-to
      contact is always empty in the result, even though it is stored. The order status
      is also not carried. Any consumer that re-serialises this object to XML would fail
      or ship without an address.
