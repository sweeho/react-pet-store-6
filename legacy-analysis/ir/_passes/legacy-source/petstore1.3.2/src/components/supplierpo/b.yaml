      "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD SupplierOrder 1.1//EN",
      VALIDATING = true by default; date via SimpleDateFormat("yyyy-MM-dd"). DTD
      SupplierOrder.dtd declares (OrderId, OrderDate, ShippingInfo, LineItem+). fromDOM
      throws XMLDocumentException "SupplierOrder element expected." for a wrong root.
      Date precision is the day: time of day is dropped when written.
    confidence: high
    confidence_basis: >
      Structure is stated in the DTD and implemented identically in toDOM/fromDOM, with
      validation on by default: two independent places.
