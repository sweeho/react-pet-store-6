    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL persist a supplier order consisting of an order identifier,
      an order date (stored as a timestamp), an order status, exactly one shipping
      contact (name, e-mail, telephone and postal address), and a collection of line
      items each carrying category, product, item, line number, quantity ordered,
      unit price and quantity shipped.
    plain_text: >
      Every order sent to the supplier is kept on file with its order number, date,
      current status, one ship-to contact with address, and the list of items ordered
      (what, how many, at what price, and how many have shipped so far).
    technical_note: >
      Container-managed entity SupplierOrderEJB (abstract schema SupplierOrder) with
      CMP fields poId, poDate (long epoch millis), poStatus; one-to-one unidirectional
      CMR contactInfo -> ContactInfoEJB (which has a one-to-one to AddressEJB); and a
      one-to-many unidirectional CMR lineItems -> LineItemEJB. All entities are
      declared in this module's ejb-jar.xml.
    confidence: high
    confidence_basis: >
      The shape is declared in the deployment descriptor (cmp-fields and relationships)
      and mirrored by the abstract accessors in the bean class and the local interface,
      so it is stated in two independent places.
    risk_class: operational
