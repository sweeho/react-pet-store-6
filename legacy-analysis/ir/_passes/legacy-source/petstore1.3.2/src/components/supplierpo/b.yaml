      ShippingInfo holding one ContactInfo, and one or more LineItem elements.
    plain_text: >
      Orders are passed to the supplier as a structured document holding the order
      number, the order date (year-month-day), the ship-to contact, and at least one
      item line; documents that do not follow this layout are rejected.
