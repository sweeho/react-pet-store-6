    description: >
      APPROVED and DENIED are declared for supplier orders, but this module never sets
      them, and nothing here performs an approval step on supplier orders. Whether
      supplier orders ever pass through APPROVED/DENIED, or go directly PENDING ->
      COMPLETED, is decided by callers outside this shard (supplier application). A
      human should confirm the real supplier-side lifecycle against OF-WF-0001.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
    description: >
      Whether a supplier order may have zero line items is stated three ways: the
      descriptor comment says "1 or more", the DTD requires LineItem+, but the
      relationship multiplicity is plain Many and creation accepts an empty collection.
      Behaviour is clear only for orders arriving as validated XML; a human should
      decide whether at-least-one-item is a rule of the stored order (affects
      OF-ENT-0001).
