records:
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout
    requirement: >
      The system SHALL persist each placed order as a purchase order identified uniquely by
      its order id and carrying the customer's user id, the customer's e-mail address, the
      order date (to the millisecond), the order locale and the order total value; each
      purchase order SHALL own exactly one contact record, exactly one credit-card record
      and one or more line items, and deleting the order SHALL delete those owned records.
    plain_text: >
      Every order is stored under its own unique order number, together with who placed it,
      their e-mail address, when it was placed, the language/region it was placed in and its
      total. Each order has one contact/address, one payment card and its item lines, and
      these are removed together with the order.
    technical_note: >
      Container-managed entity PurchaseOrderEJB (abstract schema "PurchaseOrder") with CMP
      fields poId (String, primary key), poUserId, poEmailId, poDate (long, epoch millis),
      poLocale (String) and poValue (float). CMR fields contactInfo (1:1), creditCard (1:1)
      and lineItems (1:N, Collection), all unidirectional with cascade-delete on the child
      side. Declared in ejb-jar.xml and mirrored by the abstract accessors in
      PurchaseOrderEJB.java. No physical table/column constraints are declared; mapping is
      left to the container.
    confidence: high
    confidence_basis: >
      The fields, primary key and relationships are stated in two independent places: the
      deployment descriptor (cmp-field, primkey-field, ejb-relation with cascade-delete) and
      the bean class accessors. Nullability and column sizes are not visible anywhere in this
      module, so nothing is claimed about them.
    risk_class: financial
    basis: >
      ejb-jar.xml lines 55-84 declare the CMP fields and primkey-field poId; lines 286-310,
      372-397 declare the contact-info and line-item relations with cascade-delete;
      PurchaseOrderEJB.java declares matching abstract getters/setters and the class javadoc
      states the one-to-many / one-to-one relationships.
