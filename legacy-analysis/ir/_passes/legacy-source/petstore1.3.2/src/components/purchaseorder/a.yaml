  - record_key: SIGNON-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT restrict by role who may create, read or update purchase orders
      at the order-record level; access control for orders SHALL be left to the callers.
    plain_text: >
      The order records themselves have no built-in permission check; whoever is allowed to
      reach them through the application may use them.
    technical_note: >
      ejb-jar.xml assembly-descriptor grants <unchecked/> method-permission on method "*" for
      PurchaseOrderEJB (and the ContactInfo, Address, CreditCard and LineItem entities), and
      the bean uses caller identity. These are local interfaces, so only in-container code
