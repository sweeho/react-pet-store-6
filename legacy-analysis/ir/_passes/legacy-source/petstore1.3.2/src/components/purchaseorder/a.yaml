  - capability_key: order-fulfillment
    record_keys: [ORDFUL-BR-0001]
    severity: medium
    category: other
    title: Over-shipment or duplicate item lines prevent an order from ever completing
    description: >
      Completion requires shipped quantity to equal ordered quantity exactly. If invoices
      report more than was ordered, the line never matches and the order stays partially
      shipped. Shipments are matched by item id, so when the same item appears on two lines
      each line is credited with the full shipped quantity, double-counting it. Invoice
      items that match no order line are ignored without notice.
