    severity: high
    category: data-corruption
    title: Billing address is discarded and the shipping address is reported as billing
    description: >
      The order accepts separate billing and shipping information, but only the shipping
      contact is saved. When the order is read back, the saved shipping contact is reported
      as the billing information too, so any later step that uses the billing address
      (invoicing, card verification, admin views) gets the shipping address. The read-path
      line carries a developer "XXX" marker.
