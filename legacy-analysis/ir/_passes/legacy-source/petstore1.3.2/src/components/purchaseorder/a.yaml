  - record_key: ORDFUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN a supplier invoice is received for an order THEN the system SHALL add the shipped
      quantity reported for each item to the shipped quantity of every order line for that
      item, and SHALL treat the order as completely fulfilled only when every order line's
      shipped quantity equals its ordered quantity; otherwise the order SHALL be treated as
      partially shipped.
    plain_text: >
      Each supplier invoice adds to how many of each item have been shipped. The order is
      complete only once every line has shipped exactly the quantity ordered; until then it
      counts as partly shipped.
    technical_note: >
      PurchaseOrderHelper.processInvoice(po, Map itemId -> Integer shipped) increments
      LineItem.quantityShipped for lines whose itemId is a key in the map, then returns
      false on the first line where quantity != quantityShipped, else true. The caller,
      InvoiceMDB.doWork (apps/opc), sets the order status COMPLETED on true and SHIPPED_PART
      on false. Matching is by itemId, not line number.
    confidence: high
    confidence_basis: >
      The rule is read directly from the helper's code and confirmed by its javadoc and by
      the one caller that maps the boolean to the completed / partially-shipped statuses.
    risk_class: operational
    basis: >
      processInvoice body and javadoc ("checks if all invoices of the given PO are shipped,
      it will return true to indicate ... the order is completely fulfilled").
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |2
            public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

              //set the quantity of line items shipped in the PO
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                            Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                    li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                    }
              }//end while

              // now loop through all LIs and see if all are shipped completely
              liColl = po.getLineItems();
              liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() != li.getQuantityShipped()) {
                    return false;
                    }
              }//end while
              return true;
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 159
        line_end: 171
        excerpt: |2
              PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
              invoiceXDE.setDocument(xmlInvoice);
              PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
              boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

              //update process manager if this order is completely done, or partially done
              //for this purchase order
              if(orderDone) {
                processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
                completedOrder = invoiceXDE.getOrderId();
              } else {
