  - record_key: CHK-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL require a purchase order document to contain, in order, an order
      identifier, user identifier, e-mail address, order date, shipping contact
      information, billing contact information, total price, credit card, and at least
      one line item.
    plain_text: >
      An incoming order must include the order number, customer, e-mail, date, a shipping
      contact, a billing contact, the total, the payment card and at least one item; an
      order with no items is not a valid order.
    technical_note: >
      PurchaseOrder.dtd content model: PurchaseOrder (OrderId, UserId, EmailId, OrderDate,
      ShippingInfo, BillingInfo, TotalPrice, CreditCard, LineItem+). The relationship
      comment in ejb-jar.xml also states "Every PO has 1 or more line items". Enforcement
      at parse time depends on the validating flag passed by the caller
      (PurchaseOrder.VALIDATING = true for the default fromXML overloads).
    confidence: high
    confidence_basis: >
      Stated in the DTD (declarative) and repeated in the descriptor comment for the line
      item minimum; the parser reads elements in the same order. Not graded higher because
      validation can be switched off by the caller's configuration.
    risk_class: operational
    basis: >
      DTD element declaration with LineItem+ cardinality; ejb-jar.xml comment; fromDOM reads
      each element in the declared sequence.
