  - capability_key: checkout
    record_keys: [CHK-RULE-0004]
    severity: low
    category: inconsistent-rounding
    title: Order total held as single-precision floating point
    description: >
      The order total is stored and exchanged as a single-precision float, which cannot
      represent many decimal currency amounts exactly; totals above roughly 100 000 lose
      cent precision.
