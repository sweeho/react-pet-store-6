  - record_key: SIGN-RULE-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT apply any role-based restriction at the purchase-order data
      layer; access control to order data SHALL be enforced by the components that call it.
    plain_text: >
      Order records themselves carry no access rules; whoever can reach the order-processing
      logic can read and change them, so protection depends on the screens and services in
      front of them.
    technical_note: >
      ejb-jar.xml method-permission <unchecked/> on all methods of PurchaseOrderEJB,
      ContactInfoEJB, AddressEJB, CreditCardEJB and LineItemEJB; security-identity
      use-caller-identity. Beans expose only local interfaces. Filed under sign-on as the
      closest capability for access control.
    confidence: medium
    confidence_basis: >
      Declared once, clearly, in the descriptor; the protection provided by callers is not
      visible from this module.
    risk_class: operational
    basis: >
      unchecked method permissions in the assembly descriptor.
