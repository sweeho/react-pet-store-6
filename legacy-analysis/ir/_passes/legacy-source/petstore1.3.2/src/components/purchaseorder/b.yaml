suspected_defects:
  - capability_key: checkout
    record_keys: [CHK-RULE-0005]
    severity: high
    category: data-corruption
    title: Billing contact is discarded; shipping contact is reported as billing
    description: >
      An incoming order carries separate shipping and billing contacts and the order
      document format requires both, but only the shipping contact is stored. When the
      order is read back, the shipping contact is returned as the billing contact as well,
      so any different billing name, address, phone or e-mail is silently lost. The code
      marks the read-back line with "XXX".
