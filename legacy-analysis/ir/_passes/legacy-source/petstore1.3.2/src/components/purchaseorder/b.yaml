  - capability_key: localization
    record_keys: [LOC-RULE-0001]
    severity: low
    category: other
    title: Missing locale on a non-validated order document fails order creation
    description: >
      The en_US default comes from the DTD and applies only when the document is parsed
      with validation. When validation is configured off and the locale attribute is
      absent, the attribute reads as an empty string, which converts to no locale at all
      instead of US English; storing the order then fails when the locale is converted to
      text.
