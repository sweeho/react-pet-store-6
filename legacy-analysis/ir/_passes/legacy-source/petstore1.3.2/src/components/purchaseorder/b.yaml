  - record_key: CHK-RULE-0003
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL exchange the order date in the order document as a calendar date in
      the format yyyy-MM-dd (no time of day).
      GIVEN an incoming order document whose order date is missing or not parseable as
      yyyy-MM-dd WHEN the document is read THEN the system SHALL set the order date to the
      current date-time and continue processing the order.
    plain_text: >
      The order date travels as a plain date (year-month-day). If an incoming order's date
      is missing or unreadable, the order is not rejected; it is stamped with today's date
      and time instead.
    technical_note: >
      PurchaseOrder.dateFormat = SimpleDateFormat("yyyy-MM-dd"), used by toDOM and fromDOM.
      In fromDOM any exception while reading OrderDate is caught, the date is reset to
      new Date(), and a message is written to System.err.
    confidence: medium
    confidence_basis: >
      One clear place in code; the fallback is explicit, but no document or test states it
      is intended.
    risk_class: operational
    basis: >
      Date format constant and the catch block in fromDOM.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 73
        line_end: 73
        excerpt: |
