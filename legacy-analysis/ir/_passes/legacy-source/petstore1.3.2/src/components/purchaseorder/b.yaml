records:
  - record_key: CHK-ENTITY-0001
    kind: entity
    capability_key: checkout
    requirement: >
      The system SHALL persist each accepted purchase order with: an order identifier,
      the ordering user's identifier, the customer e-mail address, the order date-time,
      the order locale, the order total value, one contact-information record, one
      credit-card record, and a collection of order line items.
    plain_text: >
      Every order that is accepted is stored with its order number, the customer's user
      name and e-mail, when it was placed, its language/region, its total, a contact
      (name, phone, e-mail, postal address), the payment card, and the list of items ordered.
    technical_note: >
      PurchaseOrderEJB is a CMP 2.x entity bean (abstract schema PurchaseOrder) with cmp
      fields poId, poUserId, poEmailId, poDate (long epoch millis), poLocale (String),
      poValue (float), and CMR fields contactInfo (1:1), creditCard (1:1) and lineItems
      (1:N), declared in ejb-jar.xml and populated in ejbCreate/ejbPostCreate.
    confidence: high
    confidence_basis: >
      The field set is declared in the deployment descriptor and independently set by the
      create methods in the bean class; the two agree field-for-field.
    risk_class: operational
    basis: >
      ejb-jar.xml cmp-field and relationship declarations; PurchaseOrderEJB.ejbCreate and
      ejbPostCreate set every one of these fields from the incoming order.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 59
        line_end: 84
        excerpt: |
          <abstract-schema-name>PurchaseOrder</abstract-schema-name>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 205
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: PurchaseOrderEJB
      ejb.transaction: Required
      db.object: PurchaseOrder (abstract schema)

