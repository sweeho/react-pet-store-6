  - record_key: FUL-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN a supplier invoice is received for a purchase order THEN the system SHALL add,
      for every order line whose item identifier appears in the invoice, the invoiced
      shipped quantity to that line's quantity shipped; item identifiers in the invoice
      that match no order line SHALL be ignored.
    plain_text: >
      When a supplier reports a shipment, each matching item on the order has the shipped
      amount added to what was already shipped. Items on the invoice that are not on the
      order are ignored.
    technical_note: >
      PurchaseOrderHelper.processInvoice(po, lineItemIds): lineItemIds is a Map itemId ->
      Integer shipped; li.setQuantityShipped(li.getQuantityShipped() + shipped). Called from
      OPC InvoiceMDB (outside shard). Matching is by item id, not line number.
    confidence: high
    confidence_basis: >
      Code and its Javadoc state the same behaviour, and a live caller was located.
    risk_class: operational
    basis: >
      processInvoice first loop and its Javadoc.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 68
        line_end: 91
        excerpt: |
          /**
           * This method processes invoice information received from supplier by opc. Its
           * job is to update the LineItem fields for the received invoices.
           * Additionally it checks if all invoices of the given PO are shipped,
           * it will return true to indicate all invoices for a purchase order have
           * been joined together and the order is completely fulfilled.
           *
           * @param <Code>po</Code>
           * @param <Code>lineItemIds</Code>
           *
           * @return true or false to indicate if order is completely done
           */
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while
    stack_metadata:
      ejb.bean: PurchaseOrderHelper (plain helper class)
      ejb.transaction: caller's (InvoiceMDB)

  - record_key: FUL-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL treat a purchase order as completely fulfilled only when, for every
      order line, the quantity shipped is exactly equal to the quantity ordered.
      GIVEN any line whose quantity shipped differs from its quantity ordered (fewer or
      more) WHEN an invoice has been applied THEN the order SHALL NOT be considered
      complete.
    plain_text: >
      An order is finished only when every item has been shipped in exactly the amount
      ordered. A partial shipment, or a shipment of more than was ordered, leaves the order
      open.
    technical_note: >
      PurchaseOrderHelper.processInvoice second loop returns false on the first line where
