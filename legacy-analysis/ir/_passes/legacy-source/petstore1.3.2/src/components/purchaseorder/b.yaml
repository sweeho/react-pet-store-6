    severity: medium
    category: error-swallowed
    title: Unreadable order date is replaced with the current date
    description: >
      If the order date in an incoming order cannot be read, the error is caught, written
      only to the server error log, and the order is stored with the processing time as its
      order date. The order then appears in date-range reports under the wrong date.
    traces:
