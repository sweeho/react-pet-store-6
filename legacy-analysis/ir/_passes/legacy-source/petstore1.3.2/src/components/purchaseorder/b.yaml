  - capability_key: order-fulfillment
    record_keys: [FUL-RULE-0002, FUL-RULE-0001]
    severity: medium
    category: other
    title: Over-shipped or duplicate-item orders never complete
    description: >
      Completion requires shipped quantity to equal ordered quantity exactly. If invoices
      ship more than ordered, or if one item appears on two order lines (both lines get the
      full invoiced quantity added because matching is by item id), shipped exceeds ordered
      and the order is never reported as complete. Re-delivery of the same invoice also adds
      the quantity again.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 87
