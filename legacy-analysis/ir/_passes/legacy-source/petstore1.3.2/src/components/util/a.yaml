    category: other
    title: Tracer build target uses a property that is never defined
    description: >
      The jar-packaging target deletes, creates, copies into, jars from and deletes a
      directory named by `tracer.buildjardir`, which is not defined in this build file's
      init target. Ant then uses the literal string "${tracer.buildjardir}" as a directory
      name relative to the build directory. The jar is still produced, but the behaviour
      depends on an unresolved property (it may be defined in an external
      build.properties/petstore.properties not checked here). Build-only; no runtime
      business impact.
