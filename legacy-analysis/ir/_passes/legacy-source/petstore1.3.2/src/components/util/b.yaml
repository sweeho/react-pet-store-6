suspected_defects:
  - capability_key: catalog-browsing
    record_keys: []
    severity: low
    category: error-swallowed
    title: Diagnostics routed through the debug helper are always discarded
    description: >
      The debug helper is switched off by a hard-coded constant, so every message and
      every exception passed to it produces no output at all in the shipped build; the
      exception-printing variants (lines 60-79) print neither the message nor the stack
      trace. Callers that handle a caught exception only by passing it to this helper
      therefore leave no trace of the failure anywhere, e.g. the catalog bean, which on
      failure to obtain its data-access object logs the exception through the helper and
      carries on. Filed under catalog-browsing only because that is the cited caller; the
      helper is used by 19 files across cart, catalog and the request controller, and
      the affected behaviour belongs to those callers' shards.
