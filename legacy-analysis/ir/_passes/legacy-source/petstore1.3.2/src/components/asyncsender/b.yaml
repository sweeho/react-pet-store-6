records:
  - record_key: CHECKOUT-INTEGRATION-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL hand a submitted order to order processing asynchronously,
      by placing the order, serialised as an XML text document, as a single message
      on the order-processing queue; the shopper's request SHALL NOT wait for order
      processing to complete.
    plain_text: >
      When a customer places an order, the store passes the whole order on to the
      order-processing back office as one message and does not make the customer
      wait while the back office handles it.
    technical_note: >
      AsyncSenderEJB.sendAMessage(String) creates a QueueSender on the queue bound
      to java:comp/env/jms/AsyncSenderQueue and sends a TextMessage carrying the
      string. In the petstore app the logical queue is bound to jms/opc/OrderQueue
      (sun-j2ee-ri.xml), and OrderEJBAction passes purchaseOrder.toXML().
    confidence: high
    confidence_basis: >
      The send is visible in the bean code, the queue reference is declared in
      ejb-jar.xml, and the petstore deployment descriptor binds it to the order
      queue, with the caller visible in OrderEJBAction. What the consumer does with
      the message is outside this shard and not verified here.
    risk_class: operational
    basis: >
      sendAMessage creates a text message, sets the supplied text and sends it to
      the configured queue; the petstore binding maps that queue to OrderQueue and
      the checkout action sends the purchase order XML through it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 74
        line_end: 79
        excerpt: |
          qConnect = qFactory.createQueueConnection();
          session = qConnect.createQueueSession(true,0);
          qSender = session.createSender(q);
          TextMessage jmsMsg = session.createTextMessage();
          jmsMsg.setText(msg);
          qSender.send(jmsMsg);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
        line_start: 497
        line_end: 498
        excerpt: |
          <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
          <jndi-name>jms/opc/OrderQueue</jndi-name>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 153
        line_end: 153
        excerpt: |
          sender.sendAMessage(purchaseOrder.toXML());
    stack_metadata:
      framework: J2EE 1.3
      ejb.bean: AsyncSenderEJB (Stateless)
      ejb.transaction: Required
      jms.queue: jms/AsyncSenderQueue -> jms/opc/OrderQueue (petstore)

  - record_key: ORDER-APPROVAL-INTEGRATION-0001
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL deliver an administrator's order approval or denial decisions
      to order processing asynchronously, as a single XML text message on the
      order-approval queue.
    plain_text: >
      When an administrator approves or denies orders, those decisions are passed on
      to the order-processing back office as one message, without the administrator
      waiting for the back office to act on them.
    technical_note: >
      The same AsyncSender bean is reused by the admin app: AdminRequestBD.updateOrders
      sends OrderApproval.toXML(), and the admin sun-j2ee-ri.xml binds the logical
      jms/AsyncSenderQueue to jms/opc/OrderApprovalQueue.
    confidence: high
    confidence_basis: >
      The bean code, the declared queue reference, the admin deployment binding and
      the admin caller all agree. The consumer of the message is outside this shard.
    risk_class: operational
    basis: >
      The admin deployment binds the bean's queue to OrderApprovalQueue and the admin
      business delegate sends the approval document through sendAMessage.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/sun-j2ee-ri.xml
        line_start: 96
        line_end: 97
        excerpt: |
          <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
          <jndi-name>jms/opc/OrderApprovalQueue</jndi-name>
