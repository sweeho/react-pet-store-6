            public void ejbCreate( ) throws CreateException {
                  try {
                ServiceLocator serviceLocator = new ServiceLocator();
                qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
                q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
                  } catch (ServiceLocatorException sle) {
                throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
                  }
            }
    stack_metadata:
      ejb.bean: AsyncSenderEJB

  - record_key: SIGN-ON-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT apply any role check of its own to the message hand-off service; it SHALL
      be available to any in-process caller and SHALL run under the caller's identity.
    plain_text: >
      The internal "pass this message on" service has no access restriction of its own; who may
      trigger it is decided by the screens and actions that use it.
    technical_note: >
      ejb-jar.xml grants <unchecked/> method permission on every local and local-home method,
      including sendAMessage, and the security identity is use-caller-identity. The bean is exposed
      only through local interfaces.
    confidence: medium
    confidence_basis: >
      Single declarative source (ejb-jar.xml); no programmatic check exists to corroborate or contradict.
      Filed under sign-on as the closest capability to access control; it is infrastructure, not a
      user-facing access rule.
    risk_class: operational
    basis: >
      method-permission unchecked over all methods; use-caller-identity.
