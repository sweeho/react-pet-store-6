findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
    record_key: CHECKOUT-BUSINESS-RULE-0001
    description: >
      The bean opens a transacted JMS session (createQueueSession(true,0)) and never calls
      session.commit(). Inside a container-managed transaction the container ignores these
      arguments and commits with the JTA transaction, so the message is delivered. If the bean were
      ever invoked without a JTA transaction the message would never be committed. The Required
      attribute should prevent that; a human should confirm the rebuild must keep "deliver on commit
      of the caller's work" semantics.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
    description: >
      The message carries no properties, priority, expiry or delivery mode override; message
      format is whatever XML the caller passes. Durability and retry of delivery are left to the
      JMS provider defaults, which are not visible in source. No requirement emitted for them.

suspected_defects:
  - capability_key: checkout
    record_keys: [CHECKOUT-BUSINESS-RULE-0002]
    severity: low
    category: error-swallowed
    title: Failure to close the queue connection is silently ignored
    description: >
      After every send, any exception raised while closing the queue connection is caught and
      discarded with no logging. A connection that fails to close leaves no trace, which can mask
      resource leaks in the messaging provider.
