      ejb.bean: AsyncSenderEJB

  - record_key: CHECKOUT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      GIVEN a message is being handed off to order processing
      WHEN the queue cannot be reached or the send fails for any reason
      THEN the system SHALL report the failure to the caller as an error and SHALL NOT report the
      hand-off as successful.
    plain_text: >
      If the order cannot be passed on to processing, the sending step fails rather than silently
      pretending it worked.
    technical_note: >
      sendAMessage catches every Exception, prints the stack trace and rethrows it as
      EJBException("askMDBToSendAMessage: Error!"). A failure to look up the queue or connection
      factory at bean creation is likewise rethrown as EJBException("AsyncSenderEJB.ejbCreate failed").
      An EJBException is a system exception and causes the container to roll back the transaction.
      How each caller handles that exception is outside this shard.
    confidence: medium
    confidence_basis: >
      One clear place each for the send path and the creation path; caller-side handling was only
      glanced at and not graded here.
    risk_class: operational
    basis: >
      Catch-all around the send rethrows as EJBException; ejbCreate rethrows lookup failure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 82
        excerpt: |
              }catch  (Exception e) {
                e.printStackTrace();
                throw new EJBException("askMDBToSendAMessage: Error!",e);
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
