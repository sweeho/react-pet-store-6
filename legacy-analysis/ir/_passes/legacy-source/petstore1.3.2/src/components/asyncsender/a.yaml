  - record_key: CHECKOUT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL enqueue the hand-off message within the caller's unit of work, joining the
      caller's transaction if one exists and starting one otherwise, so that the message is
      delivered only if that unit of work commits.
    plain_text: >
      An order (or approval decision) is only passed on to processing if the step that sent it
      completes successfully; if that step is undone, the message is not delivered.
    technical_note: >
      ejb-jar.xml declares trans-attribute Required on sendAMessage(String), and the bean opens a
      transacted JMS session (createQueueSession(true,0)). Under container-managed transactions the
      send is enlisted in the JTA transaction and is released on commit.
    confidence: medium
    confidence_basis: >
      The transaction attribute is declared and the session is transacted, but the commit-coupled
      delivery depends on the container enlisting the JMS session, which cannot be observed in source.
    risk_class: operational
    basis: >
      Declared container transaction Required on the only business method, plus a transacted session.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>AsyncSenderEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>sendAMessage</method-name>
                  <method-params>
                    <method-param>java.lang.String</method-param>
                  </method-params>
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
