# No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no document traces are cited.
# The component is a generic "put one text message on a queue" service. Which queue it targets is
# decided per deploying application (sun-j2ee-ri.xml), so its business meaning is filed under the
# capability of each deploying application: checkout (storefront -> order queue) and
# order-approval (admin -> order approval queue).
records:
  - record_key: CHECKOUT-INTEGRATION-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL hand a submitted purchase order to order processing asynchronously, by
      placing the order document, as a single text message, on the order processing queue, so
      that order submission does not wait for order processing to complete.
    plain_text: >
      When a customer places an order, the shop passes the whole order on to the back-office
      order processing system as one message and does not wait for it to be processed.
    technical_note: >
      AsyncSenderEJB.sendAMessage(String) wraps the string in a JMS TextMessage and sends it to the
      queue bound to java:comp/env/jms/AsyncSenderQueue. In the petstore application that reference
      is bound to jms/opc/OrderQueue (apps/petstore/src/sun-j2ee-ri.xml), and the caller is
      OrderEJBAction, which sends purchaseOrder.toXML().
    confidence: high
    confidence_basis: >
      The send is visible in the bean code, the queue reference is declared in ejb-jar.xml, and the
      binding to the order queue plus the calling action are visible in the petstore application.
      Not higher-risk-checked: what the consumer does with the message is outside this shard.
    risk_class: operational
    basis: >
      sendAMessage creates a TextMessage with the caller's text and sends it to the configured
      queue; the storefront binds that queue to the OPC order queue and passes the purchase order XML.
