  - record_key: CUST-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an address is received as a document THEN the system SHALL reject it unless street
      line 1, city, state, zip code and country are each present and non-empty; a second street
      line, if present, SHALL also be non-empty.
    plain_text: >
      An address received from another part of the system must include the first street line,
      city, state, zip code and country, none of them blank, or it is refused.
    technical_note: >
      Address.fromDOM reads each element with optional=false; XMLDocumentUtils.getNextSibling
      throws XMLDocumentException "<name> element expected after ..." when the element is
      missing, and getContent throws "<tag> element: content expected." when its text is empty.
      This is the parse path used when addresses travel inside XML documents (e.g. purchase
      orders). It does not apply to addresses created directly on the stored record (see
      CUST-BR-0004).
    confidence: medium
    confidence_basis: >
      One clear place enforces it (fromDOM plus the helper it calls). The DTD agrees for every
      field except country, which it marks optional, so the second source does not fully
      corroborate; hence medium and a dispute on country.
    dispute:
      reason: conflicting-sources
      detail: >
        Address.dtd declares Country as optional ("Country?"); Address.fromDOM requires it and
        throws when it is missing or empty. A DTD-valid document without Country is therefore
        rejected by the reader. Settle by deciding whether country is mandatory on an address,
        and by checking whether any producer in the wider application emits addresses without
        Country.
    risk_class: operational
    basis: >
      Non-optional element and content lookups in fromDOM; failure behaviour in XMLDocumentUtils.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
