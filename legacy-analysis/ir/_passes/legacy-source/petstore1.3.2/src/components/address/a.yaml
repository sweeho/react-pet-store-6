  - record_key: CUST-BR-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an address is received as a document THEN the system SHALL require its parts in the
      fixed order street line 1, optional street line 2, city, state, zip code, country, and
      SHALL reject a document whose parts appear in any other order.
    plain_text: >
      The parts of an exchanged address must arrive in a fixed order (street, street, city,
      state, zip, country); an address in a different order is refused.
    technical_note: >
      Address.fromDOM walks siblings with XMLDocumentUtils.getNextSibling, which inspects only
      the next element sibling and stops ("break") if its tag does not match, throwing for a
      required element. toDOM writes in the same order. The DTD sequence declares the same order.
    confidence: high
    confidence_basis: >
      The order is enforced by the reader, produced by the writer and declared by the DTD
      sequence content model; three agreeing places.
    risk_class: operational
    basis: >
      Sequential next-sibling lookup in fromDOM and its helper; append order in toDOM; DTD
      sequence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 138
        line_end: 150
        excerpt: |
          public static Element getNextSibling(Element element, String name, boolean optional) throws XMLDocumentException {
                for (Node sibling = element.getNextSibling(); sibling != null; sibling = sibling.getNextSibling()) {
              if (sibling.getNodeType() == Node.ELEMENT_NODE) {
                        if (((Element) sibling).getTagName().equals(name)) {
                  return (Element) sibling;
                        }
                        break;
              }
                }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            ...
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
    stack_metadata:
      framework: DOM / JAXP

  - record_key: CUST-BR-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL store an address without validating its contents: an address MAY be
      created with all six values supplied, copied from an existing address, or created empty,
      and any value MAY be absent or blank at the point of storage.
    plain_text: >
      Saving an address does not itself check anything; an address can even be saved completely
      blank and filled in later.
    technical_note: >
      AddressEJB has three ejbCreate variants (six Strings; an Address value object; no
      arguments). Each only calls the CMP setters with no null/empty checks and declares
      CreateException without ever throwing it. ejb-jar.xml declares no constraints. Any checks
      must therefore live in callers (web forms, ContactInfoEJB, PurchaseOrder), outside this
      shard. ContactInfoEJB.ejbCreate() calls the no-argument create.
    confidence: medium
    confidence_basis: >
      The absence of validation is directly visible in the bean and descriptor of this module.
      Not high because no DDL is in this shard; a database NOT NULL constraint elsewhere could
      still reject blank values at write time.
    risk_class: operational
    basis: >
      ejbCreate bodies contain only setter calls; the no-arg create returns with no field set.
    traces:
