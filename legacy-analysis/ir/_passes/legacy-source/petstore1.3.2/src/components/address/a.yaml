    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL hold a postal address as a record of six text values: street line 1,
      street line 2, city, state, zip code and country.
    plain_text: >
      An address is made up of two street lines, a city, a state, a zip (postal) code and a
      country.
    technical_note: >
      AddressEJB is a CMP 2.x local entity bean with six String CMP fields (streetName1,
      streetName2, city, state, zipCode, country) declared in ejb-jar.xml and mirrored by the
      Address value object and the Address.dtd XML element. The primary key class is
      java.lang.Object (container-generated); an address has no business identifier of its own
      and is reached through the contact-info record that owns it (ContactInfoEJB, separate shard).
    confidence: high
    confidence_basis: >
      The same six fields are declared independently in the deployment descriptor, the bean
      class, the value object and the DTD. Graded high because four places agree; field lengths
      and column types are not visible (no DDL in this module).
    risk_class: operational
    basis: >
      cmp-field declarations in ejb-jar.xml; abstract getters/setters in AddressEJB; private
      fields in Address; Address element content model in Address.dtd.
