  - capability_key: customer-account
    record_keys: [CUST-BR-0002, CUST-BR-0004]
    severity: medium
    category: data-corruption
    title: A stored address can be written out in a form the system itself refuses to read back
    description: >
      Storing an address applies no checks, and an address can be created entirely blank.
      When such an address is written out as a document, missing values become empty elements
      rather than being omitted, and the reader rejects any empty street line 1, city, state,
      zip code or country. An incomplete stored address therefore produces a document that
      fails when the system reads it back (for example when it travels inside an order
      document).
    traces:
