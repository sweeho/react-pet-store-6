  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL allow each part of a stored address to be read and changed individually
      after creation, and SHALL provide the whole address as a single detached copy whose later
      modification does not alter the stored address.
    plain_text: >
      Any line of a saved address can be changed on its own, and the full address can be read
      out in one go.
    technical_note: >
      AddressLocal exposes a getter and setter per CMP field plus getData(), which builds a new
      Address value object from the current field values. ejb-jar.xml grants unchecked
      (unrestricted) permission on every local method and runs every getter, setter, getData and
      remove under transaction attribute Required. The bean is local-only, so it is reachable
      only from components in the same application (no remote interface).
    confidence: high
    confidence_basis: >
      Declared in the local interface and implemented in the bean, with matching permission and
      transaction entries in the descriptor. Whether any caller actually edits individual fields
      is not visible in this shard.
    risk_class: operational
    basis: >
      Per-field setters on AddressLocal; getData constructing a new value object; unchecked
      method-permission and Required container-transaction entries.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocal.java
