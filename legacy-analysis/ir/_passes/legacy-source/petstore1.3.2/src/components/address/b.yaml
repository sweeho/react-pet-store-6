  - record_key: CUST-RULE-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an address is received as an XML document, the system SHALL require, in this
      order, a non-empty first street line, an optional second street line, a non-empty
      city, a non-empty state and a non-empty zip code, and SHALL reject the document
      with an error naming the missing or empty element otherwise.
    plain_text: >
      An address received from another system must contain street, city, state and
      postal code, in that order, none of them blank; a second street line may be
      included. Otherwise the address is refused.
    technical_note: >
      Address.fromDOM reads children with XMLDocumentUtils.getFirstChild/getNextSibling
      (optional=false) and getContentAsString(optional=false), which throw
      XMLDocumentException when an element is missing, out of order or has empty text.
      The DTD Address.dtd states the same order and cardinality.
    confidence: high
    confidence_basis: >
      Enforced by the DTD content model and independently by the programmatic parser,
      which also rejects empty text (stricter than the DTD's #PCDATA).
    risk_class: operational
    basis: >
      DTD sequence (StreetName, StreetName?, City, State, ZipCode, ...) and the
      non-optional reads in fromDOM; getContent throws "content expected" on empty text.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 179
        excerpt: |
            public static Address fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
                Element child;
                Address address = new Address();
                child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
                address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
                Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
                if (optionalChild != null) {
                  address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                  child = optionalChild;
                }
                child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
                address.city = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
                address.state = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
                address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
                address.country = XMLDocumentUtils.getContentAsString(child, false);
                return address;
              }
              throw new XMLDocumentException(XML_ADDRESS + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 153
        line_end: 166
        excerpt: |
            public static String getContent(Element element, boolean optional) throws XMLDocumentException {
                  StringBuffer buffer = new StringBuffer();
                  ...
                  if (!optional && buffer.length() == 0) {
                throw new XMLDocumentException(element.getTagName() + " element: content expected.");
                  }
                  return buffer.toString();
            }
    stack_metadata:
      xml.dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN"
      xml.root: Address

  - record_key: CUST-RULE-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an address is received as an XML document, the system SHALL require a
      non-empty country element after the zip code and SHALL reject an address without
      one.
    plain_text: >
      An address received from another system is refused if it has no country.
    technical_note: >
      Address.fromDOM reads Country with getNextSibling(..., false) and
      getContentAsString(..., false), so a missing or empty Country throws. The DTD
      declares Country optional (Country?), so a DTD-valid document can still be
      rejected by the parser.
    confidence: medium
    confidence_basis: >
      The parser behaviour is unambiguous in one place, but the DTD for the same
      document says the opposite; the two sources disagree, so not high.
    dispute:
      reason: conflicting-sources
      detail: >
        Address.dtd line 38 declares Country optional (Country?); Address.fromDOM
        line 175-176 requires it and requires non-empty content. Live behaviour when
        parsing is "required" (the code throws), but the published contract says
        optional. An SME must decide whether country is mandatory for exchanged
        addresses. Checking whether any partner/sample XML in the wider tree omits
        Country would settle which side senders rely on.
    risk_class: operational
    basis: >
      Non-optional Country read in fromDOM versus optional Country in the DTD.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 175
        line_end: 176
        excerpt: |
                child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
                address.country = XMLDocumentUtils.getContentAsString(child, false);
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      xml.root: Address

  - record_key: CUST-RULE-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an address is written as an XML document, the system SHALL emit the first
      street line, the second street line only if it is present and non-empty, then
      city, state, zip code and country, in that order; GIVEN a field other than the
      second street line has no value, THEN the system SHALL emit that element with
      empty content rather than omit it.
    plain_text: >
      When an address is sent to another system, the second street line is left out if
      blank; every other part is always included, even when blank.
    technical_note: >
      Address.toDOM appends StreetName (line 1), conditionally a second StreetName when
      streetName2 is non-null and not "", then City, State, ZipCode, Country.
      XMLDocumentUtils.appendChild writes "" for a null value.
    confidence: high
    confidence_basis: >
      The emit order and the streetName2 condition are explicit in toDOM, and the
      null-to-empty behaviour is explicit in the shared appendChild helper; the order
      matches the DTD.
    risk_class: operational
    basis: >
      toDOM statement sequence and the streetName2 guard; appendChild null handling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ADDRESS);
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
              if (streetName2 != null && !streetName2.equals("")) {
                XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
              }
              XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
              XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
              XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
              XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
              return root;
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 297
        line_end: 302
        excerpt: |
            public static void appendChild(Document document, Node root, String name, String value) {
                  Node node = document.createElement(name);
                  node.appendChild(document.createTextNode(value != null ? value : ""));
                  root.appendChild(node);
                  return;
            }
    stack_metadata:
      xml.root: Address

  - record_key: CUST-RULE-0005
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL permit any caller inside the application to read, create, change
      and remove an address without a role check; access to addresses SHALL be
      controlled only by whatever owns them.
    plain_text: >
      Addresses have no access rules of their own; who may see or change an address is
      decided by the customer or order it belongs to.
    technical_note: >
      ejb-jar.xml grants <unchecked/> method-permission on every Local and LocalHome
      method, and security-identity is use-caller-identity. The bean has only local
      interfaces, so it is reachable only from components in the same application.
      Filed under customer-account rather than sign-on because it describes the address
      record, not sign-on rules.
    confidence: high
    confidence_basis: >
      The unchecked permission is declared explicitly for every method, and the
      local-only interfaces are declared both in ejb-jar.xml and in the Java interfaces.
    risk_class: operational
    basis: >
      Unchecked method permissions and local-only view.
