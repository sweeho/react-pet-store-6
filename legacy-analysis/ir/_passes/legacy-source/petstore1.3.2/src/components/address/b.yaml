  - record_key: CUST-REQ-0002
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL identify each stored address by a system-generated key with no
      business meaning; the address SHALL have no natural key and SHALL be looked up
      only by that key.
    plain_text: >
      Each saved address gets an internal identifier. Two identical addresses are still
      two separate records; addresses cannot be searched by their content.
    technical_note: >
      ejb-jar.xml declares prim-key-class java.lang.Object (unknown primary key, so the
      container generates it) and ejbCreate returns null. The only finder is
      findByPrimaryKey(Object).
    confidence: medium
    confidence_basis: >
      The unknown-primary-key declaration and the single finder are both visible, but
      how the container generated keys (and the resulting column) is vendor
      configuration not present in this module.
    risk_class: operational
    basis: >
      Object primary key class plus findByPrimaryKey as the sole finder.
    traces:
