records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain a postal address consisting of a first street line,
      an optional second street line, a city, a state, a zip code and a country,
      each held as free text.
    plain_text: >
      A postal address has two street lines (the second is optional), a city, a state
      or region, a postal code and a country.
    technical_note: >
      AddressEJB is a CMP 2.x local entity bean (abstract schema "Address") with six
      String cmp-fields: streetName1, streetName2, city, state, zipCode, country. The
      Address value object mirrors the same six fields. Referenced by ContactInfoEJB
      (customer contact details) and used by purchase-order XML.
    confidence: high
    confidence_basis: >
      The same six fields are declared in three independent places: the ejb-jar.xml
      cmp-field list, the AddressEJB abstract accessors and the Address.dtd element
      model. Optionality of the second street line is only stated in the DTD and the
      XML code, not at the persistence layer.
    risk_class: operational
    basis: >
      Deployment descriptor cmp-fields and the bean's abstract getters/setters define
      the persistent shape; the DTD defines the exchanged shape.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 46
        line_end: 80
        excerpt: |
          <entity>
            <display-name>AddressEJB</display-name>
            <ejb-name>AddressEJB</ejb-name>
            ...
            <abstract-schema-name>Address</abstract-schema-name>
            <cmp-field> ... <field-name>zipCode</field-name> </cmp-field>
            <cmp-field> ... <field-name>streetName2</field-name> </cmp-field>
            <cmp-field> ... <field-name>state</field-name> </cmp-field>
            <cmp-field> ... <field-name>streetName1</field-name> </cmp-field>
            <cmp-field> ... <field-name>city</field-name> </cmp-field>
            <cmp-field> ... <field-name>country</field-name> </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 62
        line_end: 67
        excerpt: |
            private String streetName1;
            private String streetName2;
            private String city;
            private String state;
            private String zipCode;
            private String country;
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
    stack_metadata:
      framework: ejb-2.0
      ejb.bean: AddressEJB
      ejb.persistence: Container (CMP 2.x)
      db.object: Address (abstract schema)

  - record_key: CUST-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL NOT validate address field content when an address is stored:
      any field, including the first street line, city, state, zip code and country,
      MAY be stored empty or absent, and no format is enforced on zip code, state or
      country.
    plain_text: >
      When an address is saved, nothing checks it: any part of it can be blank, and the
      postal code, state and country can hold any text.
    technical_note: >
      AddressEJB.ejbCreate(...) and ejbCreate(Address) copy every argument straight to
      the CMP setters with no checks; ejbCreate() creates an address with every field
      unset. No validator exists in this module. Any validation would have to live in
      the web tier (outside this shard).
    confidence: medium
    confidence_basis: >
      The absence of validation is clearly visible in the one place values enter the
      entity (the create methods and plain setters). I could not see the database DDL
      for the Address table, which might impose NOT NULL; nor the web-tier forms, which
      might validate before reaching this layer. Not high for that reason.
    risk_class: operational
    basis: >
      Create methods assign parameters unchanged; the no-argument create returns an
      entity with no field set.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 82
        excerpt: |
            public Object ejbCreate(String streetName1, String streetName2, String city,
                                    String state, String zipCode, String country) throws CreateException {
                                      setStreetName1(streetName1);
                                      setStreetName2(streetName2);
                                      setCity(city);
                                      setState(state);
                                      setZipCode(zipCode);
                                      setCountry(country);
                                      return null;
            }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 99
        line_end: 101
        excerpt: |
            public Object ejbCreate() throws CreateException {
              return null;
            }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL allow an address to be created empty (all fields unset) and filled
      in afterwards, as well as created from six individual values or from a complete
      address value, and SHALL allow each field to be changed individually after creation.
    plain_text: >
      An address can be started blank and filled in later, or created in one go; each
      part of it can be updated on its own afterwards.
    technical_note: >
      AddressLocalHome exposes create(), create(6 Strings) and create(Address). Every
      field has a public local setter. ContactInfoEJB.ejbPostCreate() calls adh.create()
      to attach a blank address to every new contact record.
    confidence: high
    confidence_basis: >
      Declared in the home interface, implemented in the bean, permitted in ejb-jar.xml,
      and the blank-create path is actually called by the contact-info component.
    risk_class: operational
    basis: >
      Three create signatures in the local home; the no-arg create is used by the
      contact information entity when it is created.
    traces:
