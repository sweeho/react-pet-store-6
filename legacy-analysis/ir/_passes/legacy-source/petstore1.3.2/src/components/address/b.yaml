    title: An address the system stores can produce XML the system itself rejects
    description: >
      Storing an address accepts blank fields (an address is even created entirely
      blank for every new contact). Writing that address as XML emits empty City,
      State, ZipCode, Country or first StreetName elements, but reading XML requires
      each of those to be non-empty, so the address does not survive a write/read
      round trip and the receiving step fails.
