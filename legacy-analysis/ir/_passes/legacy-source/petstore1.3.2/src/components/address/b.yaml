  - record_key: CUST-RULE-0006
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL perform every read and update of an individual address field,
      reading the whole address, and removing an address within a transaction, joining
      the caller's transaction when one exists.
    plain_text: >
      Changes to an address are saved together with the rest of the change they belong
      to; a failed update does not leave a half-changed address.
    technical_note: >
      ejb-jar.xml declares trans-attribute Required on all getters/setters, getData and
      remove of the Local interface. The three LocalHome create methods and
      findByPrimaryKey have no container-transaction entry (container default applies).
    confidence: medium
    confidence_basis: >
      Declared in one place (the deployment descriptor). The behaviour for create and
      find depends on the container default, which is not visible in the source.
    risk_class: operational
    basis: >
      container-transaction entries with Required for Local methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 250
        line_end: 258
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>AddressEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>getCountry</method-name>
                  <method-params />
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
