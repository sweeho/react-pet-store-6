suspected_defects:
  - capability_key: localization
    record_keys: [LOCALIZATION-REQ-0001]
    severity: low
    category: other
    title: The coded ASCII fallback never applies when no encoding is configured
    description: >
      The filter declares a fallback of ASCII "by default", but on start-up it unconditionally
      replaces that fallback with the configured "encoding" value. If a deployment omits the
      setting, the value becomes empty (null) rather than ASCII, and every request is passed to
      the container with no encoding set, so the container's own default decides how text is read.
      In the shipped storefront configuration the value is present (UTF-8), so today's behaviour
      is unaffected; the risk applies only to a deployment that reuses the filter without the setting.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 58
        line_end: 64
        excerpt: |
              // default to ASCII
              private String targetEncoding = "ASCII";

              public void init(FilterConfig config) throws ServletException {
                  this.config = config;
                  this.targetEncoding = config.getInitParameter("encoding");
              }
