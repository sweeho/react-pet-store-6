records:
  - record_key: CUST-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL identify each customer by a user id that is unique across all
      customers, and SHALL refuse to create a second customer with a user id that
      already exists.
    plain_text: >
      Every customer is known by their user id, and no two customers can share the
      same user id.
    technical_note: >
      CustomerEJB is a CMP 2.x entity whose only CMP field, userId, is declared as the
      primary key in ejb-jar.xml; CustomerLocalHome.create(String userId) is the only
      creation path. Uniqueness is enforced by the container's primary-key constraint
      (DuplicateKeyException), not by application code.
    confidence: high
    confidence_basis: >
      Stated in two independent places: the deployment descriptor's primkey-field and
      the create/findByPrimaryKey signatures keyed on userId. The exact behaviour on a
      duplicate (the error shown) is container-supplied and not visible in this module,
      which is why the refusal is stated generically.
    risk_class: operational
    basis: >
      userId is the sole CMP field and the primary key; the home interface creates and
      finds customers by that key only.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 57
        line_end: 61
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>userId</field-name>
          </cmp-field>
          <primkey-field>userId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerLocalHome.java
        line_start: 47
        line_end: 49
        excerpt: |
          public CustomerLocal create(String userId) throws CreateException;

          public CustomerLocal findByPrimaryKey(String userId) throws FinderException;
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CustomerEJB
      db.object: Customer (abstract schema)

