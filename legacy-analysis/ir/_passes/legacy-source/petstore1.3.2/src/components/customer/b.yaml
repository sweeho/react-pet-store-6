    severity: medium
    category: other
    title: Credit-card and contact data have no data-layer access control
    description: >
      All methods on customer, account, contact, address and credit-card records are
      unrestricted. Any code in the application that can reach these records can read
      or replace a customer's card number and personal details without a role check.
    traces:
