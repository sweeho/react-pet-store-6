  - capability_key: customer-account
    record_keys: [CUST-ENTITY-0005]
    severity: medium
    category: unreachable-branch
    title: Account status "disabled" is defined but never set or checked
    description: >
      Accounts carry a status with defined values "active" and "disabled", but nothing
      in the application assigns "disabled" or reads the status to restrict anything.
      Every account is active and stays active; a disabled account, if one were ever
      stored, would behave exactly like an active one.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
