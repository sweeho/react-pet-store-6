    requirement: >
      WHEN a new customer is created THEN the system SHALL create exactly one account
      for that customer with status "active".
    plain_text: >
      A newly registered customer's account starts out active.
    technical_note: >
      CustomerEJB.ejbPostCreate looks up the Account home and calls
      create(AccountLocalHome.Active), where Active = "active", then links it via the
      account relationship. AccountEJB.ejbCreate and ejbPostCreate both set the status.
    confidence: high
    confidence_basis: >
      The constant value and its use at creation are both read directly, and the
      status is set in AccountEJB in two places (ejbCreate and ejbPostCreate).
    risk_class: operational
    basis: >
      Customer creation unconditionally creates an Account with the Active constant.
    traces:
