  - record_key: CUST-BR-0011
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT impose any role check on reading or changing customer,
      account, profile, contact-information, address or credit-card data at the data
      layer; access to these records SHALL be controlled only by the calling
      application tier.
    plain_text: >
      Customer data, including payment cards, has no access restriction of its own;
      only the screens and services in front of it decide who may see or change it.
    technical_note: >
      ejb-jar.xml assembly-descriptor marks every method of ProfileEJB, AddressEJB,
      ContactInfoEJB, CreditCardEJB, CustomerEJB and AccountEJB as <unchecked/>, with
      use-caller-identity. No security roles are declared in this module. Filed under
      sign-on as the closest listed capability for access control.
    confidence: high
    confidence_basis: >
      Declarative and exhaustive: seven unchecked method-permission blocks covering all
      six beans and no role declarations anywhere in the descriptor.
    risk_class: regulated
    basis: >
      All method permissions in the module are unchecked.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 372
        line_end: 378
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>ProfileEJB</ejb-name>
              <method-name>*</method-name>
            </method>
          </method-permission>
    stack_metadata:
      ejb.bean: all beans in CustomerJAR

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerLocalHome.java
    description: >
      The duplicate-customer refusal (CUST-ENTITY-0001) relies on the container's
      primary-key handling; this module defines no user-facing message for it. What a
      user sees when signing up with an existing user id must be settled from the
      calling application and sign-on components, not from this module.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      This module's descriptor also declares ContactInfo, Address and CreditCard
      entities (fields familyName, givenName, telephone, email; street lines, city,
      state, zipCode, country; cardType, cardNumber, expiryDate), but their bean
      classes live in other components. Their field rules were not extracted here to
      avoid duplicating those components' shards; a human should confirm they are
      covered there.

