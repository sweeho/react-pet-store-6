  - record_key: CUST-BR-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an account is created from a status alone THEN the system SHALL also create
      an empty contact-information record and an empty credit-card record and attach
      both to the account; WHEN an account is created with supplied contact
      information and credit card THEN the system SHALL attach those instead.
    plain_text: >
      Every account always has a contact-details record and a payment-card record.
      For a new sign-up they start blank; when existing details are supplied, those
      are used.
    technical_note: >
      AccountEJB has two create paths. create(status) in ejbPostCreate calls
      ContactInfoLocalHome.create() and CreditCardLocalHome.create() with no
      arguments and sets both relationships. create(status, contactInfo, creditCard)
      sets the supplied objects in ejbPostCreate. The customer sign-up path uses the
      first form; the sample-data populator uses the second.
    confidence: high
    confidence_basis: >
      Both creation paths are read directly in AccountEJB and declared in
      AccountLocalHome, and the callers of each form were located (CustomerEJB for the
      one-argument form; the populator outside this module for the three-argument form).
    risk_class: regulated
    basis: >
      Account post-create logic always establishes contactInfo and creditCard
      relationships; these hold personal data and card data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 99
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
              setStatus(status);
              try {
                  InitialContext ic = new InitialContext();
                  ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                  ContactInfoLocal contactInfo = cih.create();
                  setContactInfo(contactInfo);
                  CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                  CreditCardLocal creditCard = cch.create();
                  setCreditCard(creditCard);
              } catch (javax.naming.NamingException ne) {
                  throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
              }

          }

          public void ejbPostCreate(String status, ContactInfoLocal contactInfo, CreditCardLocal creditCard) throws CreateException {
              setContactInfo(contactInfo);
              setCreditCard(creditCard);
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 51
        line_end: 54
        excerpt: |
          public AccountLocal create(String status) throws CreateException;

          public AccountLocal create(String status, ContactInfoLocal contactInfo,
          CreditCardLocal creditCard) throws CreateException;
    stack_metadata:
      ejb.bean: AccountEJB
      ejb.transaction: Required

