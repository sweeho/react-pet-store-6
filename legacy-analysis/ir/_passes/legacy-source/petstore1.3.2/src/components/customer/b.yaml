  - record_key: CUST-BR-0009
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN creation of a customer's account or profile fails THEN the system SHALL
      fail the creation of the customer as a whole, so that no customer exists
      without an account and a profile.
    plain_text: >
      Signing up a customer either creates the customer with their account and
      preferences together, or creates nothing.
    technical_note: >
      Every bean method in the module is declared trans-attribute Required (80
      container-transaction entries), so CustomerLocalHome.create and the nested
      Account/Profile/ContactInfo/CreditCard creates share one transaction. A
      NamingException during sub-record lookup is rethrown as CreateException.
    confidence: medium
    confidence_basis: >
      The transaction attributes and the CreateException rethrow are read directly,
      but the all-or-nothing outcome depends on container rollback semantics for
      CreateException, which are not visible in the source (an application exception
      does not by itself mark the transaction for rollback).
    risk_class: operational
    basis: >
      Uniform Required transactions and exception propagation from ejbPostCreate.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 675
        line_end: 683
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CustomerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getAccount</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 86
        line_end: 88
        excerpt: |
