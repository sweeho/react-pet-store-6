records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL hold one customer record per user id, where the user id is the
      customer's unique identifier, and each customer SHALL own exactly one account and
      exactly one profile.
    plain_text: >
      Every customer is identified by their user id. Each customer has one account
      (contact details, payment card, status) and one profile (preferences).
    technical_note: >
      CustomerEJB is a CMP 2.x entity with primary key field userId (java.lang.String).
      One-to-one CMRs "account" (to AccountEJB) and "profile" (to ProfileEJB) are declared
      in the customer ejb-jar.xml. The deployed table CustomerEJBTable has PRIMARY KEY
      ("userId") and foreign-key columns to the account and profile tables.
    confidence: high
    confidence_basis: >
      Enforced in two independent places: the deployment descriptor declares userId as
      the primary key and the one-to-one relationships, and the deployed DDL makes userId
      the table's primary key. Multiplicity "One" on both ends is declared, not inferred.
    risk_class: operational
    basis: >
      primkey-field userId in ejb-jar.xml; CMR fields account and profile with
      multiplicity One/One; CustomerEJBTable DDL primary key on userId.
    traces:
