  - record_key: CUST-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a customer already exists with user id U
      WHEN a new customer is created with user id U
      THEN the system SHALL refuse the creation and SHALL NOT create a second customer
      record for U.
    plain_text: >
      Two customers can never share the same user id; trying to register a user id that
      already has a customer is rejected.
    technical_note: >
      Uniqueness comes from the primary key alone: CustomerLocalHome.create(userId) sets
      userId as the PK, and the container/database reject a duplicate key
      (DuplicateKeyException / PK violation on CustomerEJBTable). There is no explicit
      duplicate check in this component; how the rejection is surfaced to the user is
      handled by the calling application, not here.
    confidence: high
    confidence_basis: >
      Primary-key uniqueness is declared in the deployment descriptor and in the deployed
      DDL (two places). What this pass cannot see is the user-facing message on
      rejection, which lives outside this module.
    risk_class: operational
    basis: >
      userId is the primary key; create(String userId) is the only create method and
      sets that key.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerLocalHome.java
        line_start: 47
        line_end: 49
        excerpt: |
              public CustomerLocal create(String userId) throws CreateException;

              public CustomerLocal findByPrimaryKey(String userId) throws FinderException;
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 69
        line_end: 72
        excerpt: |
              public String ejbCreate(String userId) throws CreateException {
                  setUserId(userId);
                  return null;
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
        line_start: 308
        line_end: 308
        excerpt: |
                    <sql>CREATE TABLE "CustomerEJBTable" ("_account___PMPrimaryKey" LONGINT , "_profile___PMPrimaryKey" LONGINT , "userId" VARCHAR(255), CONSTRAINT "pk_CustomerEJBTabl" PRIMARY KEY ("userId") )</sql>
    stack_metadata:
      framework: ejb-2.x-cmp
      ejb.bean: CustomerEJB
      db.object: CustomerEJBTable

  - record_key: CUST-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a customer is created
      THEN the system SHALL create, in the same operation, an account for that customer
      whose status is "active", and a profile for that customer carrying the default
      preferences.
    plain_text: >
      Creating a customer automatically opens an account for them that starts out active,
      and gives them a profile with the standard default preferences.
    technical_note: >
      CustomerEJB.ejbPostCreate looks up AccountLocalHome and calls
      create(AccountLocalHome.Active) where Active = "active", then looks up
      ProfileLocalHome and calls create(...) with the four Default* constants, and links
      both via the CMR setters. CustomerLocalHome.create runs with trans-attribute
      Required.
    confidence: medium
    confidence_basis: >
      One clear code path (ejbPostCreate) plus the constant definitions; no test,
      comment or DDL default restates the "active" initial status.
    risk_class: operational
    basis: >
      ejbPostCreate creates the account with status Active and the profile with default
      values, and attaches both to the new customer.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
              public void ejbPostCreate(String userId) throws CreateException {
                  try {
                  InitialContext ic = new InitialContext();
                  AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
                  AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);

                  ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
                  ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
                  ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
                  ProfileLocalHome.DefaultBannerPreference);
                  setProfile(profile);
                  } catch (NamingException ne) {
                      throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
                  }
              }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
              public static final String Active = "active";
              public static final String Disabled = "disabled";
    stack_metadata:
      framework: ejb-2.x-cmp
      ejb.bean: CustomerEJB
      ejb.transaction: Required

  - record_key: CUST-BR-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a customer profile is created at customer creation
      THEN the system SHALL set the preferred language to "en_US", leave the favourite
      category unset, turn the MyList preference on, and turn the banner preference on.
    plain_text: >
      A new customer starts with US English as their language, no favourite category,
      the "my list" feature switched on and banners switched on.
    technical_note: >
      Constants on ProfileLocalHome: DefaultPreferredLanguage = "en_US",
      DefaultFavoriteCategory = null, DefaultMyListPreference = true,
      DefaultBannerPreference = true; passed by CustomerEJB.ejbPostCreate to
      ProfileLocalHome.create. Values may later be overwritten by the calling application
      with what the user entered.
    confidence: medium
    confidence_basis: >
      One clear place (named constants consumed by one create call). Whether the calling
      registration flow immediately overwrites these defaults with form values is outside
      this module and not verified here.
    risk_class: presentational
    basis: >
      Default constants in ProfileLocalHome used in CustomerEJB.ejbPostCreate.
    traces:
