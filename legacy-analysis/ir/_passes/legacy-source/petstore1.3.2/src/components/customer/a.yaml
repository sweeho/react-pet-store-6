      access-control capability.
    confidence: high
    confidence_basis: >
      Declared explicitly and consistently in seven method-permission blocks in one
      descriptor, and corroborated by the absence of any security-role element. What the
      calling web tier enforces is outside this module.
    risk_class: regulated
    basis: >
      All method-permission entries are unchecked; no security-role elements.
