  - record_key: CUST-BR-0007
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL NOT apply any role-based restriction to reading, creating,
      changing or removing customer, account, profile, contact, address or payment card
      records at the data component level; access control for these records SHALL be
      enforced by the calling application.
    plain_text: >
      The customer data store itself does not check who is asking. Anyone the application
      lets through can read or change customer details, including stored card data, so
      protection depends entirely on the screens and actions in front of it.
    technical_note: >
      Every method-permission block in the customer ejb-jar.xml is <unchecked/>, covering
      ProfileEJB, AddressEJB, ContactInfoEJB and CreditCardEJB (method-name *) and every
      listed CustomerEJB and AccountEJB method. No security-role is declared. Each bean
      uses <use-caller-identity/>. The beans are local-only (no remote interface), so
