  - record_key: CUST-BR-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN an account is created with only a status
      THEN the system SHALL create an empty contact information record and an empty
      payment card record and attach both to the account.
    plain_text: >
      When an account is opened without details, blank contact details and a blank
      payment card are set up for it, to be filled in later.
    technical_note: >
      AccountEJB.ejbPostCreate(String status) looks up ContactInfoLocalHome and
      CreditCardLocalHome and calls their no-argument create(), then links them via the
      CMR setters. This is the path used by CustomerEJB.ejbPostCreate. A second create
      overload (status, contactInfo, creditCard) attaches caller-supplied records instead.
    confidence: medium
    confidence_basis: >
      One clear code path. Whether the calling registration flow then populates these
      empty records is outside this module.
    risk_class: operational
    basis: >
      ejbPostCreate(String) creates and attaches empty contact info and credit card.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 99
        excerpt: |
              public void ejbPostCreate(String status) throws CreateException {
                  setStatus(status);
                  try {
                      InitialContext ic = new InitialContext();
                      ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                      ContactInfoLocal contactInfo = cih.create();
                      setContactInfo(contactInfo);
                      CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                      CreditCardLocal creditCard = cch.create();
                      setCreditCard(creditCard);
                  } catch (javax.naming.NamingException ne) {
                      throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
                  }

              }

              public void ejbPostCreate(String status, ContactInfoLocal contactInfo, CreditCardLocal creditCard) throws CreateException {
                  setContactInfo(contactInfo);
                  setCreditCard(creditCard);
              }
    stack_metadata:
      framework: ejb-2.x-cmp
      ejb.bean: AccountEJB

  - record_key: CUST-BR-0005
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL record an account status taking one of the values "active" or
      "disabled".
    plain_text: >
      An account is either active or disabled.
    technical_note: >
      AccountLocalHome declares Active = "active" and Disabled = "disabled". Only Active is
      ever used (at customer creation). AccountLocal.setStatus is exposed, but no caller in
      the legacy tree sets "disabled", and nothing reads the status to restrict a
      customer. The status column is a free VARCHAR with no CHECK constraint.
    confidence: low
    confidence_basis: >
      The two values are bare constants. Only "active" is used. No code sets or checks
      "disabled", and no constraint limits the column to these values, so the rule that
      the status is limited to these two values is inferred from the constants.
    dispute:
      reason: unresolved-reachability
      detail: >
        "disabled" is declared but no reference to it was found anywhere in the legacy
        tree (grep for AccountLocalHome.Disabled and "disabled" outside this component
        returned nothing), and no code reads account status. To settle it, an SME must say
        whether disabling an account was ever an operational procedure (for example,
        direct database updates or an admin tool not in this tree) and, if so, what a
        disabled account must be prevented from doing.
    risk_class: operational
    basis: >
      Status constants on AccountLocalHome; setStatus on the local interface.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
              public static final String Active = "active";
              public static final String Disabled = "disabled";
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocal.java
        line_start: 47
        line_end: 47
        excerpt: |
              public void setStatus(String status);
    stack_metadata:
      framework: ejb-2.x-cmp
      ejb.bean: AccountEJB

