  - record_key: CUST-BR-0008
    kind: business-rule
    capability_key: customer-account
    requirement: >
      Creating a customer together with its account, profile, contact information and
      payment card records SHALL take place within a single transaction, joining the
      caller's transaction when one exists.
    plain_text: >
      Setting up a new customer and all their linked records happens as one unit of work.
    technical_note: >
      Every container-transaction entry in the customer ejb-jar.xml uses
      trans-attribute Required (80 entries), including CustomerEJB LocalHome create(String)
      and AccountEJB setStatus. Dependent records are created in ejbPostCreate, inside the
      caller's transaction. A failed lookup is thrown as CreateException, which is an
      application exception and does not by itself roll the transaction back (see
      suspected defects).
    confidence: medium
    confidence_basis: >
      One declarative source, applied uniformly. Rollback behaviour on partial failure
      depends on the caller and was not traced outside this module.
    risk_class: operational
    basis: >
      trans-attribute Required on CustomerEJB create and all other methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 713
        line_end: 723
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>CustomerEJB</ejb-name>
                  <method-intf>LocalHome</method-intf>
                  <method-name>create</method-name>
                  <method-params>
                    <method-param>java.lang.String</method-param>
                  </method-params>
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
    stack_metadata:
      framework: ejb-2.x-cmp
      ejb.bean: CustomerEJB
      ejb.transaction: Required

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      The customer ejb-jar.xml also declares CreditCardEJB, ContactInfoEJB and AddressEJB
      (fields cardType/cardNumber/expiryDate, givenName/familyName/telephone/email, and
      street/city/state/zip/country). This pass left their field-level records to the
      creditcard/contactinfo/address shards to avoid duplicates, and recorded only how
      they relate to the account (CUST-ENT-0003, CUST-BR-0006). Reconciliation should
      confirm those shards cover them.
  - kind: ambiguity
    path: legacy-analysis/sources
    description: >
      There is no legacy-analysis/sources/**/extracted.md in the repository, so no
      document evidence could be cited for this module. Every record traces to code or
      configuration only.

suspected_defects:
  - capability_key: customer-account
    record_keys: [CUST-BR-0005]
    severity: low
    category: unreachable-branch
    title: Account status "disabled" is declared but never set or enforced
    description: >
      Accounts have a status with a declared "disabled" value, but nothing in the legacy
      tree ever sets an account to disabled, and nothing reads the status. A customer
      whose account was disabled (for example by a direct database edit) would still be
      able to sign on and order as normal.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
  - capability_key: customer-account
    record_keys: [CUST-BR-0002, CUST-BR-0008]
    severity: low
    category: data-corruption
    title: Partial customer creation is not rolled back on a lookup failure
    description: >
      If the account is created but the profile lookup then fails, the failure is raised
      as an application-level create error without marking the transaction for rollback.
      A caller that catches it and commits would leave a customer with an account but no
      profile. The same applies in account creation, between the contact-info and card
      steps. In practice this only happens when the system is misconfigured.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 76
        line_end: 88
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 82
        line_end: 92
  - capability_key: sign-on
    record_keys: [CUST-BR-0007]
    severity: medium
    category: other
    title: Stored payment card and contact data have no access control in the data layer
    description: >
      All operations on customer, contact, address and payment card records are open to
      any caller in the application (no role check). The stored card number and expiry
      date are plain text columns. Whether this is acceptable depends on what the web tier
      enforces and on payment-card handling obligations; a business owner should decide.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 393
        line_end: 399
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
