findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/servicelocator
    description: >
      This module is technical plumbing (directory lookup of components, message
      queues/topics, data sources, URLs and string/boolean settings, with
      web-tier caching and a wrapping exception type). Apart from the
      configuration-switch rule recorded as CUSTNOTIF-BR-0001, it states no
      business rule, and capabilities.csv has no infrastructure capability, so no
      further records were emitted. The web-tier "resolve once, reuse for the
      life of the process" caching (web/ServiceLocator.java lines 70, 86,
      109-114 and the other cached getters) and the ejb-tier "look up afresh on
      every call" behaviour are implementation choices; a human should confirm
      they need not be carried into the rebuild as requirements.
  - kind: ambiguity
    path: legacy-analysis/sources
    description: >
      No legacy-analysis/sources/**/extracted.md documents exist in the tree, so
      no document trace could be cited for this module.
suspected_defects:
  - capability_key: customer-notifications
    record_keys: []
    severity: medium
    category: error-swallowed
    title: Web-tier locator start-up failure is printed and swallowed
    description: >
      The web-tier locator is created once when its class loads. If creating the
      naming context fails, the error is only printed to standard error and the
      shared instance is left empty; every later caller receives an empty
      reference and fails with an unrelated null-reference error, far from the
      original cause. The failure is not reported to the caller that triggered
      it. (Filed under customer-notifications only because no infrastructure
      capability exists; the web locator is used across the storefront.)
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 96
  - capability_key: customer-notifications
    record_keys: []
    severity: low
    category: other
    title: Cached web-tier resource references are never refreshed
    description: >
      Once a component home, queue, topic, connection factory or data source has
      been looked up on the web tier it is kept in a process-wide cache with no
      expiry or invalidation. If the referenced resource is redeployed or its
      server restarts, the web tier keeps handing out the stale reference until
      the web application itself is restarted.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
