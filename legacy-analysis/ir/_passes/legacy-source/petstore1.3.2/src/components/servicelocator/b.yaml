records:
  - record_key: CUSTNOTIF-BR-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL read on/off switches for customer notification e-mails
      (for example the confirmation-mail switch) from named deployment
      configuration entries, and SHALL fail to start the component that needs a
      switch when that entry is missing or is not a true/false value, rather than
      assuming a default.
    plain_text: >
      Whether customer confirmation e-mails are sent is a setting chosen when the
      shop is installed, not something fixed in the program. If the setting is
      missing or not a yes/no value, the e-mail sender does not start instead of
      silently guessing.
    technical_note: >
      ServiceLocator.getBoolean(envName) (both the ejb and web variants) does a
      JNDI lookup of a java.lang.Boolean env-entry and returns booleanValue().
      A NamingException (entry absent) or ClassCastException (wrong type) is
      wrapped in ServiceLocatorException. The javadoc names
      SEND_CONFIRMATION_MAIL as the intended use; callers such as
      opc MailInvoiceMDB.ejbCreate read JNDINames.SEND_CONFIRMATION_MAIL and turn
      the ServiceLocatorException into an EJBException, so the bean is not
      created. The actual switch values live in the opc deployment descriptors,
      outside this shard.
    confidence: medium
    confidence_basis: >
      The lookup-and-fail behaviour is clear in one method duplicated in two
      classes, and the javadoc names the confirmation-mail switch. The link to
      notification e-mails was confirmed by reading one caller outside this
      shard (MailInvoiceMDB). The switch's default value and the per-notification
      wiring are not visible here, so not high.
    risk_class: operational
    basis: >
      getBoolean casts the looked-up env entry to Boolean and rethrows any lookup
      failure; javadoc cites SEND_CONFIRMATION_MAIL as the example entry.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 213
        line_end: 227
        excerpt: |
              /**
               * @return the boolean value corresponding
               * to the env entry such as SEND_CONFIRMATION_MAIL property.
               */
              public boolean getBoolean(String envName) throws ServiceLocatorException {
                Boolean bool = null;
                try {
                  bool = (Boolean)ic.lookup(envName);
                } catch (NamingException ne) {
                      throw new ServiceLocatorException(ne);
                } catch (Exception e) {
                      throw new ServiceLocatorException(e);
                }
                return bool.booleanValue();
              }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 274
        line_end: 288
        excerpt: |
