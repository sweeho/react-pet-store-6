suspected_defects:
  - capability_key: customer-notifications
    record_keys: [NOTIFY-BUSINESS-RULE-0001]
    severity: medium
    category: error-swallowed
    title: Web-tier locator start-up failure is printed and swallowed
    description: >
      If the web-tier locator cannot be created when its class loads, the error is only printed
      to standard error and the shared instance stays empty. Every later caller receives nothing
      and fails with an unrelated null error at its first lookup, far from the real cause; the
      original naming failure is not reported to the caller.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 96
  - capability_key: customer-notifications
    record_keys: [NOTIFY-BUSINESS-RULE-0001]
    severity: low
    category: other
    title: Web-tier cached resource handles are never refreshed
    description: >
      The web-tier locator keeps every looked-up component home, messaging factory, queue, topic
      and data source for the life of the process with no eviction. If a resource is redeployed or
      rebound, the web tier keeps using the old handle until restart, while the EJB-tier locator
      looks it up fresh each time, so the two tiers can behave differently after a redeploy.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
