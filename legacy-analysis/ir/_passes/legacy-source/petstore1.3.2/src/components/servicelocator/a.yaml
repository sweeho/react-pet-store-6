# Pass A — legacy-source/petstore1.3.2/src/components/servicelocator
# No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no document traces are cited.
# The component is generic lookup infrastructure (an exception type plus an EJB-tier and a web-tier
# locator). It holds no business rule of its own; the one behaviour with business consequence is how
# deployment-time settings (on/off switches) are read, filed under the capability of the caller cited.
records:
  - record_key: NOTIFY-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL read deployment-time settings (on/off switches, text values and addresses)
      from the deployment configuration by name, and SHALL treat a setting that is absent or of the
      wrong type as a startup failure of the dependent function rather than substituting a default.
      GIVEN the "send completed-order e-mail" switch is not configured WHEN the completed-order
      mailer starts THEN the mailer fails to start instead of assuming on or off.
    plain_text: >
      Settings such as whether to e-mail customers when an order completes are set when the shop
      is installed. If one of these settings is missing or malformed, the feature that needs it
      refuses to start; the shop never guesses a value.
    technical_note: >
      ServiceLocator.getBoolean/getString/getUrl (both ejb/ and web/ variants) do an
      InitialContext.lookup of a java:comp/env entry and cast it; NamingException and any other
      exception (including ClassCastException) are wrapped in ServiceLocatorException. Callers such
      as MailCompletedOrderMDB.ejbCreate rethrow it as EJBException, so the bean is not created.
      Settings are never cached; in the web-tier locator EJB homes, JMS factories/destinations and
      DataSources are cached for the life of the process in a synchronized map, settings are not.
    confidence: medium
    confidence_basis: >
      The no-default behaviour is clear in one place (the locator's lookup-and-cast with no fallback)
      and one caller confirms the failure propagates. Not graded high: no test or document states
      the rule, and only one caller was followed outside this shard; other callers may catch the
      error and apply their own default.
    risk_class: operational
    basis: >
      getBoolean looks up the env entry and casts it to Boolean with no fallback value; every
      exception is rethrown as ServiceLocatorException. The completed-order mailer reads its
      send switch this way at creation and converts the failure into a creation error.
      Filed under customer-notifications because that is the caller cited; the same locator serves
      order-approval and order-fulfillment settings (e.g. XML validation switches in
      OrderApprovalMDB and OrderFulfillmentFacadeEJB).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 226
        excerpt: |
              public boolean getBoolean(String envName) throws ServiceLocatorException {
                Boolean bool = null;
                try {
                  bool = (Boolean)ic.lookup(envName);
                } catch (NamingException ne) {
                      throw new ServiceLocatorException(ne);
                } catch (Exception e) {
                      throw new ServiceLocatorException(e);
                }
                return bool.booleanValue();
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 278
        line_end: 287
