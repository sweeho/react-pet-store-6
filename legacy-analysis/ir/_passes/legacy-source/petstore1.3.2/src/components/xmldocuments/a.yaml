  - record_key: FUL-BR-0008
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN an incoming order document is checked against a DTD
      WHEN the document declares a document type whose public identifier differs from the
      expected one
      THEN the system SHALL reject it;
      AND WHEN the document declares no document type at all
      THEN the system SHALL accept it without a type check.
    plain_text: >
      A message that names the wrong format is refused, but a message that names no format at
      all is let through.
    technical_note: >
      XMLDocumentUtils.deserialize (non-XSD path) and fromXML(InputSource) call
      checkDocumentType, which returns true when getDoctype() is null - commented as a
      workaround for the identity transformer dropping DocType nodes.
