records:
  - record_key: OAPP-ENT-0001
    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL exchange order approval decisions as a batch containing at least one
      order entry, where each entry carries an order identifier followed by an order status,
      and SHALL reject a batch on receipt when it contains no order entry or when an entry's
      order identifier or status is missing or empty.
    plain_text: >
      An approval decision message lists one or more orders, each with its order number and its
      new status. A message with no orders, or an order with a blank number or blank status,
      is refused.
    technical_note: >
      OrderApproval.dtd declares OrderApproval (Order+) and Order (OrderId, OrderStatus).
      OrderApproval.fromDOM reads the first Order child with optional=false (throws when absent)
      and ChangedOrder.fromDOM reads OrderId and OrderStatus content with optional=false, so empty
      text raises XMLDocumentException. Producers are the admin web tier (ApplRequestProcessor)
      and the order processing centre; consumers are OrderApprovalMDB and MailOrderApprovalMDB.
    confidence: high
    confidence_basis: >
      The shape is enforced in two independent places: the DTD content model and the Java
      deserializer, which throws on a missing first Order and on empty OrderId/OrderStatus
      content. Not graded higher because DTD validation is switchable per deployment, so the
      Java check is the only guaranteed enforcement.
    risk_class: operational
    basis: >
      DTD content model Order+ and (OrderId, OrderStatus); Java fromDOM requires the first Order
      child and non-empty content for both fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |2-
          <!ELEMENT OrderApproval (Order+)>

          <!ELEMENT Order (OrderId, OrderStatus)>

          <!ELEMENT OrderId (#PCDATA)>

          <!-- FIXME should be attribute -->
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 156
        line_end: 170
        excerpt: |2-
            public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDERAPPROVAL)) {
                Element child;
                OrderApproval orderApproval = new OrderApproval();
                orderApproval.orderList = new ArrayList();
                for (child = XMLDocumentUtils.getFirstChild(element, ChangedOrder.XML_ORDER, false);
                     child != null;
                     child = XMLDocumentUtils.getNextSibling(child, ChangedOrder.XML_ORDER, true)) {
                  orderApproval.orderList.add(ChangedOrder.fromDOM(child));
                }
                return orderApproval;
              }
              throw new XMLDocumentException(XML_ORDERAPPROVAL + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 80
        line_end: 90
        excerpt: |2-
            public static ChangedOrder fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDER)) {
                Element child;
                ChangedOrder changedOrder = new ChangedOrder();
                changedOrder.orderId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ORDERID, false), false);
                changedOrder.orderStatus = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ORDERSTATUS, false), false);
                return changedOrder;
              }
              throw new XMLDocumentException(XML_ORDER + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 153
        line_end: 166
        excerpt: |2-
            public static String getContent(Element element, boolean optional) throws XMLDocumentException {
                  StringBuffer buffer = new StringBuffer();
                  for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
                if (child.getNodeType() == Node.TEXT_NODE || child.getNodeType() == Node.CDATA_SECTION_NODE) {
                          try {
                    buffer.append(((Text) child).getData());
                          } catch (DOMException e) {}
                }
                  }
                  if (!optional && buffer.length() == 0) {
                throw new XMLDocumentException(element.getTagName() + " element: content expected.");
                  }
                  return buffer.toString();
            }
    stack_metadata:
      framework: JAXP DOM
      db.object: none
      jms.queue: order approval topic/queue (consumers outside this module)

  - record_key: OAPP-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL validate an incoming order approval document against its declared schema
      by default, unless the caller explicitly disables validation.
    plain_text: >
      Approval decision messages are checked against their agreed format by default; checking
      can only be switched off deliberately.
    technical_note: >
      OrderApproval.VALIDATING = true is used by the single-argument fromXML overloads. The
      production consumers call the three-argument overload with a deployment flag
      (XML_VALIDATION_ORDER_APPROVAL), so the effective setting is configuration outside this
      module. Note that a "validating" parse does not reject DTD-invalid input (see suspected
      defect on validation errors).
    confidence: medium
    confidence_basis: >
      One clear constant in one place. The production callers bypass the default and pass a
      configuration flag whose value is not visible in this module, so the live setting cannot
      be confirmed here.
    risk_class: operational
    basis: >
      Public constant VALIDATING = true, passed by the default fromXML overloads.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 67
        line_end: 70
        excerpt: |2-
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
            public static final String DTD_SYSTEM_ID = "OrderApproval.dtd";
            public static final boolean VALIDATING = true;
            public static final String XML_ORDERAPPROVAL = "OrderApproval";
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 118
        line_end: 124
        excerpt: |2-
            public static OrderApproval fromXML(Source source) throws XMLDocumentException {
              return fromXML(source, null, VALIDATING);
            }

            public static OrderApproval fromXML(String buffer) throws XMLDocumentException {
              return fromXML(buffer, null, VALIDATING);
            }
