findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      OrderStatus is free text (marked "FIXME should be attribute") and no allowed-value list is
      declared in this module. The status vocabulary used in approval messages (for example
      approved / denied) must be established from the producers and consumers in apps/admin and
      apps/opc; this module cannot settle it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPAInvoice.dtd
    description: >
      The invoice DTD declares a locale attribute defaulting to en_US, but the invoice XSD has no
      such attribute and TPAInvoiceXDE never sets it. Whether the invoice is meant to carry the
      customer's locale (for invoice e-mails) or the order's stored locale is the authority
      cannot be decided from this module.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
    description: >
      The 1.0 DTDs under src/rsrc/schemas (Invoice, PurchaseOrder, SupplierOrder, LineItem, Mail)
      are listed under "#Old DTDs" in the entity catalog, and the Mail public id maps to the
      mailer component's copy rather than this one. No caller in this module references the
      Invoice/PurchaseOrder/SupplierOrder/LineItem 1.0 public ids; only OrderApproval.dtd is
      used. No records were emitted from them. A cross-module search for those public ids would
