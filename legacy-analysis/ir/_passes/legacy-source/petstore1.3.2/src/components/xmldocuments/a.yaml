  - record_key: LOC-BR-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a stored locale code of the form language_country (for example
      en_US, ja_JP, zh_CN) as that language and country, SHALL interpret the code "default"
      (case-insensitive) as the server's default locale, and SHALL treat an absent code or a
      code without an underscore as no locale.
    plain_text: >
      Locale codes like en_US are read as language plus country; "default" means the server's
      own locale; a missing code, or one with only a language, means no locale is set.
    technical_note: >
      XMLDocumentUtils.getLocaleFromString; called by the purchase order component when reading
      an order's locale (PurchaseOrder.java line 140, outside this module). Equivalent copies
      exist in waf I18nUtil, catalog CatalogHelper and opc LocaleUtil (not inspected in this
      pass).
    confidence: medium
    confidence_basis: >
      Read directly from one implementation. The three-part (variant) branch is broken (see
      suspected defects), so only the two-part behaviour is stated.
    risk_class: presentational
    basis: >
      Branches for null, "default", missing underscore and language_country.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 644
        line_end: 678
        excerpt: |2-
            public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) {
                return null;
                  }
                  if (localeString.toLowerCase().equals("default")) {
                return Locale.getDefault();
                  }
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) {
                return null;
                  }
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                } else {
                          return null;
                }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) {
                countryIndex = localeString.indexOf('_', countryIndex +1);
                  }
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {
                variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                return new Locale(language, country, variant);
                  } else {
                return new Locale(language, country);
                  }
            }
    stack_metadata:
      framework: java.util.Locale

