        line_start: 39
        line_end: 48
        excerpt: |2-
          <!ELEMENT tpali:LineItem EMPTY>
          <!ATTLIST tpali:LineItem
               xmlns:tpali CDATA #FIXED "http://blueprints.j2ee.sun.com/TPALineItem"	
               categoryId CDATA #REQUIRED
               productId CDATA #REQUIRED
               itemId CDATA #REQUIRED
               lineNo CDATA #REQUIRED
               quantity CDATA #REQUIRED
               unitPrice CDATA #REQUIRED
          >
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 10
        line_end: 17
        excerpt: |2-
          	<xsd:complexType name="lineItem">
          		<xsd:attribute name="categoryId" type="xsd:string" use="required" />
          		<xsd:attribute name="productId" type="xsd:string" use="required" />
          		<xsd:attribute name="itemId" type="xsd:string" use="required" />
          		<xsd:attribute name="lineNo" type="xsd:nonNegativeInteger" use="required" />
          		<xsd:attribute name="quantity" type="xsd:positiveInteger" use="required" />
          		<xsd:attribute name="unitPrice" type="positiveDecimal" use="required" />
          	</xsd:complexType>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 64
        line_end: 77
        excerpt: |2-
            public static void addLineItem(Document document, Element lineItemsElement,
                                           String categoryId, String productId, String itemId, String lineNo,
                                           int quantity, float unitPrice) {
              Element lineItemElement = document.createElementNS(XML_NAMESPACE, XML_LINEITEM);
              lineItemElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_CATEGORYID, categoryId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_PRODUCTID, productId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_ITEMID, itemId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_LINENO, lineNo);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
              lineItemsElement.appendChild(lineItemElement);
              return;
            }
    stack_metadata:
      framework: JAXP DOM
      xml.namespace: http://blueprints.j2ee.sun.com/TPALineItem

  - record_key: FUL-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN supplier documents are validated against the XML Schema form
      WHEN a line item is checked
      THEN its quantity SHALL be a whole number of at least 1, its line number SHALL be a whole
      number of at least 0, and its unit price SHALL be a decimal of at least 0.0.
    plain_text: >
      When schema checking is on, each item line must order at least one unit, carry a
      non-negative line number, and have a price that is not negative (a zero price is allowed).
    technical_note: >
      TPALineItem.xsd types quantity as xsd:positiveInteger, lineNo as xsd:nonNegativeInteger
      and unitPrice as positiveDecimal (minInclusive 0.0). The DTD form types all as CDATA, so in
      DTD mode (the builders' default constructor) none of these ranges is enforced. The Java
      builder takes quantity as int and unitPrice as float and does not range-check either.
    confidence: medium
    confidence_basis: >
      Stated in one place only (the XSD). The DTD and Java code do not enforce it, and which
      mode the deployment uses is a JNDI flag outside this module.
    risk_class: financial
    basis: >
      XSD attribute types and the positiveDecimal restriction.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 10
        line_end: 23
        excerpt: |2-
          	<xsd:complexType name="lineItem">
          		<xsd:attribute name="categoryId" type="xsd:string" use="required" />
          		<xsd:attribute name="productId" type="xsd:string" use="required" />
          		<xsd:attribute name="itemId" type="xsd:string" use="required" />
          		<xsd:attribute name="lineNo" type="xsd:nonNegativeInteger" use="required" />
          		<xsd:attribute name="quantity" type="xsd:positiveInteger" use="required" />
          		<xsd:attribute name="unitPrice" type="positiveDecimal" use="required" />
          	</xsd:complexType>

          	<xsd:simpleType name="positiveDecimal">
          		<xsd:restriction base="xsd:decimal">
          			<xsd:minInclusive value="0.0" />
          		</xsd:restriction>
          	</xsd:simpleType>
    stack_metadata:
      declarative_validator: TPALineItem.xsd

