  - record_key: FUL-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL describe every line item on a supplier order or invoice with all of:
      category identifier, product identifier, item identifier, line number, quantity and unit
      price; none of these may be omitted.
    plain_text: >
      Every item line on a supplier order or invoice must state its category, product, item,
      line number, quantity and unit price.
    technical_note: >
      TPALineItem.dtd declares all six attributes #REQUIRED; TPALineItem.xsd declares them
      use="required"; TPALineItemUtils.addLineItem always writes all six.
    confidence: high
    confidence_basis: >
      Required in both the DTD and the XSD, and always populated by the single builder method.
    risk_class: financial
    basis: >
      Six required attributes in both schema forms and unconditional emission in Java.
