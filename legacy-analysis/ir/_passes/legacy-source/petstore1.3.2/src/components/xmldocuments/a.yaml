  - record_key: FUL-BR-0006
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL record the order date and shipping date on supplier orders and invoices
      as calendar dates (year-month-day) without a time of day.
    plain_text: >
