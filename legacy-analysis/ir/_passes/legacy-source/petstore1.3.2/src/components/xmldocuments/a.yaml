      The system SHALL send each supplier order to the supplier as a document containing, in
      order: the order identifier, the order date, a shipping address of first name, last name,
      street, city, state, country, zip code, e-mail and phone, and one or more line items.
    plain_text: >
      An order passed to the supplier states the order number, the order date, who and where to
      ship to (name, full postal address, e-mail and phone) and at least one item line.
    technical_note: >
      TPASupplierOrder.dtd and TPASupplierOrder.xsd (namespace
      http://blueprints.j2ee.sun.com/TPASupplierOrder) both declare the same sequence with
      LineItems requiring one or more tpali:LineItem. TPASupplierOrderXDE assembles the root in
      that exact order. Used by the order processing centre (OrderApprovalMDB) once an order is
      approved.
