    record_keys: [OF-INT-0001]
    severity: medium
    category: other
    title: A document with no declared type passes the document-type check
    description: >
      The type check returns true when a document has no DOCTYPE at all (a comment says
      this works around the identity transformer dropping DOCTYPE nodes), so a document
      of the wrong kind with no DOCTYPE is accepted as the expected type.
