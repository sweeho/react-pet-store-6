  - record_key: OF-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN schema (XSD) validation is enabled for supplier documents, WHEN a supplier
      order or invoice line item is checked, THEN the quantity SHALL be a whole number of
      at least 1, the line number SHALL be a whole number of at least 0, and the unit
      price SHALL be a decimal number of at least 0.
    plain_text: >
      When strict checking is switched on, each item must be ordered in a quantity of
      one or more, and its price may not be negative (a zero price is allowed).
    technical_note: >
      Only TPALineItem.xsd carries these value types (positiveInteger, nonNegativeInteger,
      a "positiveDecimal" type that is minInclusive 0.0). The DTD types are plain CDATA,
      so with DTD validation (the default; XSD is a deployment flag) none of these limits
      apply. The Java builder takes quantity as int and unitPrice as float and does no
      range check.
    confidence: medium
    confidence_basis: >
      One clear declarative place (the XSD); nothing in Java or the DTD repeats it, and
      whether XSD validation is on in production depends on a deployment flag I did not
      trace to its value.
    risk_class: financial
    basis: >
      XSD attribute types and the positiveDecimal restriction.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 11
