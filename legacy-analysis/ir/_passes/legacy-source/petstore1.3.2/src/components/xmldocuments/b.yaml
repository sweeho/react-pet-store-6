  - record_key: OF-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a supplier order or invoice is being built, WHEN the order identifier, user
      identifier or a date is missing, THEN the document SHALL NOT be produced; WHEN a
      shipping-address field (name, street, city, state, country, zip, e-mail or phone)
      is missing, THEN that field SHALL be written as empty and the document SHALL still
      be produced.
    plain_text: >
      A supplier order or invoice cannot be created without an order number (and, for an
      invoice, a customer reference) and dates, but a blank part of the ship-to address
      does not stop it.
