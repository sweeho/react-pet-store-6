  - record_key: LOC-BR-0003
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a stored locale text of the form language_COUNTRY (for
      example ja_JP) as that language and country, SHALL interpret the word "default" (any
      case) as the server's default locale, and SHALL treat a text with no underscore as
      no locale.
    plain_text: >
      A saved language setting such as "ja_JP" means Japanese for Japan; "default" means
      whatever the server is set to; anything without the language_country form is
      ignored.
    technical_note: >
      XMLDocumentUtils.getLocaleFromString, used by the purchase-order entity
      (PurchaseOrder.java line 140) to restore the order locale. A variant part is never
      parsed (see suspected defects).
    confidence: medium
    confidence_basis: >
      One clear implementation with a visible caller; no test and the variant handling is
      evidently unfinished, so behaviour beyond two-part locales is uncertain.
    risk_class: presentational
    basis: >
      Parsing logic in getLocaleFromString.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 644
        line_end: 678
        excerpt: |2
            public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) {
                return null;
                  }
                  if (localeString.toLowerCase().equals("default")) {
                return Locale.getDefault();
                  }
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) {
                return null;
                  }
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                } else {
                          return null;
                }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) {
                countryIndex = localeString.indexOf('_', countryIndex +1);
                  }
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {
                variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                return new Locale(language, country, variant);
                  } else {
                return new Locale(language, country);
                  }
            }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 140
        line_end: 140
        excerpt: |2
              this.locale = XMLDocumentUtils.getLocaleFromString(locale);
    stack_metadata:
      framework: java.util.Locale

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
    description: >
      The version 1.0 PurchaseOrder, Invoice, SupplierOrder and LineItem DTDs under
      src/rsrc/schemas are registered in both entity catalogs and copied into the jar by
      build.xml, but no Java source in the tree references their public identifiers
      (only OrderApproval 1.0 is used). They appear superseded by the TPA documents and
      the 1.1 DTDs in other modules. No records were emitted from them. A human should
      confirm whether any external partner or batch still exchanges the 1.0 formats
      (notably the 1.0 PurchaseOrder carries a credit card and total price).
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
    description: >
      SupplierOrder.dtd (1.0) declares its content as (orderid, orderdate, shipaddress,
      lineitem+) but imports LineItem.dtd, which declares "LineItem" (capitalised);
      "lineitem" is never declared, so no document can validate against this DTD.
      Not tied to a record because the DTD appears unreferenced (see previous finding).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Mail.dtd
    description: >
      This module ships a Mail.dtd, but both entity catalogs map the OPC Mail 1.0 public
      identifier to the mailer module's copy, so this copy is not the one resolved at
      run time. The mail document is left to the mailer shard; a human should confirm the
      two copies are identical or delete one.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
    description: >
      XMLDocumentEditorFactory maps a schema URI to a document-editor class from a
      properties catalog, but no caller of it was found outside this module. It carries
      no business rule; recorded only so its reachability is not mistaken for a gap.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [OF-INT-0001, OA-ENT-0001, OF-BR-0001, OF-BR-0002]
    severity: high
    category: error-swallowed
    title: Validation errors are logged and ignored, so invalid documents are accepted
    description: >
      With validation switched on, the parser's error handler prints non-fatal
      validation errors (wrong element order, missing required attribute, value out of
      range, duplicate item) to standard error and returns, so parsing succeeds and the
      invalid document is processed. Only well-formedness (fatal) errors stop it. Every
      schema rule in this module is therefore advisory at run time.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 588
