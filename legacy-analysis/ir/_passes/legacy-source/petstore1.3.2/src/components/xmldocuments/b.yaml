      The system SHALL represent an order approval decision batch as a list of one or
      more entries, each carrying an order identifier followed by the order's new
      status, and SHALL reject a batch whose root is not an order approval or whose
      entry lacks the identifier or the status in that order.
    plain_text: >
      When an administrator approves or denies orders, the decisions travel as one
      batch listing at least one order, each with its order number and its new status.
