      Line-item unit prices are passed as float and written with Float.toString, so
      supplier orders and invoices carry a binary-float rendering of the price; large
      values are written in exponent form (for example 1.0E7), which is not a valid
      xsd:decimal, and some decimal amounts are not exactly representable.
