  - record_key: OF-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, when reading a business document with validation switched on,
      check it against its declared schema and refuse a document that is not well formed
      or whose declared document type differs from the one expected; whether validation
      is on SHALL be a deployment setting per document type.
    plain_text: >
      Documents passed between the store, the administrator and the supplier can be
      checked against their published format before they are acted on; operators decide
      per document type whether that check is switched on.
    technical_note: >
      XMLDocumentUtils.deserialize/transform builds a SAX parser with setValidating(flag)
      and optional W3C XML Schema, then checkDocumentType compares the DOCTYPE public id.
      Fatal errors throw; non-fatal validation errors are only printed (see suspected
      defects). Flags come from env-entries such as param/xml/validation/OrderApproval
      (OPC ejb-jar.xml). Filed under order-fulfillment as the closest capability: the
      mechanism is shared by approval and fulfilment documents.
    confidence: medium
    confidence_basis: >
      The mechanism is clear in one module (the parser factory and the type check); the
      deployment flags are referenced by name but I did not read their configured values.
    risk_class: operational
    basis: >
      createParser, deserialize and checkDocumentType in the shared utility; OrderApproval
      defaults VALIDATING=true when no flag is passed.
