  - record_key: SIGN-BR-0005
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL expire an inactive administrator session after 54 minutes.
    plain_text: >
      An admin who is inactive for 54 minutes is signed out automatically.
    technical_note: >
      web.xml session-config session-timeout = 54 (minutes). No comment explaining the
      value.
    confidence: low
    confidence_basis: >
      Bare literal in one descriptor with no comment, test or other reference; the
      unusual value (54) gives no hint whether it is a business rule or arbitrary.
    risk_class: regulated
    basis: >
      web.xml session-timeout element.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet session-config

  - record_key: SIGN-BR-0006
    kind: business-rule
    capability_key: sign-on
    requirement: >
      GIVEN a request to the administration data service carries no existing session
      WHEN it is received THEN the system SHALL refuse to process it and SHALL reply
      with the error "Session Timed Out; Please exit and login as admin from the login
      page". GIVEN any existing session is present THEN the system SHALL process the
      request without further checking the caller's role.
    plain_text: >
      The admin desktop tool only works while the admin's web session is alive; once it
      expires the tool is told to log in again. The tool's data service checks only that
      a session exists, not that it belongs to an administrator.
    technical_note: >
      ApplRequestProcessor.doPost uses req.getSession(false) and treats a non-null
      session as authorised (comment says "authorised by form based login mechanism").
      /ApplRequestProcessor is not covered by the web.xml security-constraint, so no
      isUserInRole or container role check applies. Rich client attaches via
      ";jsessionid=" URL rewriting.
    confidence: high
    confidence_basis: >
      Session check is explicit in the servlet and the absence of the URL from the
      security-constraint is visible in web.xml; the client URL construction confirms
      the session is the only credential.
    risk_class: regulated
    basis: >
      ApplRequestProcessor session==null branch; web.xml security-constraint covers only
      /AdminRequestProcessor; HttpPostPetStoreProxy builds the URL with jsessionid.
    traces:
