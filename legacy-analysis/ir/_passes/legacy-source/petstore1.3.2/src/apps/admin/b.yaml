findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      The order date is written to the response as o.getOrderDate() (line 188) with no
      formatting here, while the client parses it as MM/dd/yyyy and yields null on
      mismatch (HttpPostPetStoreProxy getDate, lines 188-197). The string form of
      OrderDetails.getOrderDate lives in the OPC component, outside this shard, so it
      cannot be confirmed here that admins actually see order dates. Someone reading the
      OPC admin facade must settle the date format.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/resources/petstore_de.properties
    description: >
      The admin tool ships English and German text, but the project's localization
      capability lists en_US, ja_JP and zh_CN. A business owner must decide whether
      German admin text is a requirement and whether ja_JP/zh_CN admin text is missing.
      Recorded under LOC-REQ-0001.

