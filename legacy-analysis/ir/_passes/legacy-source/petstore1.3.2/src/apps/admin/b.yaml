    kind: workflow
    capability_key: order-approval
    requirement: >
      WHEN the administrator commits on the pending-orders screen THEN the system SHALL
      collect the rows whose status was changed to APPROVED and those changed to DENIED;
      GIVEN neither set has any rows THEN nothing SHALL be sent; OTHERWISE the system SHALL
      submit the approved orders as one request and then the denied orders as a second
      request, and SHALL then reload all orders from the server so that decided orders
      leave the pending list.
    plain_text: >
      Pressing Commit sends the admin's approvals and denials to the store (approvals
      first, then denials) and then refreshes the lists. Rows left pending are not sent.
    technical_note: >
      DataSource.OrdersApproveTableModel.commit builds approvedOrders and deniedOrders,
      runs a ServerAction calling server.updateStatus(...) per non-empty batch, then
      getServerOrderData(); response() updates both table models. Local edits before
      commit only replace the in-memory Order (setValueAt) and are not persisted.
    confidence: high
    confidence_basis: >
      Commit logic is explicit in one method and matches the per-batch request builder
      in the proxy (one UPDATESTATUS per call, one status value per batch).
