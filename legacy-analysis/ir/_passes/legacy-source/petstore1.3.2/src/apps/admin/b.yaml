records:
  # ---------------------------------------------------------------- sign-on
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL restrict the administration entry point (both GET and POST) to
      users holding the "administrator" role, and SHALL authenticate them through a
      form-based sign-in page, showing a dedicated error page when authentication fails.
    plain_text: >
      Only administrators can enter the store administration area. Anyone else is sent
      to an admin sign-in page first.
    technical_note: >
      Declarative security in the admin WAR's web.xml: a security-constraint on
      /AdminRequestProcessor (GET, POST) with auth-constraint role "administrator",
      FORM login-config with /login.jsp and /error.jsp. The role is also declared at
      EAR level in application.xml. Note that /ApplRequestProcessor (the rich-client
      data endpoint) is NOT in the constraint; see SIGN-BR-0006 and the suspected defect.
    confidence: high
    confidence_basis: >
      Declared in two independent descriptors (web.xml security-constraint and
      application.xml security-role) and the login form posts to j_security_check.
      Not higher-impact uncertainty: the container enforces this, no code involved.
    risk_class: regulated
    basis: >
      web.xml security-constraint, login-config and security-role; application.xml
      security-role; login.jsp posts to j_security_check.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 101
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>

          <login-config>
            <auth-method>FORM</auth-method>
            <realm-name>default</realm-name>
            <form-login-config>
              <form-login-page>/login.jsp</form-login-page>
              <form-error-page>/error.jsp</form-error-page>
            </form-login-config>
          </login-config>

          <security-role>
            <role-name>administrator</role-name>
          </security-role>
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/application.xml
        line_start: 55
        line_end: 57
        excerpt: |
          <security-role>
            <role-name>administrator</role-name>
          </security-role>
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/login.jsp
        line_start: 52
        line_end: 52
        excerpt: |
          <form action="j_security_check" method=post>
    stack_metadata:
      framework: servlet-2.3 declarative security
      jsp.page: login.jsp, error.jsp
      servlet: AdminRequestProcessor

  - record_key: SIGN-REQ-0002
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL grant the administrator role to the principal "jps_admin" and to
      members of the group "administrator_group".
    plain_text: >
      The built-in admin account and anyone in the administrators group are treated as
      store administrators.
    technical_note: >
      J2EE RI vendor descriptor sun-j2ee-ri.xml rolemapping for role "administrator".
      Deployment-specific; a rebuild would express this as a role assignment in its own
      identity store.
    confidence: medium
    confidence_basis: >
      One clear declarative place (vendor deployment descriptor). It is deployment
      configuration rather than application logic, so whether the business wants this
      exact mapping is not visible from the source.
    risk_class: regulated
    basis: >
      sun-j2ee-ri.xml maps principal jps_admin and group administrator_group to the
      administrator role.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/sun-j2ee-ri.xml
        line_start: 45
        line_end: 56
        excerpt: |
          <rolemapping>
            <role name="administrator">
              <principals>
                <principal>
                  <name>jps_admin</name>
                </principal>
              </principals>
              <groups>
                <group name="administrator_group" />
              </groups>
            </role>
          </rolemapping>
    stack_metadata:
      framework: j2ee-ri deployment descriptor

  - record_key: SIGN-REQ-0003
    kind: screen
    capability_key: sign-on
    requirement: >
      The system SHALL present an admin sign-in page asking for User ID and Password;
      GIVEN the credentials are rejected WHEN the administrator submits THEN the system
      SHALL show "Login Error", the text "You could not be authenticated with the
      information provided. Please check your Username and Password." and a link back to
      the sign-in page.
    plain_text: >
      Admins sign in with a user ID and password. A wrong combination shows a login
      error with a link to try again.
    technical_note: >
      login.jsp (j_username / j_password fields, pre-populated — see suspected defect)
      and error.jsp, wired as the FORM login and error pages in web.xml.
    confidence: high
    confidence_basis: >
      The pages exist and are named as login/error pages in web.xml, so both the screen
      and its wiring are visible in two places.
    risk_class: regulated
    basis: >
      login.jsp form fields; error.jsp message and return link; web.xml form-login-config.
