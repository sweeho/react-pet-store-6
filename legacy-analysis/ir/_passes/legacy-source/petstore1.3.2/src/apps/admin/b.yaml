  - record_key: SIGN-SCR-0008
    kind: screen
    capability_key: sign-on
    requirement: >
      The system SHALL show signed-in administrators an admin landing page that explains
      the administrator can view sales, revenue and orders by status and approve or deny
      pending orders, and that offers two actions: launch the administration tool, and
      log out. A GET to the admin entry point SHALL show this page.
    plain_text: >
      After signing in, an admin sees a home page describing what they can do, with a
      button to open the admin tool and a button to log out.
    technical_note: >
      AdminRequestProcessor.doGet forwards to /index.jsp. index.html (the welcome file)
      only links to /admin/AdminRequestProcessor, which triggers the sign-in.
    confidence: high
