  - record_key: SIGN-WF-0004
    kind: workflow
    capability_key: sign-on
    requirement: >
      The system SHALL let a signed-in administrator log out from the admin landing page;
      WHEN logout is requested THEN the system SHALL end the administrator's session and
      show the admin welcome page with a link to enter the admin area again.
    plain_text: >
      An admin can log out from the admin home page. Their session ends and they land on
      the admin welcome page.
    technical_note: >
      index.jsp posts currentScreen=logout to AdminRequestProcessor.doPost, which
      forwards to logout.jsp; logout.jsp calls session.invalidate() and includes
      index.html (welcome page with "Click here to enter Admin" link).
    confidence: high
    confidence_basis: >
      Visible end to end in three places: the logout form, the servlet dispatch, and the
      invalidating JSP.
    risk_class: regulated
