  - record_key: ORDA-SCR-0003
    kind: screen
    capability_key: order-approval
    requirement: >
      The system SHALL provide a "Process Pending Orders" screen listing only PENDING
      orders (ID, User ID, Date, Amount, Status) in a sortable table where only the
      Status column is editable, with the choices PENDING, APPROVED and DENIED; it SHALL
      offer Approve and Deny buttons that set the status of all selected rows, and a
      Commit button that submits the changes. Statuses SHALL be colour-coded: APPROVED
      green, DENIED red, PENDING yellow.
    plain_text: >
      Admins see a list of pending orders. They mark one or many as approved or denied
      (individually or in bulk for the selected rows) and then press Commit to send their
      decisions.
    technical_note: >
      OrdersApprovePanel (Swing JTable over TableSorter over
      DataSource.OrdersApproveTableModel, which filters statusList={PENDING} and allows
      editing only column 4). Labels come from petstore.properties.
    confidence: high
    confidence_basis: >
      Panel construction, table-model filter/edit rule and the label bundle all agree.
    risk_class: financial
    basis: >
      OrdersApprovePanel.createUI/createButtonPanel/createTable;
      DataSource.OrdersApproveTableModel constructor and isCellEditable;
