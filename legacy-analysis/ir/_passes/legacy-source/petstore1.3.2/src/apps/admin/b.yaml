  # ---------------------------------------------------------- order-approval
  - record_key: ORDA-ENT-0001
    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL represent an order to the administrator with an order id, the
      customer's user id, the order date, the order amount and an order status, where the
      status is one of PENDING, APPROVED, DENIED or COMPLETED.
    plain_text: >
      For each order an admin sees its number, the customer, the date, the amount and
      whether it is pending, approved, denied or completed.
    technical_note: >
      Client value object PetStoreProxy.Order (status constants); server XML response
      built in ApplRequestProcessor.getOrders from OrderDetails; client parser
      HttpPostPetStoreProxy.parseOrderStatus maps any other status string to null.
      Order.checkStatus is a no-op (see suspected defect).
    confidence: high
    confidence_basis: >
      The same five fields appear in the server response builder and the client parser,
      and the four status values are defined as constants and re-checked in the parser.
    risk_class: operational
    basis: >
      PetStoreProxy.Order fields and constants; ApplRequestProcessor.getOrders XML
      elements; HttpPostPetStoreProxy.parseOrderStatus.
