    severity: medium
    category: error-swallowed
    title: Update outcome check is a placeholder; any failure closes the application
    description: >
      After sending decisions the client compares the reply status with SUCCESS but does
      nothing on mismatch ("throw an exception" is only a comment). An error reply has no
      status element, so the comparison itself fails and the application closes with a
      fatal error carrying no meaningful message. When a batch of approvals succeeds and the
      following batch of denials fails, the approvals are already sent and the denials are lost
      with the closed application. "Success" also only means the message was queued.
