  - record_key: OAPP-WF-0003
    kind: workflow
    capability_key: order-approval
    requirement: >
      WHEN the administrator commits THEN the system SHALL send every order marked APPROVED as
      one approval batch, then every order marked DENIED as one denial batch, and then reload
      the order lists from the server. GIVEN no order has been marked APPROVED or DENIED WHEN
      the administrator commits THEN the system SHALL send nothing.
    plain_text: >
      Pressing Commit sends all approvals, then all denials, and refreshes the lists; with
      nothing marked, Commit does nothing.
    technical_note: >
      OrdersApproveTableModel.commit collects rows with status APPROVED / DENIED, returns early
      when both are empty, then in a background ServerAction calls server.updateStatus for the
      approved array then the denied array (each a separate UPDATESTATUS HTTP request), then
      getServerOrderData() to reload all four status lists.
    confidence: medium
    confidence_basis: >
      One clear place (commit()); the ordering of the two batches is implicit in statement
      sequence only.
    risk_class: financial
    basis: >
      commit() implementation and the Commit button wiring.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
        line_start: 422
        line_end: 476
        excerpt: |2
                      public void commit() {
                          Vector approvedRows = new Vector();
                          Vector deniedRows = new Vector();
                          for (int i = 0; i < getRowCount(); i++) {
                              if (PetStoreProxy.Order.APPROVED.equals(
                              (String)getValueAt(i, 4))) {
                                  approvedRows.add(new Integer(i));
                              } else if (PetStoreProxy.Order.DENIED.equals(
                              (String)getValueAt(i, 4))) {
                                  deniedRows.add(new Integer(i));
                              }
                          }

                          // Return if we don't have anything to update.
                          if (approvedRows.size() == 0 &&
                          deniedRows.size() == 0) {
                              return;
                          }

                          final PetStoreProxy.Order[] approvedOrders =
                          new PetStoreProxy.Order[approvedRows.size()];
                          int row;
                          for (int i = 0; i < approvedRows.size(); i++) {
                              row = ((Integer)approvedRows.elementAt(i)).intValue();
                              approvedOrders[i] = orders[indexMapping[row]];
                          }

                          final PetStoreProxy.Order[] deniedOrders =
                          new PetStoreProxy.Order[deniedRows.size()];
                          for (int i = 0; i < deniedRows.size(); i++) {
                              row = ((Integer)deniedRows.elementAt(i)).intValue();
                              deniedOrders[i] = orders[indexMapping[row]];
                          }

                          ServerAction action = new ServerAction() {
                              public void actionPerformed(final ActionEvent action) {
                                  // Notify listener to disable actions.
                                  pcs.firePropertyChange(DISABLE_ACTIONS, null, null);

                                  StatusBar.getInstance().setMessage(
                                  PetStoreAdminClient.getString("Status.update"));
                                  super.actionPerformed(action);
                              }

                              protected Object request(ActionEvent e) {
                                  if (approvedOrders.length > 0) {
                                      server.updateStatus(approvedOrders,
                                      PetStoreProxy.Order.APPROVED);
                                  }
                                  if (deniedOrders.length > 0) {
                                      server.updateStatus(deniedOrders,
                                      PetStoreProxy.Order.DENIED);
                                  }
                                  return getServerOrderData();
                              }
