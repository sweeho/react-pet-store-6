      http://host:port/admin/ApplRequestProcessor;jsessionid=<id>. Any other currentScreen
      value, or none, returns an empty response.
    confidence: medium
    confidence_basis: >
      The server side (JNLP arguments) and client side (URL with jsessionid) agree, but they are
      the two halves of one mechanism rather than two independent enforcements of a rule.
    risk_class: operational
