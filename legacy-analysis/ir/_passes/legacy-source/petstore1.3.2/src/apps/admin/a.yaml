  - record_key: SIGN-WF-0006
    kind: workflow
    capability_key: sign-on
    requirement: >
      The system SHALL offer, on the administration landing page, a control to launch the
      administration application. WHEN it is launched THEN the system SHALL hand the
      application the server host, port and the administrator's current session identifier so
      that its data requests run within the administrator's already-authenticated session.
      WHEN the landing page is requested by a direct GET THEN the system SHALL show the landing
      page describing sales, revenue and order views and the approve/deny facility.
    plain_text: >
      From the admin page an administrator starts the administration application, which
      reuses their sign-in rather than asking again.
