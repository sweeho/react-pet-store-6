  - record_key: SIGN-BR-0003
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL serve administration data requests (order lists, order status updates,
      sales charts) to any caller presenting an existing server session. GIVEN no session
      exists WHEN a data request arrives THEN the system SHALL reply with the error "Session
      Timed Out; Please exit and login as admin from the login page" and process nothing.
    plain_text: >
      The administration application's data requests are accepted as long as the caller has
      a live session; when the session has expired the caller is told to sign in again.
    technical_note: >
      ApplRequestProcessor.doPost calls req.getSession(false) and only checks for null; it
      does not check the administrator role. The web.xml security-constraint lists only
      /AdminRequestProcessor, so /ApplRequestProcessor is outside container security. The
      in-code comment assumes a session implies a form-login authorisation.
    confidence: medium
    confidence_basis: >
      One clear place in code, and the absence of the URL from the security-constraint is
      directly readable. Medium because whether some other filter or container setting
      protects the endpoint cannot be seen from this module.
    risk_class: regulated
    basis: >
      Session-null check and error text in ApplRequestProcessor; the security-constraint's
      url-pattern covers only the launcher servlet.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 112
        excerpt: |2
                  HttpSession session = req.getSession(false);
                  ServletOutputStream out = resp.getOutputStream();

                  // Check session; if null then there is no authentication; send error
                  // If session is not null then the client has been authorised by
                  // form based login mechanism
                  if(session == null) {
                      out.println(replyHeader +
                                  "<Error>Session Timed Out; Please exit and " +
                                  "login as admin from the login page</Error>\n" +
                                  "</Response>\n");
                  } else {
                      String sId = session.getId();
                      resp.setContentType("text/xml");
                      BufferedReader inp = req.getReader();
                      StringBuffer strbuf = new StringBuffer("");
                      while(true) {
                          String str = inp.readLine();
                          if(str == null)
                              break;
                          strbuf.append(str+"\n");
                      }
                      inp.close();
                      out.println(processRequest(strbuf.toString()));
                  }
