      order-approval channel, and SHALL report success to the administrator once the batch has
      been handed to that channel. WHEN the hand-off fails THEN the system SHALL reply with an
      error asking the administrator to try again.
    plain_text: >
      Approvals and denials are passed on to the order processing back office as a message;
      the admin is told "success" when the message is sent, not when the orders have actually
      changed.
