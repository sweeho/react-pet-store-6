records:
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL restrict the administration area (the admin landing page and the
      rich-client launch) to authenticated users holding the administrator role, for both
      page requests and form submissions.
    plain_text: >
      Only a signed-in administrator can open the store administration area or start the
      administration application.
    technical_note: >
      Declarative container security in the admin web module: a security-constraint on
      /AdminRequestProcessor (GET and POST) requires role "administrator"; the RI deployment
      descriptor maps that role to principal jps_admin and group administrator_group. The
      separate data endpoint used by the rich client is NOT covered (see SIGN-BR-0003).
    confidence: high
    confidence_basis: >
      Enforced declaratively in web.xml and backed by a role mapping in the deployment
      descriptor: two independent configuration places agree. Not graded higher than that
      because the realm users themselves are created outside this shard (setup.xml).
    risk_class: regulated
    basis: >
      web.xml security-constraint with auth-constraint role-name administrator over the
      AdminRequestProcessor URL pattern; security-role declaration; sun-j2ee-ri.xml role mapping.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |2
