      document; AdminRequestBD.updateOrders sends oa.toXML() through the AsyncSender local EJB,
      whose queue jms/AsyncSenderQueue is bound to jms/opc/OrderApprovalQueue. Reply is
      <Type>UPDATEORDERS</Type><Status>SUCCESS</Status> or an <Error>.
