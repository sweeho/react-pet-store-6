records:
  - record_key: "APPR-BR-0001"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL automatically approve a newly received order WHEN the order locale is en_US and the order total is strictly less than 500, OR the order locale is ja_JP and the order total is strictly less than 50000; every other order (any other locale, including zh_CN, or a total at or above the threshold) SHALL remain PENDING for an administrator decision."
    plain_text: "Small orders are approved automatically: US orders under 500 and Japanese orders under 50 000 (in the order's own currency). Larger orders, and every order from any other locale such as Chinese, wait for an administrator to approve or deny them."
    technical_note: "PurchaseOrderMDB.canIApprove() compares PurchaseOrder.getTotalPrice() against bare literals 500 (Locale.US) and 50000 (Locale.JAPAN) with strict '<'. No branch exists for Locale.CHINA. When true, doWork() builds an OrderApproval XML carrying a ChangedOrder(orderId, APPROVED) and PurchaseOrderTD posts it to the OrderApproval queue, so auto-approval goes through the same OrderApprovalMDB path as an admin approval."
    confidence: "medium"
    confidence_basis: "One clear place in code (canIApprove). The thresholds are bare literals with no configuration, test or document; the javadoc calls the method 'just a stub for converting currency' for demonstration, so the business intent behind the values is unconfirmed. Not low because the values and comparison operators are read directly, not inferred."
    risk_class: "financial"
    basis: "canIApprove() locale/threshold branches and the doWork() call that turns a true result into an APPROVED order approval message."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 178
        line_end: 191
        excerpt: "  /**\n   * Just a stub for converting currency. This method is used for\n   * demonstrating the petstore, so that smaller orders can flow through\n   * the system without having to fire up the admin Gui to approve orders\n   */\n  private boolean canIApprove(PurchaseOrder purchaseOrder) {\n    Locale locale = purchaseOrder.getLocale();\n    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;\n    } else if (locale.equals(Locale.JAPAN))  {\n      if (purchaseOrder.getTotalPrice() < 50000) return true;\n    }\n    return false;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 151
        line_end: 165
        excerpt: "  private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {\n    String ret = null;\n    PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);\n    poHome.create(purchaseOrder);\n    //update process manager to start workflow for this purchase order\n    processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);\n\n    if(canIApprove(purchaseOrder)) {\n      ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);\n      OrderApproval oa = new OrderApproval();\n      oa.addOrder(co);\n      ret = oa.toXML();\n    }\n    return ret;\n  }\n"
    stack_metadata:
      framework: "EJB 2.0"
      ejb.bean: "PurchaseOrderMDB"
      jms.queue: "jms/opc/OrderQueue -> jms/opc/OrderApprovalQueue"
      ejb.transaction: "Required"
  - record_key: "APPR-WF-0001"
    kind: "workflow"
    capability_key: "order-approval"
