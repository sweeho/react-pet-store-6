  - record_key: "FULF-INT-0003"
    kind: "integration"
    capability_key: "order-fulfillment"
    requirement: "WHEN an order arrives from the storefront the system SHALL parse it (with schema validation when enabled) and create the stored order before any approval decision; every processing step SHALL run as one transaction so that a failure at any step leaves no partial update and the incoming message is retried."
    plain_text: "Each step of processing an order (receiving it, approving it, recording a shipment, sending an e-mail) either completes fully or not at all; if it fails, it is tried again rather than half-done."
    technical_note: "All six MDB onMessage methods have container trans-attribute Required in ejb-jar.xml; every checked exception is rethrown as EJBException, which rolls back the container transaction and causes JMS redelivery. QueueHelper opens transacted sessions (createQueueSession(true, 0)) so outbound sends join the transaction. No retry limit or dead-letter handling is declared in this shard."
    confidence: "high"
    confidence_basis: "Declared in ejb-jar.xml container-transaction and consistently enforced by the catch blocks in every MDB."
    risk_class: "operational"
    basis: "container-transaction declarations; onMessage catch blocks; transacted QueueHelper session."
