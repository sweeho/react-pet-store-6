  - record_key: "RPT-BR-0001"
    kind: "business-rule"
    capability_key: "sales-reporting"
    requirement: "The system SHALL produce chart data for orders whose date falls within a start and end date inclusive: for a REVENUE request, the sum of quantity x unit price; for any other request, the sum of quantities; grouped by category when no category is given, or by item restricted to the given category; orders of every status SHALL be included."
    plain_text: "Administrators can chart revenue or units sold over a date range, either per category or per item within one category. Every order placed in the range counts, whatever its status."
    technical_note: "OPCAdminFacadeEJB.getChartInfo(request, start, end, categ): PurchaseOrderLocalHome.findPOBetweenDates (poDate >= ? AND poDate <= ?), iterate po.getAllItems(); request.equals(\"REVENUE\") else quantity; categ==null -> key categoryId else filter categoryId==categ, key itemId. Revenue accumulated as java Float. No status filter."
    confidence: "high"
    confidence_basis: "Facade code plus declared finder SQL establishing inclusive bounds."
    risk_class: "financial"
    basis: "getChartInfo() branches and the findPOBetweenDates SQL."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java"
        line_start: 159
        line_end: 256
        excerpt: "    /**\n     * Business method in remote interface. Given start, end dates, this\n     * returns a <code>HashMap</code> of revenue / orders in the given period\n     * @param request  Represents the type of request - ORDERS/REVENUE\n     * @param start    Represents the start date in mm/dd/yyyy format\n     * @param end      Represents the end date in mm/dd/yyyy format\n     * @param categ    Represents the sub-classification\n     * @return <code>HashMap</code> of the required details\n     * @throws <code>OPCAdminFacadeException</code> for all errors\n     */\n    public Map getChartInfo(String request,\n                            Date start,\n                            Date end,\n                            String categ)\n        throws OPCAdminFacadeException {\n        String id;\n        Float tmpValue;\n        Integer tmpQty;\n        PurchaseOrderLocal po;\n\n        Map chartDetails = new HashMap();\n\n        try {\n            PurchaseOrderLocalHome pohome = getPO();\n            Collection poColl =\n                pohome.findPOBetweenDates(start.getTime(), end.getTime());\n\n            Iterator it = poColl.iterator();\n            while((it!= null) && (it.hasNext())) {\n                po = (PurchaseOrderLocal) it.next();\n                Collection liColl = po.getAllItems();\n                Iterator lit = liColl.iterator();\n                while((lit!=null) && (lit.hasNext())) {\n                    LineItem loc = (LineItem) lit.next();\n                    if(request.equals(\"REVENUE\")) {\n                        if(categ == null) {\n                            id = loc.getCategoryId();\n                            if(chartDetails.containsKey(id)) {\n                                tmpValue = (Float) chartDetails.get(id);\n                                chartDetails.put(id,\n                                     new Float(tmpValue.floatValue() +\n                                     (loc.getQuantity()*loc.getUnitPrice())));\n                            } else {\n                                chartDetails.put(id, new Float((loc.getQuantity()*\n                                                        loc.getUnitPrice())));\n                            }\n                        } else {\n                            if(loc.getCategoryId().equals(categ)) {\n                                id = loc.getItemId();\n                                if(chartDetails.containsKey(id)) {\n                                    tmpValue = (Float) chartDetails.get(id);\n                                    chartDetails.put(id,\n                                      new Float(tmpValue.floatValue() +\n                                      (loc.getQuantity()*loc.getUnitPrice())));\n                                } else {\n                                    chartDetails.put(id,\n                                     new Float(loc.getQuantity()*loc.getUnitPrice()));\n                                }\n                            }\n                        }\n                    } else {\n                        if(categ == null) {\n                            id = loc.getCategoryId();\n                            if(chartDetails.containsKey(id)) {\n                                tmpQty = (Integer) chartDetails.get(id);\n                                chartDetails.put(id,\n                                     new Integer(tmpQty.intValue() +\n                                                 loc.getQuantity()));\n                            } else {\n                                chartDetails.put(id, new\n                                                 Integer(loc.getQuantity()));\n                            }\n                        } else {\n                            if(loc.getCategoryId().equals(categ)) {\n                                id = loc.getItemId();\n                                if(chartDetails.containsKey(id)) {\n                                    tmpQty = (Integer) chartDetails.get(id);\n                                    chartDetails.put(id,\n                                            new Integer(tmpQty.intValue() +\n                                            loc.getQuantity()));\n                                } else {\n                                    chartDetails.put(id,\n                                           new Integer(loc.getQuantity()));\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        } catch(FinderException fe) {\n            System.err.println(\"finder Ex while getChart :\" +\n                    fe.getMessage());\n            throw new OPCAdminFacadeException(\"Unable to find PurchaseOrders\"+\n                                              \" in given period : \" +\n                                              fe.getMessage());\n        }\n        return(chartDetails);\n    }\n"
