  - record_key: "FULF-BR-0001"
    kind: "business-rule"
    capability_key: "order-fulfillment"
    requirement: "WHEN a supplier invoice is received, the system SHALL add each invoiced quantity to the shipped quantity of the order line with the matching item id; GIVEN every order line's shipped quantity then equals its ordered quantity THEN the order status SHALL become COMPLETED and a completed-order notification SHALL be triggered; OTHERWISE the order status SHALL become SHIPPED_PART."
    plain_text: "Orders can ship in several parts. Each shipment adds to what has been sent for each item. When every item has been shipped in full the order is marked completed and the customer is told; until then it is marked partly shipped."
    technical_note: "InvoiceMDB.doWork(): poHome.findByPrimaryKey(invoice orderId); PurchaseOrderHelper.processInvoice(po, lineItemIds) (components/purchaseorder, outside this shard) increments LineItem.quantityShipped and returns true only if quantity == quantityShipped for all lines; then ProcessManager.updateStatus(COMPLETED) and InvoiceTD posts the orderId to jms/opc/MailCompletedOrderQueue, else updateStatus(SHIPPED_PART). No check of the current status is made before updating. LineItemEJBTable declares quantity and quantityShipped NOT NULL."
    confidence: "high"
    confidence_basis: "Status decision is in InvoiceMDB, the javadoc states the same rule, and the persisted shipped-quantity column is declared NOT NULL in the DDL. The equality comparison itself lives in a helper outside this shard (read for context only)."
    risk_class: "financial"
    basis: "InvoiceMDB.doWork()/onMessage() and javadoc; LineItemEJBTable DDL."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 108
        line_end: 129
        excerpt: "  /**\n   * InvoiceMDB receives a JMS message containing an Invoice\n   * for a user order. If all the order items have been shipped\n   * for the order, it updates the purchase order status to\n   * COMPLETED to end the purchase order fulfillment process.\n   * If the order is not yet all shipped, it updates the order\n   * status based on the invoice.\n   *\n   * @param recvMsg is the JMS message contaning the xml content for the invoice\n   */\n  public void onMessage(Message recvMsg) {\n    TextMessage recdTM = null;\n    String recdText = null;\n    try {\n      recdTM = (TextMessage)recvMsg;\n      recdText = recdTM.getText();\n      String joinMessage = doWork(recdText);\n\n      //if order completed so join condition is met\n      if (joinMessage != null) {\n        doTransition(joinMessage);\n      }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 157
        line_end: 173
        excerpt: "  private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {\n    String completedOrder = null;\n    PurchaseOrderHelper poHelper = new PurchaseOrderHelper();\n    invoiceXDE.setDocument(xmlInvoice);\n    PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());\n    boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());\n\n    //update process manager if this order is completely done, or partially done\n    //for this purchase order\n    if(orderDone) {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);\n      completedOrder = invoiceXDE.getOrderId();\n    } else {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);\n    }\n    return completedOrder;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/InvoiceTD.java"
        line_start: 63
        line_end: 86
        excerpt: "  public void setup() throws TransitionException {\n    try {\n      ServiceLocator serviceLocator = new ServiceLocator();\n      qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);\n      q = serviceLocator.getQueue(JNDINames.CR_MAIL_COMPLETED_ORDER_MDB_QUEUE);\n      queueHelper = new QueueHelper(qFactory, q);\n    } catch(ServiceLocatorException se) {\n        throw new TransitionException(se);\n    }\n  }\n\n\n  /**\n   * Send an order approval to the OrderApproval Queue, since the work\n   * for this step in the order fullfillment process is done.\n   */\n  public void doTransition(TransitionInfo info) throws TransitionException {\n    String xmlCompletedOrder = info.getXMLMessage();\n    try {\n      queueHelper.sendMessage(xmlCompletedOrder);\n    } catch (JMSException je) {\n        throw new TransitionException(je);\n    }\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml"
        line_start: 702
        line_end: 702
        excerpt: "          <sql>CREATE TABLE \"LineItemEJBTable\" (\"__PMPrimaryKey\" LONGINT , \"categoryId\" VARCHAR(255) , \"itemId\" VARCHAR(255) , \"lineNumber\" VARCHAR(255) , \"productId\" VARCHAR(255) , \"quantity\" INTEGER NOT NULL , \"quantityShipped\" INTEGER NOT NULL , \"unitPrice\" REAL NOT NULL, CONSTRAINT \"pk_LineItemEJBTabl\" PRIMARY KEY (\"__PMPrimaryKey\") )</sql>\n"
