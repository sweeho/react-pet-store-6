  - record_key: "APPR-WF-0002"
    kind: "workflow"
    capability_key: "order-approval"
    requirement: "The system SHALL accept approval decisions as a batch covering one or more orders, each marked APPROVED or DENIED; for every valid decision it SHALL record the new status, and for every APPROVED order it SHALL send a purchase order to the supplier; it SHALL then forward the batch of valid decisions, in a single message, for customer notification."
    plain_text: "An administrator (or the automatic approval) can decide several orders at once. Each approved order is passed on to the supplier to be filled, and the customers in the batch are then told whether their order was approved or denied."
    technical_note: "OrderApprovalMDB.doWork() parses OrderApproval XML (list of ChangedOrder), updates ProcessManager status, collects one TPA supplier order XML per APPROVED order; OrderApprovalTD.doTransition() sends each supplier PO to jms/supplier/PurchaseOrderQueue then one OrderApproval XML to jms/opc/MailOrderApprovalQueue. The transition delegate class is chosen at deploy time from env-entry param/transitiondelegate/OrderApprovalTD (value redacted in this copy)."
    confidence: "high"
    confidence_basis: "Behaviour is visible in the MDB and in the transition delegate, and the queue wiring is declared in sun-j2ee-ri.xml (OrderApprovalMailQueue and supplier PurchaseOrderQueue), i.e. code plus deployment config."
    risk_class: "financial"
    basis: "doWork() loop, OrderApprovalTD.doTransition()/sendMail(), and resource-env-ref bindings for the two outbound queues."
    traces:
