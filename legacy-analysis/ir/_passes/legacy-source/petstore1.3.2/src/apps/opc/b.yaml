  - record_key: "APPR-BR-0002"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL apply an approval or denial only to an order whose current status is PENDING. GIVEN an order already APPROVED, DENIED, SHIPPED_PART or COMPLETED WHEN an approval decision for it arrives THEN the system SHALL ignore it, SHALL NOT change its status, SHALL NOT send a supplier order, and SHALL NOT notify the customer."
    plain_text: "An order can be approved or denied only once, while it is still pending. A repeated or late decision on an order that was already decided or shipped is ignored, and the customer hears nothing more about it."
