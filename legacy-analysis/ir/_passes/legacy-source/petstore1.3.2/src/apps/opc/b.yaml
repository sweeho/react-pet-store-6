    category: "data-corruption"
    title: "Invoice processing ignores current status and over-shipment"
    description: "An invoice updates the order status without checking the current status. An invoice for a DENIED or still-PENDING order is accepted and moves it to SHIPPED_PART or COMPLETED. Completion requires shipped quantity to equal ordered quantity exactly, so a duplicate or over-quantity invoice leaves the order in SHIPPED_PART for good, and can move an already COMPLETED order back to SHIPPED_PART."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 157
        line_end: 173
        excerpt: "  private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {\n    String completedOrder = null;\n    PurchaseOrderHelper poHelper = new PurchaseOrderHelper();\n    invoiceXDE.setDocument(xmlInvoice);\n    PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());\n    boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());\n\n    //update process manager if this order is completely done, or partially done\n    //for this purchase order\n    if(orderDone) {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);\n      completedOrder = invoiceXDE.getOrderId();\n    } else {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);\n    }\n    return completedOrder;\n  }\n"
