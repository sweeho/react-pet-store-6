        excerpt: "    <container-transaction>\n      <method>\n        <ejb-name>PurchaseOrderMDB</ejb-name>\n        <method-name>onMessage</method-name>\n        <method-params>\n          <method-param>javax.jms.Message</method-param>\n        </method-params>\n      </method>\n      <trans-attribute>Required</trans-attribute>\n    </container-transaction>\n\n    <container-transaction>\n      <method>\n        <ejb-name>OrderApprovalMDB</ejb-name>\n        <method-name>onMessage</method-name>\n        <method-params>\n          <method-param>javax.jms.Message</method-param>\n        </method-params>\n      </method>\n      <trans-attribute>Required</trans-attribute>\n    </container-transaction>\n\n    <container-transaction>\n      <method>\n        <ejb-name>InvoiceMDB</ejb-name>\n        <method-name>onMessage</method-name>\n        <method-params>\n          <method-param>javax.jms.Message</method-param>\n        </method-params>\n      </method>\n      <trans-attribute>Required</trans-attribute>\n    </container-transaction>\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 114
        line_end: 136
        excerpt: "  public void onMessage(Message recvMsg) {\n    TextMessage recdTM = null;\n    String recdText = null;\n    String approval = null;\n    try {\n      recdTM = (TextMessage)recvMsg;\n      recdText = recdTM.getText();\n      approval = doWork(recdText);\n\n      //if order approve/deny list !empty, send it to customer relations\n      if(approval != null) {\n        doTransition(approval);\n      } //else wait for admin to approve/deny orders\n    } catch(XMLDocumentException de) {\n        throw new EJBException(de);\n    } catch(CreateException ce) {\n        throw new EJBException(ce);\n    } catch(TransitionException te) {\n        throw new EJBException(te);\n    } catch (JMSException je) {\n        throw new EJBException(je);\n    }\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/QueueHelper.java"
        line_start: 64
        line_end: 85
        excerpt: "    public void sendMessage(String xmlMessage) throws JMSException {\n      QueueConnection qConnect = null;\n      QueueSession session = null;\n      QueueSender qSender = null;\n\n        try {\n            qConnect = qFactory.createQueueConnection();\n            session = qConnect.createQueueSession(true, 0);\n            qSender = session.createSender(q);\n          TextMessage jmsMsg = session.createTextMessage();\n            jmsMsg.setText(xmlMessage);\n            qSender.send(jmsMsg);\n        } finally {\n            try {\n                if(qConnect != null) {\n                    qConnect.close();\n                }\n            } catch(Exception e) {\n            System.err.println(\"OPC.QueueHelper GOT EXCEPTION closing connection\" + e);\n          }\n        }\n    }\n"
