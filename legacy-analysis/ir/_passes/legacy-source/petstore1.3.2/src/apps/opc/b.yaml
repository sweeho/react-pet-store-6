        excerpt: "  private static final String MAIL_SUBJECT = \"Java Pet Store Order Status: \";\n  private static final String ORDER_APPROVAL_STYLE_SHEET =\n                \"/com/sun/j2ee/blueprints/opc/rsrc/xsl/OrderApproval.xsl\";\n"
