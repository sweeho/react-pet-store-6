  - record_key: "FULF-INT-0001"
    kind: "integration"
    capability_key: "order-fulfillment"
    requirement: "WHEN an order is approved, the system SHALL send the supplier a purchase order containing the order id, the order date, the ship-to contact (given name, family name, street line 1, city, state, country, postal code, e-mail, telephone) and, for every order line, the category, product, item, line number, quantity and unit price."
    plain_text: "For each approved order the supplier receives an order document with the order number and date, who and where to ship to, and every item ordered with its quantity and price."
    technical_note: "OrderApprovalMDB.getXmlPO() fills TPASupplierOrderXDE from PurchaseOrderLocal: setOrderId(poId), setOrderDate(poDate), setShippingAddress(givenName, familyName, streetName1, city, state, country, zipCode, email, telephone), addLineItem(categoryId, productId, itemId, lineNumber, quantity, unitPrice) per LineItem. streetName2 exists in AddressEJBTable but is not passed."
