  - record_key: "NOTIF-BR-0002"
    kind: "business-rule"
    capability_key: "customer-notifications"
    requirement: "The system SHALL render each customer e-mail in the template for the order's locale (en_US, ja_JP, zh_CN); GIVEN the stored locale has no '_' separator WHEN an approval or shipment e-mail is rendered THEN the default (English) template SHALL be used; GIVEN no template exists for the locale THEN the e-mail SHALL fail and the triggering message SHALL be retried."
    plain_text: "Customer e-mails are written in the customer's language (English, Japanese or Chinese). An unrecognised locale value falls back to English; a recognised locale with no template makes the e-mail fail."
    technical_note: "MailContentXDE.getStyleSheetPath() inserts '_' + locale.toString() before '.xsl' and falls back to the base path only when locale is null; getTransformer() throws FormatterException('No style sheet found for locale') if the resource is missing, which the MDB rethrows as EJBException. LocaleUtil.getLocaleFromString() returns null when no '_' is present. Templates present: OrderApproval/PartialInvoice/CompletedOrder for base, en_US, ja_JP, zh_CN."
    confidence: "high"
    confidence_basis: "Selection logic in MailContentXDE and LocaleUtil, and the twelve template files present on disk for exactly these locales."
    risk_class: "presentational"
    basis: "getStyleSheetPath()/getTransformer(); LocaleUtil null return; template inventory."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java"
        line_start: 136
        line_end: 165
        excerpt: "  private Transformer getTransformer(Locale locale) throws FormatterException {\n    Transformer transformer = (Transformer) transformers.get(locale);\n    if (transformer == null) {\n      InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));\n      if (stream != null) {\n        try {\n          transformer = transformerFactory.newTransformer(new StreamSource(stream));\n          transformers.put(locale, transformer);\n        } catch (Exception exception) {\n          throw new FormatterException(exception);\n        }\n      } else {\n        throw new FormatterException(\"No style sheet found for locale: \" + locale);\n      }\n    }\n    return transformer;\n  }\n\n  private String getStyleSheetPath(String styleSheetPath, Locale locale) {\n    if (locale != null) {\n      int i = styleSheetPath.lastIndexOf('.');\n      if (i >= 0) {\n        String suffix = styleSheetPath.substring(i);\n        String base = styleSheetPath.substring(0, i);\n        return base + \"_\" + locale.toString() + suffix;\n      }\n      return styleSheetPath + \"_\" + locale.toString();\n    }\n    return styleSheetPath;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java"
        line_start: 48
        line_end: 52
        excerpt: "  public static Locale getLocaleFromString(String localeString) {\n    if (localeString == null) return null;\n    if (localeString.toLowerCase().equals(\"default\")) return Locale.getDefault();\n    int languageIndex = localeString.indexOf('_');\n    if (languageIndex  == -1) return null;\n"
    stack_metadata:
      framework: "EJB 2.0 + XSLT"
