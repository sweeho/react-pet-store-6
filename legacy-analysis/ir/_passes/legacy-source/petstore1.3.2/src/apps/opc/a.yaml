      "jms.queue": "jms/opc/OrderApprovalQueue"
  - record_key: "OFUL-INT-0001"
    kind: "integration"
    capability_key: "order-fulfillment"
    requirement: "WHEN an order is approved, the system SHALL send the supplier a purchase order containing the order id, the order date, the ship-to contact (given name, family name, street line 1, city, state, country, postal code, e-mail, telephone) and every order line (category, product, item, line number, quantity, unit price)."
    plain_text: "As soon as an order is approved, a purchase order with the delivery details and all order lines goes to the supplier so it can be shipped."
    technical_note: "OrderApprovalMDB.doWork() adds getXmlPO(po) to supplierPoList for each ChangedOrder whose status is APPROVED. getXmlPO() fills TPASupplierOrderXDE (the components/xmldocuments tpa copy, per the import) from the PurchaseOrder, ContactInfo and Address entities. Only streetName1 is sent, never a second street line. OrderApprovalTD sends each PO to jms/supplier/PurchaseOrderQueue. Denied orders produce no supplier PO."
    confidence: "medium"
    confidence_basis: "It is read directly from one code path plus the transition delegate that sends it. The supplier side that consumes it is outside this shard."
    risk_class: "operational"
    basis: "The approved-only branch in doWork() and the field mapping in getXmlPO()."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 218
        line_end: 223
        excerpt: "      //for all approved orders, send a PO to supplier\n      if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {\n        po = poHome.findByPrimaryKey(co.getOrderId());\n        String xmlPO = getXmlPO(po, supplierOrderXDE);\n        supplierPoList.add(xmlPO);\n      }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 248
        line_end: 268
        excerpt: "  private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{\n    supplierOrderXDE.newDocument();\n    supplierOrderXDE.setOrderId(po.getPoId());\n    Date tmpDate = new Date(po.getPoDate());\n    supplierOrderXDE.setOrderDate(tmpDate);\n    ContactInfoLocal cinfo = po.getContactInfo();\n    AddressLocal addr = cinfo.getAddress();\n    supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),\n                                        addr.getStreetName1(), addr.getCity(),\n                                        addr.getState(), addr.getCountry(),\n                                        addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());\n    //Collection liColl = po.getAllItems();\n    Collection liColl = po.getData().getLineItems();\n    Iterator liIt = liColl.iterator();\n    while((liIt != null) && (liIt.hasNext())) {\n      LineItem li = (LineItem) liIt.next();\n      supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),\n                                   li.getLineNumber(), li.getQuantity(), li.getUnitPrice());\n    }\n    return supplierOrderXDE.getDocumentAsString();\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/OrderApprovalTD.java"
        line_start: 92
        line_end: 97
        excerpt: "      Iterator it = supplierPoList.iterator();\n      while(it!= null && it.hasNext()) {\n        xmlPO = (String) it.next();\n        //send PO to supplier for this order\n        supplierQueueHelper.sendMessage(xmlPO);\n       }//end while\n"
    stack_metadata:
      "ejb.bean": "OrderApprovalMDB"
      "jms.queue": "jms/supplier/PurchaseOrderQueue"
      "xml.document": "TPASupplierOrder"
  - record_key: "OFUL-RULE-0002"
    kind: "business-rule"
    capability_key: "order-fulfillment"
    requirement: "WHEN a supplier invoice (shipment notice) for an order is received, the system SHALL record the shipped items against the order; IF every item of the order has then been shipped THEN the system SHALL set the order status to COMPLETED and trigger the order-completed notification, OTHERWISE it SHALL set the order status to SHIPPED_PART."
    plain_text: "Each shipment from the supplier is recorded against the order. When everything has shipped the order is marked completed and the customer is told; until then it is marked partly shipped."
    technical_note: "InvoiceMDB.doWork(): TPAInvoiceXDE extracts OrderId and a map itemId->quantity. PurchaseOrderHelper.processInvoice(po, lineItemIds) (purchaseorder component, outside this shard) decides orderDone. Then processManager.updateStatus(COMPLETED or SHIPPED_PART). If completed, the order id goes to jms/opc/MailCompletedOrderQueue via InvoiceTD. The current status is not checked before the update, unlike the PENDING guard on approvals."
    confidence: "medium"
    confidence_basis: "The status branch is clear in one place and matches the javadoc. The 'all items shipped' test itself lives in PurchaseOrderHelper, outside this shard, so I could not read how it counts quantities."
    risk_class: "operational"
    basis: "InvoiceMDB.doWork() and its javadoc."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 148
        line_end: 173
        excerpt: "  /**\n   * update POEJB to reflect items shipped, and also update Process Manager\n   * to completed or partially completed status based on  the items shipped\n   * in the order's invoice. If the join condition is met and all items are\n   * shipped, then send an order completed message to user\n   *\n   * @return orderMessage if order completed\n   *         else null if NOT completed\n   */\n  private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {\n    String completedOrder = null;\n    PurchaseOrderHelper poHelper = new PurchaseOrderHelper();\n    invoiceXDE.setDocument(xmlInvoice);\n    PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());\n    boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());\n\n    //update process manager if this order is completely done, or partially done\n    //for this purchase order\n    if(orderDone) {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);\n      completedOrder = invoiceXDE.getOrderId();\n    } else {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);\n    }\n    return completedOrder;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 126
        line_end: 129
        excerpt: "      //if order completed so join condition is met\n      if (joinMessage != null) {\n        doTransition(joinMessage);\n      }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/TPAInvoiceXDE.java"
        line_start: 123
        line_end: 139
        excerpt: "  private void extractData() throws XMLDocumentException {\n        Element element = invoiceDocument.getDocumentElement();\n        if (element.getLocalName().equals(XML_INVOICE) && element.getNamespaceURI().equals(INVOICE_NS)) {\n      Element child;\n      child = XMLDocumentUtils.getFirstChildNS(element, INVOICE_NS, XML_ORDERID, false);\n      orderId = XMLDocumentUtils.getContentAsString(child, false);\n      child = XMLDocumentUtils.getSiblingNS(child, INVOICE_NS, XML_LINEITEMS, false);\n      for (child = XMLDocumentUtils.getFirstChildNS(child, LINEITEM_NS, XML_LINEITEM, false);\n           child != null;\n           child = XMLDocumentUtils.getNextSiblingNS(child, LINEITEM_NS, XML_LINEITEM, true)) {\n                lineItemIds.put(XMLDocumentUtils.getAttribute(child, XML_ITEMID, false),\n                        new Integer(XMLDocumentUtils.getAttributeAsInt(child, XML_QUANTITY, false)));\n      }\n      return;\n        }\n        throw new XMLDocumentException(XML_INVOICE + \" element expected.\");\n  }\n"
    stack_metadata:
      "ejb.bean": "InvoiceMDB"
      "ejb.transaction": "Required"
      "jms.queue": "jms/opc/InvoiceTopic -> jms/opc/MailCompletedOrderQueue"
