  - record_key: "CNOT-RULE-0004"
    kind: "business-rule"
    capability_key: "customer-notifications"
    requirement: "The system SHALL select each customer e-mail template by the order's locale (en_US, ja_JP, zh_CN are provided); GIVEN an order with no usable locale WHEN a mail is built THEN the default (English) template SHALL be used; GIVEN an order whose locale has no template WHEN a mail is built THEN mail generation SHALL fail for that message."
    plain_text: "Customer e-mails are written in the order's language: English, Japanese or Chinese. Orders with no language get English. An order in any other language cannot be e-mailed."
    technical_note: "MailContentXDE.getStyleSheetPath() appends '_' + locale.toString() before the .xsl suffix, and uses the bare base file when locale is null. getTransformer() throws FormatterException('No style sheet found for locale') when the resource is absent. That becomes EJBException, then rollback and redelivery. Templates exist for exactly en_US, ja_JP, zh_CN plus a base file per mail type. Transformers are cached per locale."
    confidence: "medium"
    confidence_basis: "One clear implementation, and the set of shipped template files corroborates the supported locales. Which locale strings actually reach this code depends on the storefront, outside this shard."
    risk_class: "presentational"
    basis: "MailContentXDE stylesheet resolution and the template file set."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java"
        line_start: 136
        line_end: 165
        excerpt: "  private Transformer getTransformer(Locale locale) throws FormatterException {\n    Transformer transformer = (Transformer) transformers.get(locale);\n    if (transformer == null) {\n      InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));\n      if (stream != null) {\n        try {\n          transformer = transformerFactory.newTransformer(new StreamSource(stream));\n          transformers.put(locale, transformer);\n        } catch (Exception exception) {\n          throw new FormatterException(exception);\n        }\n      } else {\n        throw new FormatterException(\"No style sheet found for locale: \" + locale);\n      }\n    }\n    return transformer;\n  }\n\n  private String getStyleSheetPath(String styleSheetPath, Locale locale) {\n    if (locale != null) {\n      int i = styleSheetPath.lastIndexOf('.');\n      if (i >= 0) {\n        String suffix = styleSheetPath.substring(i);\n        String base = styleSheetPath.substring(0, i);\n        return base + \"_\" + locale.toString() + suffix;\n      }\n      return styleSheetPath + \"_\" + locale.toString();\n    }\n    return styleSheetPath;\n  }\n"
    stack_metadata:
      "framework": "XSLT"
      "resource": "opc/rsrc/xsl/*_<locale>.xsl"
