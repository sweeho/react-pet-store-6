  - record_key: "SIGN-RULE-0001"
    kind: "business-rule"
    capability_key: "sign-on"
    requirement: "The system SHALL NOT itself restrict who may call the order-processing administration functions (order lists by status, sales charts) or the order-processing message handlers; every method is open to any caller that can reach it."
    plain_text: "The order-processing back office does not check who is asking. Anyone who can reach it can read order lists and sales figures, and anyone who can post to its queues can approve orders."
    technical_note: "ejb-jar.xml assembly-descriptor gives <unchecked/> method-permission for method-name * on OPCAdminFacadeEJB and on all six MDBs, and declares no security-role. sun-j2ee-ri.xml leaves the principal names empty. web.xml has no security-constraint. Access control, if any, is left to the calling admin application and the network."
    confidence: "high"
    confidence_basis: "The declarative descriptor states it explicitly for every bean, and there is no isUserInRole/getCallerPrincipal anywhere in this module's code."
    risk_class: "regulated"
    basis: "The unchecked method-permissions in ejb-jar.xml."
