  - record_key: "LOC-RULE-0001"
    kind: "business-rule"
    capability_key: "localization"
    requirement: "The system SHALL interpret an order's stored locale text of the form 'language_COUNTRY' as that language and country, SHALL interpret 'default' (any case) as the server's default locale, and SHALL treat text without an underscore as no locale."
    plain_text: "The language stored on an order, such as 'en_US' or 'ja_JP', decides the language of its e-mails. 'default' means the server's own language, and anything else unrecognisable means no language."
    technical_note: "LocaleUtil.getLocaleFromString() is used by MailOrderApprovalMDB and MailInvoiceMDB on po.getPoLocale(). A third '_variant' segment is never parsed (variantIndex is always -1), and with three segments the country stays null. MailCompletedOrderMDB uses PurchaseOrder.getLocale() instead."
    confidence: "medium"
    confidence_basis: "One implementation, read directly, with two callers in this shard. The producers of the locale string are outside the shard."
    risk_class: "presentational"
    basis: "LocaleUtil.getLocaleFromString()."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java"
        line_start: 48
        line_end: 75
        excerpt: "  public static Locale getLocaleFromString(String localeString) {\n    if (localeString == null) return null;\n    if (localeString.toLowerCase().equals(\"default\")) return Locale.getDefault();\n    int languageIndex = localeString.indexOf('_');\n    if (languageIndex  == -1) return null;\n    int countryIndex = localeString.indexOf('_', languageIndex +1);\n    String country = null;\n    if (countryIndex  == -1) {\n      if (localeString.length() > languageIndex) {\n        country = localeString.substring(languageIndex +1, localeString.length());\n      } else {\n        return null;\n      }\n    }\n    int variantIndex = -1;\n    if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);\n    String language = localeString.substring(0, languageIndex);\n    String variant = null;\n    if (variantIndex  != -1) {\n      variant = localeString.substring(variantIndex +1, localeString.length());\n    }\n    if (variant != null) {\n      return new Locale(language, country, variant);\n    } else {\n      return new Locale(language, country);\n    }\n\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailOrderApprovalMDB.java"
        line_start: 174
        line_end: 174
        excerpt: "        mailContentXDE.setLocale(LocaleUtil.getLocaleFromString(po.getPoLocale()));\n"
    stack_metadata:
      "framework": "java.util.Locale"
