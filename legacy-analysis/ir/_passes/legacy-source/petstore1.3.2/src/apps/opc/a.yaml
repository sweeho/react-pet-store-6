  - record_key: "SREP-RULE-0002"
    kind: "business-rule"
    capability_key: "sales-reporting"
    requirement: "The system SHALL report, for orders placed between a start and an end date, either revenue (sum of quantity x unit price per order line) or units ordered (sum of quantity), grouped by category; GIVEN a category is specified WHEN the report runs THEN only lines of that category SHALL be included, grouped by item. Orders SHALL be included regardless of their status."
    plain_text: "Administrators can chart revenue or units sold over a date range, by category or, within one category, by item. Every order placed in the range counts, including ones that were denied or never shipped."
    technical_note: "OPCAdminFacadeEJB.getChartInfo(request, start, end, categ) uses pohome.findPOBetweenDates(start.getTime(), end.getTime()). The boundary inclusivity is defined in the PurchaseOrder finder (outside this shard). request.equals(\"REVENUE\") selects revenue; any other value yields quantities. Revenue is accumulated in java.lang.Float with no rounding. There is no status filter."
    confidence: "medium"
    confidence_basis: "One clear implementation. The date-boundary semantics and the admin caller are outside this shard."
    risk_class: "financial"
    basis: "The getChartInfo() aggregation loops."
