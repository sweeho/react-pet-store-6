records:
  - record_key: "OAPP-RULE-0001"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL automatically approve a newly received order WHEN the order locale is en_US AND the order total is strictly less than 500, OR WHEN the order locale is ja_JP AND the order total is strictly less than 50000; every other order (any other locale, including zh_CN, or a total at or above the threshold) SHALL remain PENDING until an administrator approves or denies it."
    plain_text: "Small orders are approved automatically: US orders under 500 and Japanese orders under 50 000. Everything else, including every Chinese-locale order whatever its size, waits for an administrator to approve or deny it."
    technical_note: "PurchaseOrderMDB.canIApprove() compares PurchaseOrder.getTotalPrice() with the bare literals 500 (Locale.US) and 50000 (Locale.JAPAN). No other locale has a branch, so it falls through to false. The comparison is strict (<), on the order total in the order's own currency, with no currency conversion. When true, doWork() builds an OrderApproval with one ChangedOrder(APPROVED) and PurchaseOrderTD sends it to the OrderApproval queue, so the auto-approval goes through the same path as an administrator decision."
    confidence: "low"
    confidence_basis: "The thresholds are bare literals in one method, with no configuration, test or document behind them, and the method comment calls it 'just a stub for converting currency' used 'for demonstrating the petstore'. The code is unambiguous about what runs today. Whether these values are a real business rule is not, so the grade is low per the playbook's bare-literal rule."
    risk_class: "financial"
    basis: "canIApprove() is the only decision point. The onMessage() javadoc confirms that small orders are approved directly and larger ones wait for the Administrator."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 178
        line_end: 191
        excerpt: "  /**\n   * Just a stub for converting currency. This method is used for\n   * demonstrating the petstore, so that smaller orders can flow through\n   * the system without having to fire up the admin Gui to approve orders\n   */\n  private boolean canIApprove(PurchaseOrder purchaseOrder) {\n    Locale locale = purchaseOrder.getLocale();\n    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;\n    } else if (locale.equals(Locale.JAPAN))  {\n      if (purchaseOrder.getTotalPrice() < 50000) return true;\n    }\n    return false;\n  }\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 104
        line_end: 111
        excerpt: "  /**\n   * Process a purchase order that was placed at the Java Pet Store\n   * It creates the PuchaseOrder EJB for the order, and then for small\n   * orders directly approves the order and sends the approval to the\n   * OrderApproval MDB queue, but for larger orders, it jst puts them\n   * in the PurchaseOrder EJB, and the workflow process just waits for\n   * the Administrator to appove or deny the orders.\n   *\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 158
        line_end: 163
        excerpt: "    if(canIApprove(purchaseOrder)) {\n      ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);\n      OrderApproval oa = new OrderApproval();\n      oa.addOrder(co);\n      ret = oa.toXML();\n    }\n"
    stack_metadata:
      "framework": "EJB 2.0 MDB"
      "ejb.bean": "PurchaseOrderMDB"
      "ejb.transaction": "Required"
      "jms.queue": "jms/opc/OrderQueue -> jms/opc/OrderApprovalQueue"
  - record_key: "OAPP-WF-0002"
    kind: "workflow"
    capability_key: "order-approval"
    requirement: "WHEN an order is received from the storefront, the system SHALL persist the order and start its fulfilment workflow in status PENDING before any approval decision is taken."
    plain_text: "Every incoming order is saved and starts life as 'pending' before anything decides whether it is approved."
    technical_note: "PurchaseOrderMDB.doWork(): PurchaseOrder.fromXML(), then poHome.create(purchaseOrder), then processManager.createManager(orderId, OrderStatusNames.PENDING), and only then canIApprove(). All of this runs inside onMessage under a container-managed Required transaction."
    confidence: "medium"
    confidence_basis: "It is enforced in one clear code path, and the class javadoc agrees. I did not read the process-manager component to confirm how createManager stores the status, because it is outside this shard."
    risk_class: "operational"
    basis: "The doWork() statement order creates the PO entity and the PENDING process record unconditionally."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 151
        line_end: 157
        excerpt: "  private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {\n    String ret = null;\n    PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);\n    poHome.create(purchaseOrder);\n    //update process manager to start workflow for this purchase order\n    processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);\n\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml"
        line_start: 708
        line_end: 717
        excerpt: "    <container-transaction>\n      <method>\n        <ejb-name>PurchaseOrderMDB</ejb-name>\n        <method-name>onMessage</method-name>\n        <method-params>\n          <method-param>javax.jms.Message</method-param>\n        </method-params>\n      </method>\n      <trans-attribute>Required</trans-attribute>\n    </container-transaction>\n"
    stack_metadata:
      "ejb.bean": "PurchaseOrderMDB"
      "ejb.transaction": "Required"
      "db.object": "PurchaseOrderEJB; ProcessManagerEJB"
  - record_key: "OAPP-RULE-0003"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL apply an approval or denial only to an order whose current status is PENDING. GIVEN an order already APPROVED, DENIED, SHIPPED_PART or COMPLETED WHEN an approval or denial for it is received THEN the system SHALL ignore that entry without error, SHALL NOT change its status, SHALL NOT send it to a supplier, and SHALL NOT notify the customer about it."
    plain_text: "An order can only be approved or denied once, while it is still pending. A repeated or late decision for an order that has already been handled is silently ignored."
    technical_note: "OrderApprovalMDB.doWork() loops over the ChangedOrder list and does `continue` when processManager.getStatus(orderId) is not PENDING. An ignored entry is not added to the mail list (oaMailList) or the supplier PO list. Both the automatic approval from PurchaseOrderMDB and administrator decisions pass through this guard."
    confidence: "medium"
    confidence_basis: "It is enforced in one place, and an inline comment states the intent ('only PENDING orders can be updated'). There is no second enforcement, such as a DB constraint or state machine, in this shard."
    risk_class: "financial"
    basis: "The explicit status guard and comment in OrderApprovalMDB.doWork()."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 199
        line_end: 212
        excerpt: "    while(it!= null && it.hasNext()) {\n      ChangedOrder co = (ChangedOrder) it.next();\n      // only PENDING orders can be updated\n      //if order alreay APPROVED or DENIED or COMPLETED, then order\n      //already processed so dont process again\n      String curStatus = processManager.getStatus(co.getOrderId());\n      if(!curStatus.equals(OrderStatusNames.PENDING)) {\n        continue;\n      }\n      //generate list of valid orders to return\n      //list contains orders to notify the customer of\n      //order status changes. List is sent to customer\n      //relations for emailing.\n      oaMailList.addOrder(co);\n"
    stack_metadata:
      "ejb.bean": "OrderApprovalMDB"
      "ejb.transaction": "Required"
      "jms.queue": "jms/opc/OrderApprovalQueue"
  - record_key: "OAPP-REQ-0004"
    kind: "requirement"
    capability_key: "order-approval"
    requirement: "The system SHALL accept order decisions as a batch listing one or more orders, each with a new status of APPROVED or DENIED, and SHALL record each valid order's new status as given in the batch."
    plain_text: "Approval decisions can be sent for many orders at once, and each order's new status (approved or denied) is recorded."
    technical_note: "OrderApprovalMDB.onMessage() parses an OrderApproval XML document (OrderApproval.fromXML, with optional DTD validation per env-entry param/xml/validation/OrderApproval). For each PENDING ChangedOrder it calls processManager.updateStatus(orderId, co.getOrderStatus()). The status value is taken from the message as-is, with no check here that it is APPROVED or DENIED. Producers are PurchaseOrderMDB (auto-approval) and the admin application (per the discovery report)."
    confidence: "medium"
    confidence_basis: "One clear code path. The allowed status values (APPROVED/DENIED) come from the class and method javadoc and from the mail stylesheets, which only render those two. Code in this shard does not validate them."
    risk_class: "financial"
    basis: "OrderApprovalMDB class javadoc and doWork() loop."
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 139
        line_end: 145
        excerpt: "  /**\n   * Process a list of order status updates for customer orders\n   *\n   * @param  a JMS message containing an OrderApproval that\n   *          contains a list of orders and the status updates,\n   *          such as APPROVED or DENIED.\n   */\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 191
        line_end: 191
        excerpt: "    approval = OrderApproval.fromXML(xmlMessage, entityCatalogURL, validateXmlOrderApproval);\n"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 214
        line_end: 216
        excerpt: "      //update process manager\n      //for this purchase order workflow\n      processManager.updateStatus(co.getOrderId(), co.getOrderStatus());\n"
    stack_metadata:
