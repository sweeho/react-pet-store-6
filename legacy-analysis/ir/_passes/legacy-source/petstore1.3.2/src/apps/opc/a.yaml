  - record_key: "OFUL-REQ-0004"
    kind: "requirement"
    capability_key: "order-fulfillment"
    requirement: "The system SHALL process each incoming order, approval batch, invoice and notification as a single all-or-nothing unit: GIVEN any failure while handling the message WHEN processing aborts THEN status changes and outbound messages produced by that step SHALL NOT be committed and the message SHALL be retried."
    plain_text: "Each step of order processing either fully happens or does not happen at all. A failure undoes that step and it is retried, so an order is never half-updated."
    technical_note: "ejb-jar.xml declares trans-attribute Required on onMessage for all six MDBs. Every checked exception is rethrown as EJBException, which rolls back the container transaction. QueueHelper opens a transacted QueueSession (createQueueSession(true, 0)), so sends enlist in the transaction. The retry/redelivery count is the JMS provider's default and is not configured in this module."
    confidence: "high"
    confidence_basis: "It is enforced in two independent places: the declarative transaction attributes in ejb-jar.xml, and the programmatic rethrow-as-EJBException plus transacted send in the code. The redelivery limit is not visible."
    risk_class: "operational"
    basis: "container-transaction Required entries plus the consistent exception handling in each onMessage."
