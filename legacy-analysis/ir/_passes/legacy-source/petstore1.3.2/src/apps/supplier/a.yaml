  - capability_key: order-fulfillment
    record_keys: [SINV-WF-0001, OFUL-INT-0002]
    severity: high
    category: error-swallowed
    title: Invoice publish failures after a restock are swallowed and the update commits
    description: >
      When pending orders ship after an inventory update, a failure to look up or
      publish to the invoice topic is caught and printed inside sendInvoices(); the
      surrounding transaction still commits, so stock is reduced and lines marked
      shipped while the order processing centre never receives the invoice.
