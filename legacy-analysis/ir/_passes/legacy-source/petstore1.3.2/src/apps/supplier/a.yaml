  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      The status a supplier order is given when first recorded is set by the
      SupplierOrder entity outside this module. Pending-order reprocessing only selects
      PENDING orders, so the extraction of the supplierpo component must confirm new
      orders start as PENDING; otherwise unshipped orders would never be retried.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [OFUL-BR-0001, OFUL-BR-0003, SINV-BR-0002]
    severity: high
    category: data-corruption
    title: Stock is taken and lines marked shipped even when the invoice cannot be built
    description: >
      Stock is decremented and each line is marked fully shipped (and the order possibly
      marked COMPLETED) before the invoice is generated. If invoice generation fails the
      exception is caught, printed, and null returned, so the transaction commits. The
      comment says the order "can be fullfilled later", but the lines are already marked
      shipped and will be skipped on every later attempt; no invoice is ever sent for
      them.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
