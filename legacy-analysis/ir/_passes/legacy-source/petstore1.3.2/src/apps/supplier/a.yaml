  - record_key: OFUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      WHEN the supplier receives a purchase order THEN the system SHALL first record
      the order, then attempt to fulfil it from stock, and SHALL send an invoice back
      to the order processing centre only if at least one line was shipped. GIVEN no
      line could be shipped WHEN the order is received THEN the system SHALL send
      nothing and keep the order for later fulfilment when stock arrives.
    plain_text: >
      Every incoming supplier order is saved, as much as possible is shipped straight
      away, and an invoice is sent for what shipped. Orders that can't ship yet wait
      for restocking.
    technical_note: >
      SupplierOrderMDB.onMessage() calls OrderFulfillmentFacadeEJB.processPO(), which
      converts the XML via TPASupplierOrderXDE, creates a SupplierOrder entity and runs
      processAnOrder(). A non-null invoice string triggers SupplierOrderTD.doTransition().
      Whole onMessage runs in a Required container transaction; any checked failure is
      rethrown as EJBException (rollback, message redelivery by the container).
    confidence: high
    confidence_basis: >
      The flow is explicit in the message bean and the facade, and the transaction
      attributes are declared in ejb-jar.xml: code plus declarative config.
    risk_class: financial
    basis: >
      processPO persists then calls processAnOrder; onMessage transitions only when
      invoice != null, with the comment "else wait for the inventory to arrive".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |2
            public void onMessage(Message recvMsg) {
              try {
                String messageID = recvMsg.getJMSMessageID();
                TextMessage recdTM = (TextMessage)recvMsg;
                String recdText = recdTM.getText();

                // Do processing work on received message
                String invoice = doWork(recdText);

                // If orders were shipped, do the transition
                if(invoice!=null) {
                  doTransition(invoice);
                } //else wait for the inventory to arrive at the inventory receiver
              } catch (TransitionException te) {
                  throw new EJBException(te);
              } catch  (CreateException ce) {
                throw new EJBException(ce);
              } catch  (XMLDocumentException xe) {
                throw new EJBException(xe);
              } catch  (JMSException je) {
                throw new EJBException(je);
              }
            }
