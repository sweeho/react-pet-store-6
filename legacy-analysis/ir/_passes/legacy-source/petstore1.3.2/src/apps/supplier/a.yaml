  - record_key: SINV-BR-0001
    kind: business-rule
    capability_key: supplier-inventory
    requirement: >
      WHEN the supplier submits an inventory update THEN the system SHALL, for each
      item whose update selector is ticked and whose new-quantity field is non-empty
      and zero or greater, replace that item's stock quantity with the entered value.
      Items not ticked, with an empty quantity, or with a negative quantity SHALL be
      left unchanged without any message.
    plain_text: >
      A stock update overwrites the stock count (it does not add to it), and only for
      the items the supplier ticked. Negative or blank entries are silently ignored.
    technical_note: >
      RcvrRequestProcessor.updateInventory() walks request parameters starting with
      "item_", reads qty_<itemId>, parses with new Integer(), and calls
      InventoryLocal.setQuantity() when >= 0. An addQuantity() method in InventoryEJB
      is commented out, so there is no additive path.
    confidence: medium
    confidence_basis: >
      One clear programmatic place; no declarative validator or client-side check
      backs the >= 0 rule, and non-numeric input is not handled (see defects).
    risk_class: operational
    basis: >
      Explicit startsWith("item_"), empty-check and qty.intValue() >= 0 guard before
      setQuantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |2
            private void updateInventory(HttpServletRequest req) {

              String itemId;
              InventoryLocal inventory;

              try {
                Enumeration e = req.getParameterNames();
                while ((e != null) && e.hasMoreElements()) {
                  String param = ((String)e.nextElement()).trim();
                  if ((param != null) && param.startsWith("item_")) {
                    // get the item id number from the parameter
                    itemId = param.substring("item_".length(),param.length());
                    if(itemId != null) {
                      String newQty = req.getParameter("qty_" + itemId);
                      if((newQty == null) || (newQty.length() <= 0))
                        continue;
                      Integer qty = new Integer(newQty);
                      if(qty.intValue() >= 0 ) {
                        inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                        inventory.setQuantity(qty.intValue());
                      }
                    }
                  }
                }
              } catch (FinderException ne) {
                ne.printStackTrace();
              }
            }
