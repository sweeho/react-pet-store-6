    kind: business-rule
    capability_key: data-population
    requirement: >
      The system SHALL seed supplier stock with 29 items (EST-1 to EST-29) at a quantity
      of 10000 each. A seed entry without a quantity SHALL default to 0.
    plain_text: >
      The sample supplier starts with 10 000 units of each of the 29 sample items.
    technical_note: >
      docroot/populate/Populate-UTF8.xml InventoryList; InventoryPopulator.create()
