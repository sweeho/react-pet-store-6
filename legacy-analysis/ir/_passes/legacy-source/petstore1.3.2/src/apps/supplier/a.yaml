    category: error-swallowed
    title: Inventory update errors leave the transaction open and the user with no response
    description: >
      Every checked exception in the update path is caught and only printed: no rollback
      is issued and nothing is forwarded, so the supplier gets an empty response and the
      user transaction is left to time out. A non-numeric quantity raises an unchecked
      NumberFormatException that escapes the handler entirely, also without rollback.
