  - record_key: OFUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL fulfil an order line either completely or not at all: a line is
      shipped only when its full ordered quantity is in stock, and a shipped line is
      recorded as having its full quantity shipped. Lines already fully shipped SHALL
      be skipped on later attempts. An order MAY therefore ship in several partial
      shipments, line by line.
    plain_text: >
      Each line of an order ships whole or waits; an order can go out in several
      shipments as stock arrives, but a single line is never split.
    technical_note: >
      OrderFulfillmentFacadeEJB.processAnOrder(): skip when quantity ==
      quantityShipped; otherwise checkInventory(); on success
      setQuantityShipped(getQuantity()) and add the line to the invoice map.
    confidence: medium
    confidence_basis: >
