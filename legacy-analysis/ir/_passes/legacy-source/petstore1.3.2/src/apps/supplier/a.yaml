  - record_key: SINV-BR-0002
    kind: business-rule
    capability_key: supplier-inventory
    requirement: >
      WHEN an order line is fulfilled THEN the system SHALL reduce the item's stock by
      the full ordered quantity of that line. GIVEN the stock on hand is less than the
      line's ordered quantity WHEN fulfilment is attempted THEN the system SHALL not
      reduce stock for that line at all.
    plain_text: >
      Stock goes down by the ordered amount when a line ships; if there isn't enough
      stock for the whole line, nothing is taken.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory() compares InventoryLocal.getQuantity()
      with LineItemLocal.getQuantity() and calls InventoryEJB.reduceQuantity(), which
      subtracts with no floor of its own; the comparison is the only guard.
    confidence: high
    confidence_basis: >
      The guard and the decrement are read in two places (facade check plus entity
      method), and both run under a Required container transaction.
    risk_class: financial
    basis: >
      `if(inv.getQuantity() < item.getQuantity()) return(false);` precedes
      `inv.reduceQuantity(item.getQuantity());`.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 120
        line_end: 139
        excerpt: |2
            /**
             * if items are in stock then take them out of inventory to full order
             *
             * @return false if number of items in inventory is less than
             *         number in the line item of po; else return true.
             */
            private boolean checkInventory(LineItemLocal item)  {
              try {
                InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
                if(inv.getQuantity() < item.getQuantity())
                  return(false);
                inv.reduceQuantity(item.getQuantity());
              } catch (FinderException fe) {
                // swallow the finder exception because this means
                // supplier has not been populated; So we cant fulfill
                // this part of the order now
                return(false);
              }
              return(true);
            }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
