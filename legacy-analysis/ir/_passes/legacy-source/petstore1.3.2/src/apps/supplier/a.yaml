  - record_key: DPOP-WF-0001
    kind: workflow
    capability_key: data-population
    requirement: >
      WHEN population finishes THEN the system SHALL redirect to the requested success
      page, or failing that to the referring page; WHEN population fails THEN it SHALL
      redirect to the requested error page, or report a server error if none was given.
      The supplier "populating" page SHALL show a please-wait notice and immediately
      start population, passing through the forced flag and returning to the pet store
      main screen on success.
    plain_text: >
      A "please wait" page kicks off loading the sample supplier data and then returns
      the user to the pet store home page.
    technical_note: >
      PopulateServlet.doPost() success_page / error_page / Referer handling and
      redirect() ("//" prefix resolves against the server root, otherwise context-relative).
      populating.jsp uses a zero-second META refresh to
      Populate?success_page=//petstore/main.screen&forcefully=<param>.
    confidence: medium
    confidence_basis: >
      Both pieces read once each; the caller that links to populating.jsp is outside
      this module.
    risk_class: operational
    basis: >
      Redirect branches in doPost; META REFRESH URL in populating.jsp.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/tools/populate/PopulateServlet.java
        line_start: 74
        line_end: 96
        excerpt: |2
            public void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException, ServletException {
              String successPageURL = request.getParameter(SUCCESS_PAGE_URL_PARAM);
              String errorPageURL = request.getParameter(ERROR_PAGE_URL_PARAM);
              String forcefully = request.getParameter(FORCEFULLY_MODE_PARAM);
              String refererURL = request.getHeader(REFERER_HEADER);
              // System.err.println(successPageURL + " " + errorPageURL + " " + refererURL);
              try {
                populate(forcefully != null && Boolean.valueOf(forcefully).booleanValue());
              } catch(PopulateException exception) {
                System.err.println(exception.getRootCause().getMessage());
                if (errorPageURL == null) {
                  throw new ServletException("Populate exception occured :" + exception.getMessage(), exception.getRootCause());
                } else {
                  redirect(request, response, errorPageURL);
                }
              }
              if (successPageURL != null) {
                redirect(request, response, successPageURL);
              } else if (refererURL != null) {
                redirect(request, response, refererURL);
              }
              return;
            }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/populating.jsp
        line_start: 47
        line_end: 47
        excerpt: |2
          <META HTTP-EQUIV=REFRESH CONTENT="0; URL=Populate?success_page=//petstore/main.screen&forcefully=<%=request.getParameter("forcefully") %>"
    stack_metadata:
      jsp.page: docroot/populating.jsp

