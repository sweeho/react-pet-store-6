    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      The status a supplier order is given when first recorded is set by the
      SupplierOrder entity in the supplierpo component, outside this shard. Re-fulfilment
      on inventory update only picks up PENDING orders (OFUL-WF-0002), so whether a
      partly shipped or unshipped new order is ever retried depends on that initial
      status. A human (or the supplierpo shard) must confirm it is PENDING.
