  - record_key: OFUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL ship a purchase order line only when supplier stock for the item
      is at least the full ordered quantity of that line, and SHALL then mark the whole
      line quantity as shipped; a line SHALL never be shipped in part. Lines SHALL be
      evaluated independently, so an order MAY be shipped partially line by line.
      GIVEN stock of 3 and a line for 5 WHEN the order is fulfilled THEN that line is not
      shipped and the stock stays at 3.
    plain_text: >
      Each order line ships in full or not at all; the supplier never sends part of a
      line. Different lines of the same order can ship at different times.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory compares Inventory.quantity with
      LineItem.quantity and returns false if short; processAnOrder then
      setQuantityShipped(getQuantity()) for lines that passed and continues past lines
      that failed.
    confidence: medium
    confidence_basis: >
      One clear place in the facade, backed by the method's Javadoc; no declarative
      constraint or test states the rule independently.
    risk_class: financial
    basis: >
      `if(inv.getQuantity() < item.getQuantity()) return(false);` followed by
      `li.setQuantityShipped(li.getQuantity());` — quantityShipped is only ever set to
      the full quantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
