  - record_key: OFUL-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL produce, for each fulfilment attempt that ships at least one
      line, an invoice carrying the order id, the original order date, a shipping date
      equal to the current date, a fixed customer salutation "Dear PetStore Customer"
      in the user field, and one entry per line shipped in that attempt with category,
      product, item, line number, quantity and unit price. Lines not shipped in that
      attempt SHALL NOT appear on the invoice.
    plain_text: >
      Every shipment produces an invoice listing only the lines shipped in that
      shipment, dated today, with the order number and order date. The customer is
      addressed generically as "Dear PetStore Customer" rather than by name.
    technical_note: >
      OrderFulfillmentFacadeEJB.createInvoice builds a TPAInvoiceXDE document; it
      filters the order's lines by the HashMap of item ids shipped in this pass.
    confidence: medium
    confidence_basis: >
      One clear builder method; the invoice document format itself lives in a shared
      xmldocuments component outside this shard.
    risk_class: financial
    basis: >
      setOrderId/setUserId/setOrderDate/setShippingDate(new Date()) and addLineItem only
      for items in newLis.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 166
        excerpt: |4
            private String createInvoice(SupplierOrderLocal po, HashMap newLis)
              throws XMLDocumentException {
                invoiceXDE.newDocument();
                invoiceXDE.setOrderId(po.getPoId());
                invoiceXDE.setUserId("Dear PetStore Customer");
                Date poDate = new Date(po.getPoDate());
                invoiceXDE.setOrderDate(poDate);
                Date curDate = new Date();
                invoiceXDE.setShippingDate(curDate);
                Collection items = po.getLineItems();
                Iterator it = items.iterator();
                while((it != null) && (it.hasNext())) {
                  LineItemLocal anItem = (LineItemLocal)it.next();
                  if(newLis.containsKey(anItem.getItemId())) {
                    invoiceXDE.addLineItem(anItem.getCategoryId(),
                                           anItem.getProductId(),
                                           anItem.getItemId(),
                                           anItem.getLineNumber(),
                                           anItem.getQuantity(),
                                           anItem.getUnitPrice());
                  }
                }//end while
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

