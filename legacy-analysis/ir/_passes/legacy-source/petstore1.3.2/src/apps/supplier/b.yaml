    severity: medium
    category: error-swallowed
    title: Invoices sent from the inventory update are not part of its transaction
    description: >
      Invoices are published on a non-transacted messaging session inside the inventory
      update transaction, so they are delivered even if the transaction later fails to
      commit. A publishing failure on this path is printed and swallowed, so the
      transaction commits with lines marked shipped but no invoice delivered.
