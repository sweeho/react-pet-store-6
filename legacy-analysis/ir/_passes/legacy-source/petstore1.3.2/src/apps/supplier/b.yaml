suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [OFUL-BR-0004, OFUL-BR-0001, SINV-BR-0001]
    severity: high
    category: data-corruption
    title: Invoice build failure keeps the shipment but loses the invoice
    description: >
      Stock is reduced and lines are marked shipped (and the order may be marked
      COMPLETED) before the invoice is built. If building the invoice fails, the error
      is printed and swallowed, null is returned, and the surrounding transaction still
      commits. The comment claims the order "can be fullfilled later", but the lines are
      already marked shipped, so they are skipped on every retry and no invoice is ever
      sent for that shipment.
    traces:
