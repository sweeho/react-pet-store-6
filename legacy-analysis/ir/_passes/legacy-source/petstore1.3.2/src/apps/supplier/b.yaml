  - record_key: OFUL-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL set a supplier order's status to COMPLETED only when every line
      not already shipped could be shipped in the current fulfilment attempt; otherwise
      the order status SHALL be left unchanged.
    plain_text: >
      An order is marked complete only when everything still outstanding on it has
      shipped. If anything is still missing, the order keeps its current status.
    technical_note: >
