records:
  - record_key: OFUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, on receipt of a supplier purchase order message, persist the
      purchase order, attempt to fulfil it from supplier inventory, and, only when at
      least one line was shipped, publish an invoice for the shipped lines back to the
      order processing centre; when nothing could be shipped the order SHALL be left
      waiting for inventory to arrive.
    plain_text: >
      When the supplier receives a purchase order it records it, ships whatever it has
      in stock, and sends back an invoice for what it shipped. If nothing could be
      shipped, no invoice is sent and the order waits for new stock.
    technical_note: >
      SupplierOrderMDB.onMessage (queue-driven MDB, CMT Required) calls
      OrderFulfillmentFacadeEJB.processPO, which parses the XML, creates the
      SupplierOrder entity and calls processAnOrder. A non-null invoice string is
      published through the SupplierOrderTD transition delegate.
    confidence: high
    confidence_basis: >
      The flow is visible end to end in the MDB and the facade, and the MDB's queue
      binding and Required transaction are declared independently in ejb-jar.xml.
    risk_class: operational
    basis: >
      onMessage calls doWork then doTransition only when the invoice is non-null; the
      comment states the else-branch waits for inventory. processPO persists then
      fulfils.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 113
        excerpt: |4
            public void onMessage(Message recvMsg) {
              try {
                String messageID = recvMsg.getJMSMessageID();
                TextMessage recdTM = (TextMessage)recvMsg;
                String recdText = recdTM.getText();

                // Do processing work on received message
                String invoice = doWork(recdText);

                // If orders were shipped, do the transition
                if(invoice!=null) {
                  doTransition(invoice);
                } //else wait for the inventory to arrive at the inventory receiver
