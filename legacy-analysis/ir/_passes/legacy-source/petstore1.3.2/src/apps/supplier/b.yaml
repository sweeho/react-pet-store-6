  - record_key: OFUL-BR-0006
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL treat the receipt, recording, fulfilment and invoice publication
      of a purchase order as one unit of work: GIVEN any failure to read, convert,
      record or publish WHEN a purchase order message is processed THEN the whole
      unit SHALL be abandoned and the message left for redelivery by the messaging
      system.
    plain_text: >
      Processing a purchase order is all-or-nothing: if any step fails, nothing is kept
      and the order message is retried.
    technical_note: >
      onMessage rethrows TransitionException, CreateException, XMLDocumentException and
      JMSException as EJBException; onMessage, processPO and Inventory methods are all
      container-managed Required. Redelivery itself is container behaviour, not code.
    confidence: medium
    confidence_basis: >
      The rethrow and the Required attributes are both visible, but rollback and
      redelivery are inferred from EJB container semantics rather than read; and the
      invoice-build failure path is an explicit exception (see suspected defects).
    risk_class: operational
    basis: >
      Every checked exception in onMessage becomes a system exception within a Required
      container transaction.
