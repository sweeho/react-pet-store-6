  - record_key: CHK-BR-0004
    kind: business-rule
    capability_key: checkout
    requirement: The system SHALL compute the order total as the sum over cart lines of unit price multiplied by quantity, with no tax, shipping charge, discount or explicit rounding, in the currency of the cart's current locale.
    plain_text: The order total is simply each item's selling price times its quantity, added up. No tax, shipping or discount is applied.
    technical_note: "OrderEJBAction: float totalCost += new Float(item.getUnitCost()).floatValue() * item.getQuantity(); purchaseOrder.setTotalPrice(totalCost). Uses binary float (not decimal). The cart display total (cart.subTotal) is computed separately in the cart component."
    confidence: medium
    confidence_basis: One clear place in this module. The cart component computes its own displayed subtotal, which was not read here, so agreement between the displayed and the ordered total is not proven.
    risk_class: financial
    basis: Loop accumulating cost*quantity into a float in OrderEJBAction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 122
        line_end: 146
        excerpt: |2
              int lineItemCount = 0;
              float totalCost = 0;
              // Add the items from the shopping cart
              ShoppingCartLocal cart = scf.getShoppingCart();
              Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
              purchaseOrder.setLocale(locale);
              Collection items = cart.getItems();
              // if the cart is empty throw an exception saying so
              if (items.size() == 0) {
                throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
              }
              Iterator it = items.iterator();
              while (it.hasNext()) {
                CartItem item = (CartItem)it.next();

                float cost = new Float(item.getUnitCost()).floatValue();
                totalCost += (cost*item.getQuantity());
                purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                       item.getProductId(),
                                                       item.getItemId(),
                                                       (lineItemCount++) + "",
                                                       item.getQuantity(),
                                                       cost));
              }
              purchaseOrder.setTotalPrice(totalCost);
