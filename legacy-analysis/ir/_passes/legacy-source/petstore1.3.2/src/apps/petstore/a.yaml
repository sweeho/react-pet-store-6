  - record_key: CAT-BR-0006
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL search items in the current locale by keywords, returning an item when ANY keyword matches, case-insensitively, the product name, the category id or the item description; GIVEN the keyword field is empty OR nothing matches WHEN a search is submitted THEN the system SHALL show "No results were found for your search."
    plain_text: Customers can search with one or more words. An item is found if any of the words appears in its product name, its category, or its description, ignoring upper/lower case. An empty search or no matches shows a 'no results' message. Results come two per page and show the selling price.
    technical_note: "Search box in banner.jsp posts keywords to search.screen. search.jsp sets catalog.searchQuery and pages like category.jsp. SEARCH_ITEMS SQL: lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?, repeated (VARIABLE fragment) OR-ed per keyword. Keyword splitting and wildcard wrapping are done in the catalog component, not in this module. Results print item.unitCost."
    confidence: medium
    confidence_basis: The match columns and the OR between keywords are read from the SQL and from the 'Items matching any of' text. How keywords are split and whether they are wrapped in % wildcards is in the catalog component and was not read in this pass. The active DAO class is redacted in web.xml (see findings), so which SQL variant runs is not provable here; both variants match the same columns.
    risk_class: presentational
    basis: SEARCH_ITEMS statement in CatalogDAOSQL.xml; empty/zero-result branch in search.jsp.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/banner.jsp
        line_start: 56
        line_end: 59
        excerpt: |2
               <form action="search.screen">
                <input class="petstore_listing" type="text" name="keywords" size="8">
                <input class="petstore_listing" type="submit" value="Search">
              </form>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 74
        line_end: 90
        excerpt: |
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="${param.keywords}" target="${catalog}" property="searchQuery"/>
          <c:set value="${catalog.searchItems}" var="pageResults" />

          <c:choose>
           <c:when test="${param.keywords == '' || pageResults.size == 0}">
            <p class="petstore_title">
              No results were found for your search.
            </p>
           </c:when>
           <c:otherwise>
            <p class="petstore_title">
             Search Results:
            </p>
            <p class="petstore">
             Items matching any of: <b><c:out value="${param.keywords}" /></b>
            </p>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 115
        line_end: 116
        excerpt: |2
                 <td class="petstore_listing" align="right">
