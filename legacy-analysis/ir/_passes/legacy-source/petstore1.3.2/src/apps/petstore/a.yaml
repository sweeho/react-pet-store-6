findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
    description: The env-entry values param/CatalogDAOClass, param/CatalogDAODatabase, param/ComponentManager and param/WebController (web.xml lines 184-215) and the ShoppingControllerEJB event-to-action env-entries (ejb-jar.xml lines 58-85) were redacted at ingest. They are class names and a database name, not secrets. Which catalog DAO implementation (and so which SQL in CatalogDAOSQL.xml) is active cannot be confirmed from this tree; an SME or an unredacted copy must confirm.
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: mappings.xml lines 53-56 map com.sun.j2ee.blueprints.petstore.controller.events.SignOffEvent to SignOffEJBAction, but neither class exists anywhere in legacy-source/. SignOffHTMLAction returns a ChangeLocaleEvent instead, so the mapping appears dead. Confirm no deployment relies on it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_en_US.xml
    description: Screen 'signon_create' (screendefinitions_*.xml line 178 onward) uses body /create_user.jsp, which does not exist in the module, and no page links to signon_create.screen. Probably dead configuration; confirm before dropping.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/ejb-jar.xml
    description: "ShoppingControllerEJB and ShoppingClientFacadeEJB methods are declared <unchecked/> (ejb-jar.xml lines 171-183): the EJB tier enforces no role. All access control in this module therefore rests on the web-tier sign-on filter list (SIGN-REQ-0001). No requirement recorded; noted for the security review."
  - kind: ambiguity
    path: legacy-analysis/sources
    description: No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no document trace pointers could be cited for this module. The docs/ module (install/use guides) may state intended behaviour for checkout and sign-on; if it is extracted later, CHK-BR-0008 and CHK-REQ-0010 should be re-checked against it.
