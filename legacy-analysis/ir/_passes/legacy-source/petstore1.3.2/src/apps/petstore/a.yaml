  - record_key: ACCT-BR-0006
    kind: business-rule
    capability_key: customer-account
    requirement: The system SHALL treat first name, last name, street address, city, state/province, postal code and telephone as required customer contact fields; GIVEN any of them is blank WHEN the account is created or updated THEN the details SHALL NOT be saved, and the request ends in a general failure rather than a message naming the missing fields.
    plain_text: Name, street, city, state, postal code and phone are required on the account form. If one is left blank the save does not happen, but the customer gets a general error page, not a list of what is missing.
    technical_note: CustomerHTMLAction.extractContactInfo builds a MissingFormDataException listing missing fields, stores it in request attribute missing_form_data_exception and returns null ContactInfo; no JSP in the module reads that attribute. CustomerEJBAction.updateCustomer then dereferences the null ContactInfo. Edit form adds browser-side 'is empty' checks on most of these fields (not on last name); the create form is a plain HTML form with no browser-side check.
    confidence: medium
    confidence_basis: The required-field list is read directly from one method. The resulting failure path (null dereference ending on the error screen) is inferred from the code and was not executed.
    risk_class: operational
