  - record_key: CAT-BR-0007
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL cache the rendered category product list, product item list and category side panel for 5 minutes, shared across all shoppers, so catalog changes may take up to 5 minutes to appear on those pages.
    plain_text: Category pages, product pages and the category side panel are re-used for up to five minutes for every shopper, so a catalog change can take up to five minutes to show.
    technical_note: <waf:cache scope="context" duration="300000"> wraps category.jsp (name "page"), product.jsp (product_en_US) and sidebar.jsp (sidebar_en_US). The WAF CacheTag key includes the request query string, so different categories are cached separately. item.jsp and search.jsp are not cached. Japanese/Chinese copies cache product and sidebar only.
    confidence: medium
    confidence_basis: Three consistent declarations in this module; the cache key composition was checked in the WAF CacheTag, outside this module. 300000 ms is a bare literal with no stated reason.
    risk_class: operational
    basis: duration="300000" scope="context" on the three JSP cache tags.
    traces:
