    plain_text: Opening a category shows its products in alphabetical order, two at a time, with Previous and Next links to move between pages.
    technical_note: category.jsp sets CatalogHelper start=0,count=2 when no paging parameters are present, otherwise uses request start/count; Previous link hard-codes count=2, Next link passes count=${pageResults.size}. GET_PRODUCTS SQL orders by name. The same paging pattern is used by product.jsp and search.jsp.
