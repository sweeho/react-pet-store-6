records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: The system SHALL hold the catalog as a three-level hierarchy of categories, products and items, where every product belongs to exactly one category and every item belongs to exactly one product, and SHALL hold the name, description and image of each category, product and item per locale, with an item's list price and unit cost both mandatory per locale.
    plain_text: The catalog is organised as categories, which contain products, which contain the actual items for sale. Each level has its own name, description and picture in every supported language, and each item has a list price and a selling price in every language.
    technical_note: Catalog DDL is in PopulateSQL.xml (tables category, category_details, product, product_details, item, item_details), executed by the populate tool. Detail tables are keyed (id, locale) with foreign keys to the parent table. listprice/unitcost are decimal(10,2) not null. The Catalog DAO SQL in CatalogDAOSQL.xml joins the same tables on locale.
    confidence: high
    confidence_basis: Enforced by DDL constraints (primary and foreign keys, NOT NULL) and relied on by the DAO join SQL in a second file. The Cloudscape and Oracle DDL variants were diffed and differ only in char vs varchar.
    risk_class: operational
    basis: DDL primary keys pk_category_details (catid, locale), pk_product_details (productid, locale), pk_item_details (itemid, locale); foreign keys fk_product_1 (catid), fk_item_1 (productid); listprice and unitcost declared decimal(10,2) not null.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 51
        line_end: 71
        excerpt: |2
                  create table category (catid char(10) not null,
                    constraint pk_category primary key (catid))
                </CreateStatement>
                <InsertStatement>
                  insert into category values (?)
                </InsertStatement>
                <DropStatement>
                  drop table category
                </DropStatement>
              </TableStatements>
              <TableStatements table="category_details">
                <CheckStatement>
                  select * from category_details
                </CheckStatement>
                <CreateStatement>
                  create table category_details (catid char(10) not null,
                    name varchar(80) not null, image varchar(255) null,
                    descn varchar(255) null, locale char(10) not null,
                    constraint pk_category_details primary key (catid, locale),
                      constraint fk_category_details_1 foreign key (catid)
                      references category (catid))
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 85
        line_end: 90
        excerpt: |2
                  create table product (
                    productid char(10) not null,
                    catid char(10) not null,
                    constraint pk_product primary key (productid),
                      constraint fk_product_1 foreign key (catid)
                      references category (catid))
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 126
        line_end: 161
        excerpt: |2
                  create table item (
                    itemid char(10) not null,
                    productid char(10) not null,
                    constraint pk_item primary key (itemid),
                      constraint fk_item_1 foreign key (productid)
                      references product (productid)
                  )
                </CreateStatement>
                <InsertStatement>
                  insert into item (itemid, productid) values (? , ?)
                </InsertStatement>
                <DropStatement>
                  drop table item
                </DropStatement>
              </TableStatements>
              <TableStatements table="item_details">
                <CheckStatement>
                  select * from item_details
                </CheckStatement>
                <CreateStatement>
                  create table item_details (
                    itemid char(10) not null,
                    listprice decimal(10,2) not null,
                    unitcost decimal(10,2) not null,
                    locale char(10) not null,
                    image char(255) not null,
                    descn varchar(255) not null,
                    attr1 varchar(80) null,
                    attr2 varchar(80) null,
                    attr3 varchar(80) null,
                    attr4 varchar(80) null,
                    attr5 varchar(80) null,
                    constraint pk_item_details primary key (itemid, locale),
                        constraint fk_item_details_1 foreign key (itemid)
                        references item (itemid)
                  )
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 102
        line_end: 110
        excerpt: |2
                  <SQLStatement method="GET_ITEMS">
                      <SQLFragment parameterNb="2">
                          select catid, name, a.itemid, b.image, b.descn, attr1, attr2, attr3,
                                  attr4, attr5, listprice, unitcost
                              from (((item a join item_details b on a.itemid=b.itemid)
                                  join product_details c on a.productid=c.productid)
                                  join product d on d.productid=c.productid and b.locale = c.locale)
                              where b.locale = ? and a.productid = ?
                      </SQLFragment>
    stack_metadata:
      db.object: category, category_details, product, product_details, item, item_details
      framework: J2EE 1.3 / WAF
  - record_key: CAT-SCR-0002
    kind: screen
    capability_key: catalog-browsing
    requirement: The system SHALL present a home screen with a pet selection map whose regions link to the Birds, Fish, Dogs, Reptiles and Cats categories, and SHALL show on every storefront screen a side panel listing the catalog categories in the current locale ordered by name.
    plain_text: The store's home page shows a picture of pets; clicking a pet opens that category (Birds, Fish, Dogs, Reptiles, Cats). A side panel on every page lists the categories alphabetically.
    technical_note: main.jsp image map with five category ids (BIRDS appears twice). sidebar.jsp lists catalog.categories with count 5, start 0; GET_CATEGORIES SQL orders by name. Every screen definition includes /sidebar.jsp.
    confidence: medium
    confidence_basis: Read directly from the JSPs and the DAO SQL. The side panel requests only 5 categories, which matches the 5 seeded categories; whether more than 5 would be truncated depends on the catalog component's paging, which is outside this module.
    risk_class: presentational
    basis: Image-map area links in main.jsp; category list loop in sidebar.jsp; 'order by name' in GET_CATEGORIES.
