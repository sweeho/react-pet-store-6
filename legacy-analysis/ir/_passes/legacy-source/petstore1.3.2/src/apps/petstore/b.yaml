      subsequent orders SHALL NOT be switched by this save.
    plain_text: >-
      Changing the preferred language on the account form does not switch the cart's or new
      orders' language for the current visit; the switch happens at the next sign-in.
    technical_note: >-
      CustomerEJBAction.updateCustomer ends with machine.setAttribute("locale", locale) - a
      literal key - whereas ChangeLocaleEJBAction and SignOnEJBAction use PetstoreKeys.LOCALE
      (= WebKeys.LOCALE "com.sun.j2ee.blueprints.waf.LOCALE"), which is what OrderEJBAction
      reads. No cart.setLocale call is made here.
    confidence: medium
    confidence_basis: >-
      Key mismatch read directly; the constant value is in the waf shard (WebKeys.LOCALE) and
      was looked up only to confirm it differs. Whether the web-tier page language changes on
      save is decided by the waf locale handling, not read.
    risk_class: operational
    basis: >-
      Literal 'locale' key versus PetstoreKeys.LOCALE elsewhere.
