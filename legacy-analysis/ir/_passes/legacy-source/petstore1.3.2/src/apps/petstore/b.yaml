  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >-
      The system SHALL let a shopper add an item to the shopping cart from the product
      listing, the item detail page or search results, adding it with a quantity of one.
    plain_text: >-
      A shopper can put any item in their cart with one click from the product list, the item
      page or a search result; it goes in with a quantity of one.
    technical_note: >-
      cart.do?action=purchase&itemId=... is translated by CartHTMLAction into a
      CartEvent(ADD_ITEM, itemId) whose default quantity is 1; CartEJBAction calls
      ShoppingCartLocal.addItem(itemId). Links rendered in product.jsp, item.jsp and
      search.jsp.
    confidence: high
    confidence_basis: >-
      The add path is visible end to end in two layers (web action building the event, EJB
      action applying it) plus the links on three screens. The cart component's own addItem
      (whether a second add increments the quantity) is in another shard and not read here, so
      the requirement stops at 'adds with quantity one'.
    risk_class: financial
    basis: >-
      CartHTMLAction maps action=purchase to an ADD_ITEM event; CartEvent documents that the
      two-argument constructor adds with quantity 1; CartEJBAction calls addItem.
