  - record_key: POP-RULE-0004
    kind: business-rule
    capability_key: data-population
    requirement: >-
      WHEN population runs THEN the system SHALL end the caller's session first, and
      afterwards SHALL redirect to the requested success page, else back to the referring
      page.
    plain_text: >-
      Loading demo data signs the visitor out and then sends them on to the next page.
    technical_note: >-
      PopulateServlet.doPost: request.getSession().invalidate() 'because all EJB Refs are no
      longer valid'; redirect to success_page or Referer; '//' prefix resolves against the
      request URL (used to hop to the supplier app).
    confidence: medium
    confidence_basis: >-
      One method, read in full.
    risk_class: operational
    basis: >-
      PopulateServlet.doPost and redirect.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 110
        line_end: 133
        excerpt: |2-
            public void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException, ServletException {
              String successPageURL = request.getParameter(SUCCESS_PAGE_URL_PARAM);
              String errorPageURL = request.getParameter(ERROR_PAGE_URL_PARAM);
              String forcefully = request.getParameter(FORCEFULLY_MODE_PARAM);
              String refererURL = request.getHeader(REFERER_HEADER);
              // kill the Servlet Session because all EJB Refs are no longer valid
              request.getSession().invalidate();
              try {
                populate(forcefully != null && Boolean.valueOf(forcefully).booleanValue());
              } catch(PopulateException exception) {
                System.err.println(exception.getRootCause().getMessage());
                if (errorPageURL == null) {
                  throw new ServletException("Populate exception occured :" + exception.getMessage(), exception.getRootCause());
                } else {
                  redirect(request, response, errorPageURL);
                }
              }
              if (successPageURL != null) {
                redirect(request, response, successPageURL);
              } else if (refererURL != null) {
                redirect(request, response, refererURL);
              }
              return;
            }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 188
        line_end: 198
        excerpt: |2-
            private void redirect(HttpServletRequest request, HttpServletResponse response, String path) throws IOException {
              String url;
              if (path.startsWith("//")) {
                url = new URL(new URL(HttpUtils.getRequestURL(request).toString()), path.substring(1)).toString();
              } else {
                url = request.getContextPath() + (path.startsWith("/") ? path : "/" + path);
              }
              //System.err.println("redirecting to: " + url);
              response.sendRedirect(url);
              return;
            }
