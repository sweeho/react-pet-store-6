  - record_key: ACCT-RULE-0005
    kind: business-rule
    capability_key: customer-account
    requirement: >-
      The system SHALL require, when creating or updating a customer, a last name, first name,
      street address line 1, city, state or province, postal code and telephone, a preferred
      language, a favourite category and a card number; it SHALL treat street line 2 and
      e-mail as optional. MyList and banner preferences SHALL be on only when their boxes are
      ticked.
    plain_text: >-
      A customer profile needs name, first address line, city, state, postal code, phone,
      language, favourite category and a card number. Second address line and e-mail are
      optional. The My List and banner options are off unless ticked.
    technical_note: >-
      CustomerHTMLAction.extractContactInfo (suffix _a) mirrors the order form checks and
      stores a MissingFormDataException in the request; extractProfileInfo and
      extractCreditCard build local missing-field lists that are never stored or thrown.
      mylist_on / banners_on absent => false.
    confidence: medium
    confidence_basis: >-
      Required-field checks read in one class. The checks for card type and expiry test the
      card number field instead (copy error), and the card/profile lists are discarded, so the
      effective enforcement is weaker than the field list suggests; recorded as a suspected
      defect.
    risk_class: operational
    basis: >-
      Empty-string checks in CustomerHTMLAction extract* methods.
