  - record_key: CHK-RULE-0004
    kind: business-rule
    capability_key: checkout
    requirement: >-
      The system SHALL compute the order total as the sum, over all cart items, of the item's
      unit price multiplied by its quantity, using the unit price (not the list price) in the
      shopper's current catalog locale, with no rounding step and no tax, shipping or discount
      component. Each cart item SHALL become one order line carrying category, product, item,
      quantity and unit price, numbered sequentially from 0 in cart order.
    plain_text: >-
      The order total is simply price times quantity for each item, added up. It uses the
      'Your Price' figure, adds nothing for tax or delivery, and is not rounded. Each item
      becomes a numbered order line starting at line 0.
    technical_note: >-
      OrderEJBAction accumulates float totalCost += unitCost*quantity, builds
      LineItem(category, productId, itemId, lineNo, quantity, cost) with lineNo from a
      post-incremented counter starting at 0, and calls
      purchaseOrder.setTotalPrice(totalCost). Catalog prices are DECIMAL(10,2) in
      item_details.
    confidence: medium
    confidence_basis: >-
      The arithmetic and line numbering are read directly in one method. The use of unit price
      rather than list price follows from CartItem.getUnitCost; the cart's own subtotal (shown
      to the shopper) is computed in the cart component, not compared here.
    risk_class: financial
    basis: >-
      Loop over cart items in OrderEJBAction; schema columns listprice/unitcost decimal(10,2).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
