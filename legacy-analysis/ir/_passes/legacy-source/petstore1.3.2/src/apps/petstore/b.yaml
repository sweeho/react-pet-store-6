  - record_key: CART-RULE-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >-
      The system SHALL let a shopper change the quantities of all cart lines in one
      submission. GIVEN a quantity field that is not a whole number WHEN the cart is updated
      THEN that line's quantity SHALL be treated as 0. GIVEN a line's quantity is set to 0
      THEN the item SHALL be removed from the cart.
    plain_text: >-
      On the cart page the shopper can edit every quantity and press Update Cart. Anything
      that is not a whole number counts as zero, and a zero quantity takes the item out of the
      cart.
    technical_note: >-
      cart.jsp posts itemQuantity_<itemId> fields (maxlength 10) to cart.do?action=update.
      CartHTMLAction parses each with new Integer(value) and substitutes 0 on
      NumberFormatException, then CartEvent.createUpdateItemEvent; CartEJBAction calls
      updateItemQuantity per item. The removal-at-zero behaviour is stated in the CartEvent
      javadoc; the cart component implementing it is outside this shard.
    confidence: medium
    confidence_basis: >-
      Parsing and the non-numeric-to-zero substitution are read directly in one place. That
      zero removes the item rests on a javadoc comment in this module; the cart component that
      enforces it was not read in this pass. Negative numbers are passed through unchanged and
      their effect is not visible here.
    risk_class: financial
    basis: >-
      NumberFormatException handler substitutes 0; javadoc says 'When the quantity is 0 the
      item will be remove from the cart'.
