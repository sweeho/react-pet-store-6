  - record_key: CHK-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >-
      The system SHALL require, for both the billing and the shipping contact, a last name,
      first name, street address line 1, city, state or province, postal code and telephone
      number; street address line 2 and e-mail SHALL be optional and country SHALL NOT be
      checked. Values SHALL be trimmed of surrounding spaces before use.
    plain_text: >-
      To place an order the billing and shipping blocks must each have a name, first address
      line, city, state, postal code and phone number. The second address line and e-mail can
      be left empty.
    technical_note: >-
      OrderHTMLAction.extractContactInfo(request, suffix) trims each parameter and collects
      missing labels into a MissingFormDataException stored in the request under
      'missing_form_data_exception'; it then returns null instead of a ContactInfo. Nothing in
      the module reads that attribute (see suspected defect).
    confidence: medium
    confidence_basis: >-
      The list of required fields is read directly in one method. The JSP inputs carry a
      validation="validation" attribute whose effect is in the waf taglib (other shard) and
      was not read, so client-side enforcement is unknown. What the user sees on failure is
      not established (no reader of the error found).
    risk_class: operational
    basis: >-
      Per-field empty checks in OrderHTMLAction.extractContactInfo.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 88
        line_end: 158
        excerpt: |2-
              private ContactInfo extractContactInfo(HttpServletRequest request, String suffix)
                  throws HTMLActionException {
                  ArrayList missingFields = null;
                  String familyName =  request.getParameter("family_name" +suffix).trim();
                  if (familyName.equals("")) {
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("Last Name");
                  }
                  String givenName =  request.getParameter("given_name" +suffix).trim();
                  if (givenName.equals("")) {
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("First Name");
                  }
                  String address1 = request.getParameter("address_1" +suffix).trim();
                  if (address1.equals("")){
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("Street Address");
                  }
                  String address2 = request.getParameter("address_2" +suffix).trim();
                  if (address2.equals("")) {
                    address2 = null;
                  }
                  String city =   request.getParameter("city"  +suffix).trim();
                  if (city.equals("")){
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("City");
                  }
                  String stateOrProvince = request.getParameter("state_or_province" +suffix).trim();
                  if (stateOrProvince.equals("")) {
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("State or Province" +suffix);
                  }
                  String postalCode = request.getParameter("postal_code" +suffix).trim();
                  if (postalCode.equals("")){
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("Postal Code");
                  }

                  String country = request.getParameter("country" + suffix).trim();
                  String telephone = request.getParameter("telephone_number" +suffix).trim();
                  if (telephone.equals("")){
                      if (missingFields == null) {
                          missingFields = new ArrayList();
                      }
                      missingFields.add("Telephone Number");
                  }
                  String email = null;
                  if (request.getParameter("email"  +suffix) != null) {
                      email = request.getParameter("email" +suffix).trim();
                  }
                  if (missingFields != null) {
                      MissingFormDataException ex = new MissingFormDataException("Missing Address Data", missingFields);
                      request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);
                      return null;
                  }

