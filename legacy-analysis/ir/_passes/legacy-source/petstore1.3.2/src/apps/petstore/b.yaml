  - record_key: ACCT-WF-0006
    kind: workflow
    capability_key: customer-account
    requirement: >-
      The system SHALL complete account creation as: create the login and remember the user
      id; show the account information form; on submit create a customer record keyed by that
      user id, store its contact, address, card and profile details, switch the shopping
      language to the chosen preferred language, mark the visitor as signed on, and return
      them to the page they were trying to reach before signing in, or to the main page if
      that page was the account page.
    plain_text: >-
      Signing up is a two-step process: choose a login, then fill in account details. Once
      saved, the customer is signed in automatically, the store switches to their chosen
      language, and they are taken back to where they were heading (or the home page).
    technical_note: >-
      CreateUserEJBAction sets scf.setUserId; CustomerEJBAction CREATE calls
      scf.createCustomer(userId) then updateCustomer (deep copy into
      ContactInfo/Address/CreditCard/Profile entity beans) inside processEvent (tx Required).
      CustomerHTMLAction.doEnd sets SignOnFilter.SIGNED_ON_USER=true, which fires
      SignOnNotifier. createcustomer.do uses CreateUserFlowHandler: returns
      SignOnFilter.ORIGINAL_URL, or MAIN_SCREEN when it was customer.do.
    confidence: high
    confidence_basis: >-
      Flow is declared in mappings.xml and implemented across four classes that agree.
    risk_class: operational
    basis: >-
      mappings.xml createcustomer.do flow handler; CustomerEJBAction CREATE branch;
      CustomerHTMLAction.doEnd; CreateUserFlowHandler.processFlow.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 90
        line_end: 95
        excerpt: |2-
              <url-mapping url="createcustomer.do" useFlowHandler="true" >
                  <web-action-class>com.sun.j2ee.blueprints.petstore.controller.web.actions.CustomerHTMLAction</web-action-class>
                  <flow-handler class="com.sun.j2ee.blueprints.petstore.controller.web.flow.handlers.CreateUserFlowHandler">
                     <handler-result result="MAIN_SCREEN" screen="main.screen"/>
                  </flow-handler>
             </url-mapping>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 80
        line_end: 96
        excerpt: |2-
              public EventResponse perform(Event e) throws EventException {
                  CustomerEvent ce = (CustomerEvent)e;
                  scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                  switch (ce.getActionType()) {
                      case CustomerEvent.CREATE : {
                        String userId = scf.getUserId();
                        scf.createCustomer(userId);
                        updateCustomer(ce);
                        break;
                      }
                      case CustomerEvent.UPDATE : {
                        updateCustomer(ce);
                        break;
                      }
                  }
                  return null;
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 255
        line_end: 266
        excerpt: |2-
              // load the customer here if we made it through the action processing
              public void doEnd(HttpServletRequest request, EventResponse eventResponse) {
                  // put the signed on ok in the sesion if creating a customer
                  if (eventType == CustomerEvent.CREATE) {
                      // remove the SIGNED_ON_USER_SESSION_KEY
                      if (request.getSession().getAttribute(SignOnFilter.SIGNED_ON_USER) != null) {
                          request.getSession().removeAttribute(SignOnFilter.SIGNED_ON_USER);
                      }
                      request.getSession().setAttribute(SignOnFilter.SIGNED_ON_USER, new Boolean(true));
                  }
                  eventType = -1;
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/flow/handlers/CreateUserFlowHandler.java
        line_start: 64
