  - record_key: CART-RULE-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >-
      The system SHALL keep exactly one shopping cart per browsing session, created on first
      use, and SHALL discard that cart when the shopper signs out.
    plain_text: >-
      Each visitor has one cart for their visit. Signing out throws the cart away and starts a
      fresh, empty one.
    technical_note: >-
      PetstoreComponentManager.sessionCreated puts the cart from the per-session stateful
      ShoppingClientFacade into the session; ShoppingClientFacadeLocalEJB.getShoppingCart
      lazily creates it once. SignOffHTMLAction invalidates the HTTP session and initialises a
      new component manager, which creates a new controller and cart.
    confidence: medium
    confidence_basis: >-
      Creation and replacement are both read directly, but no requirement-level statement
      exists; whether the old stateful beans are removed is up to the framework's
      session-destroy path (waf shard).
    risk_class: operational
    basis: >-
      Lazy single cart per facade; session invalidation and new component manager on sign-off.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/ShoppingClientFacadeLocalEJB.java
        line_start: 132
        line_end: 145
        excerpt: |2-
              public ShoppingCartLocal getShoppingCart() {
                  if (cart == null) {
                      try {
                          ServiceLocator sl = new ServiceLocator();
                          ShoppingCartLocalHome home =(ShoppingCartLocalHome)sl.getLocalHome(JNDINames.SHOPPING_CART_EJBHOME);
                          cart = home.create();
                      } catch (javax.ejb.CreateException cx) {
                          throw new GeneralFailureException("ShoppingClientFacade: failed to create cart: caught " + cx);
                      } catch (ServiceLocatorException slx) {
                          throw new GeneralFailureException("ShoppingClientFacade: failed to look up name of cart: caught " + slx);
                      }
                  }
                  return cart;
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/PetstoreComponentManager.java
        line_start: 95
        line_end: 108
        excerpt: |2-
              public void init(HttpSession session) {
                  session.setAttribute(PetstoreKeys.COMPONENT_MANAGER, this);
                  session.setAttribute(PetstoreKeys.CART, getShoppingCart(session));
              }
              /**
               *
               * Create the WebClientController which in turn should create the
               * EJBClientController.
               *
               */
              public void sessionCreated(HttpSessionEvent se) {
                  super.sessionCreated(se);
                  se.getSession().setAttribute(PetstoreKeys.CART, getShoppingCart(se.getSession()));
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/SignOffHTMLAction.java
        line_start: 69
        line_end: 82
        excerpt: |2-
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // kill the session thus prompting a signoff
                  HttpSession session = request.getSession();
                  Locale locale = (Locale)session.getAttribute(WebKeys.LOCALE);
                  session.invalidate();
                  session = null;
                  session = request.getSession(true);
                  session.setAttribute(WebKeys.LOCALE, locale);
                  // create a new Component Manager
                  PetstoreComponentManager pcm = new PetstoreComponentManager();
                  pcm.init(session);
                  return new ChangeLocaleEvent(locale);
              }
