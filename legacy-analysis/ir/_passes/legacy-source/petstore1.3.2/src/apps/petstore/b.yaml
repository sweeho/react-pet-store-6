      PetstoreKeys.LOCALE and cart.setLocale (FinderException ignored for first-time users).
      The notifier then puts the customer in the session and sets the session locale.
    confidence: high
    confidence_basis: >-
      Both the web-tier listener and the EJB action perform and agree on the locale switch.
    risk_class: operational
    basis: >-
      SignOnNotifier.processEvent and SignOnEJBAction.perform.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/SignOnNotifier.java
        line_start: 105
        line_end: 143
        excerpt: |2-
              private void processEvent(HttpSessionBindingEvent se) {
                  HttpSession session = se.getSession();
                  String name = se.getName();

                  /* check if the value matches the signon attribute
                   * if a macth fire off an event to the ejb tier that the user
                   * has signed on and load the account for the user
                   */
                  if (name.equals(SignOnFilter.SIGNED_ON_USER)) {
                      boolean aSignOn  = ((Boolean)se.getValue()).booleanValue();
                      if (aSignOn) {

                        String userName = (String)session.getAttribute(SignOnFilter.USER_NAME);
                        // look up the model manager and webclient controller
                        PetstoreComponentManager sl = (PetstoreComponentManager)session.getAttribute(PetstoreKeys.COMPONENT_MANAGER);
                        WebController wc =  sl.getWebController(session);
                        SignOnEvent soe = new SignOnEvent(userName);
                        // set the EJBAction on the Event
                        EventMapping em = getEventMapping(session.getServletContext(), soe);
                        if (em != null) {
                            soe.setEJBActionClassName(em.getEJBActionClassName());
                        }

                        try {
                            wc.handleEvent(soe, session);
                        } catch (EventException e) {
                            System.err.println("SignOnNotifier Error handling event " + e);
                        }
                        CustomerLocal customer =  sl.getCustomer(session);
                        // ensure the customer object is put in the session
                        if (session.getAttribute(PetstoreKeys.CUSTOMER) == null) {
                          session.setAttribute(PetstoreKeys.CUSTOMER, customer);
                        }
                        // set the language to the preferred language and other preferences
                        ProfileLocal profile = sl.getCustomer(session).getProfile();
                        Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
                        session.setAttribute(PetstoreKeys.LOCALE, locale);
                      }
                  }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 77
        line_end: 96
        excerpt: |2-
              public EventResponse perform(Event e) throws EventException {
                  SignOnEvent cue = (SignOnEvent)e;
                  String userId = cue.getUserName();
                  // put a copy of the userName in the shopping client facade for future retrival
                   ShoppingClientFacadeLocal scf = null;
                   scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                   scf.setUserId(userId);
                   // set the locale here to the user's desired locale
                   try {
                       ProfileLocal profile = scf.getCustomer().getProfile();
                       Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
                       machine.setAttribute(PetstoreKeys.LOCALE, locale);
                        // notify the shopping cart of the locale change
                       ShoppingCartLocal cart = scf.getShoppingCart();
                       cart.setLocale(locale);
                   } catch ( FinderException fe) {
                       // in the process of creating a user for the first time
                       // so the locale will be se when creating the user
                   }
                   return null;
    stack_metadata:
      session.scope: "session"
      ejb.bean: "ShoppingControllerEJB"
  - record_key: SIGN-WF-0005
    kind: workflow
    capability_key: sign-on
    requirement: >-
      WHEN a user signs out THEN the system SHALL end their session, start a new anonymous
      session that keeps the language they were using, and show a signed-out screen thanking
      them and offering to sign in again.
    plain_text: >-
      Signing out clears everything about the visit except the chosen language, and shows a
      'You are signed out' page with a link to sign in again.
    technical_note: >-
      signoff.do -> SignOffHTMLAction: saves WebKeys.LOCALE, session.invalidate(), new
      session, restores locale, new PetstoreComponentManager.init, returns ChangeLocaleEvent;
      screen signoff.screen (signoff.jsp). mappings.xml also lists a
      SignOffEvent/SignOffEJBAction pair whose classes are not in this tree.
    confidence: high
    confidence_basis: >-
      URL mapping, action code and screen agree.
    risk_class: operational
    basis: >-
      SignOffHTMLAction.perform; mappings.xml; signoff.jsp.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 82
        line_end: 84
        excerpt: |2-
              <url-mapping url="signoff.do" screen="signoff.screen" >
                  <web-action-class>com.sun.j2ee.blueprints.petstore.controller.web.actions.SignOffHTMLAction</web-action-class>
             </url-mapping>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/SignOffHTMLAction.java
        line_start: 69
        line_end: 82
        excerpt: |2-
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // kill the session thus prompting a signoff
                  HttpSession session = request.getSession();
                  Locale locale = (Locale)session.getAttribute(WebKeys.LOCALE);
                  session.invalidate();
                  session = null;
                  session = request.getSession(true);
                  session.setAttribute(WebKeys.LOCALE, locale);
                  // create a new Component Manager
                  PetstoreComponentManager pcm = new PetstoreComponentManager();
                  pcm.init(session);
                  return new ChangeLocaleEvent(locale);
              }
