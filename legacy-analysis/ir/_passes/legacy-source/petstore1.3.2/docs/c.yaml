  - record_key: DATA-POPULATION-REQ-0001
    kind: requirement
    capability_key: data-population
    requirement: >
      The system SHALL populate its catalog and inventory data from a single editable
      seed data file, and SHALL create the database tables using statements chosen for
      the configured database product.
    plain_text: >
      The shop's starting catalog and stock come from one data file that operators can
      edit; the table set-up adapts to the database in use.
    technical_note: >
      Seed file docroot/populate/Populate-UTF8.xml; per-database Check/Create/Insert/Drop
      statements in PopulateSQL.xml and DAO selects in CatalogDAOSQL.xml, selected by
      the "Database" init-param in web.xml and param/CatalogDAODatabase env-entries
      (default cloudscape). The rebuild uses one datastore, so the per-database
      selection is likely an implementation detail.
    confidence: medium
    confidence_basis: >
      One document section describes it; the populate servlet code was not read here.
    risk_class: operational
    basis: >
      Configuring guide, Configuring the Database.
    traces:
      - kind: document
