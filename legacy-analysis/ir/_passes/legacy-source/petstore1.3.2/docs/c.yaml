        line_start: 127
        line_end: 130
        excerpt: |2
                if (sendConfirmationMail) {
                  result = doWork(recdText);
                  doTransition(result);
                }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 414
        line_end: 418
        excerpt: |2
