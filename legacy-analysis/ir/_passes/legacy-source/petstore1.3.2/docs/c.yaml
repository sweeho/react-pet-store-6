# Spec extraction SX-0001, pass C (tie-breaker), shard legacy-source/petstore1.3.2/docs
# No legacy-analysis/sources/**/extracted.md exists in this tree; the HTML documents
# under docs/ (en, ja, zh) were read directly and are cited as `kind: document`
# with the HTML <a name> anchor or heading. The ja files are EUC-JP and the zh files
# GB2312; their excerpts below are UTF-8 decodings of the cited lines.
records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received US-locale order whose
      total price is strictly less than 500 (US dollars), and SHALL leave every other
      US-locale order pending for administrator review.
      GIVEN a US-locale order with total exactly 500.00 WHEN it is received THEN it
      SHALL remain pending.
    plain_text: >
      A US order under $500 is approved automatically. An order of $500 or more waits
      for an administrator to approve or deny it.
    technical_note: >
      PurchaseOrderMDB.doWork creates the process manager entry as PENDING, then calls
      canIApprove(); for Locale.US it returns true when getTotalPrice() < 500, and an
      APPROVED ChangedOrder is emitted. The code comment calls this "just a stub for
      converting currency" used for the demo. The English and Japanese user guides say
      "less than $500" (auto) and "greater than $500" (pending); the Chinese guide says
      "not exceeding $500" (auto), which disagrees at exactly $500.
    confidence: high
    confidence_basis: >
      The strict "< 500" comparison is read directly in code, and the English and
      Japanese guides restate the same threshold in two sections each. Not graded
      lower because code and two documents agree on the value; the boundary at exactly
      500 is only settled by the code, which is why a separate suspected defect records
      the Chinese guide's contrary wording.
    risk_class: financial
    basis: >
      Code comparison against a bare literal 500, corroborated by user documentation
      in the storefront and admin sections.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |2
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "place_order (Placing an Order)"
        line_start: 201
        line_end: 202
        excerpt: |2
          <p>When you complete the order, the Storefront sends the order info asyncronously
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "approve_deny_orders (Approving/Denying Orders)"
        line_start: 239
        line_end: 240
        excerpt: |2
            <p>You approve or deny pending orders using the Process Pending Orders
          panel.  An order appears as pending if its total value is greater than $500.</p>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/ja/using.html
        anchor: "place_order (注文する)"
        line_start: 191
        line_end: 192
        excerpt: |2
          <p>ユーザが注文を完了すると、その注文は Storefront によって非同期的に OPC に送信されます。注文金額が $500 未満であれば、OPC
          はその注文を自動的に承認します。</p>
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      framework: J2EE 1.3 message-driven bean
      jms.queue: purchase order queue (OPC)

  - record_key: ORDER-APPROVAL-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received Japan-locale order whose
      total price is strictly less than 50000, and SHALL NOT automatically approve an
      order in any locale other than US or Japan, regardless of its total.
      GIVEN a zh_CN-locale order of any total WHEN it is received THEN it SHALL remain
      pending for administrator review.
    plain_text: >
      A Japanese order under 50,000 (yen) is approved automatically. Orders from any
      other locale, including Chinese, are never approved automatically and always
      wait for an administrator.
    technical_note: >
      Same canIApprove() method in PurchaseOrderMDB: the Locale.JAPAN branch compares
      against 50000; any other locale falls through to return false. The order total
      is compared as a raw number with no currency conversion. No document mentions
      the Japanese threshold or the non-approval of other locales.
    confidence: medium
    confidence_basis: >
      One clear place in code. The documents in this shard state only the US-dollar
      threshold and never mention a per-locale rule, so there is no second source.
    risk_class: financial
    basis: >
      Locale-specific branches with bare literals in the auto-approval method.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 178
        line_end: 191
        excerpt: |2
          /**
           * Just a stub for converting currency. This method is used for
           * demonstrating the petstore, so that smaller orders can flow through
           * the system without having to fire up the admin Gui to approve orders
           */
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

