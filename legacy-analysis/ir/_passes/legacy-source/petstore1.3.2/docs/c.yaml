  - record_key: CUSTOMER-NOTIFICATIONS-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL support three customer e-mail notifications, each independently
      switchable at deployment time: order approval, order confirmation (sent as parts
      of the order are fulfilled), and order completion. The documented default is that
      all three are disabled. GIVEN a notification is disabled WHEN its triggering event
      occurs THEN no e-mail of that kind SHALL be sent.
    plain_text: >
      Customers can be e-mailed when their order is approved, as parts of it ship, and
      when it is complete. Each of these e-mails can be turned on or off by the
      operator, and the guide says they are off out of the box.
    technical_note: >
      Flags param/SendApprovalMail (MailOrderApprovalMDB), param/SendConfirmationMail
      (MailInvoiceMDB) and param/SendCompletedOrderMail (MailCompletedOrderMDB) are
      Boolean env-entries in the OPC ejb-jar.xml. MailOrderApprovalMDB initialises its
      flag to false, reads SEND_APPROVAL_MAIL in ejbCreate, and only does its work when
      the flag is true. Mail From/host/user come from the mail/MailSession resource
      (sun-j2ee-ri.xml mail-configuration). The shipped env-entry values are redacted
      in this copy of the source, so the actual default cannot be read.
    confidence: medium
    confidence_basis: >
      The three flags are named in both the deployment descriptor and the guide, and
      the gating is visible in code for the approval mail. Not high because the shipped
      flag values are redacted, so the documented "disabled by default" cannot be
      confirmed against the descriptor.
    risk_class: operational
    basis: >
      Configuring guide e-mail sections plus the env-entries and the gate in the
      approval-mail bean.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/configuring.html
        anchor: "e-mail (Setting Up E-mail Notifications Using the J2EE SDK Deployment Tool)"
        line_start: 49
        line_end: 51
        excerpt: |2
                 You can configure the Java Pet Store Demo to send customers e-mail
          notifications    regarding the status of their orders. By default, these notifications
          are    disabled, but you can enable them at deployment time.
      - kind: document
        path: legacy-source/petstore1.3.2/docs/configuring.html
        anchor: "e-mail-manual (Setting Up E-mail Notifications by Editing the Deployment Descriptors)"
        line_start: 142
        line_end: 157
