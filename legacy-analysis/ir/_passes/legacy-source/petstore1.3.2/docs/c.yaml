findings:
  - kind: conflict
    record_key: ORDER-APPROVAL-BR-0001
    path: legacy-source/petstore1.3.2/docs/zh/using.html
    description: >
      The Chinese user guide (place_order, line 190; admin, lines 209-210) says orders
      "not exceeding 500 USD" (不超过 500 美元) are auto-approved, i.e. 500.00 is
      approved. The code uses a strict "< 500", and the English/Japanese guides say
      "less than $500". The English guide's "pending if greater than $500" also leaves
      exactly $500 unstated. A business owner must confirm whether exactly 500 is
      auto-approved.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >
      The shipped values of param/SendApprovalMail, param/SendConfirmationMail and
      param/SendCompletedOrderMail are redacted in this source copy (lines 417, 507,
      593), so the guide's claim that notifications are disabled by default cannot be
      checked. A human with the unredacted descriptor should confirm the default.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      "Make sure to first logout of the admin client, before using the supplier"
      (open_supplier, lines 271-272) implies the admin and supplier web apps share a
      sign-on session or user realm and that an admin session interferes with supplier
      use. No requirement was emitted; sign-on owners should decide whether separate
      admin and supplier identities are intended and what happens if both are active.

