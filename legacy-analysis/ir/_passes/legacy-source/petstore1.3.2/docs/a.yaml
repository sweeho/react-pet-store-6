        excerpt: "       <code>select</code> statements on the application's database tables.\n  For example, here is a fragment from the default (Cloudscape) entry:</p>\n                                                        <pre><code>&lt;DAOStatements <b>database=\"cloudscape\"</b>&gt;<br>    &lt;SQLStatement method=\"GET_CATEGORY\"&gt;<br>        &lt;SQLFragment parameterNb=\"2\"&gt;<br>            select name, descn<br>                from (category a join category_details b on a.catid=b.catid)<br>                where locale = ? and a.catid = ?<br>        &lt;/SQLFragment&gt;<br>    &lt;/SQLStatement&gt;<br>    &lt;SQLStatement method=\"GET_CATEGORIES\"&gt;<br>        &lt;SQLFragment parameterNb=\"1\"&gt;<br>            select a.catid, name, descn<br>                from (category a join category_details b on a.catid=b.catid) <br>                where locale = ?  order by name<br>        &lt;/SQLFragment&gt;<br>    &lt;/SQLStatement&gt;<br>    ...</code></pre>\n                                                             "
