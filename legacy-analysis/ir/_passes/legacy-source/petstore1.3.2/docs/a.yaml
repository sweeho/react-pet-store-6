        excerpt: "    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;"
  - capability_key: order-approval
    record_keys: [ORDER-APPROVAL-BR-0001]
    severity: medium
    category: other
    title: "Orders in any locale other than US and Japan are never auto-approved"
    description: >-
      The automatic approval check has thresholds only for the US (500) and Japan (50000) locales and returns not-approved for every other locale, so every Chinese-locale order, however small, waits for an administrator. The code comment calls this a currency-conversion stub. The guides describe only the dollar rule.
    traces:
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 178
        line_end: 191
        excerpt: "  /**\n   * Just a stub for converting currency. This method is used for\n   * demonstrating the petstore, so that smaller orders can flow through\n   * the system without having to fire up the admin Gui to approve orders\n   */\n  private boolean canIApprove(PurchaseOrder purchaseOrder) {\n    Locale locale = purchaseOrder.getLocale();\n    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;\n    } else if (locale.equals(Locale.JAPAN))  {\n      if (purchaseOrder.getTotalPrice() < 50000) return true;\n    }\n    return false;\n  }"
      - path: "legacy-source/petstore1.3.2/docs/using.html"
        kind: "document"
        anchor: "Placing an Order (#place_order)"
        line_start: 201
        line_end: 202
        excerpt: "<p>When you complete the order, the Storefront sends the order info asyncronously \n to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>"
  - capability_key: customer-notifications
    record_keys: [CUSTOMER-NOTIFICATIONS-REQ-0001]
    severity: low
