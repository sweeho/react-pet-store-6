      Docs describe how the storefront is localized and which locales ship.
    traces:
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Adding a New Localization (#l10n)"
        line_start: 205
        line_end: 228
        excerpt: "<h2> <a name=\"l10n\"></a>Adding a New Localization</h2>\n       The Storefront of the Java Pet Store Demo is internationalized, and\n comes   with the English (en) and Japanese (ja) localizations.       \n<p>To add another localization, follow these steps: </p>\n           \n<ol>\n        <b>Add new JSP pages for the locale.</b>                   \n  <p>Place these in the subdirectory <tt>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/&lt;locale.code&gt;/</tt>\n ,    where <tt>&lt;locale.code&gt;</tt> is the string representation of\nthe locale.     </p>\n                       \n  <p>For example, the JSP pages for the Japanese localization are located \n   in the directory <tt>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/<b>\n ja</b>/</tt>.      </p>\n                       \n  <p><b>Create a localized screen definitions file.</b> </p>\n                       \n  <p>Place the screen definitions (which use your localized JSP pages, of \n   course) in a file called <tt>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_&lt;locale.code&gt;.xml</tt>\n ,    where <tt>&lt;locale.code&gt;</tt> is the string representation of\nthe locale.     </p>\n                       \n  <p>For example, the Japanese screen definitions are stored in <tt>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_<b>\n ja_JP</b>.xml</tt>.      </p>"
      - path: "legacy-source/petstore1.3.2/docs/index.html"
        kind: "document"
        anchor: "Contents"
        line_start: 53
        line_end: 53
        excerpt: "  <li> <a href=\"zh/index.html\">For instructions in Chinese language</a></li>"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_zh_CN.xml"
        line_start: 43
        line_end: 43
        excerpt: "  <default-template>/zh/template.jsp</default-template>"
      - path: "legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml"
        line_start: 106
        line_end: 110
        excerpt: "    <display-name>TemplateServlet</display-name>\n    <servlet-class>com.sun.j2ee.blueprints.waf.view.template.TemplateServlet</servlet-class>\n    <init-param>\n      <param-name>locales</param-name>\n      <param-value>en_US,ja_JP,zh_CN</param-value>"
    stack_metadata:
      jsp.page: "docroot/<locale>/*.jsp"
  - record_key: CATALOG-BROWSING-REQ-0001
