        configuring.html line 207 says the storefront comes with English and Japanese only; the source contains screendefinitions_zh_CN.xml, a docroot/zh folder, and web.xml lists en_US,ja_JP,zh_CN as supported locales. The capability list names en_US, ja_JP and zh_CN. Confirm zh_CN is a supported storefront locale.
    risk_class: presentational
