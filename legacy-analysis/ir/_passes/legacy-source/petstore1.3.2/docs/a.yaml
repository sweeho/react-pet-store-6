  - record_key: DATA-POPULATION-REQ-0001
    kind: requirement
    capability_key: data-population
    requirement: >-
      The system SHALL seed its catalog, customer and inventory data from a bundled data file, creating the required tables when they are absent, and the seed data SHALL be editable to change the initial catalog and inventory.
    plain_text: >-
      The store starts with a ready-made catalog and stock list loaded from a data file, which can be edited to change the starting data.
    technical_note: >-
      configuring.html Configuring the Database: populate/Populate-UTF8.xml holds the seed data; populate/PopulateSQL.xml holds per-database Check/Create/Insert/Drop statements per table (e.g. category: catid char(10) not null, primary key). Database choice via web.xml init-param Database and env-entry param/CatalogDAODatabase (default cloudscape).
    confidence: medium
    confidence_basis: >-
      Clear documentary description including quoted configuration; the populate code itself was not read in this pass.
    risk_class: operational
    basis: >-
      Docs describe population data and the check/create/insert/drop statement set used to build tables.
    traces:
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Configuring the Database (#db)"
        line_start: 244
        line_end: 265
        excerpt: "<h2> <a name=\"db\"></a>Configuring the Database</h2>\n              \n<p>The Storefront and Supplier applications in the Java Pet Store Demo can\n   be configured to use a different database from the default one (Cloudscape).\n   Using a different database may require different SQL statements (e.g.\n<code> create   table</code>, <code>drop table</code>) from the default ones.\nThese statements   can be specified by editing some of the sample application's \nXML configuration   files.</p>\n              \n<p>To configure the sample application to use a different database:</p>\n              \n<ol>\n           \n  <li>                              \n    <p><b>Add a new entry to the <code>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/populate/PopulateSQL.xml</code>\n     configuration file.</b></p>\n                                      \n    <p>Each database for which the sample application is configured has a \n       <code>DatabaseStatements</code> entry, which contains fragments for \n performing various SQL operations on the application's database tables. For\n example, here is a fragment from the default (Cloudscape) entry:</p>\n                                                        <pre><code>&lt;DatabaseStatements <b>database=\"cloudscape\"</b>&gt;<br>  &lt;TableStatements table=\"category\"&gt;<br>    &lt;CheckStatement&gt;<br>      select * from category<br>    &lt;/CheckStatement&gt;<br>    &lt;CreateStatement&gt;<br>      create table category (catid char(10) not null,<br>        constraint pk_category primary key (catid))<br>    &lt;/CreateStatement&gt;<br>    &lt;InsertStatement&gt;<br>      insert into category values (?)<br>    &lt;/InsertStatement&gt;<br>    &lt;DropStatement&gt;<br>      drop table category<br>    &lt;/DropStatement&gt;<br>  &lt;/TableStatements&gt;<br>  ...</code></pre>"
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Configuring the Database (#db)"
        line_start: 330
        line_end: 335
        excerpt: "</ol>\n              \n<p>You also have the option of changing the catalog and inventory information\n   used to populate the sample application's database. To modify this data,\n  edit the file <code>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/populate/Populate-UTF8.xml</code>\n .</p>"
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Adding a New Localization (#l10n)"
        line_start: 230
        line_end: 235
        excerpt: "  <p><b>Add new catalog data for the locale.</b> </p>\n                       \n  <p>The XML file <tt>&lt;petstore.home&gt;/src/apps/petstore/src/docroot/populate/Populate-UTF8.xml</tt>\n     contains the data used to populate the pet store's database. Localizing \n the catalog for a particular language involves adding new data to this XML \n file.    </p>"
    stack_metadata:
      db.object: "PopulateSQL.xml DatabaseStatements"
      framework: "Cloudscape default"
