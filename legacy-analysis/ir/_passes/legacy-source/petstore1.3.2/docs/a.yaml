records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >-
      The system SHALL automatically approve a US-locale order whose total price is less than 500 (US dollars), without administrator review. GIVEN a US order with total exactly 500 WHEN it is received THEN it SHALL NOT be auto-approved and SHALL remain pending.
    plain_text: >-
      Orders under $500 are approved automatically; orders of $500 or more wait for an administrator.
    technical_note: >-
      Documented in using.html (Placing an Order, Opening the Admin Client, Approving/Denying Orders). Enforced in the OPC PurchaseOrderMDB.canIApprove(), which compares getTotalPrice() < 500 for Locale.US. The same method uses < 50000 for Locale.JAPAN and returns false for every other locale (zh_CN orders are never auto-approved); the docs mention only the dollar threshold.
    confidence: high
    confidence_basis: >-
      Stated three times in the user documentation and enforced by an explicit literal in the order-processing code; two independent sources agree on the 500 threshold. Boundary wording differs (see dispute), which is why the edge case is called out.
    dispute:
      reason: contradicts-docs
      detail: >-
        using.html line 240 says an order is pending only if its total is 'greater than $500', implying exactly $500 is auto-approved; the code (< 500) leaves an order of exactly 500 pending. An SME must decide which boundary is intended; a test order totalling exactly 500.00 against the legacy system would settle the live behaviour (the code says pending).
    risk_class: financial
    basis: >-
      Docs state orders under $500 are automatically approved and orders over $500 are pending; code check confirms the threshold for the US locale.
    traces:
      - path: "legacy-source/petstore1.3.2/docs/using.html"
        kind: "document"
        anchor: "Placing an Order (#place_order)"
        line_start: 201
        line_end: 202
        excerpt: "<p>When you complete the order, the Storefront sends the order info asyncronously \n to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>"
      - path: "legacy-source/petstore1.3.2/docs/using.html"
        kind: "document"
        anchor: "Opening the Admin Client (#open_admin)"
        line_start: 219
        line_end: 222
        excerpt: "<p>When the client appears, you will see two panes for displaying pending \n and non-pending orders. The bulldog order from the previous section would \n be non-pending, because it was less than $500, and all orders under $500 \nare automatically approved.<br>"
      - path: "legacy-source/petstore1.3.2/docs/using.html"
        kind: "document"
        anchor: "Approving/Denying Orders (#approve_deny_orders)"
        line_start: 239
        line_end: 240
        excerpt: "  <p>You approve or deny pending orders using the Process Pending Orders  \npanel.  An order appears as pending if its total value is greater than $500.</p>"
      - path: "legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 183
        line_end: 191
        excerpt: "  private boolean canIApprove(PurchaseOrder purchaseOrder) {\n    Locale locale = purchaseOrder.getLocale();\n    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;\n    } else if (locale.equals(Locale.JAPAN))  {\n      if (purchaseOrder.getTotalPrice() < 50000) return true;\n    }\n    return false;\n  }"
    stack_metadata:
      ejb.bean: "PurchaseOrderMDB"
      framework: "J2EE 1.3 MDB"
  - record_key: ORDER-APPROVAL-WF-0001
