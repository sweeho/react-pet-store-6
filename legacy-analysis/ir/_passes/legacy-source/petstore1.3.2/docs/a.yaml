        line_end: 51
        excerpt: "<h2> <a name=\"e-mail\"></a>Setting Up E-mail Notifications Using the J2EE\nSDK Deployment Tool</h2>\n       You can configure the Java Pet Store Demo to send customers e-mail \nnotifications    regarding the status of their orders. By default, these notifications\nare    disabled, but you can enable them at deployment time.       "
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Setting Up E-mail Notifications by Editing the Deployment Descriptors (#e-mail-manual)"
        line_start: 143
        line_end: 157
        excerpt: "                       \n  <p>Look for these lines: </p>\n                    <pre><tt>&lt;env-entry&gt;<br>&nbsp; &lt;env-entry-name&gt;param/SendApprovalMail&lt;/env-entry-name&gt;<br>&nbsp; &lt;env-entry-type&gt;java.lang.Boolean&lt;/env-entry-type&gt;<br>&nbsp; <b>&lt;env-entry-value&gt;true&lt;/env-entry-value&gt;<br></b>&lt;/env-entry&gt;</tt></pre>\n       Ensure that the <tt>env-entry-value</tt> entry is set to <tt>true</tt>\n .                     \n  <p><b>Enable order confirmation notifications.</b> </p>\n                       \n  <p>Look for these lines: </p>\n                    <pre><tt>&lt;env-entry&gt;<br>&nbsp; &lt;env-entry-name&gt;param/SendConfirmationMail&lt;/env-entry-name&gt;<br>&nbsp; &lt;env-entry-type&gt;java.lang.Boolean&lt;/env-entry-type&gt;<br>&nbsp; <b>&lt;env-entry-value&gt;true&lt;/env-entry-value&gt;<br></b>&lt;/env-entry&gt;</tt></pre>\n       Ensure that the <tt>env-entry-value</tt> entry is set to <tt>true</tt>\n .                     \n  <p><b>Enable order completion notifications.</b> </p>\n                       \n  <p>Look for these lines: </p>\n                    <pre><tt>&lt;env-entry&gt;<br>&nbsp; &lt;env-entry-name&gt;param/SendCompletedOrderMail&lt;/env-entry-name&gt;<br>&nbsp; &lt;env-entry-type&gt;java.lang.Boolean&lt;/env-entry-type&gt;<br>&nbsp; <b>&lt;env-entry-value&gt;true&lt;/env-entry-value&gt;<br></b>&lt;/env-entry&gt;</tt></pre>"
