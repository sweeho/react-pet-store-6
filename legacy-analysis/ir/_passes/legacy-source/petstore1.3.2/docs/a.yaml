  - record_key: CUSTOMER-NOTIFICATIONS-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >-
      The system SHALL support three independently switchable customer e-mail notifications: order approval, order confirmation (invoice/shipment), and order completion; each SHALL be enabled or disabled by deployment configuration, and the documented default is disabled.
    plain_text: >-
      Customers can be e-mailed when their order is approved, when parts ship, and when the order is complete; each e-mail can be turned on or off, and the guide says they are off by default.
    technical_note: >-
      configuring.html: env entries param/SendApprovalMail (MailOrderApprovalMDB), param/SendConfirmationMail (MailInvoiceMDB), param/SendCompletedOrderMail (MailCompletedOrderMDB) in the OPC ejb-jar.xml, all java.lang.Boolean. The committed ejb-jar.xml values are redacted in this repository, so the shipped default cannot be read.
    confidence: low
    confidence_basis: >-
      The three switches are clearly named, but the default is contradicted within the same document (prose says disabled, the example snippets show true) and the deployed values are redacted, so the default cannot be confirmed.
    dispute:
      reason: contradicts-docs
      detail: >-
        configuring.html lines 50-51 say notifications are disabled by default; the same page's 'Look for these lines' snippets (lines 145, 151, 157) show env-entry-value true. The deployed value in src/apps/opc/src/ejb-jar.xml is redacted («REDACTED»). An SME with the unredacted descriptor, or a test deployment, would settle whether the shipped default is on or off.
    risk_class: operational
    basis: >-
      Docs enumerate the three notification switches and their deployment-time control.
    traces:
      - path: "legacy-source/petstore1.3.2/docs/configuring.html"
        kind: "document"
        anchor: "Setting Up E-mail Notifications Using the J2EE SDK Deployment Tool (#e-mail)"
