  - capability_key: order-approval
    record_keys: [ORDER-APPROVAL-BR-0001]
    severity: low
    category: contradicts-document
    title: "An order of exactly $500 stays pending, though the guide says only orders over $500 are pending"
    description: >-
      The user guide says an order is pending if its total is greater than $500. The approval check auto-approves only totals strictly below 500, so a $500.00 order waits for an administrator.
    traces:
      - path: "legacy-source/petstore1.3.2/docs/using.html"
        kind: "document"
        anchor: "Approving/Denying Orders (#approve_deny_orders)"
        line_start: 239
