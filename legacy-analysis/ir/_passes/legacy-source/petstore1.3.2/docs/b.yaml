  - capability_key: order-approval
    record_keys: [ORDER-APPROVAL-BR-0001]
    severity: medium
    category: contradicts-document
    title: Auto-approval only covers US and Japanese orders; others always wait
    description: >
      The guide describes a single $500 auto-approval rule. The code applies it only to US
      orders, uses an undocumented 50 000 threshold for Japanese orders, and never
      auto-approves an order in any other locale (including the Chinese storefront the code
      ships), so every Chinese order needs manual approval. The code comment calls the check
      a demo stub for currency conversion. The guide also says both "less than $500" and
      "greater than $500", leaving exactly $500 undefined; the code holds it as pending.
