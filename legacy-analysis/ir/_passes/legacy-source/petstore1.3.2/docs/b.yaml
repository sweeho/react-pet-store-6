  - record_key: SUPPLIER-INVENTORY-SCREEN-0001
    kind: screen
    capability_key: supplier-inventory
    requirement: >
      The system SHALL provide the supplier a screen listing the stock quantity of every
      inventory item, on which the supplier enters a new quantity for selected items, marks
      each item to be updated, and submits all marked changes to be saved together.
    plain_text: >
      The supplier sees how many of each item are in stock, types new quantities for the
      items they want to change, ticks those items, and saves them in one go.
    technical_note: >
      Supplier web application, "Display Inventory" page with a New Quantity cell and an
      Update checkbox per row and a Submit button. Only the documentation was read here.
    confidence: medium
    confidence_basis: >
      One clear documentary source; the supplier JSP and its handler were not read in this
      shard, so whether unticked rows with an edited quantity are ignored is not confirmed.
    risk_class: operational
    basis: >
      using.html "Viewing and Editing Inventory" describes the table, the New Quantity cell,
      the Update box and Submit.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Managing the Supplier > Viewing and Editing Inventory"
        line_start: 283
        line_end: 288
        excerpt: |2
            <p>To view and edit inventory, click Display Inventory at the home screen.</p>

            <p>A table shows the quantity for each item in the inventory. To edit that
           item's quantity, edit the New Quantity cell in the item's entry, and check
           the Update box. After making all your changes, commit your edits to the database
           by clicking Submit.</p>
    stack_metadata:
      framework: j2ee-1.3 web

  - record_key: ORDER-FULFILLMENT-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      WHEN the supplier saves an inventory change THEN the system SHALL notify order
      processing of the change, SHALL re-examine orders that could not previously be
      fulfilled, and SHALL mark as completed every such order it can now fulfil.
    plain_text: >
      When the supplier restocks, any orders that were waiting for that stock are
      re-checked, and those that can now be filled are completed.
    technical_note: >
      Documented as the Supplier application notifying the Order Processing Center after
      each inventory database update (asynchronous messaging between supplier and OPC per
      building.html). Mechanism not read in this shard.
    confidence: medium
    confidence_basis: >
      One clear documentary statement; the supplier-to-OPC message flow was not traced in
      code in this pass.
    risk_class: operational
    basis: >
      using.html "Viewing and Editing Inventory" final paragraph; building.html confirms
      the OPC and Supplier communicate over JMS.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Managing the Supplier > Viewing and Editing Inventory"
        line_start: 290
        line_end: 293
        excerpt: |2
            <p>Any time you update the database, the Supplier notifies the OPC about
          the changes to the inventory. The OPC examines these changes to see if it
          can fulfill any orders that it previously could not. If it can fullill an
          order, it will mark the order as completed.</p>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/building.html
        anchor: "Building the Demo > 1.0 Building Pet Store Demo"
        line_start: 64
        line_end: 66
    stack_metadata:
