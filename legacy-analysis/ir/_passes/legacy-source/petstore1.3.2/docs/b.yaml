  - record_key: ORDER-FULFILLMENT-WF-0002
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process an order in stages: the storefront SHALL hand the order to
      order processing asynchronously, order processing SHALL approve or hold it, the
      supplier SHALL fulfil approved orders from inventory, possibly in more than one
      part, and SHALL invoice order processing for what it ships, and the order SHALL be
      complete only when fully fulfilled.
    plain_text: >
      After a customer places an order it is passed on for approval, then the supplier
      ships it from stock (sometimes in several shipments) and bills for each one; the order
      is finished once everything has shipped.
    technical_note: >
      Storefront, Order Processing Center (OPC), Supplier and Admin are separate
      applications (petstore, opc, supplier, admin EARs); OPC and Supplier talk over JMS.
    confidence: medium
    confidence_basis: >
      Stated consistently across using.html and configuring.html, but only in documentation;
      no code was traced for the partial-shipment path in this pass.
    risk_class: operational
    basis: >
      using.html "Demo at a Glance" describes the components; configuring.html says the
      customer receives one or more e-mails as parts of the order are fulfilled and a final
      one when completely fulfilled, which establishes partial fulfilment.
    traces:
