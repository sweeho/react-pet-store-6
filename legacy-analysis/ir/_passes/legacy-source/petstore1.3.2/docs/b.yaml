records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a submitted order whose total is below the
      locale's approval threshold (below 500 for US-English orders, below 50 000 for
      Japanese orders), and SHALL leave every other order pending for administrator review.
      GIVEN a US order with a total of exactly 500 WHEN it is received THEN it SHALL be
      left pending. GIVEN an order in any locale other than US or Japan (for example
      Chinese) WHEN it is received THEN it SHALL be left pending regardless of its total.
    plain_text: >
      Small orders are approved automatically: a US order under $500 or a Japanese order
      under 50 000 yen goes straight through. Anything at or above those amounts, and every
      order placed in any other language/region, waits for an administrator to approve it.
    technical_note: >
      The user guide states the $500 rule for the US storefront only. The live check is
      PurchaseOrderMDB.canIApprove() in the Order Processing Center, a hard-coded
      locale switch (Locale.US < 500, Locale.JAPAN < 50000, else false). Its own comment
      calls it "just a stub for converting currency" for demo purposes.
    confidence: high
    confidence_basis: >
      The US $500 rule is stated twice in the user guide and is enforced in code, so the
      US branch is high. The Japanese threshold and the fall-through for other locales are
      read from code only and are not documented; the exactly-500 boundary is ambiguous in
      the documentation ("less than" / "greater than"), and the code resolves it as pending.
    risk_class: financial
    basis: >
      using.html "Placing an Order" and "Opening the Admin Client" say orders under $500
      are approved automatically; "Approving/Denying Orders" says an order is pending if
      its total is greater than $500. canIApprove() implements the comparison.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Using the Storefront > Placing an Order"
        line_start: 201
        line_end: 202
        excerpt: |2
          <p>When you complete the order, the Storefront sends the order info asyncronously
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Using the Admin Client > Opening the Admin Client"
        line_start: 219
        line_end: 222
        excerpt: |2
          <p>When the client appears, you will see two panes for displaying pending
           and non-pending orders. The bulldog order from the previous section would
           be non-pending, because it was less than $500, and all orders under $500
          are automatically approved.<br>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Using the Admin Client > Approving/Denying Orders"
        line_start: 239
        line_end: 240
        excerpt: |2
            <p>You approve or deny pending orders using the Process Pending Orders
          panel.  An order appears as pending if its total value is greater than $500.</p>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |2
            private boolean canIApprove(PurchaseOrder purchaseOrder) {
              Locale locale = purchaseOrder.getLocale();
              if (locale.equals(Locale.US)) {
                if (purchaseOrder.getTotalPrice() < 500) return true;
              } else if (locale.equals(Locale.JAPAN))  {
                if (purchaseOrder.getTotalPrice() < 50000) return true;
              }
              return false;
            }
    stack_metadata:
      framework: j2ee-1.3
      ejb.bean: PurchaseOrderMDB
      source_kind: user-guide + code

  - record_key: ORDER-APPROVAL-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL let an administrator list pending orders, change the status of one
      or more pending orders to approved or denied, and save all of those status changes
      together in a single commit; the list SHALL show the saved changes only after it is
      refreshed.
    plain_text: >
      An administrator sees the orders waiting for approval, marks each one approved or
      denied, and then saves the whole batch of decisions at once. The list is reloaded on
      request to show the result.
    technical_note: >
      Documented for the Swing rich client launched by Java Web Start from the admin web
      application ("Process Pending Orders" tab, Status cell editor, Commit and Refresh
      buttons). This pass read only the documentation for this behaviour.
    confidence: medium
    confidence_basis: >
      One clear documentary source; the admin client code was not read in this shard, so
      whether the commit is atomic across orders or per order is not established.
    risk_class: financial
    basis: >
      using.html "Approving/Denying Orders" lists the steps: open the Process Pending Orders
      tab, select the row, edit the Status cell, choose a new status, then Commit and Refresh.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "Using the Demo > Using the Admin Client > Approving/Denying Orders"
        line_start: 264
        line_end: 265
        excerpt: |2
            <p>You can approve or deny as many orders as you wish. To save your changes,
           click Commit. To see your changes, click the Refresh button.</p>
    stack_metadata:
      framework: jfc-swing (java web start)

