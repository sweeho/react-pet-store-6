  - record_key: LOCALIZATION-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL offer the storefront in English (US) and Japanese, each with its own
      localized pages and screen layout, and the current source additionally ships a
      Simplified Chinese (China) storefront.
    plain_text: >
      Shoppers can use the store in English or Japanese; the code also contains a Chinese
      version that the guide does not mention.
    technical_note: >
      Per locale: JSP pages under docroot/<locale>/ and a screendefinitions_<locale>.xml in
      WEB-INF. The tree contains screendefinitions_en_US.xml, _ja_JP.xml and _zh_CN.xml and
      docroot/ja and docroot/zh directories.
    confidence: medium
    confidence_basis: >
      English and Japanese are confirmed by both document and file layout; Chinese is seen
      only in the file layout (and in the existence of Chinese documentation), contradicting
      the configuration guide.
    dispute:
      reason: contradicts-docs
      detail: >
        configuring.html says the storefront comes with English and Japanese only; the source
        ships zh_CN screen definitions and a zh docroot. Whether Chinese is a supported locale
        or an unfinished addition needs an SME decision.
    risk_class: presentational
    basis: >
      configuring.html "Adding a New Localization" names the shipped localizations and how
      each is structured.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/configuring.html
        anchor: "Configuring the Demo > Adding a New Localization"
        line_start: 206
        line_end: 207
        excerpt: |2
                 The Storefront of the Java Pet Store Demo is internationalized, and
